}

function renderProcessosResults(){
  const f = pageFilters.processos;
  const list = state.processes.filter(p=>getBucket(p)!=='finalizados' && processMatchesFilter(p,f));
  if(list.length===0){
    const hasFilters = f.search || f.supplierId || f.modal || f.tipo || f.stage;
    return hasFilters ? `<div class="empty-state"><h3>Nenhum processo encontrado</h3><p>Nenhum processo bate com os filtros aplicados.</p><button class="btn" onclick="clearPageFilters('processos')">Limpar filtros</button></div>` : `<div class="empty-state">
      <h3>Nenhum processo ativo</h3>
      <p>Crie seu primeiro processo para começar a controlar custos, prazos e documentos.</p>
      ${canEdit('processos') ? `<button class="btn btn-primary" onclick="openProcessModal()">+ Novo Processo</button>` : ''}
    </div>`;
  }
  const sorted = [...list].sort((a,b)=> processProgressRatio(b) - processProgressRatio(a) || (a.chegadaPrevista||'9999').localeCompare(b.chegadaPrevista||'9999'));
  return `<div class="active-count-label">${sorted.length} processo(s)</div><div class="process-list">${sorted.map(p=>processCard(p)).join('')}</div>`;
}

function processCard(p, note){
  const stages = getStagesForProcess(p);
  const info = stageInfoFor(p, p.status);

  const costs = computeCosts(p);
  const fornecedor = state.suppliers.find(s=>s.id===p.supplierId);
  const trackHtml = stages.map((s,i)=>{
    const dotCls = i<idx ? 'done' : (i===idx ? 'current' : '');
    const lineCls = i<idx ? 'done' : '';
    return `<div class="track-step">
      <div class="track-dot ${dotCls}"></div>
      ${i<stages.length-1?`<div class="track-line ${lineCls}"></div>`:''}
    </div>`;
  }).join('');

  const extra = p.extra || {};
  const cardInfoParts = [];

  if(extra.numeroDUIMP) cardInfoParts.push(`<span><b>DUIMP</b> ${extra.numeroDUIMP}</span>`);
  if(extra.canalDesembaraco) cardInfoParts.push(`<span><b>Canal</b> ${extra.canalDesembaraco}</span>`);
  const cardInfoHtml = cardInfoParts.length ? `<div class="process-meta" style="margin-top:2px;">${cardInfoParts.join(' &nbsp;·&nbsp; ')}</div>` : '';

  return `
  <div class="process-card ${getProcessAlerts(p).length?'has-alert':''}" onclick="openProcessCardClick('${p.id}')">

    <div class="process-side">
      ${p.fob ? `<div class="stat-chip"><span class="stat-chip-value">${fmtUSD(parseFloat(p.fob))}</span></div>` : ''}

function transitoCard(p){

  if(extra.navio) logiParts.push(`<span><b>Navio:</b> ${extra.navio}</span>`);

  if(extra.agenteCarga) logiParts.push(`<span><b>Agente:</b> ${extra.agenteCarga}</span>`);

      <h3 style="font-size:15px;font-weight:600;">${p.produto||'Sem descrição'}</h3>

        <span>Chegada prevista: ${fmtDate(chegada)}</span>

      ${logiParts.length?`<div class="transit-logi">${logiParts.join('')}</div>`:''}

function computeDespachantePerformance(empresaNome){
  if(!empresaNome) return {totalProcessos:0, comAmbasDatas:0, mediaTempo:null};
  const doEste = state.processes.filter(p => p.extra && p.extra.despachante===empresaNome);
  const tempos = doEste
    .filter(p => p.extra.dataRascunhoDUIMP && p.extra.dataRegistroDUIMP)
    .map(p => daysBetween(p.extra.dataRascunhoDUIMP, p.extra.dataRegistroDUIMP))
    .filter(d => d>=0);
  const mediaTempo = tempos.length ? (tempos.reduce((a,b)=>a+b,0)/tempos.length) : null;
  return { totalProcessos: doEste.length, comAmbasDatas: tempos.length, mediaTempo };
}

function renderDespachantePerformanceHtml(empresaNome){
  const stats = computeDespachantePerformance(empresaNome);
  if(stats.totalProcessos===0){
    return `<div class="form-hint">Nenhum processo vinculado a este despachante ainda.</div>`;
  }
  let html = `<div class="form-hint">${stats.totalProcessos} processo(s) com este despachante.</div>`;
  if(stats.comAmbasDatas>0){
    html += `<div class="form-hint">Tempo médio entre Rascunho e Registro da DUIMP: <strong>${stats.mediaTempo.toFixed(1)} dias</strong> (baseado em ${stats.comAmbasDatas} processo(s) com as duas datas preenchidas).</div>`;
  } else {
    html += `<div class="form-hint">Ainda não há processos com Rascunho e Registro da DUIMP preenchidos pra calcular o tempo médio.</div>`;
  }
  return html;
}

async function savePartner(id){
  if(!requireEditPermission()) return;
  const empresa = document.getElementById('pt-empresa').value.trim();
  if(!empresa){ alert('Informe o nome da empresa.'); return; }
  const contatosEmail = (window.__editingPartnerContatos||[])
    .map(c=>({ nome:(c.nome||'').trim(), email:(c.email||'').trim() }))
    .filter(c=>c.nome || c.email);
  const data = {
    id,
    tipo: document.getElementById('pt-tipo').value,
    empresa,
    zonaRecinto: document.getElementById('pt-zona') ? document.getElementById('pt-zona').value : '',
    cidade: document.getElementById('pt-cidade') ? document.getElementById('pt-cidade').value.trim() : '',
    contato: document.getElementById('pt-contato').value.trim(),
    phone: document.getElementById('pt-phone').value.trim(),
    email: document.getElementById('pt-email').value.trim(),
    contatosEmail,
    honorariosPadrao: document.getElementById('pt-honorarios') ? parseBRMasked(document.getElementById('pt-honorarios').value) : '',
    taxaSiscomexPadrao: document.getElementById('pt-siscomex') ? parseBRMasked(document.getElementById('pt-siscomex').value) : '',
    notes: document.getElementById('pt-notes').value.trim(),
  };
  const idx = state.partners.findIndex(p=>p.id===id);
  if(idx>=0) state.partners[idx]=data; else state.partners.push(data);
  await persistState();
  closeModal();
  render();
}

async function deletePartner(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este parceiro?')) return;
  state.partners = state.partners.filter(p=>p.id!==id);
  await persistState();
  closeModal();
  render();
}

function renderExtraFieldInput(f, p){
  const val = (p.extra && p.extra[f.key]) || '';
  if(f.type==='readonly'){
    const v = (p[f.sourceKey]!==undefined && p[f.sourceKey]!=='') ? p[f.sourceKey] : '—';
    return `<div class="mini-field"><label>${f.label}</label><div style="padding:6px 8px;font-size:12px;background:#fff;border:1px solid var(--border-strong);border-radius:5px;">${v}</div></div>`;
  }
  if(f.type==='select'){
    const preview = f.key==='canalDesembaraco' && val ? `<div style="margin-top:5px;">${canalBadgeHtml(val)}</div>` : '';
    return `<div class="mini-field"><label>${f.label}</label><select onchange="updateExtraField('${f.key}', this.value)">
      <option value="">—</option>
      ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select>${preview}</div>`;
  }
  if(f.type==='partner'){
    const options = state.partners
      .filter(pt=>pt.tipo===f.partnerType)
      .filter(pt=> !f.zona || pt.zonaRecinto===f.zona)
      .map(pt=>pt.empresa);
    return `<div class="mini-field"><label>${f.label}</label><select onchange="updateExtraField('${f.key}', this.value)">
      <option value="">—</option>
      ${options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select></div>`;
  }
  const type = f.type||'text';
  return `<div class="mini-field"><label>${f.label}</label><input type="${type}" value="${val}" oninput="updateExtraField('${f.key}', this.value)"></div>`;
}
/* Referências do Fornecedor (uma por fatura do processo) — cada uma vira automaticamente um
   espaço de documento em Documentos ("Invoice - referência"), ligado pelo id ESTÁVEL da
   referência (não pelo texto digitado), pra editar o texto depois (corrigir digitação) não
   criar um espaço novo nem perder um arquivo já anexado no espaço antigo. */
function refFornecedorRowsHtml(p){
  const list = p.referenciasFornecedor || [];
  if(!list.length) return `<div class="form-hint">Nenhuma referência ainda — clique em "+ Adicionar Fatura".</div>`;
  return list.map(r=>`
    <div class="form-row" style="grid-template-columns:1fr auto; margin-bottom:6px; align-items:center;">
      <input type="text" value="${(r.ref||'').replace(/"/g,'&quot;')}" placeholder="Nº do pedido/PO/invoice no sistema do fornecedor" oninput="updateRefFornecedor('${r.id}', this.value)">
      <button type="button" class="btn btn-danger" style="padding:8px 12px;" onclick="removeRefFornecedor('${r.id}')">Remover</button>
    </div>
  `).join('');
}
function addRefFornecedor(){
  const p = window.__editingProcess;
  p.referenciasFornecedor = p.referenciasFornecedor || [];
  p.referenciasFornecedor.push({ id: uid(), ref: '' });
  document.getElementById('ref-fornecedor-list').innerHTML = refFornecedorRowsHtml(p);
}
function updateRefFornecedor(id, val){
  const p = window.__editingProcess;
  const r = (p.referenciasFornecedor||[]).find(x=>x.id===id);
  if(!r) return;
  r.ref = val;
  syncInvoiceDocSlots(p);
  renderDocsTab(); // reflete o nome do documento atualizado sem precisar trocar de aba
}
function removeRefFornecedor(id){
  const p = window.__editingProcess;
  p.referenciasFornecedor = (p.referenciasFornecedor||[]).filter(x=>x.id!==id);
  document.getElementById('ref-fornecedor-list').innerHTML = refFornecedorRowsHtml(p);
  renderDocsTab();
}
/* Cria (ou renomeia, se a referência foi editada) um documento personalizado por referência
   de fatura — nunca remove um espaço já existente automaticamente, mesmo que a referência seja
   apagada, pra nunca arriscar perder um arquivo já anexado sem confirmação explícita da pessoa
   (ela pode remover manualmente pelo botão de excluir documento, se quiser). */
function syncInvoiceDocSlots(p){
  p.customDocs = p.customDocs || [];
  (p.referenciasFornecedor||[]).forEach(r=>{
    const refTrim = (r.ref||'').trim();
    if(!refTrim) return;
    const nomeEsperado = `Invoice - ${refTrim}`;
    const existing = p.customDocs.find(cd=>cd.linkedRefId===r.id);
    if(!existing){
      p.customDocs.push({ id: uid(), name: nomeEsperado, linkedRefId: r.id });
    } else if(existing.name !== nomeEsperado){
      existing.name = nomeEsperado;
    }
  });
}

function renderContainersTable(p){
  const qty = parseInt(p.containersQty)||0;
  if(qty<=0){
    return `<div class="form-hint" style="margin-top:6px;">Defina a quantidade de containers na Visão Geral para preencher os números aqui.</div>`;
  }
  const list = p.extra.containersList || [];
  let rows = '';
  for(let i=0;i<qty;i++){
    const c = list[i] || {container:'', lacre:''};
    rows += `<div class="container-row">
      <span class="container-idx">#${i+1}</span>
      <input type="text" placeholder="Número do container" value="${c.container||''}" oninput="updateContainerField(${i},'container',this.value)">
      <input type="text" placeholder="Número do lacre" value="${c.lacre||''}" oninput="updateContainerField(${i},'lacre',this.value)">
    </div>`;
  }
  return `<div class="containers-table"><label style="display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px;">Containers e Lacres</label>${rows}</div>`;

async function fetchDollarQuoteIfNeeded(){
  const p = window.__editingProcess;
  if(p.cambioManual) return; // travado, não sobrescreve
  const cambioInput = document.getElementById('c-cambio');
  if(cambioInput && cambioInput.value) return; // já tem valor (processo existente), não mexe
  try{
    const resp = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
    const data = await resp.json();
    const bid = data && data.USDBRL && data.USDBRL.bid;
    if(bid && cambioInput){
      cambioInput.value = parseFloat(bid).toFixed(4);
      updateCostPreview();
      const statusEl = document.getElementById('cambio-status');
      if(statusEl) statusEl.textContent = '🔄 Cotação automática do último fechamento';
    }
  }catch(e){
    console.log('Não foi possível buscar a cotação automática do dólar.', e);
  }
}

/* Atualiza a exibição da Taxa Siscomex na aba Custos a partir de getTaxaSiscomexDespachante —
   chamado ao abrir o processo e sempre que o despachante (Fase 5) mudar. Guarda o valor
   efetivo (puxado ou manual) no input escondido #c-siscomex, no mesmo formato mascarado dos
   outros campos de moeda da aba, pra collectCostFields() ler igual aos demais. */
function refreshSiscomexDisplay(){
  const p = window.__editingProcess;
  if(!p) return;
  const hidden = document.getElementById('c-siscomex');
  const display = document.getElementById('c-siscomex-display');
  const origemHint = document.getElementById('c-siscomex-origem-hint');
  if(!hidden || !display) return;
  const siscomex = getTaxaSiscomexDespachante(p);
  hidden.value = siscomex.valor ? fmtNumberBR(siscomex.valor) : '';
  display.innerHTML = `${siscomex.valor ? fmtBRL(siscomex.valor) : '<span style="color:var(--muted); font-style:italic;">Não definido</span>'} <button type="button" class="prov-edit-btn" onclick="toggleSiscomexEdit(true)" title="Editar">✏️ Editar</button>`;
  if(origemHint){
    origemHint.textContent = siscomex.origem==='partner' ? `Puxado automaticamente do cadastro de ${siscomex.partnerNome} em Parceiros.`
      : siscomex.origem==='manual' ? 'Valor definido manualmente para este processo.'
      : (getDespachantePartner(p) ? 'Este despachante ainda não tem Taxa Siscomex Padrão cadastrada em Parceiros — defina aqui ou lá.' : 'Selecione o despachante na aba Etapas (Fase 5) para puxar o valor cadastrado, ou defina manualmente aqui.');
  }
  updateCostPreview();
}

function toggleSiscomexEdit(editMode){
  const display = document.getElementById('c-siscomex-display');
  const editRow = document.getElementById('c-siscomex-edit-row');
  if(display) display.style.display = editMode ? 'none' : '';
  if(editRow) editRow.style.display = editMode ? 'flex' : 'none';
  if(editMode){
    const input = document.getElementById('c-siscomex-input');
    const hidden = document.getElementById('c-siscomex');

}

async function addCustomPayment(name){
  if(!requireEditPermission()) return;

  const p = window.__editingProcess;
  p.customPayments = p.customPayments || [];
  const newId = uid();
  p.customPayments.push({ id:newId, name:name.trim() });
  p.payments['custom:'+newId] = { checked:false, valor:'' };
  window.__openStage = 'fase8';
  renderEtapasTab();
  await autoPersistCurrentProcess();

async function removeCustomPayment(id){
  if(!requireEditPermission()) return;
  if(!confirm('Remover este pagamento personalizado?')) return;
  const p = window.__editingProcess;
  p.customPayments = (p.customPayments||[]).filter(cp=>cp.id!==id);
  delete p.payments['custom:'+id];
  window.__openStage = 'fase8';
  renderEtapasTab();
  await autoPersistCurrentProcess();
}

function produtoMestreOverrideHint(p, field, currentVal){
  if(!p.produtoMestreSnapshot) return '';
  const snap = p.produtoMestreSnapshot[field];
  if(snap===undefined || snap==='') return '';
  if(String(snap||'') !== String(currentVal||'')){
    return `<div class="form-hint" style="color:var(--ink-amber);">✏️ Alterado do modelo "${p.produtoMestreNome||''}" — padrão: ${snap}</div>`;
  }
  return '';
}

async function ensureMasterDataForProcess(){
  if(!window.__produtosMestre){
    window.__produtosMestre = [];
    try{
      const snap = await db.collection('produtosMestre').get();
      snap.forEach(d=>window.__produtosMestre.push({id:d.id, ...d.data()}));
    }catch(e){ console.error(e); }
  }
  if(!window.__rotas){
    window.__rotas = [];
    try{
      const snap = await db.collection('rotas').get();
      snap.forEach(d=>window.__rotas.push({id:d.id, ...d.data()}));
    }catch(e){ console.error(e); }
  }
  refreshProdutoMestreSelect();
  refreshRotaSelect();
  renderLotesTab(); // reforça a checagem — nada aqui depende mais de Produto Mestre carregado
}

function refreshProdutoMestreSelect(){
  const sel = document.getElementById('f-produto-mestre');
  if(!sel) return;
  const p = window.__editingProcess;
  const supplierSel = document.getElementById('f-supplier');
  const currentSupplierId = supplierSel ? supplierSel.value : '';
  const list = (window.__produtosMestre||[])
    .filter(x=>x.ativo!==false)
    .filter(x=> !currentSupplierId || x.supplierId===currentSupplierId);
  sel.innerHTML = '<option value="">Nenhum / preencher manualmente</option>' +
    list.map(pr=>`<option value="${pr.id}" ${p.produtoMestreId===pr.id?'selected':''}>${pr.nome}</option>`).join('');
}
function refreshRotaSelect(){
  const sel = document.getElementById('f-rota');
  if(!sel) return;
  const p = window.__editingProcess;
  const list = (window.__rotas||[]).filter(x=>x.ativo!==false);
  sel.innerHTML = '<option value="">Nenhuma / preencher manualmente</option>' +
    list.map(r=>`<option value="${r.id}" ${(p.rotaAplicada&&p.rotaAplicada.id===r.id)?'selected':''}>${r.nome}</option>`).join('');

async function applyProdutoMestre(){
  if(!requireEditPermission()) return;
  const sel = document.getElementById('f-produto-mestre');
  const id = sel.value;
  if(!id) return;
  const template = (window.__produtosMestre||[]).find(x=>x.id===id);
  if(!template) return;
  const p = window.__editingProcess;

  const temperaturaOutro = template.temperaturaControlada
    ? (template.temperaturaMin && template.temperaturaMax && template.temperaturaMin!==template.temperaturaMax
        ? `${template.temperaturaMin}°C a ${template.temperaturaMax}°C`
        : `${template.temperaturaMin||template.temperaturaMax||''}°C`)
    : '';
  const snapshot = {
    produto: template.nome || '',
    supplierId: template.supplierId || '',
    origemPais: template.origemPais || '',
    portoEmbarque: template.portoEmbarque || '',
    portoDestino: template.portoDestino || '',
    temperaturaControlada: !!template.temperaturaControlada,
    temperaturaValor: template.temperaturaControlada ? 'outro' : '',
    temperaturaOutro,
    genset: !!template.genset,
    containerTamanho: template.containerTamanho || '',
    containerTipo: template.containerTipo || '',
  };

  document.getElementById('f-produto').value = snapshot.produto;
  document.getElementById('f-supplier').value = snapshot.supplierId;
  onSupplierChange(snapshot.supplierId);
  const origemSel = document.getElementById('f-origem');
  if(origemSel){
    if(snapshot.origemPais && ![...origemSel.options].some(o=>o.value===snapshot.origemPais)){
      origemSel.innerHTML += `<option value="${snapshot.origemPais}">${snapshot.origemPais}</option>`;
    }
    origemSel.value = snapshot.origemPais;
  }
  const embEl = document.getElementById('f-porto-embarque');
  if(embEl) embEl.value = snapshot.portoEmbarque;
  const destEl = document.getElementById('f-porto-destino');
  if(destEl) destEl.value = snapshot.portoDestino;

  const tamanhoEl = document.getElementById('f-container-tamanho');
  if(tamanhoEl && snapshot.containerTamanho) tamanhoEl.value = snapshot.containerTamanho;
  const tipoEl = document.getElementById('f-container-tipo');
  if(tipoEl && snapshot.containerTipo) tipoEl.value = snapshot.containerTipo;
  onProcessContainerFieldChange();

  toggleTemperaturaControlada(snapshot.temperaturaControlada);
  if(snapshot.temperaturaControlada){
    const tSel = document.getElementById('f-temperatura');
    if(tSel){ tSel.value = 'outro'; onTemperaturaSelectChange('outro'); }
    const tOutro = document.getElementById('f-temperatura-outro');
    if(tOutro) tOutro.value = snapshot.temperaturaOutro;
    toggleGenset(snapshot.genset);
  }

  p.produtoMestreId = template.id;
  p.produtoMestreNome = template.nome;
  p.produtoMestreSnapshot = snapshot;

  const historico = template.historicoProcessos || [];
  const leadTimes = historico.filter(h=>h.leadTimeDias!=null).map(h=>h.leadTimeDias);
  if(leadTimes.length){
    const mediaLead = Math.round(leadTimes.reduce((a,b)=>a+b,0)/leadTimes.length);
    const dataPedidoEl = document.getElementById('f-datapedido');
    const previsaoEl = document.getElementById('f-previsao-estoque');
    if(dataPedidoEl && dataPedidoEl.value && previsaoEl && !previsaoEl.value){
      const base = new Date(dataPedidoEl.value+'T00:00:00');
      base.setDate(base.getDate()+mediaLead);
      previsaoEl.value = base.toISOString().slice(0,10);
    }
  }

  alert(`Modelo "${template.nome}" aplicado. Você ainda pode ajustar qualquer campo neste processo específico, sem alterar o modelo mestre.`);
  await autoPersistCurrentProcess();
}

async function applyRota(){
  if(!requireEditPermission()) return;
  const sel = document.getElementById('f-rota');
  const id = sel.value;
  if(!id) return;
  const rota = (window.__rotas||[]).find(x=>x.id===id);
  if(!rota) return;
  const p = window.__editingProcess;
  const pontos = rota.pontos || [];
  const primarios = pontos.filter(pt=>pt.zona==='Zona Primária');
  const secundarios = pontos.filter(pt=>pt.zona==='Zona Secundária');
  const primario = primarios[primarios.length-1];
  const secundario = secundarios[secundarios.length-1];

  p.extra = p.extra || {};
  if(primario) p.extra.recintoZonaPrimaria = primario.recintoNome;
  if(secundario){
    p.extra.recintoAlfandegado = secundario.recintoNome;
  } else if(primario){
    /* rota com só um ponto (Zona Primária): o desembaraço acontece ali mesmo,
       sem seguir pra um recinto de Zona Secundária separado */
    p.extra.recintoAlfandegado = primario.recintoNome;
  }
  p.rotaAplicada = { id: rota.id, nome: rota.nome };
  renderEtapasTab();
  alert(`Rota "${rota.nome}" aplicada. Os recintos foram preenchidos na Fase 6 — você ainda pode trocar neste processo específico, sem afetar a rota.`);
  await autoPersistCurrentProcess();
}

function onSupplierChange(val){
  window.__editingProcess.supplierId = val;
  const supplier = state.suppliers.find(s=>s.id===val);
  const countries = supplier ? (supplier.countries||[]) : [];
  const sel = document.getElementById('f-origem');
  const current = sel.value;
  sel.innerHTML = '<option value="">Selecione...</option>' + countries.map(c=>`<option value="${c}" ${c===current?'selected':''}>${c}</option>`).join('');
  if(!countries.includes(current)) sel.value = '';
  refreshProdutoMestreSelect();
}

function changeProcessType(tipo){
  window.__editingProcess.tipo = tipo;
  initProcessData(window.__editingProcess);
  window.__editingProcess.status = recomputeStatus(window.__editingProcess);
  window.__openStage = window.__editingProcess.status;
  document.querySelectorAll('.type-toggle button').forEach(b=>{
    b.classList.toggle('active', (tipo==='definitiva' && b.textContent.includes('Definitiva')) || (tipo==='temporaria' && b.textContent.includes('Temporária')));
  });
  renderEtapasTab();
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

function renderEtapasTab(){
  const p = window.__editingProcess;
  const stages = getStagesForProcess(p);
  const currentKey = recomputeStatus(p);
  p.status = currentKey;

  const html = stages.map((s,i)=>{
    const isPayments = s.type==='payments';
    const customPayCount = isPayments ? (p.customPayments||[]).length : 0;
    const doneCount = isPayments
      ? s.items.filter(it=>(p.payments[it.key]||{}).checked).length + (p.customPayments||[]).filter(cp=>(p.payments['custom:'+cp.id]||{}).checked).length
      : (p.checklist[s.key]||[]).filter(Boolean).length;
    const total = s.items.length + customPayCount;
    const isDone = doneCount===total;
    const isCurrent = s.key===currentKey;
    const stateCls = isDone ? 'done' : (isCurrent ? 'current' : '');
    const isOpen = window.__openStage === s.key;

    let bodyHtml = '';
    if(isPayments){
      const paymentRow = (key, label) => {
        const rec = p.payments[key] || {checked:false, valor:'', pedidoSap:'', dataVencimento:''};
        return `<div class="payment-row ${rec.checked?'checked':''}">
          <div class="payment-row-main">
            <div class="doc-check" style="cursor:pointer;" onclick="togglePaymentCheck('${key}')">${rec.checked?'✓':''}</div>
            <div class="payment-label" onclick="togglePaymentCheck('${key}')">${label}</div>
            <div class="payment-value-wrap">
              <span class="payment-value-prefix">R$</span>
              <input type="text" inputmode="decimal" class="payment-value" placeholder="0,00" value="${rec.valor?fmtNumberBR(rec.valor):''}" oninput="maskCurrencyInput(this); updatePaymentField('${key}','valor', parseBRMasked(this.value));">
            </div>
          </div>
          <div class="payment-row-extra">
            <div class="mini-field"><label>Pedido SAP</label><input type="text" value="${rec.pedidoSap||''}" placeholder="Nº do pedido" oninput="updatePaymentField('${key}','pedidoSap', this.value)"></div>
            <div class="mini-field"><label>Vencimento</label><input type="date" value="${rec.dataVencimento||''}" oninput="updatePaymentField('${key}','dataVencimento', this.value)"></div>
          </div>
        </div>`;
      };
      bodyHtml = s.items.map(it=>{
        const label = (it.key==='dta' && p.extra && p.extra.transportadoraDTA) ? `${it.label} (${p.extra.transportadoraDTA})` : it.label;
        return paymentRow(it.key, label);
      }).join('');
      bodyHtml += (p.customPayments||[]).map(cp=>`
        <div style="position:relative;">
          ${paymentRow('custom:'+cp.id, cp.name)}
          <button class="btn btn-danger" style="position:absolute; top:6px; right:6px; padding:2px 7px; font-size:10px;" onclick="removeCustomPayment('${cp.id}')">×</button>
        </div>
      `).join('');
      bodyHtml += `
        <div style="display:flex; gap:8px; margin-top:8px;">
          <input type="text" id="new-custom-payment-name" placeholder="Ex: Armazenagem, Capatazia..." style="flex:1; padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:12.5px;">
          <button class="btn" onclick="addCustomPayment(document.getElementById('new-custom-payment-name').value); document.getElementById('new-custom-payment-name').value='';">+ Outro Pagamento</button>
        </div>
      `;
    } else {
      const checked = p.checklist[s.key] || [];
      bodyHtml = s.items.map((label,idx)=>{
        let row = `<div class="doc-item ${checked[idx]?'checked':''}" onclick="toggleStageItem('${s.key}',${idx})">
          <div class="doc-check">${checked[idx]?'✓':''}</div><span>${label}</span>
        </div>`;
        if(s.itemFields && s.itemFields[idx]){
          row += `<div class="item-fields">${s.itemFields[idx].map(f=>renderExtraFieldInput(f,p)).join('')}${s.containersItemIndex===idx?renderContainersTable(p):''}</div>`;
        } else if(s.containersItemIndex===idx){
          row += `<div class="item-fields">${renderContainersTable(p)}</div>`;
        }
        return row;
      }).join('');
      if(s.extraFields){
        bodyHtml += `<div class="stage-extra">${s.extraFields.map(f=>renderExtraFieldInput(f,p)).join('')}</div>`;
      }
    }

    return `
    <div class="stage-block ${stateCls}">
      <div class="stage-header" onclick="toggleStageOpen('${s.key}')">
        <div class="stage-num">${isDone?'✓':(i+1)}</div>
        <div class="stage-title">${s.label}</div>
        <div class="stage-progress">${doneCount}/${total}</div>
      </div>
      <div class="stage-body" style="display:${isOpen?'flex':'none'}">
        ${bodyHtml}
      </div>
    </div>`;
  }).join('');

  document.getElementById('etapas-container').innerHTML = html;

  const stampEl = document.getElementById('geral-status-stamp');
  if(stampEl){
    const info = stageInfoFor(p, currentKey);
    stampEl.className = `stamp ${info.cls}`;
    stampEl.textContent = info.label;
  }
}

function slugifyDocType(docType){
  return docType.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function renderDocRow(key, label, p, canEdit, removable){
  const checked = p.docs && p.docs[key];
  const file = p.docFiles[key];
  const inputId = 'file-input-'+slugifyDocType(key);
  const keyEsc = key.replace(/'/g,"\\'");
  return `
    <div class="doc-item-block">
      <div class="doc-item ${checked?'checked':''}" onclick="toggleDoc(this, '${keyEsc}')" data-doc="${keyEsc}">
        <div class="doc-check">${checked?'✓':''}</div>
        <span>${label}</span>
      </div>
      <div class="doc-file-row">

          <span class="doc-file-name">📎 ${file.name}</span>
          <a href="${file.url}" target="_blank" rel="noopener" class="btn" style="padding:4px 9px; font-size:11px;">Ver / Baixar</a>
          ${canEdit ? `
            <label class="btn" style="padding:4px 9px; font-size:11px; cursor:pointer;">Substituir<input type="file" id="${inputId}" style="display:none;" onchange="uploadDocFile(this,'${keyEsc}')"></label>

          <span class="doc-upload-status" id="status-${slugifyDocType(key)}"></span>

function renderDocsTab(){

async function addCustomDoc(name){
  if(!requireEditPermission()) return;
  if(!name || !name.trim()) return;
  const p = window.__editingProcess;
  p.customDocs = p.customDocs || [];
  p.customDocs.push({ id: uid(), name: name.trim() });
  renderDocsTab();
  await autoPersistCurrentProcess();
}

async function removeCustomDoc(key){
  if(!requireEditPermission()) return;
  if(!confirm('Remover este documento personalizado? O arquivo anexado (se houver) também será excluído.')) return;
  const p = window.__editingProcess;
  const id = key.replace('custom:','');
  const info = p.docFiles && p.docFiles[key];
  if(info && info.path){
    try{ await storage.ref(info.path).delete(); }catch(e){ console.log('Arquivo já não existia', e); }
  }
  if(p.docFiles) delete p.docFiles[key];
  if(p.docs) delete p.docs[key];
  p.customDocs = (p.customDocs||[]).filter(cd=>cd.id!==id);
  renderDocsTab();
  window.__lotesResultados = null;
  delete p.lotesExtraidos;
  renderLotesTab();
  await autoPersistCurrentProcess();
}

async function autoPersistCurrentProcess(){
  const p = window.__editingProcess;
  if(!p) return;
  const data = collectProcessFormData();
  if(!data.produto) return; // processo novo ainda sem nome — evita salvar rascunho vazio sozinho
  const idx = state.processes.findIndex(x=>x.id===data.id);
  const prev = idx>=0 ? state.processes[idx] : null;
  detectHistoryChanges(prev, data);
  const newKey = currentPendingKey(data);
  if(prev && prev.pendingKey===newKey){
    data.pendingSince = prev.pendingSince || todayStr();
  } else {
    data.pendingSince = todayStr();
  }
  data.pendingKey = newKey;
  if(idx>=0) state.processes[idx] = data; else state.processes.push(data);
  await persistState();
}

async function uploadDocFile(inputEl, docType){
  if(!requireEditPermission()) return;
  const file = inputEl.files[0];
  if(!file) return;
  const p = window.__editingProcess;
  const statusEl = document.getElementById('status-'+slugifyDocType(docType));
  if(statusEl) statusEl.textContent = 'Enviando...';
  const path = `processos/${p.id}/${slugifyDocType(docType)}/${Date.now()}_${file.name}`;
  try{
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    p.docFiles = p.docFiles || {};
    p.docFiles[docType] = { name:file.name, url, path, uploadedAt: Date.now() };
    p.docs = p.docs || {};
    p.docs[docType] = true;
    renderDocsTab();
    if(/fatura|invoice/i.test(docType)){ window.__lotesResultados = null; delete p.lotesExtraidos; }
    renderLotesTab();
    await autoPersistCurrentProcess();
  }catch(e){
    console.error(e);
    if(statusEl) statusEl.textContent = '';
    alert('Não foi possível enviar o arquivo. Confira se o Storage foi ativado, se as regras foram publicadas e se o CORS do bucket está configurado.');
  }
}

async function deleteDocFile(docType){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este arquivo anexado?')) return;
  const p = window.__editingProcess;
  const info = p.docFiles && p.docFiles[docType];
  if(info && info.path){
    try{ await storage.ref(info.path).delete(); }catch(e){ console.log('Arquivo já não existia no Storage', e); }
  }
  if(p.docFiles) delete p.docFiles[docType];
  renderDocsTab();
  if(/fatura|invoice/i.test(docType)){ window.__lotesResultados = null; delete p.lotesExtraidos; }
  renderLotesTab();
  await autoPersistCurrentProcess();
}

/* Lista os pagamentos da Fase 8 separadamente (fixos + personalizados), cada um com seu
   próprio valor — usado tanto no preview da aba Custos quanto na Capa em PDF. */
function paymentBreakdownRows(p){
  if(!p) return [];
  const payments = p.payments || {};
  const nomesFixos = {freteInternacional:'Frete Internacional', dta:'DTA', prestacaoDespachante:'Prestação Despachante'};
  const rows = Object.keys(nomesFixos).map(key=>{
    const rec = payments[key];
    const valor = rec ? (parseFloat(rec.valor)||0) : 0;
    return { key, label: nomesFixos[key] + (rec && rec.checked ? '' : ' (pendente)'), valor };
  });
  (p.customPayments||[]).forEach(cp=>{
    const rec = payments['custom:'+cp.id];
    const valor = rec ? (parseFloat(rec.valor)||0) : 0;
    rows.push({ key:'custom:'+cp.id, label: cp.name + (rec && rec.checked ? '' : ' (pendente)'), valor });
  });
  return rows.filter(r=>r.valor>0 || (payments[r.key]&&payments[r.key].checked));
}

async function saveProcess(){
  if(!requireEditPermission()) return;
  const data = collectProcessFormData();
  if(!data.produto){
    alert('Informe ao menos o nome do produto.');
    switchTab('geral');
    return;
  }
  const idx = state.processes.findIndex(p=>p.id===data.id);
  const prev = idx>=0 ? state.processes[idx] : null;
  detectHistoryChanges(prev, data);
  const newKey = currentPendingKey(data);
  if(prev && prev.pendingKey===newKey){
    data.pendingSince = prev.pendingSince || todayStr();
  } else {
    data.pendingSince = todayStr();
  }
  data.pendingKey = newKey;
  if(idx>=0) state.processes[idx] = data; else state.processes.push(data);
  const ok = await persistState();
  if(!ok){
    /* NUNCA fecha o modal nem descarta a alteração se o salvamento falhou de verdade — antes
       disso acontecia silenciosamente (o modal fechava igual, dando a impressão de que salvou),
       e a pessoa só percebia a perda ao reabrir o processo depois. Agora avisa e mantém tudo
       aberto pra tentar de novo. */
    alert('Não foi possível salvar o processo agora (sem conexão ou erro no servidor). Suas alterações continuam aqui na tela — tente salvar de novo em alguns segundos.');
    return;
  }
  /* O processo já está salvo com segurança neste ponto (persistState() confirmou). Qualquer
     erro nas linhas abaixo (sincronizar histórico do Produto Mestre, fechar modal, re-renderizar)
     nunca deve ser confundido com falha ao salvar. */
  try{ syncProdutoMestreHistorico(data); }catch(e){ console.error('Erro ao sincronizar histórico do Produto Mestre (não afeta o salvamento, já concluído)', e); }
  try{ closeModal(); }catch(e){ console.error('Erro ao fechar modal (não afeta o salvamento, já concluído)', e); }
  render();
}

async function syncProdutoMestreHistorico(p){
  if(!p.produtoMestreId || !isProcessDone(p)) return;
  try{
    const leadTimeDias = p.dataPedido ? daysBetween(p.dataPedido, todayStr()) : null;
    const custoTotal = computeCosts(p).total;
    const entry = { processoId:p.id, ref:p.ref||'', leadTimeDias, custoTotal, dataFinalizacao: todayStr() };
    const docRef = db.collection('produtosMestre').doc(p.produtoMestreId);
    const doc = await docRef.get();
    if(!doc.exists) return;
    const dataAtual = doc.data();
    const historico = (dataAtual.historicoProcessos||[]).filter(h=>h.processoId!==p.id);
    historico.push(entry);
    await docRef.set({historicoProcessos: historico}, {merge:true});
    const idx = (window.__produtosMestre||[]).findIndex(x=>x.id===p.produtoMestreId);
    if(idx>=0) window.__produtosMestre[idx].historicoProcessos = historico;
  }catch(e){
    console.error('Não foi possível sincronizar o histórico do Produto Mestre', e);
  }
}

async function deleteProcess(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este processo permanentemente?')) return;
  state.processes = state.processes.filter(p=>p.id!==id);
  await persistState();
  closeModal();
  render();
}

function capaItem(checked, label){
  return `<div class="capa-item"><span class="capa-check">${checked?'&#10003;':''}</span><span>${label}</span></div>`;

function generateCapaPDF(){
  const data = collectProcessFormData();
  const fornecedor = state.suppliers.find(s=>s.id===data.supplierId);
  const stages = getStagesForProcess(data);
  const costs = computeCosts(data);
  const extra = data.extra || {};
  const destino = data.modal==='aereo' ? (data.aeroportoDestinoFinal ? data.aeroportoDesembarque : data.aeroportoDestino) : (extra.recintoAlfandegado || data.portoDestino || 'Recinto alfandegado a definir');
  const refDisplay = data.ref || ('REF-'+data.id.slice(0,6).toUpperCase());
  const statusLabel = stageInfoFor(data, data.status).label;

  const etapasHtml = stages.map(s=>{
    if(s.type==='payments'){
      return s.items.map(it=>{
        const rec = (data.payments && data.payments[it.key]) || {checked:false, valor:''};
        const v = parseFloat(rec.valor)||0;
        return capaItem(rec.checked, it.label + (v?` — ${fmtBRL(v)}`:''));
      }).join('');
    }
    const checked = data.checklist[s.key]||[];
    return s.items.map((label,idx)=>capaItem(checked[idx], label)).join('');
  }).join('');

  const docsHtml = getDocTypesForProcess(data).map(d=>capaItem(data.docs && data.docs[d], d)).join('');

  const field = (label, value)=>`<div class="f"><div class="l">${label}</div><div class="v">${value || '—'}</div></div>`;

  const html = `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Capa — ${data.produto||'Processo'}</title>
<style>
:root{--bar:#1f3864;--fill:#dce4ff;--title:#152a4a;--label:#3f5178;--ink:#1c2333;}
*{box-sizing:border-box;}
@page{ size: A4; margin: 10mm; }
html, body{ margin:0; padding:0; }
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:9.5pt;background:#fff;}
.sheet{width:190mm;max-width:190mm;margin:0 auto;padding:0;}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--bar);padding-bottom:8px;margin-bottom:14px;}
.head h1{font-size:19pt;color:var(--title);margin:0;}
.head .ref{font-size:22pt;font-weight:800;color:var(--bar);background:var(--fill);padding:8px 18px;border-radius:4px;letter-spacing:.3px;}
.sec-bar{background:var(--bar);color:#fff;font-size:9.5pt;font-weight:700;letter-spacing:.5px;padding:6px 10px;text-transform:uppercase;margin-top:16px; break-after:avoid; page-break-after:avoid;}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px; break-inside:avoid; page-break-inside:avoid;}
.f{flex:1 1 150px;min-width:150px;}
.f .l{font-size:7.5pt;text-transform:uppercase;color:var(--label);font-weight:700;letter-spacing:.4px;}
.f .v{background:var(--fill);padding:6px 9px;border-radius:3px;font-size:10pt;margin-top:3px;min-height:15px;}
.capa-items{display:flex;flex-wrap:wrap;margin-top:8px;}
.capa-item{width:33%;font-size:8.5pt;padding:3px 6px 3px 0;display:flex;align-items:center;gap:6px; break-inside:avoid; page-break-inside:avoid;}
.capa-check{display:inline-block;width:12px;height:12px;border:1.4px solid var(--bar);text-align:center;line-height:11px;font-size:8px;color:var(--bar);flex-shrink:0;}
.obs-box{background:var(--fill);border-radius:4px;padding:8px 10px;margin-top:8px;font-size:9.5pt;min-height:30px; break-inside:avoid; page-break-inside:avoid;}
.foot{text-align:center;font-size:7.5pt;color:#8a93a8;margin-top:18px;padding-top:8px;border-top:1px solid #d5dcec;}
@media print{
  body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sheet{ width:auto; max-width:none; }
}
</style></head>
<body>
<div class="sheet">
  <div class="head">
    <h1>PROCESSO DE IMPORTAÇÃO</h1>
    <div class="ref">${refDisplay}</div>
  </div>

  <div class="sec-bar">1. Identificação</div>
  <div class="row">
    ${field('Produto', data.produto)}
    ${field('Fornecedor', fornecedor?fornecedor.name:'')}
    ${field('Status Atual', statusLabel)}
  </div>
  <div class="row">
    ${field('Referência', data.ref)}
    ${field('Referência do Fornecedor', (data.referenciasFornecedor||[]).map(r=>r.ref).filter(Boolean).join(' / '))}
    ${field('Tipo de Processo', data.tipo==='temporaria'?'Admissão Temporária':'Importação Definitiva')}
  </div>
  ${data.produtoMestreNome || (data.rotaAplicada&&data.rotaAplicada.nome) ? `
  <div class="row">
    ${data.produtoMestreNome?field('Produto Mestre Utilizado', data.produtoMestreNome):''}
    ${data.rotaAplicada&&data.rotaAplicada.nome?field('Rota Utilizada', data.rotaAplicada.nome):''}
  </div>` : ''}
  <div class="row">
    ${field('Data de Abertura', fmtDate(data.dataPedido))}
    ${field('Prontidão da Carga', fmtDate(data.prontidao))}
    ${field('Previsão de Entrada em Estoque', fmtDate(data.previsaoEntradaEstoque))}
  </div>

  <div class="sec-bar">2. Dados da Importação</div>
  <div class="row">
    ${field('DI / DUIMP', extra.numeroDUIMP)}
    ${field('Modal', data.modal==='aereo'?'Aéreo':'Marítimo')}
    ${field('Incoterm', data.incoterm)}
    ${field('Regime Fiscal', data.regime)}
  </div>
  <div class="row">
    ${field('Controle de Temperatura', data.temperaturaControlada ? (data.temperaturaValor==='outro' ? data.temperaturaOutro : (data.temperaturaValor||'Sim')) : 'Não')}
  </div>
  <div class="row">
    ${field('Origem', data.origemPais)}
    ${field('Destino', destino)}
    ${field('Moeda', 'USD')}
    ${field('Câmbio', data.cambio)}
  </div>
  <div class="row">
    ${field('Agente de Cargas', extra.agenteCarga)}
    ${field('Despachante', extra.despachante)}
    ${field('Transportadora (DTA)', extra.transportadoraDTA)}
  </div>
  <div class="row">
    ${field('Número do BL', extra.numeroBL)}
    ${field('Valor FOB', data.fob?fmtUSD(parseFloat(data.fob)):'')}
    ${field('Quantidade de Containers', data.containersQty)}
    ${field('Número da NF', extra.numeroNF)}
  </div>

  <div class="sec-bar">3. Logística</div>
  ${data.modal==='aereo' ? `
  <div class="row">
    ${field('AWB', extra.numeroAWB)}
    ${field('Companhia Aérea', extra.ciaAerea)}
    ${field('Freetime', '')}
  </div>
  <div class="row">
    ${field('Aeroporto de Embarque', data.aeroportoEmbarque)}
    ${field('Aeroporto de Desembarque', data.aeroportoDesembarque)}
    ${field('Aeroporto de Destino', data.aeroportoDestinoFinal ? 'Mesmo que desembarque' : data.aeroportoDestino)}
  </div>` : `
  <div class="row">
    ${field('Navio / Voo', extra.navio)}
    ${field('Viagem', extra.viagem)}
    ${field('Freetime', extra.freetime ? extra.freetime+' dias' : '')}
  </div>
  <div class="row">
    ${field('Quantidade de Containers', data.containersQty)}
    ${field('Tamanho do Container', data.containerTamanho)}
    ${field('Tipo de Container', data.containerTipo)}
  </div>`}
  <div class="row">
    ${field('Data de Embarque', fmtDate(data.dataEmbarqueReal))}
    ${field('Chegada Prevista', fmtDate(data.chegadaPrevista))}
    ${field('Data de Chegada (Betim)', fmtDate(extra.dataChegadaBetim))}
  </div>
  ${(extra.containersList && extra.containersList.length) ? `
  <div class="row">
    ${extra.containersList.map((c,i)=>field('Container #'+(i+1), (c.container||'—')+' / Lacre: '+(c.lacre||'—'))).join('')}
  </div>` : ''}

  <div class="sec-bar">4. Etapas do Processo</div>
  <div class="capa-items">${etapasHtml}</div>

  <div class="sec-bar">5. Checklist de Documentos</div>
  <div class="capa-items">${docsHtml}</div>

  <div class="sec-bar">6. Custos</div>
  <div class="row">
    ${field('CIF (BRL) — referência', fmtBRL(costs.cifBrl))}
    ${field('FOB + Seguro (BRL)', fmtBRL(costs.fobBrl+costs.seguroBrl))}
    ${field(costs.icmsAplicavel ? 'Impostos (II+IPI+PIS+COFINS+ICMS)' : 'Impostos (II+IPI+PIS+COFINS) — RET-MG', fmtBRL(costs.ii+costs.ipi+costs.pis+costs.cofins+costs.icms))}
    ${field('Pagamentos da Fase 8 (inclui frete real)', fmtBRL(costs.paymentsTotal))}
  </div>
  <div class="row">
    ${field('Custo Total Estimado', fmtBRL(costs.total))}
  </div>
  ${(() => {
    const rows = paymentBreakdownRows(data);
    if(!rows.length) return '';
    return `<div class="row">` + rows.map(r => field(r.label, fmtBRL(r.valor))).join('') + `</div>`;
  })()}

  <div class="sec-bar">7. Observações</div>
  <div class="obs-box">${data.obs || '—'}</div>

  <div class="foot">Capa gerada automaticamente pelo ComexTrack em ${fmtDate(todayStr())}.</div>
</div>
<` + `script>window.onload=function(){ setTimeout(function(){ window.print(); }, 350); };<` + `/script>
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){
    alert('Não foi possível abrir a janela de impressão. Verifique se o navegador bloqueou pop-ups.');
    return;
  }
  w.document.write(html);
  w.document.close();
}

/* ---------- SUPPLIER MODAL ---------- */
function openSupplierModal(id){
  const existing = id ? state.suppliers.find(s=>s.id===id) : null;
  const s = existing || {id:uid()};
  window.__editingSupplierCountries = (s.countries||[]).slice();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h2>${existing?'Editar Fornecedor':'Novo Fornecedor'}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>Nome</label><input id="s-name" value="${s.name||''}" placeholder="Ex: Morita ou Carestream"></div>
        <div class="form-group">
          <label>Cor de Identificação</label>
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="color" id="s-color" value="${s.color || (/carestream/i.test(s.name||'') ? '#C8641A' : (/morita/i.test(s.name||'') ? '#1D5FA8' : '#2A5C8A'))}" style="width:52px; height:36px; padding:2px; border:1px solid var(--border-strong); border-radius:6px; cursor:pointer;">
            <span class="form-hint">Usada pra destacar o nome deste fornecedor nos processos, produtos e listagens.</span>
          </div>
        </div>
        <div class="form-group">
          <label>Países de Origem</label>
          <div style="display:flex; gap:8px; margin-bottom:8px;">
            <select id="s-country-select" style="flex:1;">
              ${COUNTRY_LIST.map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}
            </select>
            <button type="button" class="btn" onclick="addSupplierCountry()">+ Adicionar</button>
          </div>
          <div class="supplier-tags" id="supplier-countries-tags">
            ${window.__editingSupplierCountries.map(c=>`<span class="supplier-tag" style="display:inline-flex; align-items:center; gap:5px;">${countryFlag(c)} ${c} <span style="cursor:pointer; font-weight:700;" onclick="removeSupplierCountry('${c.replace(/'/g,"\\'")}')">×</span></span>`).join('') || '<span class="form-hint">Nenhum país adicionado ainda.</span>'}
          </div>
          <div class="form-hint">Se o país que você precisa não aparecer digitando, escolha "Outro" e escreva na próxima tela de edição.</div>
        </div>
        <div class="form-group">
          <label>Modais que este fornecedor opera</label>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-modal-aereo" ${s.modaisOperados && s.modaisOperados.aereo ? 'checked':''}> Aéreo</label>
            <label class="modalidade-check"><input type="checkbox" id="s-modal-maritimo" ${s.modaisOperados && s.modaisOperados.maritimo ? 'checked':''}> Marítimo</label>
            <label class="modalidade-check"><input type="checkbox" id="s-modal-rodoviario" ${s.modaisOperados && s.modaisOperados.rodoviario ? 'checked':''}> Rodoviário</label>
          </div>
        </div>
        <div class="form-group"><label>Contato (e-mail / telefone)</label><input id="s-contact" value="${s.contact||''}"></div>
        <div class="form-group">
          <label>Modalidades de Pagamento Aceitas</label>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-adiantado" ${s.modalidades && s.modalidades.adiantado ? 'checked':''}> Adiantado</label>
          </div>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-aprazo" onchange="toggleModalidadeDias('aprazo', this.checked)" ${s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.checked ? 'checked':''}> A prazo</label>
            <div class="modalidade-dias" id="wrap-aprazo" style="display:${s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.checked ? 'flex':'none'};">
              <input type="number" id="s-mod-aprazo-dias" value="${(s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.dias) || ''}" placeholder="dias">
              <span>dias após a fatura</span>
            </div>
          </div>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-factoring" onchange="toggleModalidadeDias('factoring', this.checked)" ${s.modalidades && s.modalidades.factoring && s.modalidades.factoring.checked ? 'checked':''}> Factoring</label>
            <div class="modalidade-dias" id="wrap-factoring" style="display:${s.modalidades && s.modalidades.factoring && s.modalidades.factoring.checked ? 'flex':'none'};">
              <input type="number" id="s-mod-factoring-dias" value="${(s.modalidades && s.modalidades.factoring && s.modalidades.factoring.dias) || ''}" placeholder="dias">
              <span>dias após a fatura (via banco)</span>
            </div>
          </div>
          <div class="form-hint">Marque quantas se aplicarem. O número de dias fica salvo para quando você precisar calcular a data de vencimento a partir da fatura.</div>
        </div>
        <div class="form-group"><label>Observações de Pagamento</label><input id="s-payment" value="${s.paymentTerms||''}" placeholder="Ex: condições específicas, banco, contato financeiro..."></div>
        <div class="form-group"><label>Observações Gerais</label><textarea id="s-notes">${s.notes||''}</textarea></div>
      </div>
      <div class="modal-footer">
        <div>${existing && canEdit('fornecedores') ?`<button class="btn btn-danger" onclick="deleteSupplier('${s.id}')">Excluir</button>`:'<span></span>'}</div>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="closeModal()">${!canEdit('fornecedores')?'Fechar':'Cancelar'}</button>
          ${canEdit('fornecedores') ? `<button class="btn btn-primary" onclick="saveSupplier('${s.id}')">Salvar Fornecedor</button>` : ''}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function toggleModalidadeDias(which, checked){
  document.getElementById('wrap-'+which).style.display = checked ? 'flex' : 'none';
}

function addSupplierCountry(){
  const sel = document.getElementById('s-country-select');
  const val = sel.value;
  if(!val) return;
  if(!window.__editingSupplierCountries.includes(val)){
    window.__editingSupplierCountries.push(val);
  }
  document.getElementById('supplier-countries-tags').innerHTML =
    window.__editingSupplierCountries.map(c=>`<span class="supplier-tag" style="display:inline-flex; align-items:center; gap:5px;">${countryFlag(c)} ${c} <span style="cursor:pointer; font-weight:700;" onclick="removeSupplierCountry('${c.replace(/'/g,"\\'")}')">×</span></span>`).join('') || '<span class="form-hint">Nenhum país adicionado ainda.</span>';
}
function removeSupplierCountry(c){
  window.__editingSupplierCountries = window.__editingSupplierCountries.filter(x=>x!==c);
  document.getElementById('supplier-countries-tags').innerHTML =
    window.__editingSupplierCountries.map(cc=>`<span class="supplier-tag" style="display:inline-flex; align-items:center; gap:5px;">${countryFlag(cc)} ${cc} <span style="cursor:pointer; font-weight:700;" onclick="removeSupplierCountry('${cc.replace(/'/g,"\\'")}')">×</span></span>`).join('') || '<span class="form-hint">Nenhum país adicionado ainda.</span>';
}

async function saveSupplier(id){
  if(!requireEditPermission()) return;
  const name = document.getElementById('s-name').value.trim();
  if(!name){ alert('Informe o nome do fornecedor.'); return; }
  const data = {
    id,
    name,
    countries: (window.__editingSupplierCountries||[]).slice(),
    color: document.getElementById('s-color').value,
    modaisOperados: {
      aereo: document.getElementById('s-modal-aereo').checked,
      maritimo: document.getElementById('s-modal-maritimo').checked,
      rodoviario: document.getElementById('s-modal-rodoviario').checked,
    },
    contact: document.getElementById('s-contact').value.trim(),
    modalidades: {
      adiantado: document.getElementById('s-mod-adiantado').checked,
      aPrazo: { checked: document.getElementById('s-mod-aprazo').checked, dias: document.getElementById('s-mod-aprazo-dias').value },
      factoring: { checked: document.getElementById('s-mod-factoring').checked, dias: document.getElementById('s-mod-factoring-dias').value },
    },
    paymentTerms: document.getElementById('s-payment').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
  };
  const idx = state.suppliers.findIndex(s=>s.id===id);
  if(idx>=0) state.suppliers[idx]=data; else state.suppliers.push(data);
  await persistState();
  closeModal();
  render();
}

async function deleteSupplier(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este fornecedor? Processos vinculados manterão a referência vazia.')) return;
  state.suppliers = state.suppliers.filter(s=>s.id!==id);
  state.processes.forEach(p=>{ if(p.supplierId===id) p.supplierId=''; });
  await persistState();
  closeModal();
  render();
}

applyStoredTheme();
/* App inicia via tela de login — ver auth.onAuthStateChanged acima */
</script>
</body>
</html>
