<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --navy:#0F1B2D;
  --navy-light:#16263D;
  --navy-lighter:#223a58;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --ink-red:#B8441F;
  --ink-red-bg:#FBE9E2;
  --ink-green:#1F7A5C;
  --ink-green-bg:#E4F3EC;
  --ink-amber:#A5730F;
  --ink-amber-bg:#FBF0DC;
  --ink-blue:#2A5C8A;
  --ink-blue-bg:#E4EEF6;
  --ink-purple:#5B3FA0;
  --ink-purple-bg:#EDE7F8;
  --ink-teal:#0E7C86;
  --ink-teal-bg:#DCEEF0;
  --ink-gold:#946200;
  --ink-gold-bg:#FCEFD1;
  --ink-orange:#B85C1F;
  --ink-orange-bg:#FBEBDD;
  --text:#1A2433;
  --muted:#6B7785;
  --border:#E2E6EA;
  --border-strong:#C7CFD6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.display{font-family:'Zilla Slab', serif;}

#app{display:flex; min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--navy);
  color:#DCE4EC;
  display:flex; flex-direction:column;
  padding:24px 0;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:0 20px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  margin-bottom:20px;
  display:flex; justify-content:center;
}
.brand-mark{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:20px;
  color:#fff; letter-spacing:0.02em;
  display:flex; align-items:center; gap:8px;
}
.brand-mark svg{flex-shrink:0;}
.brand-sub{
  font-family:'IBM Plex Mono', monospace; font-size:10px; color:#7C8FA8;
  letter-spacing:0.12em; text-transform:uppercase; margin-top:4px;
}
.nav{display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:6px;
  color:#AEBBCC; font-size:14px; font-weight:500;
  cursor:pointer; border:none; background:none; text-align:left; width:100%;
  transition:background 0.15s, color 0.15s;
}
.nav-item:hover{background:var(--navy-light); color:#fff;}
.nav-item-reorder-row{display:flex; align-items:center; gap:4px; margin-bottom:2px;}
.nav-reorder-btn{background:var(--navy-light); border:none; color:#AEBBCC; border-radius:5px; width:26px; height:26px; cursor:pointer; font-size:12px; flex-shrink:0;}
.nav-reorder-btn:hover{color:#fff;}
.nav-reorder-btn:disabled{opacity:0.25; cursor:default;}
.nav-reorder-toggle{width:100%; margin-top:10px; padding:8px 12px; background:none; border:1px dashed #4A5A70; border-radius:6px; color:#AEBBCC; font-size:11.5px; cursor:pointer;}
.nav-reorder-toggle:hover{color:#fff; border-color:#7A8AA0;}
.nav-item.active{background:var(--navy-lighter); color:#fff;}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0; flex-shrink:0;}
.nav-item.active .dot{opacity:1; background:#E8A25C;}

.sidebar-footer{margin-top:auto; padding:0 20px;}
.new-process-btn{
  width:100%; background:var(--ink-red); color:#fff; border:none;
  padding:11px 14px; border-radius:6px; font-weight:600; font-size:13px;
  cursor:pointer; font-family:'Inter',sans-serif;
  transition:background 0.15s;
}
.new-process-btn:hover{background:#9c3818;}

/* MAIN */
main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:28px 36px 20px 36px;
  border-bottom:1px solid var(--border);
  background:var(--card);
}
.topbar h1{font-family:'Zilla Slab', serif; font-size:26px; font-weight:700;}
.topbar p{color:var(--muted); font-size:13.5px; margin-top:4px;}
.view-content{padding:28px 36px 60px 36px; flex:1;}

/* KPI */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
.kpi-card{
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:8px;
}
.kpi-card::before{
  content:''; position:absolute; top:0; left:0; width:3px; height:100%;
  background:var(--kpi-accent, var(--ink-blue));
}
.kpi-icon-circle{
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:14px; background:var(--kpi-accent-bg, var(--ink-blue-bg)); color:var(--kpi-accent, var(--ink-blue));
}
.kpi-label{font-family:'Inter',sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text); font-weight:700;}
.kpi-value{font-family:'Zilla Slab', serif; font-size:26px; font-weight:700;}
.kpi-pct{font-size:11px; color:var(--muted); font-weight:600;}
.kpi-sub{font-size:12px; color:var(--muted); margin-top:3px;}

.section-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:16px;
  margin:36px 0 16px 0; display:flex; align-items:center; gap:12px;
  text-transform:uppercase; letter-spacing:0.03em;
}
.section-title:first-child{margin-top:0;}
.section-title .rule{flex:1; height:3px; background:linear-gradient(90deg, var(--navy) 0%, var(--border-strong) 70%, transparent 100%); border-radius:2px;}

/* ====================== TESTE VISUAL — Painel v2 ======================
   Aditivo: nada do .section-title acima foi removido. Estas classes novas
   (.section-band, .attention-*) só entram em uso se renderDashboardResults
   estiver chamando a versão "v2" — fácil reverter trocando só essa função. */
.section-band{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; cursor:pointer; user-select:none;
  padding:13px 20px; border-radius:10px; margin:28px 0 16px 0;
  background:var(--band-color, var(--ink-blue)); color:#fff;
}
.section-band:first-child{margin-top:0;}
.section-band .band-icon{font-size:15px;}
.section-band .band-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:14.5px;
  text-transform:uppercase; letter-spacing:0.03em; color:#fff;
}
.section-band .band-count{
  margin-left:auto; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;
  color:#fff; opacity:0.9;
}
.section-band .band-chevron{font-size:11px; transition:transform 0.15s ease; opacity:0.9;}
.section-band.collapsed .band-chevron{transform:rotate(-90deg);}
.section-band-body{overflow:hidden;}
.section-band-body.collapsed{display:none;}
.section-band-placeholder{
  padding:14px 20px; color:var(--muted); font-size:13px; cursor:pointer;
  background:var(--card); border:1px solid var(--border); border-top:none;
  border-radius:0 0 10px 10px; margin-top:-16px; margin-bottom:16px;
  display:flex; align-items:center; justify-content:space-between;
}

.attention-area{
  background:linear-gradient(90deg, #FDECEA 0%, #FDF6F5 55%, #FFFFFF 100%);
  border:1.5px solid #F2BBB1; border-radius:16px;
  padding:18px 22px; margin-bottom:20px;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.attention-body{flex-shrink:0; display:flex; flex-direction:column; gap:3px;}
.attention-label{
  font-family:'Inter', sans-serif; font-weight:800; font-size:18px; color:#DC2626;
  line-height:1.1; letter-spacing:0.01em; white-space:nowrap;
}
.attention-sub{font-size:11.5px; font-weight:500; color:#374151; white-space:nowrap;}
.attention-chips{display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; flex:1;}
.attention-chip{
  display:flex; align-items:center; gap:11px; padding:12px 20px 12px 15px; border-radius:13px;
  min-width:180px;
}
.attention-chip-text{display:flex; flex-direction:column; line-height:1.25;}
.attention-chip-num{font-family:'Inter',sans-serif; font-weight:800; font-size:20px; line-height:1.1;}
.attention-chip-label{font-size:11.5px; font-weight:700; color:#1F2937; margin-top:1px;}
.attention-chip-hint{font-size:10px; font-weight:600; margin-top:1px;}
.attention-chip-red{background:#FCE1DD; color:#DC2626;}
.attention-chip-red .attention-chip-hint{color:#DC2626;}
.attention-chip-orange{background:#FCE7D6; color:#EA580C;}
.attention-chip-orange .attention-chip-hint{color:#EA580C;}
.attention-chip-yellow{background:#FCEFCE; color:#CA8A04;}
.attention-chip-yellow .attention-chip-hint{color:#CA8A04;}
.attention-details-btn{
  flex-shrink:0; margin-left:auto; background:#EEF1F5; border:1.5px solid #D6DDE6;
  border-radius:11px; padding:11px 19px; font-size:12.5px; font-weight:600; color:#1F2937;
  cursor:pointer; white-space:nowrap;
}
.attention-details-btn:hover{border-color:var(--navy);}
body.dark-mode .attention-area{background:var(--card); border-color:var(--border-strong);}
body.dark-mode .attention-label{color:#F87171;}
body.dark-mode .attention-sub{color:var(--muted);}
body.dark-mode .attention-chip-red{background:rgba(220,38,38,0.15); color:#F87171;}
body.dark-mode .attention-chip-red .attention-chip-hint{color:#F87171;}
body.dark-mode .attention-chip-orange{background:rgba(234,88,12,0.15); color:#FB923C;}
body.dark-mode .attention-chip-orange .attention-chip-hint{color:#FB923C;}
body.dark-mode .attention-chip-yellow{background:rgba(202,138,4,0.18); color:#FBBF24;}
body.dark-mode .attention-chip-yellow .attention-chip-hint{color:#FBBF24;}
body.dark-mode .attention-chip-label{color:var(--text);}
body.dark-mode .attention-details-btn{background:var(--paper); border-color:var(--border-strong); color:var(--text);}

.dashboard-footer-bar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  margin-top:28px; padding-top:16px; border-top:1px solid var(--border);
}
.dashboard-footer-sync{font-size:12px; color:var(--muted);}
.dashboard-footer-fob{
  display:flex; align-items:baseline; gap:10px; padding:10px 16px;
  background:var(--navy); border-radius:8px;
}
.dashboard-footer-fob-label{font-size:11px; font-weight:600; color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.03em;}
body.dark-mode .dashboard-footer-fob{background:var(--card); border:1px solid var(--border-strong);}

.attention-detail-group{margin-bottom:18px;}
.attention-detail-group:last-child{margin-bottom:0;}
.attention-detail-group-title{
  display:inline-block; font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:999px;
  margin-bottom:8px;
}
.attention-detail-row{
  display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:8px;
  border:1px solid var(--border); margin-bottom:6px; cursor:pointer; transition:border-color 0.15s, background 0.15s;
}
.attention-detail-row:hover{border-color:var(--navy); background:var(--paper);}
.attention-detail-ref{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:var(--muted);
  background:var(--paper); border-radius:6px; padding:4px 8px; flex-shrink:0;
}
.attention-detail-text{flex:1; min-width:0;}
.attention-detail-produto{font-size:12.5px; font-weight:700; color:var(--text);}
.attention-detail-alert{font-size:12px; color:var(--muted); margin-top:1px;}
.attention-detail-arrow{color:var(--muted); flex-shrink:0;}
/* ==================== fim TESTE VISUAL — Painel v2 ==================== */

/* PROCESS LIST */
.process-list{display:flex; flex-direction:column; gap:10px;}
.process-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:16px 18px; cursor:pointer; transition:border-color 0.15s, box-shadow 0.15s;
  display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center;
}
.process-card:hover{border-color:var(--border-strong); box-shadow:0 2px 10px rgba(15,27,45,0.06);}

.stamp{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600;
  letter-spacing:0.06em; text-transform:uppercase;
  border:2px solid currentColor; border-radius:4px;
  padding:5px 8px; transform:rotate(-3deg); white-space:nowrap;
  text-align:center; line-height:1.3; max-width:150px;
}
.stamp-pedido{color:var(--ink-blue); background:var(--ink-blue-bg);}
.stamp-producao{color:var(--ink-amber); background:var(--ink-amber-bg);}
.stamp-embarcado{color:var(--ink-purple); background:var(--ink-purple-bg);}
.stamp-transito{color:var(--ink-purple); background:var(--ink-purple-bg);}
.stamp-porto{color:var(--ink-amber); background:var(--ink-amber-bg);}
.stamp-desembaraco{color:var(--ink-red); background:var(--ink-red-bg);}
.stamp-remocao{color:var(--ink-teal); background:var(--ink-teal-bg);}
.stamp-pagamentos{color:var(--ink-gold); background:var(--ink-gold-bg);}
.stamp-entregue{color:var(--ink-green); background:var(--ink-green-bg);}

.process-main h3{font-size:15px; font-weight:600;}
.process-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
.process-meta .ref{font-family:'IBM Plex Mono', monospace; color:var(--muted);}
.process-track{margin-top:10px; display:flex; align-items:center;}
.track-step{display:flex; align-items:center; flex:1;}
.track-dot{width:8px; height:8px; border-radius:50%; background:var(--border-strong); flex-shrink:0; position:relative;}
.track-dot.done{background:var(--ink-green);}
.track-dot.current{background:var(--ink-red); box-shadow:0 0 0 3px var(--ink-red-bg);}
.track-line{flex:1; height:2px; background:var(--border-strong);}
.track-line.done{background:var(--ink-green);}
.step-note{font-size:12px; color:var(--ink-red); margin-top:5px; font-style:italic;}
.progress-pct{font-size:10.5px; color:var(--muted); margin-top:4px; font-family:'IBM Plex Mono',monospace;}
.alert-banner{
  background:var(--ink-red-bg); color:var(--ink-red); border:1px solid #F0BBA5; border-radius:6px;
  padding:6px 10px; font-size:11.5px; font-weight:600; margin-top:7px; line-height:1.5;
}
.process-card.has-alert, .transit-card.has-alert{border-color:var(--ink-red); box-shadow:0 0 0 1px var(--ink-red-bg);}

.eye-btn{
  position:absolute; top:10px; right:10px; background:var(--navy); border:1px solid var(--navy);
  border-radius:6px; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:14px; z-index:2; box-shadow:0 1px 3px rgba(15,27,45,0.25);
}
.eye-btn:hover{background:var(--navy-light); border-color:var(--navy-light);}
body.dark-mode .eye-btn{background:var(--card); border-color:var(--border-strong);}
body.dark-mode .eye-btn:hover{border-color:var(--ink-blue);}
.process-card, .transit-card{position:relative;}

.view-section-title{font-family:'Zilla Slab',serif; font-weight:700; font-size:14.5px; margin:18px 0 10px 0; color:var(--navy); text-transform:uppercase; letter-spacing:0.03em;}
.view-section-title:first-child{margin-top:0;}
.view-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
.view-field{background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:8px 10px;}
.view-field .view-label{display:block; font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:0.03em; margin-bottom:3px;}
.view-field .view-value{font-size:13px; font-weight:500;}
.view-field .view-value-row{display:flex; align-items:center; gap:6px;}
.copy-icon-btn{background:none; border:none; cursor:pointer; opacity:0.3; font-size:11px; padding:2px; line-height:1; flex-shrink:0;}
.copy-icon-btn:hover{opacity:0.9;}
.copy-toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--navy); color:#fff; padding:8px 18px; border-radius:20px; font-size:12.5px; font-weight:600; opacity:0; transition:opacity 0.25s ease, transform 0.25s ease; z-index:9999; box-shadow:0 6px 18px rgba(0,0,0,0.2);}
.copy-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.view-check-list{display:flex; flex-direction:column; gap:5px;}
.view-check-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px; border-radius:5px;}
.view-check-item.done{color:var(--ink-green);}
.view-check-item .vc{width:14px; height:14px; border-radius:4px; border:2px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff;}
.view-check-item.done .vc{background:var(--ink-green); border-color:var(--ink-green);}
.pending-since{font-size:11px; color:var(--ink-red); margin-top:4px; font-weight:600;}

.process-ref-badge{min-width:64px; text-align:center; padding:6px 4px;}
.process-ref-badge .ref-label{display:block; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:3px;}
.process-ref-badge .ref-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; color:var(--navy); line-height:1.2; word-break:break-word; text-transform:uppercase; letter-spacing:0.02em;}
.phase-mini{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; color:var(--muted); background:var(--paper); padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; margin-left:6px; vertical-align:middle;}

.filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:20px;}
.filter-bar input, .filter-bar select{padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;}
.filter-bar input[type="text"]{flex:1; min-width:180px;}
.filter-bar .btn{padding:8px 12px; font-size:12.5px;}

.stage-pills{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px;}
.stage-pill{
  padding:6px 13px; border-radius:20px; border:1px solid var(--border-strong); background:var(--card);
  font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;
}
.stage-pill.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.stage-pill:hover:not(.active){border-color:var(--ink-blue);}

.active-count-label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:12px; letter-spacing:0.02em;}

.month-group{margin-bottom:6px;}
.month-summary{
  cursor:pointer; font-family:'Zilla Slab',serif; font-weight:700; font-size:14px; color:var(--navy);
  padding:9px 4px; list-style:none; display:flex; align-items:center; gap:10px; letter-spacing:0.03em;
}
.month-summary::-webkit-details-marker{display:none;}
.month-summary::before{content:'▸'; font-size:12px; color:var(--muted);}
.month-group[open] .month-summary::before{content:'▾';}
.month-count{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--muted); background:var(--paper); padding:2px 8px; border-radius:10px;}

.history-item{border-left:3px solid var(--ink-blue); background:var(--paper); border-radius:0 6px 6px 0; padding:10px 14px; margin-bottom:10px;}
.history-date{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;}
.history-title{font-size:13.5px; font-weight:600; margin-top:3px;}
.history-detail{font-size:12.5px; color:var(--muted); margin-top:4px; white-space:pre-line; line-height:1.5;}
.history-actions{display:flex; gap:6px; margin-top:8px;}

.perf-group{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:4px 14px;}
.perf-row{padding:11px 0; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;}
.perf-row:last-child{border-bottom:none;}
.perf-label{font-size:13px; color:var(--text);}
.perf-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
.perf-compare{width:100%; font-size:11.5px; color:var(--muted); margin-top:2px;}

.followup-card{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:14px;}
.followup-card-header{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.followup-ref{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:var(--navy); margin-right:10px; text-transform:uppercase;}
.followup-produto{font-weight:600; font-size:14px; margin-right:8px;}
.followup-fornecedor{font-size:12.5px; color:var(--muted);}
.followup-meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-bottom:12px;}
.followup-meta-grid .view-field{padding:6px 8px;}
.followup-meta-grid .view-label{font-size:9px;}
.followup-meta-grid .view-value{font-size:12px;}
.followup-narrative{background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-size:12.5px; line-height:1.8; color:var(--text);}
.chegada-prevista-tag{background:#fef3c7; color:#92400e; padding:1px 7px; border-radius:4px; font-weight:600;}

.product-search-bar{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.product-search-bar input{flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:6px; font-size:13.5px;}
.product-search-bar select{padding:9px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px;}
.product-row{display:grid; grid-template-columns:110px 1fr 110px 130px 100px auto; gap:10px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:11px 14px; margin-bottom:8px; cursor:pointer;}
.product-row:hover{border-color:var(--border-strong);}
.product-row .pn{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color:var(--navy);}
.product-row .desc{font-size:13px;}
.product-row .ncm{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);}
.product-row .fab{font-size:12px; color:var(--muted);}
.product-row .val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right;}
.product-inactive-badge{font-size:9.5px; font-weight:700; text-transform:uppercase; background:var(--paper); color:var(--muted); padding:2px 7px; border-radius:10px; border:1px solid var(--border-strong);}
.nav-alert-badge{display:inline-block; min-width:16px; padding:1px 5px; font-size:10px; font-weight:700; background:var(--ink-red); color:#fff; border-radius:9px; margin-left:6px; vertical-align:middle;}
.ex-badge{font-size:9.5px; font-weight:700; text-transform:uppercase; background:rgba(217,119,6,.12); color:#b45309; padding:2px 7px; border-radius:10px; border:1px solid rgba(217,119,6,.35);}

.import-drop{border:2px dashed var(--border-strong); border-radius:10px; padding:30px; text-align:center; color:var(--muted); margin-bottom:16px;}
.import-mapping-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);}
.import-preview-table{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
.import-preview-table th{background:var(--paper); padding:7px 9px; text-align:left; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; color:var(--muted);}
.import-preview-table td{padding:7px 9px; border-bottom:1px solid var(--border);}
.import-status-badge{font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px;}
.import-status-badge.novo{background:var(--ink-green-bg); color:var(--ink-green);}
.import-status-badge.alterado{background:var(--ink-amber-bg); color:var(--ink-amber);}
.import-status-badge.inalterado{background:var(--paper); color:var(--muted);}

.item-row{display:grid; grid-template-columns:100px 1fr 100px 90px 110px 40px; gap:8px; align-items:center; background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:9px 11px; margin-bottom:6px;}
.item-row input{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}
.item-row .item-pn{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px;}
.item-row .item-pn-link{cursor:pointer; text-decoration:none; border-bottom:1px dotted transparent;}
.item-row .item-pn-link:hover{border-bottom-color:var(--muted); color:var(--navy);}
.item-row .item-desc{font-size:12px;}
.item-autocomplete-wrap{position:relative;}
.item-autocomplete-list{position:absolute; top:100%; left:0; right:0; background:var(--card); border:1px solid var(--border-strong); border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,0.15); max-height:220px; overflow-y:auto; z-index:20;}
.item-autocomplete-option{padding:8px 11px; cursor:pointer; font-size:12.5px; border-bottom:1px solid var(--border);}
.item-autocomplete-option:hover{background:var(--paper);}
.item-autocomplete-option:last-child{border-bottom:none;}
.item-totals-row{display:flex; gap:20px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-top:12px;}
.item-total-box{text-align:center; background:var(--navy); border-radius:8px; padding:8px 16px;}
.item-total-box .num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px; color:#fff;}
.item-total-box .lbl{font-size:10.5px; color:rgba(255,255,255,0.7); text-transform:uppercase; letter-spacing:0.03em;}
body.dark-mode .item-total-box{background:var(--card); border:1px solid var(--border-strong);}
body.dark-mode .item-total-box .num{color:var(--text);}
body.dark-mode .item-total-box .lbl{color:var(--muted);}
.supplier-name-carestream{color:#C8641A; font-weight:700;}
.supplier-name-morita{color:#1D5FA8; font-weight:700;}

body.dark-mode{
  --paper:#10161F; --card:#1A222E; --text:#E4E9F0; --muted:#8C9BB5;
  --border:#2A3646; --border-strong:#3A4A5F;
}
body.dark-mode .modal-overlay{background:rgba(0,0,0,0.7);}
body.dark-mode .form-group input, body.dark-mode .form-group select, body.dark-mode .form-group textarea,
body.dark-mode .filter-bar input, body.dark-mode .filter-bar select,
body.dark-mode .item-fields input, body.dark-mode .item-fields select,
body.dark-mode .stage-extra input, body.dark-mode .payment-row input,
body.dark-mode .config-icon, body.dark-mode .config-label, body.dark-mode .config-row select{
  background:#232E3D; color:var(--text); border-color:var(--border-strong);
}
body.dark-mode .doc-item, body.dark-mode .stage-header, body.dark-mode .stage-body{background:#1A222E;}
body.dark-mode .theme-toggle-btn{background:#232E3D; color:#fff; border-color:#3A4A5F;}
body.dark-mode .process-ref-badge .ref-value{color:#E8A25C;}
body.dark-mode .kpi-card, body.dark-mode .process-card, body.dark-mode .transit-card, body.dark-mode .supplier-card, body.dark-mode .contact-card{background:var(--card);}
body.dark-mode .stage-block.done .stage-header, body.dark-mode .stage-block.current .stage-header{color:#152A3D;}
body.dark-mode .stage-block.done .stage-title, body.dark-mode .stage-block.current .stage-title{color:#152A3D;}
body.dark-mode .contact-role, body.dark-mode .supplier-flag{color:#9AA9C2;}
body.dark-mode .contact-phone{color:#7FB3E8;}
body.dark-mode .stage-progress{color:#8C9BB5;}

.process-side{text-align:right; white-space:nowrap; align-self:start; margin-top:26px; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
.process-value{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px;}
.process-eta{font-size:11.5px; color:var(--muted); margin-top:3px;}
.process-badge-temp{
  display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--ink-purple); background:var(--ink-purple-bg);
  padding:2px 6px; border-radius:4px; margin-top:4px;
}

/* TRANSIT CARD */
.transit-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; cursor:pointer;
}
.transit-card:hover{border-color:var(--border-strong); box-shadow:0 2px 10px rgba(15,27,45,0.06);}
.transit-icon{font-size:26px; width:44px; text-align:center;}
.transit-dates{font-size:12px; color:var(--muted); margin-top:5px; display:flex; gap:14px; flex-wrap:wrap;}
.transit-logi{font-size:11.5px; color:var(--text); margin-top:4px; display:flex; gap:12px; flex-wrap:wrap;}
.transit-logi b{color:var(--muted); font-weight:600;}
.transit-days{text-align:right; white-space:nowrap;}
.transit-days .big{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; letter-spacing:0.01em;}
.transit-days .small{font-size:11px; color:var(--muted);}
.transit-days.late .big{color:var(--ink-red);}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--muted);
  border:1px dashed var(--border-strong); border-radius:10px;
}
.empty-state h3{font-family:'Zilla Slab', serif; color:var(--text); font-size:17px; margin-bottom:6px;}
.empty-state button{margin-top:16px;}

/* SUPPLIERS / PARTNERS */
.supplier-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
.supplier-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;
  cursor:pointer;
}
.supplier-card:hover{border-color:var(--border-strong);}
.supplier-card h3{font-size:15px; font-weight:600;}
.supplier-flag{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
.supplier-meta{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.6;}
.supplier-count{
  display:inline-block; margin-top:10px; font-size:11px; font-weight:600;
  background:var(--ink-blue-bg); color:var(--ink-blue); padding:3px 8px; border-radius:20px;
}
.supplier-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;}
.supplier-tag{font-size:10.5px; background:var(--ink-blue-bg); color:var(--ink-blue); padding:2px 7px; border-radius:10px; font-weight:600;}

/* COUNTRY CHIPS */
.country-checks{display:flex; flex-wrap:wrap; gap:8px;}
.country-chip{
  padding:6px 11px; border:1px solid var(--border-strong); border-radius:20px; font-size:12px; cursor:pointer; user-select:none;
}
.country-chip.checked{background:var(--ink-blue); color:#fff; border-color:var(--ink-blue);}

.modalidade-row{display:flex; align-items:center; gap:14px; margin-top:6px; flex-wrap:wrap;}
.modalidade-check{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; min-width:110px;}
.modalidade-check input{width:auto;}
.modalidade-dias{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
.modalidade-dias input{width:70px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}

.container-row{display:grid; grid-template-columns:28px 1fr 1fr; gap:8px; align-items:center; margin-top:6px;}
.container-row .container-idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;}
.container-row input{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}
.containers-table{margin-top:4px;}

/* PARTNERS GROUPS */
.contact-group{margin-bottom:26px;}
.contact-group-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:15px; margin-bottom:10px;
  display:flex; align-items:center; gap:8px; color:var(--navy);
}
.contact-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px;}
.contact-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:13px 15px; cursor:pointer;
}
.contact-card:hover{border-color:var(--border-strong);}
.contact-name{font-size:13.5px; font-weight:600;}
.contact-role{font-size:12px; color:var(--muted); margin-top:1px;}
.contact-phone{font-size:12.5px; color:var(--ink-blue); margin-top:6px; font-family:'IBM Plex Mono',monospace;}

/* INDICATORS */
.indicators-table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.indicators-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);
  background:var(--paper); padding:10px 14px; font-weight:600; border-bottom:1px solid var(--border);
}
.indicators-table td{padding:11px 14px; font-size:13px; border-bottom:1px solid var(--border);}
.indicators-table tr:last-child td{border-bottom:none;}
.indicators-table td.meta-col{font-family:'IBM Plex Mono',monospace; color:var(--ink-green); font-weight:600;}

/* MODAL */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,27,45,0.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:40px 20px;
  overflow-y:auto;
}
.modal{
  background:var(--card); border-radius:10px; width:100%; max-width:700px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
/* Modo Viewer: campos ficam visíveis mas travados (não dá pra editar, só ler) — os botões
   de ação (Salvar/Excluir/etc.) já ficam escondidos por role em cada modal; isso trava
   visualmente os campos em si, pra não parecer editável sem ser. */
.modal-readonly input, .modal-readonly select, .modal-readonly textarea, .modal-readonly [contenteditable="true"]{
  pointer-events:none; background:var(--paper); opacity:0.85; cursor:default;
}
.modal-readonly .type-toggle button, .modal-readonly .temp-toggle-btn, .modal-readonly .genset-toggle-btn, .modal-readonly .ex-toggle-btn, .modal-readonly .aerofinal-toggle-btn{
  pointer-events:none; opacity:0.7;
}
.modal-header{
  padding:20px 26px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-header h2{font-family:'Zilla Slab', serif; font-size:19px;}
.modal-close{
  background:none; border:none; cursor:pointer; color:var(--muted); font-size:20px;
  width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center;
}
.modal-close:hover{background:var(--paper); color:var(--text);}
.modal-body{padding:22px 26px; max-height:70vh; overflow-y:auto;}
.modal-footer{padding:16px 26px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}

.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em;}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border-strong); border-radius:6px;
  font-family:'Inter',sans-serif; font-size:13.5px; background:#fff; color:var(--text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:2px solid var(--ink-blue); outline-offset:1px; border-color:var(--ink-blue);}
.form-group textarea{resize:vertical; min-height:60px;}
.form-hint{font-size:11px; color:var(--muted); margin-top:4px; font-style:italic;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.tab-btn{
  background:none; border:none; padding:9px 4px; margin-right:18px; font-size:13px; font-weight:600;
  color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:'Inter',sans-serif;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--ink-red);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

.cost-table{width:100%; border-collapse:collapse; font-size:13px;}
.cost-table td{padding:7px 0; border-bottom:1px solid var(--border);}
.cost-table td:last-child{text-align:right; font-family:'IBM Plex Mono',monospace;}
.cost-table tr.total td{font-weight:700; border-top:2px solid var(--text); border-bottom:none; padding-top:10px;}
.cost-note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5; font-style:italic;}

/* ---------- Provisionamento ---------- */
.prov-section{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;}
.prov-section-title{font-size:11px; font-weight:800; letter-spacing:.6px; color:var(--muted); margin-bottom:10px;}
.prov-line{padding:10px 0; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
.prov-line:last-child{border-bottom:none;}
.prov-line-label{font-size:13px; color:var(--text);}
.prov-line-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px;}
.prov-line-total{border-top:1px solid var(--border-strong); margin-top:4px; padding-top:12px;}
.prov-line-total .prov-line-value{font-size:16px;}
.prov-line-grand-total .prov-line-label{font-size:13px; font-weight:800; letter-spacing:.4px;}
.prov-line-grand-total .prov-line-value{font-size:20px; font-weight:800; color:var(--navy);}
.prov-edit-btn{background:none; border:none; cursor:pointer; font-size:11.5px; color:var(--muted); padding:2px 4px;}
.prov-edit-btn:hover{color:var(--text);}
.prov-details{margin:4px 0 10px; font-size:12px;}
.prov-details summary{cursor:pointer; color:var(--muted); font-size:11.5px; padding:2px 0;}
.prov-warning{font-size:12px; color:var(--ink-red); background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.25); border-radius:6px; padding:8px 10px; margin:6px 0;}
.prov-mini-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:6px;}
.prov-mini-table th{text-align:right; font-size:10px; text-transform:uppercase; color:var(--muted); padding:4px 6px; border-bottom:2px solid var(--text);}
.prov-mini-table th:first-child, .prov-mini-table th:nth-child(2){text-align:left;}
.prov-mini-table td{padding:5px 6px; border-bottom:1px solid var(--border); text-align:right; font-family:'IBM Plex Mono',monospace;}
.prov-mini-table td:first-child, .prov-mini-table td:nth-child(2){text-align:left; font-family:inherit;}
.prov-mini-table tr.total td{font-weight:700; border-top:2px solid var(--text); border-bottom:none;}
.prov-conf-badge{display:inline-block; font-size:9px; text-transform:uppercase; font-weight:700; padding:1px 6px; border-radius:8px; background:rgba(217,119,6,.12); color:#b45309; border:1px solid rgba(217,119,6,.35); cursor:help; margin-left:4px; vertical-align:1px;}
.prov-conf-badge.prov-conf-ok{background:rgba(22,163,74,.12); color:#15803d; border-color:rgba(22,163,74,.35);}
.prov-multiplier-badge{display:inline-block; font-size:10.5px; font-weight:700; color:var(--navy); background:rgba(30,58,138,.08); border:1px solid rgba(30,58,138,.25); padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:1px; font-family:'IBM Plex Mono',monospace;}

.doc-checklist{display:flex; flex-direction:column; gap:8px;}
.doc-item-block{border:1px solid var(--border); border-radius:6px; overflow:hidden;}
.doc-item-block .doc-item{border:none; border-radius:0; margin:0;}
.doc-file-row{display:flex; align-items:center; gap:8px; padding:8px 11px; background:var(--paper); flex-wrap:wrap;}
.doc-file-name{font-size:12px; color:var(--text); font-weight:500;}
.doc-upload-status{font-size:11.5px; color:var(--muted); font-style:italic;}
.doc-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  border:1px solid var(--border); border-radius:6px; cursor:pointer;
}
.doc-item.checked{background:var(--ink-green-bg); border-color:#B7DBC9;}
.doc-check{
  width:18px; height:18px; border-radius:4px; border:2px solid var(--border-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
}
.doc-item.checked .doc-check{background:var(--ink-green); border-color:var(--ink-green);}
.doc-item span{font-size:13px; line-height:1.4;}
.doc-item.checked span{color:var(--ink-green); text-decoration:line-through; text-decoration-color:#B7DBC9;}

.item-fields{margin:-2px 0 6px 30px; padding:9px 11px; background:var(--paper); border-left:2px solid var(--border-strong); display:flex; flex-wrap:wrap; gap:8px; border-radius:0 6px 6px 0;}
.item-fields .mini-field{display:flex; flex-direction:column; gap:3px; min-width:130px; flex:1;}
.item-fields label{font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600;}
.item-fields input, .item-fields select{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; font-family:'Inter',sans-serif;}

.stage-extra{margin-top:6px; padding:11px 12px; background:var(--paper); border:1px solid var(--border); border-radius:6px; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:9px;}

.payment-row{display:flex; flex-direction:column; gap:8px; padding:10px 11px; border:1px solid var(--border); border-radius:6px;}
.payment-row-main{display:flex; align-items:center; gap:10px;}
.payment-row-extra{display:flex; gap:10px; padding-left:28px; flex-wrap:wrap;}
.payment-row-extra .mini-field{min-width:130px; flex:1;}
.payment-row-extra .mini-field label{font-size:9.5px; text-transform:uppercase; color:var(--muted); font-weight:600; display:block; margin-bottom:2px;}
.payment-row-extra .mini-field input{width:100%; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px;}
.payment-row.checked{background:var(--ink-green-bg); border-color:#B7DBC9;}
.payment-row .payment-label{flex:1; font-size:13px; cursor:pointer;}
.payment-row input.payment-value{width:110px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; font-weight:700; text-align:right;}
.payment-value-wrap{display:flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--border-strong); border-radius:5px; padding:0 8px 0 10px;}
.payment-value-wrap .payment-value-prefix{font-size:11.5px; color:var(--muted); font-weight:600;}
.payment-value-wrap input.payment-value{border:none; padding:6px 0;}

.btn{
  padding:9px 16px; border-radius:6px; font-size:13.5px; font-weight:600; cursor:pointer;
  border:1px solid var(--border-strong); background:#fff; color:var(--text); font-family:'Inter',sans-serif;
}
.btn:hover{background:var(--paper);}
.btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.btn-primary:hover{background:var(--navy-light);}
.btn-danger{color:var(--ink-red); border-color:var(--ink-red-bg);}
.btn-danger:hover{background:var(--ink-red-bg);}
.btn-pdf{color:var(--ink-teal); border-color:var(--ink-teal-bg); background:var(--ink-teal-bg);}
.btn-pdf:hover{background:#c9e6e9;}

.status-badge-row{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  background:var(--paper); border:1px solid var(--border); border-radius:8px; margin-bottom:16px;
}
.status-badge-row .stamp{transform:rotate(0deg);}
.status-badge-hint{font-size:12px; color:var(--muted);}

.fob-usd-hero{
  display:flex; align-items:baseline; gap:10px; padding:14px 16px;
  background:var(--navy); border-radius:8px; margin-bottom:16px;
}
.fob-usd-hero-label{font-size:12px; font-weight:600; color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.03em;}
.fob-usd-hero-value{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:700; color:#fff;}
body.dark-mode .fob-usd-hero{background:var(--card); border:1px solid var(--border-strong);}
body.dark-mode .fob-usd-hero-value{color:var(--text);}
body.dark-mode .fob-usd-hero-label{color:var(--muted);}

/* Linguagem visual reutilizável do "quadrado azul-marinho arredondado" (mesmo estilo do FOB
   em destaque) — .stat-box pro tamanho cheio (um valor-âncora por seção) e .stat-chip pra
   contextos compactos, como dentro de um card de lista, onde um bloco grande destoaria. */
.stat-box{
  display:flex; align-items:baseline; gap:10px; padding:14px 16px;
  background:var(--navy); border-radius:8px;
}
.stat-box-label{font-size:12px; font-weight:600; color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.03em;}
.stat-box-value{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:700; color:#fff;}
body.dark-mode .stat-box{background:var(--card); border:1px solid var(--border-strong);}
body.dark-mode .stat-box-value{color:var(--text);}
body.dark-mode .stat-box-label{color:var(--muted);}

.stat-chip{
  display:inline-flex; flex-direction:column; align-items:flex-end; gap:1px;
  padding:6px 12px; background:var(--navy); border-radius:10px;
}
.stat-chip-label{font-size:9px; font-weight:600; color:rgba(255,255,255,0.65); text-transform:uppercase; letter-spacing:0.03em;}
.stat-chip-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13.5px; color:#fff;}
.stat-chip-secondary{background:var(--navy-light); padding:4px 12px;}
.stat-chip-secondary .stat-chip-value{font-size:12px; font-weight:600;}
body.dark-mode .stat-chip{background:var(--card); border:1px solid var(--border-strong);}
body.dark-mode .stat-chip-value{color:var(--text);}
body.dark-mode .stat-chip-label{color:var(--muted);}
body.dark-mode .stat-chip-secondary{background:var(--paper);}

.type-toggle{display:flex; gap:8px; margin-bottom:16px;}
.type-toggle button{
  flex:1; padding:10px 12px; border-radius:6px; border:1px solid var(--border-strong);
  background:#fff; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted);
}
.type-toggle button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

.stage-block{
  border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden;
}
.stage-block.current{border-color:var(--ink-red); box-shadow:0 0 0 1px var(--ink-red-bg);}
.stage-block.done{border-color:#B7DBC9;}
.stage-header{
  display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer;
  background:#fff; user-select:none;
}
.stage-block.done .stage-header{background:var(--ink-green-bg);}
.stage-block.current .stage-header{background:var(--ink-red-bg);}
.stage-num{
  width:22px; height:22px; border-radius:50%; background:var(--border-strong); color:#fff;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'IBM Plex Mono', monospace;
}
.stage-block.done .stage-num{background:var(--ink-green);}
.stage-block.current .stage-num{background:var(--ink-red);}
.stage-title{flex:1; font-size:13.5px; font-weight:600;}
.stage-progress{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted);}
.stage-body{padding:12px 14px 14px 14px; display:flex; flex-direction:column; gap:8px; background:#fff;}
.stage-hint{font-size:11.5px; color:var(--muted); margin-top:2px; font-style:italic;}

#loading{padding:60px; text-align:center; color:var(--muted);}

/* LOGIN */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--navy);
}
.login-box{

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
let currentUser = null;
let currentRole = 'viewer';
let currentUserCargoId = null;
let currentUserPermissoes = null; // matriz de permissões do cargo do usuário logado — null quando é 'admin' (bypass total)
let currentUserVerAlertas = true; // permissão à parte da matriz — controla se o cargo vê os alertas de pendência nos cards de processo (ex: "faltando provisionamento")
let unsubscribeData = null;

function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
  auth.signInWithEmailAndPassword(email, password).catch(e=>{
    errEl.textContent = 'Não foi possível entrar. Confira e-mail e senha.';
    console.error(e);
  });
}
function doLogout(){
  if(unsubscribeData) unsubscribeData();
  auth.signOut();
}

/* ===================== CARGOS E PERMISSÕES ===================== */
/* Cada aba de navegação (NAV_ITEMS) vira uma linha configurável na matriz de permissões de
   cada cargo — assim, se uma aba nova for adicionada no futuro, ela aparece automaticamente
   na matriz, sem precisar editar nada aqui (pedido explicitamente pelo usuário). */
function getPermissionTabs(){
  try{ return NAV_ITEMS.map(i=>({key:i.key, label:i.label.replace(/^\S+\s/,'')})); }
  catch(e){ return [{key:'processos', label:'Processos'}]; }
}
const CARGO_ADMIN_ONLY_TABS = ['equipe','empresa','personalizacao'];
function defaultEditorPermissoes(){
  const perms = {};
  getPermissionTabs().forEach(t=>{
    const adminOnly = CARGO_ADMIN_ONLY_TABS.includes(t.key);
    perms[t.key] = { ver: !adminOnly, editar: !adminOnly };
  });
  return perms;
}
function defaultViewerPermissoes(){
  const perms = {};
  getPermissionTabs().forEach(t=>{
    const adminOnly = CARGO_ADMIN_ONLY_TABS.includes(t.key);
    perms[t.key] = { ver: !adminOnly, editar: false };
  });
  return perms;
}
/* Garante que os 2 cargos padrão (Editor/Visualizador) existam — idempotente, roda toda
   vez que alguém loga. O cargo "Administrador" NÃO é um documento no Firestore: é tratado
   como caso especial via currentRole==='admin', pra nunca correr o risco de alguém apagar
   ou reconfigurar o cargo administrativo e travar o próprio acesso à plataforma. */
async function ensureDefaultCargos(){
  try{
    const snap = await db.collection('cargos').get();
    if(!snap.empty) return;
    const userEmail = currentUser ? currentUser.email : '';
    await db.collection('cargos').doc('editor').set({
      nome: 'Editor', sistema: true, permissoes: defaultEditorPermissoes(), verAlertas: true,
      createdAt: Date.now(), updatedAt: Date.now(),
      history: [{ts:Date.now(), field:'Cargo', valorAnterior:'', valorNovo:'Criado automaticamente (padrão do sistema)', userEmail}],
    });
    await db.collection('cargos').doc('viewer').set({
      nome: 'Visualizador', sistema: true, permissoes: defaultViewerPermissoes(), verAlertas: true,
      createdAt: Date.now(), updatedAt: Date.now(),
      history: [{ts:Date.now(), field:'Cargo', valorAnterior:'', valorNovo:'Criado automaticamente (padrão do sistema)', userEmail}],
    });
  }catch(e){ console.error('Erro ao garantir cargos padrão', e); }
}
async function getCargoByIdRemote(id){
  if(!id) return null;
  try{
    const doc = await db.collection('cargos').doc(id).get();
    return doc.exists ? {id:doc.id, ...doc.data()} : null;
  }catch(e){ console.error('Erro ao buscar cargo', e); return null; }
}
/* Ponto único de verdade pra "pode visualizar essa aba" — admin sempre pode; qualquer outro
   cargo depende da matriz carregada no login. Abas que não existem na matriz de um cargo
   (ex: uma aba nova, criada depois do cargo) ficam bloqueadas por padrão (mais seguro que
   liberar por omissão). */
function canView(tabKey){
  if(currentRole==='admin') return true;
  const perm = currentUserPermissoes && currentUserPermissoes[tabKey];
  return !!(perm && perm.ver);
}
function canEdit(tabKey){
  if(currentRole==='admin') return true;
  const perm = currentUserPermissoes && currentUserPermissoes[tabKey];
  return !!(perm && perm.editar);
}
/* Mapeia a view atual (currentView) pra aba de permissão correspondente — cobre casos onde
   uma mesma ação (ex: editar um processo) pode ser disparada a partir de mais de uma tela
   (Dashboard, Processos, Finalizados todos mexem com processos). */
const VIEW_TO_PERM_TAB = { dashboard:'processos', finalizados:'processos', processos:'processos' };
function currentPermTab(){ return VIEW_TO_PERM_TAB[currentView] || currentView; }
function canEditCurrent(){ return canEdit(currentPermTab()); }
function canViewCurrent(){ return canView(currentPermTab()); }
/* Verdadeiro se o usuário tem edição em QUALQUER aba — usado só em lugares muito genéricos
   de UI que não têm uma aba clara associada; a real trava de segurança continua sendo
   requireEditPermission() (tab-aware) em cada ação de salvar/excluir. */
function hasAnyEditAccess(){
  if(currentRole==='admin') return true;
  if(!currentUserPermissoes) return false;
  return Object.keys(currentUserPermissoes).some(k=>currentUserPermissoes[k].editar);
}
/* Permissão à parte da matriz de abas — controla se o cargo vê os alertas de pendência que
   aparecem nos cards de processo (ex: "faltando provisionamento", "sem despachante definido").
   Default true (se o cargo não tiver o campo definido ainda, por compatibilidade). */
function canSeeProcessAlerts(){
  if(currentRole==='admin') return true;
  return currentUserVerAlertas !== false;
}

async function ensureUserRole(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  let userData;
  if(snap.exists){
    userData = snap.data();
  } else {
    const allUsers = await db.collection('users').get();
    const isFirstUser = allUsers.empty;
    const role = isFirstUser ? 'admin' : 'editor';
    userData = { email:user.email, role, cargoId: isFirstUser ? null : 'editor', createdAt: Date.now() };
    await ref.set(userData);
  }
  currentRole = userData.role || 'editor';
  currentUserCargoId = userData.cargoId || (currentRole==='viewer' ? 'viewer' : (currentRole==='admin' ? null : 'editor'));
  await ensureDefaultCargos();
  if(currentRole==='admin'){
    currentUserPermissoes = null; // bypass — admin nunca depende da matriz
    currentUserVerAlertas = true;
  } else {
    const cargo = await getCargoByIdRemote(currentUserCargoId);
    currentUserPermissoes = cargo ? cargo.permissoes : defaultViewerPermissoes();
    currentUserVerAlertas = cargo && cargo.verAlertas===false ? false : true;
  }

}

function attachDataListener(){
  if(unsubscribeData) unsubscribeData();
  unsubscribeData = db.collection('comextrack').doc('data').onSnapshot(doc=>{
    window.__lastSyncTs = Date.now(); // TESTE VISUAL — Painel v2: usado no rodapé "Atualizado há..."
    if(doc.exists){
      const d = doc.data();
      state.processes = d.processes || [];
      state.suppliers = d.suppliers || [];
      state.partners = (d.partners && d.partners.length) ? d.partners : DEFAULT_PARTNERS.map(p=>({...p}));
      state.dashboardConfig = d.dashboardConfig || null;
      state.ncms = (d.ncms && d.ncms.length) ? d.ncms : DEFAULT_NCMS.map(n=>({...n}));
      state.empresaConfig = d.empresaConfig || { nome:'', estoques:[] };
    } else {
      state = { processes:[], suppliers:[], partners: DEFAULT_PARTNERS.map(p=>({...p})), ncms: DEFAULT_NCMS.map(n=>({...n})), empresaConfig: { nome:'', estoques:[] } };
    }
    /* Evita rodar o auto-preenchimento de NCM (que dispara um persistState() de fundo) enquanto
       o modal de processo está aberto — evita uma corrida onde esse salvamento de fundo grava
       uma versão de state.processes anterior às edições que a pessoa está fazendo agora mesmo,
       "apagando" silenciosamente o que ela tinha acabado de mudar. */
    if(!window.__editingProcess && autoFillKnownNcmAliquotas() && hasAnyEditAccess()){
      persistState();
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render();
  }, err=>{
    console.error('Erro ao sincronizar', err);
    updateSaveIndicator('⚠ Erro de conexão com a nuvem');
  });
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    await ensureUserRole(user);
    attachDataListener();
  } else {
    currentUser = null;
    if(unsubscribeData) unsubscribeData();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }
});
</script>

/* Preenche automaticamente as alíquotas conhecidas em qualquer NCM já cadastrada que ainda
   esteja vazia (ex: quem já usava o app antes desta planilha existir). Só preenche o que
   está em branco — nunca sobrescreve um valor que alguém já editou manualmente — e não
   dispara alerta de "alíquota alterada", já que preencher um campo vazio não é uma mudança. */
function autoFillKnownNcmAliquotas(){
  let changed = false;
  (state.ncms||[]).forEach(n=>{
    const known = NCM_ALIQUOTAS_CONHECIDAS[n.ncm];
    if(!known) return;
    const vazio = (v)=> v===undefined || v===null || v==='';
    if(vazio(n.ii) && vazio(n.ipi) && vazio(n.pis) && vazio(n.cofins)){
      n.ii = String(known.ii); n.ipi = String(known.ipi); n.pis = String(known.pis); n.cofins = String(known.cofins);
      n.history = n.history || [];
      n.history.push({ ts: Date.now(), field:'Preenchimento inicial (planilha de alíquotas)', valorAnterior:'', valorNovo:`II ${known.ii}% · IPI ${known.ipi}% · PIS ${known.pis}% · COFINS ${known.cofins}%`, userEmail: currentUser?currentUser.email:'' });
      changed = true;
    }
  });
  return changed;
}

function fmtBRL(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtUSD(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'USD'});
}
function fmtNumberBR(v, decimals){
  decimals = decimals===undefined ? 2 : decimals;
  return (parseFloat(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function maskCurrencyInput(el){
  let digits = el.value.replace(/\D/g,'');
  if(!digits) digits = '0';
  digits = digits.replace(/^0+(?=\d)/,'');
  const num = parseInt(digits,10)/100;
  el.value = num.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function parseBRMasked(str){
  if(str===undefined || str===null || str==='') return 0;
  const cleaned = String(str).replace(/\./g,'').replace(',','.');
  return parseFloat(cleaned)||0;
}
function fmtDate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(d1,d2){
  const a = new Date(d1+'T00:00:00');
  const b = new Date(d2+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function countryFlag(country){

}

function computePerformanceMetrics(p){
  const extra = p.extra || {};
  const m = {};
  if(p.dataPedido && p.dataEmbarqueReal) m.tempoProducao = daysBetween(p.dataPedido, p.dataEmbarqueReal);
  if(p.prontidao && p.dataEmbarqueReal) m.tempoProntoEmbarque = daysBetween(p.prontidao, p.dataEmbarqueReal);
  if(p.dataEmbarqueReal && extra.dataChegadaBetim) m.transitTime = daysBetween(p.dataEmbarqueReal, extra.dataChegadaBetim);
  if(extra.dataChegadaBetim && extra.dataDesembaraco) m.tempoDesembaraco = daysBetween(extra.dataChegadaBetim, extra.dataDesembaraco);
  const fimReferencia = (isProcessDone(p) && p.pendingSince) ? p.pendingSince : todayStr();
  if(p.dataPedido) m.tempoTotal = daysBetween(p.dataPedido, fimReferencia);
  const costs = computeCosts(p);
  m.custoRealizado = costs.total;
  m.custoOrcado = parseFloat(p.custoOrcado) || null;
  if(m.custoOrcado){
    m.custoVariacaoPct = ((m.custoRealizado - m.custoOrcado) / m.custoOrcado) * 100;
  }
  m.alteracoesETA = (p.history||[]).filter(h=>h.title==='Data prevista de chegada alterada').length;
  m.ocorrencias = (p.history||[]).length;
  return m;
}

function historicalAverage(field, excludeId){
  const finalizados = state.processes.filter(x=>x.id!==excludeId && isProcessDone(x));
  const vals = finalizados.map(x=>computePerformanceMetrics(x)[field]).filter(v=>v!==undefined && v!==null && !isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function perfComparisonHtml(label, valor, media, unidade, lowerIsBetter){
  if(valor===undefined || valor===null || isNaN(valor)){
    return `<div class="perf-row"><span class="perf-label">${label}</span><span class="perf-value">—</span></div>`;
  }
  let compHtml = '';
  if(media!==null && media!==undefined && !isNaN(media) && media!==0){
    const diffPct = ((valor - media) / Math.abs(media)) * 100;
    const isBetter = lowerIsBetter ? diffPct < 0 : diffPct > 0;
    const icon = Math.abs(diffPct) < 1 ? '⚪' : (isBetter ? '🟢' : '🔴');
    compHtml = `<div class="perf-compare">${icon} ${Math.abs(diffPct).toFixed(1)}% ${isBetter?'melhor':'pior'} que a média histórica (${media.toFixed(1)}${unidade})</div>`;
  }
  return `<div class="perf-row"><span class="perf-label">${label}</span><span class="perf-value">${valor.toFixed ? valor.toFixed(1) : valor}${unidade}</span>${compHtml}</div>`;
}

function renderDesempenhoTab(){
  const p = window.__editingProcess;
  const m = computePerformanceMetrics(p);
  const avgTotal = historicalAverage('tempoTotal', p.id);
  const avgProducao = historicalAverage('tempoProducao', p.id);
  const avgTransit = historicalAverage('transitTime', p.id);
  const avgDesembaraco = historicalAverage('tempoDesembaraco', p.id);
  const avgCusto = historicalAverage('custoRealizado', p.id);

  const finalizadosCount = state.processes.filter(x=>x.id!==p.id && isProcessDone(x)).length;

  let html = '';
  if(finalizadosCount < 3){
    html += `<div class="form-hint" style="margin-bottom:14px;">Ainda há poucos processos finalizados (${finalizadosCount}) para uma comparação histórica confiável. As médias abaixo vão ficar mais precisas conforme mais processos forem concluídos.</div>`;
  }

  html += `<div class="perf-group">`;
  html += perfComparisonHtml('Tempo de produção (pedido → embarque)', m.tempoProducao, avgProducao, 'd', true);
  html += perfComparisonHtml('Tempo entre pronto e embarque', m.tempoProntoEmbarque, null, 'd', true);
  html += perfComparisonHtml('Transit time (embarque → chegada)', m.transitTime, avgTransit, 'd', true);
  html += perfComparisonHtml('Tempo de desembaraço (chegada → desembaraçado)', m.tempoDesembaraco, avgDesembaraco, 'd', true);
  html += perfComparisonHtml('Tempo total do processo', m.tempoTotal, avgTotal, 'd', true);
  html += `</div>`;

  html += `<div class="perf-group" style="margin-top:16px;">`;
  let custoCompHtml = '';
  if(avgCusto!==null && avgCusto!==undefined && avgCusto!==0){
    const diffPct = ((m.custoRealizado - avgCusto) / Math.abs(avgCusto)) * 100;
    const icon = Math.abs(diffPct) < 1 ? '⚪' : (diffPct<0 ? '🟢' : '🔴');
    custoCompHtml = `<div class="perf-compare">${icon} ${Math.abs(diffPct).toFixed(1)}% ${diffPct<0?'abaixo':'acima'} da média histórica (${fmtBRL(avgCusto)})</div>`;
  }
  html += `<div class="perf-row"><span class="perf-label">Custo realizado</span><span class="perf-value">${fmtBRL(m.custoRealizado)}</span>${custoCompHtml}</div>`;
  if(m.custoOrcado){
    const varHtml = m.custoVariacaoPct!==undefined ? `<div class="perf-compare">${m.custoVariacaoPct<=0?'🟢':'🔴'} ${Math.abs(m.custoVariacaoPct).toFixed(1)}% ${m.custoVariacaoPct<=0?'abaixo':'acima'} do orçado</div>` : '';
    html += `<div class="perf-row"><span class="perf-label">Custo orçado</span><span class="perf-value">${fmtBRL(m.custoOrcado)}</span>${varHtml}</div>`;
  }
  html += `</div>`;

  html += `<div class="perf-group" style="margin-top:16px;">`;
  html += `<div class="perf-row"><span class="perf-label">Alterações de ETA</span><span class="perf-value">${m.alteracoesETA}</span></div>`;
  html += `<div class="perf-row"><span class="perf-label">Total de ocorrências no histórico</span><span class="perf-value">${m.ocorrencias}</span></div>`;
  html += `</div>`;

  return html;
}

    despachanteCalcEl.innerHTML = `
      <div class="prov-line">
        <div class="prov-line-label">Impostos estimados <span style="font-weight:400; text-transform:none; font-style:italic;">(II + IPI + PIS + COFINS, por item)</span></div>
        <div class="prov-line-value">${fmtBRL(impostos.total)}</div>
      </div>
      ${impostos.temItens ? `<details class="prov-details"><summary>Ver composição por item</summary>${renderImpostosDetalheHtml(impostos)}</details>`
        : `<div class="form-hint">Nenhum item cadastrado neste processo ainda — adicione na aba Itens para calcular os impostos.</div>`}
      ${impostos.itensSemAliquota.length ? `<div class="prov-warning">⚠️ ${impostos.itensSemAliquota.length} item(ns) com alíquota incompleta ou NCM não cadastrado na aba NCM — o valor abaixo está subestimado para esses itens. Veja o detalhe acima.</div>` : ''}
      <div class="prov-line prov-line-total">
        <div class="prov-line-label">Total Despachante <span style="font-weight:400; text-transform:none; font-style:italic;">= Honorários + Impostos</span></div>
        <div class="prov-line-value">${fmtBRL(totalDespachante)}</div>
      </div>
    `;
  }

  let armazenagemTotal = 0;
  const zsPrazoEl = document.getElementById('prov-zona-secundaria-prazo');
  if(zsPrazoEl) zsPrazoEl.innerHTML = renderPrazoZonaSecundariaHtml(p);
  const armazenagemEl = document.getElementById('prov-armazenagem-calc');
  if(armazenagemEl){
    const arm = computeArmazenagemZonaPrimaria(p);
    armazenagemEl.innerHTML = renderArmazenagemHtml(arm);
    if(arm.status==='ok') armazenagemTotal = arm.total;
  }

  let armazenagemZSTotal = 0;
  const armazenagemZSEl = document.getElementById('prov-armazenagem-zs-calc');
  if(armazenagemZSEl){
    const armZS = computeArmazenagemZonaSecundaria(p);
    armazenagemZSEl.innerHTML = renderArmazenagemZSHtml(armZS);
    if(armZS.status==='ok') armazenagemZSTotal = armZS.total;
  }

  const totalEl = document.getElementById('prov-total-body');
  if(totalEl){
    const totalGeral = totalDespachante + armazenagemTotal + armazenagemZSTotal;
    totalEl.innerHTML = `<div class="prov-line prov-line-grand-total"><div class="prov-line-label">TOTAL PROVISIONADO</div><div class="prov-line-value">${fmtBRL(totalGeral)}</div></div>
      <div class="form-hint" style="margin-top:6px;">Ainda faltam outras despesas (frete internacional pago separadamente na Fase 8, transporte rodoviário, taxas portuárias, Siscomex, etc.) — serão adicionadas em próximas etapas do Provisionamento.</div>`;
  }
}

  if(arm.status==='sem_recinto') return `<div class="form-hint">Selecione o recinto de Zona Primária na aba Etapas (Fase 6) para calcular a armazenagem.</div>`;
  if(arm.status==='sem_regra') return `<div class="prov-warning">⚠️ Ainda não existe uma regra de armazenagem cadastrada para o recinto "${arm.recintoNome}". Hoje só a Movecta está implementada — outros recintos entram em próximas etapas, sem precisar reconstruir esta aba.</div>`;

  const confBadge = (c)=>{
    if(c.confianca==='formula') return '<span class="prov-conf-badge prov-conf-ok" title="'+c.detalhe.replace(/"/g,'&quot;')+'">fórmula</span>';
    return '<span class="prov-conf-badge" title="'+c.detalhe.replace(/"/g,'&quot;')+'">referência</span>';

  const componentesHtml = arm.componentes.map(c=>`
    <tr>

    <details class="prov-details"><summary>Ver composição (${arm.nContainers} container(s) × ${fmtBRL(arm.porContainer)})</summary>

        ${arm.nContainers>1 ? `<tr class="total"><td>× ${arm.nContainers} containers</td><td>${fmtBRL(arm.total)}</td></tr>` : ''}
      </table>
      <div class="form-hint" style="margin-top:6px;">
        Calculado sobre o Valor Aduaneiro de ${fmtBRL(arm.vaTotalBrl)}, com ${arm.periodos} período(s) de 15 dias (1º período — estimativa antes do embarque).
        <span class="prov-conf-badge prov-conf-ok" style="position:static;">fórmula</span> = percentual confirmado por escrito nos demonstrativos.
        <span class="prov-conf-badge" style="position:static;">referência</span> = valor fixo do demonstrativo mais recente — esses valores têm mudado entre os documentos analisados (parecem sofrer reajuste periódico), então vale reconferir de tempos em tempos. Passe o mouse em cada um pra ver o histórico.
        <br>Não incluído: Taxa Operador Portuário BTP (gap ainda não confirmado) e monitoramento de energia para container reefer (cobrança à parte, condicional).
      </div>

/* Data limite para devolução do container vazio = Chegada na Zona Primária + Free Time.
   Só calcula quando a chegada na Zona Primária estiver de fato confirmada (checklist da Fase
   6 · "Chegada e presença" preenchido com data) — nunca estima com base em previsão, como
   pedido. extra.dataChegadaBetim (Zona Secundária) entra só como fallback pra processos
   antigos que não tinham o campo de Zona Primária ainda — na prática a chegada na Zona
   Primária sempre acontece antes ou junto da chegada na Zona Secundária, então segue sendo
   uma data real, nunca uma estimativa. */
function containerReturnDate(p){
  const extra = p.extra || {};
  const baseDate = extra.dataChegadaZonaPrimaria || extra.dataChegadaBetim;
  if(!baseDate || !extra.freetime) return null;
  const dias = parseInt(extra.freetime)||0;
  const dt = new Date(baseDate+'T00:00:00');
  dt.setDate(dt.getDate()+dias);
  return { date: dt.toISOString().slice(0,10) };
}

/* Depois que a devolução é marcada como concluída, compara a data efetiva com a data limite
   original (sempre recalculada a partir de Chegada na Zona Primária + Free Time — nunca a
   partir da própria data de devolução, então a "data limite original" nunca muda mesmo depois
   de concluída, como pedido). Retorna null se a devolução ainda não foi concluída ou faltar
   algum dos dois campos. */
function containerReturnPerformance(p){
  if(!isContainerReturnDone(p)) return null;
  const extra = p.extra || {};
  const dataEfetiva = extra.dataDevolucaoContainer;
  const deadline = containerReturnDate(p);
  if(!dataEfetiva || !deadline) return null;
  const diff = daysBetween(dataEfetiva, deadline.date); // >=0 → devolvido no limite ou antes
  return { dataEfetiva, deadlineDate: deadline.date, onTime: diff>=0, dias: Math.abs(diff) };
}

/* Índice do item "Devolução do vazio" dentro da Fase 7 — não existe no modal aéreo.
   Resolvido dinamicamente a partir da definição da fase, em vez de fixo, pra não
   quebrar se a lista de itens da Fase 7 mudar no futuro. */
function isContainerReturnDone(p){
  const stages = getStagesForProcess(p);
  const fase7 = stages.find(s=>s.key==='fase7');
  if(!fase7) return false;
  const idx = fase7.items.indexOf('Devolução do vazio');
  if(idx<0) return false;
  const checked = p.checklist['fase7']||[];
  return !!checked[idx];
}

/* Prazo do 1º período de armazenagem na Zona Secundária: 10 dias a partir da chegada lá
   (extra.dataChegadaBetim, Fase 6 · "Chegada no Recinto de Desembaraço"). Mesmo padrão de
   containerReturnDate() logo acima — data calculada, nunca digitada. */
function prazoPrimeiroPeriodoZonaSecundaria(p){
  const extra = p.extra || {};
  if(!extra.dataChegadaBetim) return null;
  const dt = new Date(extra.dataChegadaBetim+'T00:00:00');
  dt.setDate(dt.getDate()+10);
  return dt.toISOString().slice(0,10);
}

function getProcessAlerts(p){
  const alerts = [];
  if(!canSeeProcessAlerts()) return alerts;
  if(p.tipo==='temporaria' || isProcessDone(p)) return alerts;
  const extra = p.extra || {};
  const today = todayStr();

  const stages = getStagesForProcess(p);
  const statusIdx = stages.findIndex(s=>s.key===p.status);
  for(let i=0;i<statusIdx;i++){
    const s = stages[i];
    if(stageComplete(p, s.key)) continue;
    let pendentes;
    if(s.type==='payments'){
      pendentes = s.items.filter(it=>!(p.payments[it.key]||{}).checked).map(it=>it.label);
    } else {
      const checked = p.checklist[s.key]||[];
      pendentes = s.items.filter((_,idx)=>!checked[idx]);
    }
    if(pendentes.length){
      alerts.push(`Pendente da fase anterior (${s.label.replace(/^Fase \d+ · /,'')}): ${pendentes.join(', ')}`);
    }
  }

  if(p.dataEmbarqueReal){
    const diasDesdeEmbarque = daysBetween(p.dataEmbarqueReal, today);
    const diasParaEmbarque = daysBetween(today, p.dataEmbarqueReal);
    /* O alerta acompanha o TICK "Despachante notificado" (Fase 5), não se o campo Despachante
       da Visão Geral está preenchido — mesmo já sabendo quem vai ser o despachante desde o
       início, ainda é preciso lembrar de notificar, e é isso que o alerta cobra. */
    const despachanteNotificado = (p.checklist['fase5']||[])[1];
    if(diasDesdeEmbarque>=3 && !despachanteNotificado){
      alerts.push(`Já se passaram ${diasDesdeEmbarque} dias do embarque sem notificar o despachante`);
    }
    if(diasParaEmbarque<=3 && diasParaEmbarque>0 && !despachanteNotificado){
      alerts.push(`Faltam ${diasParaEmbarque} dia${diasParaEmbarque===1?'':'s'} para o embarque sem notificar o despachante`);
    }
    if(diasParaEmbarque===0 && !despachanteNotificado){
      alerts.push('Embarca hoje e o despachante ainda não foi notificado');
    }
    if(diasDesdeEmbarque>=0){
      const fase3checked = p.checklist['fase3']||[];
      if(!fase3checked[0]){
        alerts.push(diasDesdeEmbarque===0 ? 'Carga embarcou hoje e o provisionamento (Fase 3) ainda não foi enviado' : `Carga embarcou há ${diasDesdeEmbarque} dias e o provisionamento (Fase 3) ainda não foi enviado`);
      }
    }
  }

  if(p.chegadaPrevista){
    const diasParaChegada = daysBetween(today, p.chegadaPrevista);
    /* Mesma lógica: acompanha o TICK "Solicitar DTA" (Fase 6), não se a Transportadora (DTA)
       já foi escolhida na Visão Geral. */
    const dtaSolicitada = (p.checklist['fase6']||[])[0];
    if(p.modal!=='aereo'){
      if(diasParaChegada<=5 && diasParaChegada>0 && !dtaSolicitada){
        alerts.push(`Faltam ${diasParaChegada} dia${diasParaChegada===1?'':'s'} para a chegada sem solicitar a DTA`);
      }
      if(diasParaChegada<=0 && !dtaSolicitada){
        alerts.push(diasParaChegada===0 ? 'Chegada é hoje e a DTA ainda não foi solicitada' : `Chegada atrasada há ${Math.abs(diasParaChegada)} dias sem solicitar a DTA`);
      }
    }
    const fase5checked = p.checklist['fase5']||[];
    if(diasParaChegada<=5 && diasParaChegada>0 && !fase5checked[4]){
      alerts.push(`Faltam ${diasParaChegada} dia${diasParaChegada===1?'':'s'} para a chegada sem rascunho da DUIMP`);
    }
    if(diasParaChegada<=0 && !fase5checked[4]){
      alerts.push(diasParaChegada===0 ? 'Chegada é hoje sem rascunho da DUIMP' : `Chegada atrasada há ${Math.abs(diasParaChegada)} dias sem rascunho da DUIMP`);
    }
  }

  if(p.prontidao && daysBetween(p.prontidao, today) >= 0){
    const diasDesdeProntidao = daysBetween(p.prontidao, today);
    const hasFatura = p.docs && p.docs['Comercial Invoice (Fatura)'];
    const hasPacking = p.docs && p.docs['Packing List'];
    if(!hasFatura || !hasPacking){
      alerts.push(diasDesdeProntidao===0 ? 'Prontidão é hoje sem Fatura e/ou Packing List marcados' : `Prontidão chegou há ${diasDesdeProntidao} dias sem Fatura e/ou Packing List marcados`);
    }
  }

  if(extra.dataChegadaBetim){
    const diasDesdeChegada = daysBetween(extra.dataChegadaBetim, today);
    if(diasDesdeChegada>=1){
      if(!extra.numeroDUIMP){
        alerts.push(`Já se passaram ${diasDesdeChegada} dias da chegada sem número da DUIMP`);
      }
      const hasDDR = p.docs && p.docs['DDR (Declaração do Detentor do Registro)'];
      if(!hasDDR){
        alerts.push(`Já se passaram ${diasDesdeChegada} dias da chegada sem DDR`);
      }
    }
  }

  const devolucao = containerReturnDate(p);
  if(devolucao){
    const diasParaDevolucao = daysBetween(today, devolucao.date);
    const fase7checked = p.checklist['fase7']||[];
    if(diasParaDevolucao<=5 && diasParaDevolucao>0 && !fase7checked[4]){
      alerts.push(`Faltam ${diasParaDevolucao} dia${diasParaDevolucao===1?'':'s'} para a devolução do container e a etapa ainda não foi marcada`);
    }
    if(diasParaDevolucao<=0 && !fase7checked[4]){
      alerts.push(diasParaDevolucao===0 ? 'Devolução do container é hoje e a etapa ainda não foi marcada' : `Devolução do container atrasada há ${Math.abs(diasParaDevolucao)} dias`);
    }
  }

  {
    /* Recebimento em estoque (Fase 7, índice 2) marcado sem a Nota Fiscal (índice 3) —
       a mercadoria já entrou fisicamente, então a NF não pode ficar esquecida pra trás. */
    const fase7checked = p.checklist['fase7']||[];
    if(fase7checked[2] && !fase7checked[3]){
      alerts.push('Recebimento em estoque marcado, mas a Nota Fiscal ainda não foi emitida');
    }
  }

  const costs = computeCosts(p);
  const empresaCfg = getEmpresaConfig();
  const seguroLimite = empresaCfg.seguroLimiteValor || 0;
  const seguroMoeda = empresaCfg.seguroLimiteMoeda === 'USD' ? 'USD' : 'BRL';
  const valorCargaNaMoedaEscolhida = seguroMoeda === 'USD' ? costs.cifUsd : costs.cifBrl;
  if(seguroLimite > 0 && valorCargaNaMoedaEscolhida > seguroLimite && !p.seguradoraInformada){
    const valorFmt = seguroMoeda === 'USD' ? fmtUSD(valorCargaNaMoedaEscolhida) : fmtBRL(valorCargaNaMoedaEscolhida);
    const limiteFmt = seguroMoeda === 'USD' ? fmtUSD(seguroLimite) : fmtBRL(seguroLimite);
    alerts.push(`Carga acima de ${limiteFmt} (${valorFmt}) — informe a seguradora`);
  }

  const prazoZS = prazoPrimeiroPeriodoZonaSecundaria(p);
  if(prazoZS){
    const diasParaPrazoZS = daysBetween(today, prazoZS);
    const fase7checked = p.checklist['fase7']||[];
    if(diasParaPrazoZS<=3 && !fase7checked[2]){
      alerts.push(diasParaPrazoZS<0
        ? `Prazo do 1º período de armazenagem na Zona Secundária venceu há ${Math.abs(diasParaPrazoZS)} dias e o recebimento em estoque ainda não foi marcado`
        : diasParaPrazoZS===0
          ? 'Prazo do 1º período de armazenagem na Zona Secundária vence hoje e o recebimento em estoque ainda não foi marcado'
          : `Faltam ${diasParaPrazoZS} dia${diasParaPrazoZS===1?'':'s'} para o fim do 1º período de armazenagem na Zona Secundária e o recebimento em estoque ainda não foi marcado`);
    }
  }

  return alerts;
}

function renderAlertBanner(p){
  const alerts = getProcessAlerts(p);
  if(!alerts.length) return '';
  return `<div class="alert-banner">⚠️ ${alerts.join(' · ')}</div>`;
}

/* TESTE VISUAL — Painel v2: classifica um alerta (texto livre, já gerado por
   getProcessAlerts) em uma das 3 categorias da área de Atenção, só olhando pro
   texto que já existe — não inventa nenhuma informação nova. */
function categorizeAlertText(text){
  const t = String(text||'').toLowerCase();
  if(t.includes('atrasad') || t.includes('venceu')) return 'atrasado';
  if(t.includes('faltam') || t.includes(' hoje')) return 'prazo';
  return 'pendencia';
}

function canalColor(canal){
  const map = {'Verde':'#1F7A5C','Amarelo':'#A5730F','Vermelho':'#B8441F','Cinza':'#6B7785'};
  return map[canal] || null;
}
function canalBadgeHtml(canal){
  if(!canal) return '';
  const color = canalColor(canal);
  if(!color) return canal;
  return `<span style="color:${color};font-weight:700;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:5px;vertical-align:1px;"></span>${canal}</span>`;
}

function stripHtmlTags(html){
  return String(html==null?'':html).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();
}
function viewFieldHtml(label, value){
  const display = (value===undefined || value===null || value==='') ? '—' : value;
  const plain = stripHtmlTags(display);
  const canCopy = plain && plain!=='—';
  return `<div class="view-field">
    <span class="view-label">${label}</span>
    <span class="view-value-row">
      <span class="view-value">${display}</span>
      ${canCopy ? `<button class="copy-icon-btn" onclick="copyToClipboard('${plain.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')}')" title="Copiar">📋</button>` : ''}
    </span>
  </div>`;
}
async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    showCopyToast();
  }catch(e){
    console.error('Não foi possível copiar', e);
  }
}
function showCopyToast(){
  const existing = document.querySelector('.copy-toast');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'copy-toast';
  toast.textContent = 'Copiado';
  document.body.appendChild(toast);
  requestAnimationFrame(()=>toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=>toast.remove(), 300);
  }, 1300);
}
