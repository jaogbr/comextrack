function onSupplierChange(val){
  window.__editingProcess.supplierId = val;
  const supplier = state.suppliers.find(s=>s.id===val);
  const countries = supplier ? (supplier.countries||[]) : [];
  const sel = document.getElementById('f-origem');
  const current = sel.value;
  sel.innerHTML = '<option value="">Selecione...</option>' + countries.map(c=>`<option value="${c}" ${c===current?'selected':''}>${c}</option>`).join('');
  if(!countries.includes(current)) sel.value = '';
}

function changeProcessType(tipo){
  window.__editingProcess.tipo = tipo;
  initProcessData(window.__editingProcess);
  window.__editingProcess.status = recomputeStatus(window.__editingProcess);
  window.__openStage = window.__editingProcess.status;
  document.querySelectorAll('.type-toggle button').forEach(b=>{
    b.classList.toggle('active', (tipo==='definitiva' && b.textContent.includes('Definitiva')) || (tipo==='temporaria' && b.textContent.includes('Temporária')));
  });
  renderEtapasTab();
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

function renderEtapasTab(){
  const p = window.__editingProcess;
  const stages = getStagesForProcess(p);
  const currentKey = recomputeStatus(p);
  p.status = currentKey;

  const html = stages.map((s,i)=>{
    const isPayments = s.type==='payments';
    const doneCount = isPayments
      ? s.items.filter(it=>(p.payments[it.key]||{}).checked).length
      : (p.checklist[s.key]||[]).filter(Boolean).length;
    const total = s.items.length;
    const isDone = doneCount===total;
    const isCurrent = s.key===currentKey;
    const stateCls = isDone ? 'done' : (isCurrent ? 'current' : '');
    const isOpen = window.__openStage === s.key;

    let bodyHtml = '';
    if(isPayments){
      bodyHtml = s.items.map(it=>{
        const rec = p.payments[it.key] || {checked:false, valor:''};
        const label = (it.key==='dta' && p.extra && p.extra.transportadoraDTA) ? `${it.label} (${p.extra.transportadoraDTA})` : it.label;
        return `<div class="payment-row ${rec.checked?'checked':''}">
          <div class="doc-check" style="cursor:pointer;" onclick="togglePaymentCheck('${it.key}')">${rec.checked?'✓':''}</div>
          <div class="payment-label" onclick="togglePaymentCheck('${it.key}')">${label}</div>
          <input type="number" step="0.01" class="payment-value" placeholder="Valor pago (R$)" value="${rec.valor||''}" oninput="updatePaymentValue('${it.key}', this.value)">
        </div>`;
      }).join('');
    } else {
      const checked = p.checklist[s.key] || [];
      bodyHtml = s.items.map((label,idx)=>{
        let row = `<div class="doc-item ${checked[idx]?'checked':''}" onclick="toggleStageItem('${s.key}',${idx})">
          <div class="doc-check">${checked[idx]?'✓':''}</div><span>${label}</span>
        </div>`;
        if(s.itemFields && s.itemFields[idx]){
          row += `<div class="item-fields">${s.itemFields[idx].map(f=>renderExtraFieldInput(f,p)).join('')}${s.containersItemIndex===idx?renderContainersTable(p):''}</div>`;
        } else if(s.containersItemIndex===idx){
          row += `<div class="item-fields">${renderContainersTable(p)}</div>`;
        }
        return row;
      }).join('');
      if(s.extraFields){
        bodyHtml += `<div class="stage-extra">${s.extraFields.map(f=>renderExtraFieldInput(f,p)).join('')}</div>`;
      }
    }

    return `
    <div class="stage-block ${stateCls}">
      <div class="stage-header" onclick="toggleStageOpen('${s.key}')">
        <div class="stage-num">${isDone?'✓':(i+1)}</div>
        <div class="stage-title">${s.label}</div>
        <div class="stage-progress">${doneCount}/${total}</div>
      </div>
      <div class="stage-body" style="display:${isOpen?'flex':'none'}">
        ${bodyHtml}
      </div>
    </div>`;
  }).join('');

  document.getElementById('etapas-container').innerHTML = html;

  const stampEl = document.getElementById('geral-status-stamp');
  if(stampEl){
    const info = stageInfoFor(p, currentKey);
    stampEl.className = `stamp ${info.cls}`;
    stampEl.textContent = info.label;
  }
}

function toggleStageOpen(key){
  window.__openStage = (window.__openStage===key) ? null : key;
  renderEtapasTab();
}

function toggleStageItem(stageKey, idx){
  const p = window.__editingProcess;
  p.checklist[stageKey][idx] = !p.checklist[stageKey][idx];
  window.__openStage = stageKey;
  renderEtapasTab();
}

function toggleDoc(el, docName){
  const p = window.__editingProcess;
  p.docs = p.docs || {};
  p.docs[docName] = !p.docs[docName];
  el.classList.toggle('checked');
  const checkEl = el.querySelector('.doc-check');
  checkEl.textContent = el.classList.contains('checked') ? '✓' : '';
}

function slugifyDocType(docType){
  return docType.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function renderDocsTab(){
  const p = window.__editingProcess;
  p.docFiles = p.docFiles || {};
  const el = document.getElementById('docs-list');
  if(!el) return;
  const canEdit = currentRole!=='viewer';
  el.innerHTML = `<div class="doc-checklist">${getDocTypesForProcess(p).map(d=>{
    const checked = p.docs && p.docs[d];
    const file = p.docFiles[d];
    const inputId = 'file-input-'+slugifyDocType(d);
    return `
      <div class="doc-item-block">
        <div class="doc-item ${checked?'checked':''}" onclick="toggleDoc(this, '${d.replace(/'/g,"\\'")}')" data-doc="${d.replace(/'/g,"\\'")}">
          <div class="doc-check">${checked?'✓':''}</div>
          <span>${d}</span>
        </div>
        <div class="doc-file-row">
          ${file ? `
            <span class="doc-file-name">📎 ${file.name}</span>
            <a href="${file.url}" target="_blank" rel="noopener" class="btn" style="padding:4px 9px; font-size:11px;">Ver / Baixar</a>
            ${canEdit ? `
              <label class="btn" style="padding:4px 9px; font-size:11px; cursor:pointer;">Substituir<input type="file" id="${inputId}" style="display:none;" onchange="uploadDocFile(this,'${d.replace(/'/g,"\\'")}')"></label>
              <button class="btn btn-danger" style="padding:4px 9px; font-size:11px;" onclick="deleteDocFile('${d.replace(/'/g,"\\'")}')">Excluir</button>
            ` : ''}
          ` : (canEdit ? `
            <label class="btn" style="padding:5px 11px; font-size:11.5px; cursor:pointer;">+ Anexar arquivo<input type="file" id="${inputId}" style="display:none;" onchange="uploadDocFile(this,'${d.replace(/'/g,"\\'")}')"></label>
            <span class="doc-upload-status" id="status-${slugifyDocType(d)}"></span>
          ` : `<span class="form-hint">Nenhum arquivo anexado</span>`)}
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

async function uploadDocFile(inputEl, docType){
  if(!requireEditPermission()) return;
  const file = inputEl.files[0];
  if(!file) return;
  const p = window.__editingProcess;
  const statusEl = document.getElementById('status-'+slugifyDocType(docType));
  if(statusEl) statusEl.textContent = 'Enviando...';
  const path = `processos/${p.id}/${slugifyDocType(docType)}/${Date.now()}_${file.name}`;
  try{
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    p.docFiles = p.docFiles || {};
    p.docFiles[docType] = { name:file.name, url, path, uploadedAt: Date.now() };
    p.docs = p.docs || {};
    p.docs[docType] = true;
    renderDocsTab();
  }catch(e){
    console.error(e);
    if(statusEl) statusEl.textContent = '';
    alert('Não foi possível enviar o arquivo. Confira se o Storage foi ativado e as regras foram publicadas.');
  }
}

async function deleteDocFile(docType){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este arquivo anexado?')) return;
  const p = window.__editingProcess;
  const info = p.docFiles && p.docFiles[docType];
  if(info && info.path){
    try{ await storage.ref(info.path).delete(); }catch(e){ console.log('Arquivo já não existia no Storage', e); }
  }
  if(p.docFiles) delete p.docFiles[docType];
  renderDocsTab();
}

    dataEmbarqueReal: document.getElementById('f-dataembarquereal').value,
    chegadaPrevista: document.getElementById('f-chegada').value,
    modal: document.getElementById('f-modal').value,
    containersQty: document.getElementById('f-containers').value,
    aeroportoEmbarque: document.getElementById('f-aero-embarque') ? document.getElementById('f-aero-embarque').value : '',
    aeroportoDesembarque: document.getElementById('f-aero-desembarque') ? document.getElementById('f-aero-desembarque').value : '',
    aeroportoDestinoFinal: window.__editingProcess.aeroportoDestinoFinal,
    aeroportoDestino: document.getElementById('f-aero-destino') ? document.getElementById('f-aero-destino').value : '',
    temperaturaControlada: !!window.__editingProcess.temperaturaControlada,
    temperaturaValor: document.getElementById('f-temperatura').value,
    temperaturaOutro: document.getElementById('f-temperatura-outro').value,
    genset: !!window.__editingProcess.genset,
    cambioManual: !!window.__editingProcess.cambioManual,
    obs: document.getElementById('f-obs').value,
    docs: docs,
    docFiles: docFiles,
    ...collectCostFields()
  };
}

async function saveProcess(){
  if(!requireEditPermission()) return;
  const data = collectProcessFormData();
  if(!data.produto){
    alert('Informe ao menos o nome do produto.');
    switchTab('geral');
    return;
  }
  const idx = state.processes.findIndex(p=>p.id===data.id);
  const prev = idx>=0 ? state.processes[idx] : null;
  detectHistoryChanges(prev, data);
  const newKey = currentPendingKey(data);
  if(prev && prev.pendingKey===newKey){
    data.pendingSince = prev.pendingSince || todayStr();
  } else {
    data.pendingSince = todayStr();
  }
  data.pendingKey = newKey;
  if(idx>=0) state.processes[idx] = data; else state.processes.push(data);
  await persistState();
  closeModal();
  render();
}

async function deleteProcess(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este processo permanentemente?')) return;
  state.processes = state.processes.filter(p=>p.id!==id);
  await persistState();
  closeModal();
  render();
}

function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.remove();
  window.__editingProcess = null;
}

/* ---------- GERAÇÃO DE CAPA (PDF via impressão) ---------- */
function capaItem(checked, label){
  return `<div class="capa-item"><span class="capa-check">${checked?'&#10003;':''}</span><span>${label}</span></div>`;
}

function generateCapaPDF(){
  const data = collectProcessFormData();

  const stages = getStagesForProcess(data);
  const costs = computeCosts(data);
  const extra = data.extra || {};
  const destino = data.modal==='aereo' ? 'Aeroporto de Confins' : 'Porto Seco de Betim';
  const refDisplay = data.ref || ('REF-'+data.id.slice(0,6).toUpperCase());
  const statusLabel = stageInfoFor(data, data.status).label;

  const etapasHtml = stages.map(s=>{
    if(s.type==='payments'){
      return s.items.map(it=>{
        const rec = (data.payments && data.payments[it.key]) || {checked:false, valor:''};
        const v = parseFloat(rec.valor)||0;
        return capaItem(rec.checked, it.label + (v?` — ${fmtBRL(v)}`:''));
      }).join('');
    }
    const checked = data.checklist[s.key]||[];
    return s.items.map((label,idx)=>capaItem(checked[idx], label)).join('');
  }).join('');

  const docsHtml = getDocTypesForProcess(data).map(d=>capaItem(data.docs && data.docs[d], d)).join('');

  const field = (label, value)=>`<div class="f"><div class="l">${label}</div><div class="v">${value || '—'}</div></div>`;

.head .ref{font-size:12pt;font-weight:700;color:var(--bar);background:var(--fill);padding:7px 14px;border-radius:4px;}
.sec-bar{background:var(--bar);color:#fff;font-size:9.5pt;font-weight:700;letter-spacing:.5px;padding:6px 10px;text-transform:uppercase;margin-top:16px; break-after:avoid; page-break-after:avoid;}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px; break-inside:avoid; page-break-inside:avoid;}
.f{flex:1 1 150px;min-width:150px;}
.f .l{font-size:7.5pt;text-transform:uppercase;color:var(--label);font-weight:700;letter-spacing:.4px;}
.f .v{background:var(--fill);padding:6px 9px;border-radius:3px;font-size:10pt;margin-top:3px;min-height:15px;}
.capa-items{display:flex;flex-wrap:wrap;margin-top:8px;}
.capa-item{width:33%;font-size:8.5pt;padding:3px 6px 3px 0;display:flex;align-items:center;gap:6px; break-inside:avoid; page-break-inside:avoid;}
.capa-check{display:inline-block;width:12px;height:12px;border:1.4px solid var(--bar);text-align:center;line-height:11px;font-size:8px;color:var(--bar);flex-shrink:0;}
.obs-box{background:var(--fill);border-radius:4px;padding:8px 10px;margin-top:8px;font-size:9.5pt;min-height:30px; break-inside:avoid; page-break-inside:avoid;}
.foot{text-align:center;font-size:7.5pt;color:#8a93a8;margin-top:18px;padding-top:8px;border-top:1px solid #d5dcec;}
@media print{

</style></head>
<body>
<div class="sheet">

  <div class="sec-bar">2. Dados da Importação</div>
  <div class="row">
    ${field('DI / DUIMP', extra.numeroDUIMP)}
    ${field('Modal', data.modal==='aereo'?'Aéreo':'Marítimo')}

    ${field('Regime Fiscal', data.regime)}
  </div>
  <div class="row">
    ${field('Controle de Temperatura', data.temperaturaControlada ? (data.temperaturaValor==='outro' ? data.temperaturaOutro : (data.temperaturaValor||'Sim')) : 'Não')}
  </div>
  <div class="row">

    ${field('Destino', destino)}

  <div class="row">

    ${field('Transportadora (DTA)', extra.transportadoraDTA)}

  <div class="row">
    ${field('Número do BL', extra.numeroBL)}
    ${field('Valor FOB', data.fob?fmtUSD(parseFloat(data.fob)):'')}

    ${field('Número da NF', extra.numeroNF)}

  <div class="sec-bar">3. Logística</div>
  ${data.modal==='aereo' ? `
  <div class="row">
    ${field('AWB', extra.numeroAWB)}
    ${field('Companhia Aérea', extra.ciaAerea)}
    ${field('Freetime', '')}
  </div>
  <div class="row">
    ${field('Aeroporto de Embarque', data.aeroportoEmbarque)}
    ${field('Aeroporto de Desembarque', data.aeroportoDesembarque)}

  </div>` : `
  <div class="row">
    ${field('Navio / Voo', extra.navio)}
    ${field('Viagem', extra.viagem)}
    ${field('Freetime', extra.freetime ? extra.freetime+' dias' : '')}
  </div>
  <div class="row">
    ${field('Quantidade de Containers', data.containersQty)}
  </div>`}
  <div class="row">
    ${field('Data de Embarque', fmtDate(data.dataEmbarqueReal))}
    ${field('Chegada Prevista', fmtDate(data.chegadaPrevista))}
    ${field('Data de Chegada (Betim)', fmtDate(extra.dataChegadaBetim))}
  </div>
  ${(extra.containersList && extra.containersList.length) ? `
  <div class="row">
    ${extra.containersList.map((c,i)=>field('Container #'+(i+1), (c.container||'—')+' / Lacre: '+(c.lacre||'—'))).join('')}
  </div>` : ''}

  <div class="sec-bar">4. Etapas do Processo</div>
  <div class="capa-items">${etapasHtml}</div>

  <div class="sec-bar">5. Checklist de Documentos</div>

    ${field('FOB + Seguro (BRL)', fmtBRL(costs.fobBrl+costs.seguroBrl))}
    ${field('Impostos (II+IPI+PIS+COFINS+ICMS)', fmtBRL(costs.ii+costs.ipi+costs.pis+costs.cofins+costs.icms))}
    ${field('Pagamentos da Fase 8 (inclui frete real)', fmtBRL(costs.paymentsTotal))}
  </div>
  <div class="row">
    ${field('Custo Total Estimado', fmtBRL(costs.total))}
  </div>

  <div class="sec-bar">7. Observações</div>
  <div class="obs-box">${data.obs || '—'}</div>

  <div class="foot">Capa gerada automaticamente pelo ComexTrack em ${fmtDate(todayStr())}.</div>
</div>
<` + `script>window.onload=function(){ setTimeout(function(){ window.print(); }, 350); };<` + `/script>
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){
    alert('Não foi possível abrir a janela de impressão. Verifique se o navegador bloqueou pop-ups.');
    return;
  }
  w.document.write(html);
  w.document.close();
}

/* ---------- SUPPLIER MODAL ---------- */
function openSupplierModal(id){
  const existing = id ? state.suppliers.find(s=>s.id===id) : null;
  const s = existing || {id:uid()};
  window.__editingSupplierCountries = (s.countries||[]).slice();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h2>${existing?'Editar Fornecedor':'Novo Fornecedor'}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>Nome</label><input id="s-name" value="${s.name||''}" placeholder="Ex: Morita ou Carestream"></div>
        <div class="form-group">
          <label>Países de Origem</label>
          <div class="country-checks">
            ${COUNTRY_OPTIONS.map(c=>`<div class="country-chip ${window.__editingSupplierCountries.includes(c)?'checked':''}" id="chip-${c}" onclick="toggleSupplierCountry('${c}')">${c}</div>`).join('')}
          </div>
          <div class="form-hint">Ex: Morita normalmente só Japão; Carestream pode sair de EUA, Holanda, Bélgica ou China.</div>
        </div>
        <div class="form-group"><label>Contato (e-mail / telefone)</label><input id="s-contact" value="${s.contact||''}"></div>
        <div class="form-group">
          <label>Modalidades de Pagamento Aceitas</label>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-adiantado" ${s.modalidades && s.modalidades.adiantado ? 'checked':''}> Adiantado</label>
          </div>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-aprazo" onchange="toggleModalidadeDias('aprazo', this.checked)" ${s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.checked ? 'checked':''}> A prazo</label>
            <div class="modalidade-dias" id="wrap-aprazo" style="display:${s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.checked ? 'flex':'none'};">
              <input type="number" id="s-mod-aprazo-dias" value="${(s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.dias) || ''}" placeholder="dias">
              <span>dias após a fatura</span>
            </div>
          </div>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-factoring" onchange="toggleModalidadeDias('factoring', this.checked)" ${s.modalidades && s.modalidades.factoring && s.modalidades.factoring.checked ? 'checked':''}> Factoring</label>
            <div class="modalidade-dias" id="wrap-factoring" style="display:${s.modalidades && s.modalidades.factoring && s.modalidades.factoring.checked ? 'flex':'none'};">
              <input type="number" id="s-mod-factoring-dias" value="${(s.modalidades && s.modalidades.factoring && s.modalidades.factoring.dias) || ''}" placeholder="dias">
              <span>dias após a fatura (via banco)</span>
            </div>
          </div>
          <div class="form-hint">Marque quantas se aplicarem. O número de dias fica salvo para quando você precisar calcular a data de vencimento a partir da fatura.</div>
        </div>
        <div class="form-group"><label>Observações de Pagamento</label><input id="s-payment" value="${s.paymentTerms||''}" placeholder="Ex: condições específicas, banco, contato financeiro..."></div>
        <div class="form-group"><label>Observações Gerais</label><textarea id="s-notes">${s.notes||''}</textarea></div>
      </div>
      <div class="modal-footer">
        <div>${existing && currentRole!=='viewer' ?`<button class="btn btn-danger" onclick="deleteSupplier('${s.id}')">Excluir</button>`:'<span></span>'}</div>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="closeModal()">${currentRole==='viewer'?'Fechar':'Cancelar'}</button>
          ${currentRole!=='viewer' ? `<button class="btn btn-primary" onclick="saveSupplier('${s.id}')">Salvar Fornecedor</button>` : ''}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function toggleModalidadeDias(which, checked){
  document.getElementById('wrap-'+which).style.display = checked ? 'flex' : 'none';
}

function toggleSupplierCountry(c){
  const arr = window.__editingSupplierCountries;
  const i = arr.indexOf(c);
  if(i>=0) arr.splice(i,1); else arr.push(c);
  document.getElementById('chip-'+c).classList.toggle('checked');
}

async function saveSupplier(id){
  if(!requireEditPermission()) return;
  const name = document.getElementById('s-name').value.trim();
  if(!name){ alert('Informe o nome do fornecedor.'); return; }
  const data = {
    id,
    name,
    countries: (window.__editingSupplierCountries||[]).slice(),
    contact: document.getElementById('s-contact').value.trim(),
    modalidades: {
      adiantado: document.getElementById('s-mod-adiantado').checked,
      aPrazo: { checked: document.getElementById('s-mod-aprazo').checked, dias: document.getElementById('s-mod-aprazo-dias').value },
      factoring: { checked: document.getElementById('s-mod-factoring').checked, dias: document.getElementById('s-mod-factoring-dias').value },
    },
    paymentTerms: document.getElementById('s-payment').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
  };
  const idx = state.suppliers.findIndex(s=>s.id===id);
  if(idx>=0) state.suppliers[idx]=data; else state.suppliers.push(data);
  await persistState();
  closeModal();
  render();
}

async function deleteSupplier(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este fornecedor? Processos vinculados manterão a referência vazia.')) return;
  state.suppliers = state.suppliers.filter(s=>s.id!==id);
  state.processes.forEach(p=>{ if(p.supplierId===id) p.supplierId=''; });
  await persistState();
  closeModal();
  render();
}
