<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ComexTrack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --navy:#0F1B2D;
  --navy-light:#16263D;
  --navy-lighter:#223a58;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --ink-red:#B8441F;
  --ink-red-bg:#FBE9E2;
  --ink-green:#1F7A5C;
  --ink-green-bg:#E4F3EC;
  --ink-amber:#A5730F;
  --ink-amber-bg:#FBF0DC;
  --ink-blue:#2A5C8A;
  --ink-blue-bg:#E4EEF6;
  --ink-purple:#5B3FA0;
  --ink-purple-bg:#EDE7F8;
  --ink-teal:#0E7C86;
  --ink-teal-bg:#DCEEF0;
  --ink-gold:#946200;
  --ink-gold-bg:#FCEFD1;
  --text:#1A2433;
  --muted:#6B7785;
  --border:#E2E6EA;
  --border-strong:#C7CFD6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.display{font-family:'Zilla Slab', serif;}

#app{display:flex; min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--navy);
  color:#DCE4EC;
  display:flex; flex-direction:column;
  padding:24px 0;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:0 20px 24px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  margin-bottom:20px;
}
.brand-mark{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:20px;
  color:#fff; letter-spacing:0.02em;
  display:flex; align-items:center; gap:8px;
}
.brand-mark svg{flex-shrink:0;}
.brand-sub{
  font-family:'IBM Plex Mono', monospace; font-size:10px; color:#7C8FA8;
  letter-spacing:0.12em; text-transform:uppercase; margin-top:4px;
}
.nav{display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:6px;
  color:#AEBBCC; font-size:14px; font-weight:500;
  cursor:pointer; border:none; background:none; text-align:left; width:100%;
  transition:background 0.15s, color 0.15s;
}
.nav-item:hover{background:var(--navy-light); color:#fff;}
.nav-item.active{background:var(--navy-lighter); color:#fff;}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0; flex-shrink:0;}
.nav-item.active .dot{opacity:1; background:#E8A25C;}

.sidebar-footer{margin-top:auto; padding:0 20px;}
.new-process-btn{
  width:100%; background:var(--ink-red); color:#fff; border:none;
  padding:11px 14px; border-radius:6px; font-weight:600; font-size:13px;
  cursor:pointer; font-family:'Inter',sans-serif;
  transition:background 0.15s;
}
.new-process-btn:hover{background:#9c3818;}

/* MAIN */
main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:28px 36px 20px 36px;
  border-bottom:1px solid var(--border);
  background:var(--card);
}
.topbar h1{font-family:'Zilla Slab', serif; font-size:26px; font-weight:700;}
.topbar p{color:var(--muted); font-size:13.5px; margin-top:4px;}
.view-content{padding:28px 36px 60px 36px; flex:1;}

/* KPI */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
.kpi-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:16px 18px; position:relative; overflow:hidden;
}
.kpi-card::before{
  content:''; position:absolute; top:0; left:0; width:3px; height:100%;
  background:var(--kpi-accent, var(--ink-blue));
}
.kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-weight:600;}
.kpi-value{font-family:'Zilla Slab', serif; font-size:26px; font-weight:700; margin-top:6px;}
.kpi-sub{font-size:12px; color:var(--muted); margin-top:3px;}

.section-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:16px;
  margin:36px 0 16px 0; display:flex; align-items:center; gap:12px;
  text-transform:uppercase; letter-spacing:0.03em;
}
.section-title:first-child{margin-top:0;}
.section-title .rule{flex:1; height:3px; background:linear-gradient(90deg, var(--navy) 0%, var(--border-strong) 70%, transparent 100%); border-radius:2px;}

/* PROCESS LIST */
.process-list{display:flex; flex-direction:column; gap:10px;}
.process-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:16px 18px; cursor:pointer; transition:border-color 0.15s, box-shadow 0.15s;
  display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center;
}
.process-card:hover{border-color:var(--border-strong); box-shadow:0 2px 10px rgba(15,27,45,0.06);}

.stamp{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600;
  letter-spacing:0.06em; text-transform:uppercase;
  border:2px solid currentColor; border-radius:4px;
  padding:5px 8px; transform:rotate(-3deg); white-space:nowrap;
  text-align:center; line-height:1.3; max-width:150px;
}
.stamp-pedido{color:var(--ink-blue); background:var(--ink-blue-bg);}
.stamp-producao{color:var(--ink-amber); background:var(--ink-amber-bg);}
.stamp-embarcado{color:var(--ink-purple); background:var(--ink-purple-bg);}
.stamp-transito{color:var(--ink-purple); background:var(--ink-purple-bg);}
.stamp-porto{color:var(--ink-amber); background:var(--ink-amber-bg);}
.stamp-desembaraco{color:var(--ink-red); background:var(--ink-red-bg);}
.stamp-remocao{color:var(--ink-teal); background:var(--ink-teal-bg);}
.stamp-pagamentos{color:var(--ink-gold); background:var(--ink-gold-bg);}
.stamp-entregue{color:var(--ink-green); background:var(--ink-green-bg);}

.process-main h3{font-size:15px; font-weight:600;}
.process-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
.process-meta .ref{font-family:'IBM Plex Mono', monospace; color:var(--muted);}
.process-track{margin-top:10px; display:flex; align-items:center;}
.track-step{display:flex; align-items:center; flex:1;}
.track-dot{width:8px; height:8px; border-radius:50%; background:var(--border-strong); flex-shrink:0; position:relative;}
.track-dot.done{background:var(--ink-green);}
.track-dot.current{background:var(--ink-red); box-shadow:0 0 0 3px var(--ink-red-bg);}
.track-line{flex:1; height:2px; background:var(--border-strong);}
.track-line.done{background:var(--ink-green);}
.step-note{font-size:12px; color:var(--ink-red); margin-top:5px; font-style:italic;}
.progress-pct{font-size:10.5px; color:var(--muted); margin-top:4px; font-family:'IBM Plex Mono',monospace;}
.alert-banner{
  background:var(--ink-red-bg); color:var(--ink-red); border:1px solid #F0BBA5; border-radius:6px;
  padding:6px 10px; font-size:11.5px; font-weight:600; margin-top:7px; line-height:1.5;
}
.process-card.has-alert, .transit-card.has-alert{border-color:var(--ink-red); box-shadow:0 0 0 1px var(--ink-red-bg);}

.eye-btn{
  position:absolute; top:10px; right:10px; background:var(--paper); border:1px solid var(--border-strong);
  border-radius:6px; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:14px; z-index:2;
}
.eye-btn:hover{background:var(--card); border-color:var(--ink-blue);}
.process-card, .transit-card{position:relative;}

.view-section-title{font-family:'Zilla Slab',serif; font-weight:700; font-size:14.5px; margin:18px 0 10px 0; color:var(--navy); text-transform:uppercase; letter-spacing:0.03em;}
.view-section-title:first-child{margin-top:0;}
.view-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
.view-field{background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:8px 10px;}
.view-field .view-label{display:block; font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:0.03em; margin-bottom:3px;}
.view-field .view-value{font-size:13px; font-weight:500;}
.view-check-list{display:flex; flex-direction:column; gap:5px;}
.view-check-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px; border-radius:5px;}
.view-check-item.done{color:var(--ink-green);}
.view-check-item .vc{width:14px; height:14px; border-radius:4px; border:2px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff;}
.view-check-item.done .vc{background:var(--ink-green); border-color:var(--ink-green);}
.pending-since{font-size:11px; color:var(--ink-red); margin-top:4px; font-weight:600;}

.process-ref-badge{min-width:64px; text-align:center; padding:6px 4px;}
.process-ref-badge .ref-label{display:block; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:3px;}
.process-ref-badge .ref-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; color:var(--navy); line-height:1.2; word-break:break-word; text-transform:uppercase; letter-spacing:0.02em;}
.phase-mini{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; color:var(--muted); background:var(--paper); padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; margin-left:6px; vertical-align:middle;}

.filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:20px;}
.filter-bar input, .filter-bar select{padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;}
.filter-bar input[type="text"]{flex:1; min-width:180px;}
.filter-bar .btn{padding:8px 12px; font-size:12.5px;}
.supplier-name-carestream{color:#C8641A; font-weight:700;}
.supplier-name-morita{color:#1D5FA8; font-weight:700;}

body.dark-mode{
  --paper:#10161F; --card:#1A222E; --text:#E4E9F0; --muted:#8C9BB5;
  --border:#2A3646; --border-strong:#3A4A5F;
}
body.dark-mode .modal-overlay{background:rgba(0,0,0,0.7);}
body.dark-mode .form-group input, body.dark-mode .form-group select, body.dark-mode .form-group textarea,
body.dark-mode .filter-bar input, body.dark-mode .filter-bar select,
body.dark-mode .item-fields input, body.dark-mode .item-fields select,
body.dark-mode .stage-extra input, body.dark-mode .payment-row input,
body.dark-mode .config-icon, body.dark-mode .config-label, body.dark-mode .config-row select{
  background:#232E3D; color:var(--text); border-color:var(--border-strong);
}
body.dark-mode .doc-item, body.dark-mode .stage-header, body.dark-mode .stage-body{background:#1A222E;}
body.dark-mode .theme-toggle-btn{background:#232E3D; color:#fff; border-color:#3A4A5F;}
body.dark-mode .process-ref-badge .ref-value{color:#E8A25C;}
body.dark-mode .kpi-card, body.dark-mode .process-card, body.dark-mode .transit-card, body.dark-mode .supplier-card, body.dark-mode .contact-card{background:var(--card);}

.process-side{text-align:right; white-space:nowrap;}
.process-value{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px;}
.process-eta{font-size:11.5px; color:var(--muted); margin-top:3px;}
.process-badge-temp{
  display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--ink-purple); background:var(--ink-purple-bg);
  padding:2px 6px; border-radius:4px; margin-top:4px;
}

/* TRANSIT CARD */
.transit-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; cursor:pointer;
}
.transit-card:hover{border-color:var(--border-strong); box-shadow:0 2px 10px rgba(15,27,45,0.06);}
.transit-icon{font-size:26px; width:44px; text-align:center;}
.transit-dates{font-size:12px; color:var(--muted); margin-top:5px; display:flex; gap:14px; flex-wrap:wrap;}
.transit-logi{font-size:11.5px; color:var(--text); margin-top:4px; display:flex; gap:12px; flex-wrap:wrap;}
.transit-logi b{color:var(--muted); font-weight:600;}
.transit-days{text-align:right; white-space:nowrap;}
.transit-days .big{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; letter-spacing:0.01em;}
.transit-days .small{font-size:11px; color:var(--muted);}
.transit-days.late .big{color:var(--ink-red);}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--muted);
  border:1px dashed var(--border-strong); border-radius:10px;
}
.empty-state h3{font-family:'Zilla Slab', serif; color:var(--text); font-size:17px; margin-bottom:6px;}
.empty-state button{margin-top:16px;}

/* SUPPLIERS / PARTNERS */
.supplier-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
.supplier-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;
  cursor:pointer;
}
.supplier-card:hover{border-color:var(--border-strong);}
.supplier-card h3{font-size:15px; font-weight:600;}
.supplier-flag{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
.supplier-meta{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.6;}
.supplier-count{
  display:inline-block; margin-top:10px; font-size:11px; font-weight:600;
  background:var(--ink-blue-bg); color:var(--ink-blue); padding:3px 8px; border-radius:20px;
}
.supplier-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;}
.supplier-tag{font-size:10.5px; background:var(--ink-blue-bg); color:var(--ink-blue); padding:2px 7px; border-radius:10px; font-weight:600;}

/* COUNTRY CHIPS */
.country-checks{display:flex; flex-wrap:wrap; gap:8px;}
.country-chip{
  padding:6px 11px; border:1px solid var(--border-strong); border-radius:20px; font-size:12px; cursor:pointer; user-select:none;
}
.country-chip.checked{background:var(--ink-blue); color:#fff; border-color:var(--ink-blue);}

.modalidade-row{display:flex; align-items:center; gap:14px; margin-top:6px; flex-wrap:wrap;}
.modalidade-check{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; min-width:110px;}
.modalidade-check input{width:auto;}
.modalidade-dias{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
.modalidade-dias input{width:70px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}

.container-row{display:grid; grid-template-columns:28px 1fr 1fr; gap:8px; align-items:center; margin-top:6px;}
.container-row .container-idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;}
.container-row input{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}
.containers-table{margin-top:4px;}

/* PARTNERS GROUPS */
.contact-group{margin-bottom:26px;}
.contact-group-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:15px; margin-bottom:10px;
  display:flex; align-items:center; gap:8px; color:var(--navy);
}
.contact-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px;}
.contact-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:13px 15px; cursor:pointer;
}
.contact-card:hover{border-color:var(--border-strong);}
.contact-name{font-size:13.5px; font-weight:600;}
.contact-role{font-size:12px; color:var(--muted); margin-top:1px;}
.contact-phone{font-size:12.5px; color:var(--ink-blue); margin-top:6px; font-family:'IBM Plex Mono',monospace;}

/* INDICATORS */
.indicators-table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.indicators-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);
  background:var(--paper); padding:10px 14px; font-weight:600; border-bottom:1px solid var(--border);
}
.indicators-table td{padding:11px 14px; font-size:13px; border-bottom:1px solid var(--border);}
.indicators-table tr:last-child td{border-bottom:none;}
.indicators-table td.meta-col{font-family:'IBM Plex Mono',monospace; color:var(--ink-green); font-weight:600;}

/* MODAL */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,27,45,0.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:40px 20px;
  overflow-y:auto;
}
.modal{
  background:var(--card); border-radius:10px; width:100%; max-width:700px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.modal-header{
  padding:20px 26px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-header h2{font-family:'Zilla Slab', serif; font-size:19px;}
.modal-close{
  background:none; border:none; cursor:pointer; color:var(--muted); font-size:20px;
  width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center;
}
.modal-close:hover{background:var(--paper); color:var(--text);}
.modal-body{padding:22px 26px; max-height:70vh; overflow-y:auto;}
.modal-footer{padding:16px 26px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}

.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em;}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border-strong); border-radius:6px;
  font-family:'Inter',sans-serif; font-size:13.5px; background:#fff; color:var(--text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:2px solid var(--ink-blue); outline-offset:1px; border-color:var(--ink-blue);}
.form-group textarea{resize:vertical; min-height:60px;}
.form-hint{font-size:11px; color:var(--muted); margin-top:4px; font-style:italic;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.tab-btn{
  background:none; border:none; padding:9px 4px; margin-right:18px; font-size:13px; font-weight:600;
  color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:'Inter',sans-serif;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--ink-red);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

.cost-table{width:100%; border-collapse:collapse; font-size:13px;}
.cost-table td{padding:7px 0; border-bottom:1px solid var(--border);}
.cost-table td:last-child{text-align:right; font-family:'IBM Plex Mono',monospace;}
.cost-table tr.total td{font-weight:700; border-top:2px solid var(--text); border-bottom:none; padding-top:10px;}
.cost-note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5; font-style:italic;}

.doc-checklist{display:flex; flex-direction:column; gap:8px;}
.doc-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  border:1px solid var(--border); border-radius:6px; cursor:pointer;
}
.doc-item.checked{background:var(--ink-green-bg); border-color:#B7DBC9;}
.doc-check{
  width:18px; height:18px; border-radius:4px; border:2px solid var(--border-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
}
.doc-item.checked .doc-check{background:var(--ink-green); border-color:var(--ink-green);}
.doc-item span{font-size:13px; line-height:1.4;}
.doc-item.checked span{color:var(--ink-green); text-decoration:line-through; text-decoration-color:#B7DBC9;}

.item-fields{margin:-2px 0 6px 30px; padding:9px 11px; background:var(--paper); border-left:2px solid var(--border-strong); display:flex; flex-wrap:wrap; gap:8px; border-radius:0 6px 6px 0;}
.item-fields .mini-field{display:flex; flex-direction:column; gap:3px; min-width:130px; flex:1;}
.item-fields label{font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600;}
.item-fields input, .item-fields select{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; font-family:'Inter',sans-serif;}

.stage-extra{margin-top:6px; padding:11px 12px; background:var(--paper); border:1px solid var(--border); border-radius:6px; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:9px;}

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBEkQ5JtdnbhC_aJAnMgarmcFZx6HxyO3k",
  authDomain: "plataforma-comextrack.firebaseapp.com",
  projectId: "plataforma-comextrack",
  storageBucket: "plataforma-comextrack.firebasestorage.app",
  messagingSenderId: "483429245617",
  appId: "1:483429245617:web:ed494476724f11bd98b890",
  measurementId: "G-X58Z9RMEH4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;
let currentRole = 'viewer';
let unsubscribeData = null;

function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
  auth.signInWithEmailAndPassword(email, password).catch(e=>{
    errEl.textContent = 'Não foi possível entrar. Confira e-mail e senha.';
    console.error(e);
  });
}
function doLogout(){
  if(unsubscribeData) unsubscribeData();
  auth.signOut();
}

async function ensureUserRole(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if(snap.exists){
    currentRole = snap.data().role || 'editor';
    return;
  }
  const allUsers = await db.collection('users').get();
  const role = allUsers.empty ? 'admin' : 'editor';
  await ref.set({ email:user.email, role, createdAt: Date.now() });
  currentRole = role;
}

function attachDataListener(){
  if(unsubscribeData) unsubscribeData();
  unsubscribeData = db.collection('comextrack').doc('data').onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      state.processes = d.processes || [];
      state.suppliers = d.suppliers || [];
      state.partners = (d.partners && d.partners.length) ? d.partners : DEFAULT_PARTNERS.map(p=>({...p}));
      state.dashboardConfig = d.dashboardConfig || null;
    } else {
      state = { processes:[], suppliers:[], partners: DEFAULT_PARTNERS.map(p=>({...p})) };
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render();
  }, err=>{
    console.error('Erro ao sincronizar', err);
    updateSaveIndicator('⚠ Erro de conexão com a nuvem');
  });
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    await ensureUserRole(user);
    attachDataListener();
  } else {
    currentUser = null;
    if(unsubscribeData) unsubscribeData();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }
});
</script>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtBRL(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtUSD(v){
  return (v||0).toLocaleString('en-US', {style:'currency', currency:'USD'});
}
function fmtDate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(d1,d2){
  const a = new Date(d1+'T00:00:00');
  const b = new Date(d2+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function countryFlag(country){
  const map = {'Japão':'🇯🇵','EUA':'🇺🇸','Holanda':'🇳🇱','Bélgica':'🇧🇪','China':'🇨🇳'};
  return map[country] || (country ? '🌐' : '');
}
function modalIcon(modal){ return modal==='aereo' ? '✈️' : '🚢'; }
function modalLabel(modal){ return modal==='aereo' ? 'Aéreo' : 'Marítimo'; }
function getProcessAlerts(p){
  const alerts = [];
  if(p.tipo==='temporaria' || isProcessDone(p)) return alerts;
  const extra = p.extra || {};
  const today = todayStr();

  if(p.dataEmbarqueReal){
    const diasDesdeEmbarque = daysBetween(p.dataEmbarqueReal, today);
    if(diasDesdeEmbarque>=3 && !extra.despachante){
      alerts.push('3+ dias de embarque sem despachante definido');
    }
    if(diasDesdeEmbarque>=0){
      const fase3checked = p.checklist['fase3']||[];
      if(!fase3checked[0]){
        alerts.push('Carga já embarcou e o provisionamento (Fase 3) não foi enviado');
      }
    }
  }

  if(p.chegadaPrevista){
    const diasParaChegada = daysBetween(today, p.chegadaPrevista);
    if(diasParaChegada<=5 && !extra.transportadoraDTA){
      alerts.push('Faltam 5 dias ou menos para a chegada sem DTA definida');
    }
    const fase5checked = p.checklist['fase5']||[];
    if(diasParaChegada<=5 && !fase5checked[4]){
      alerts.push('Faltam 5 dias ou menos para a chegada sem rascunho da DUIMP');
    }
  }

  if(p.prontidao && daysBetween(p.prontidao, today) >= 0){
    const hasFatura = p.docs && p.docs['Invoice Comercial (Fatura)'];
    const hasPacking = p.docs && p.docs['Packing List'];
    if(!hasFatura || !hasPacking){
      alerts.push('Prontidão já chegou sem Fatura e/ou Packing List marcados');
    }
  }

  return alerts;
}

function renderAlertBanner(p){
  const alerts = getProcessAlerts(p);
  if(!alerts.length) return '';
  return `<div class="alert-banner">⚠️ ${alerts.join(' · ')}</div>`;
}

function canalColor(canal){
  const map = {'Verde':'#1F7A5C','Amarelo':'#A5730F','Vermelho':'#B8441F','Cinza':'#6B7785'};
  return map[canal] || null;
}
function canalBadgeHtml(canal){
  if(!canal) return '';
  const color = canalColor(canal);
  if(!color) return canal;
  return `<span style="color:${color};font-weight:700;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:5px;vertical-align:1px;"></span>${canal}</span>`;
}

function viewFieldHtml(label, value){
  return `<div class="view-field"><span class="view-label">${label}</span><span class="view-value">${value||'—'}</span></div>`;
}

function openProcessViewModal(id, event){
  if(event) event.stopPropagation();
  const p = state.processes.find(x=>x.id===id);
  if(!p) return;
  const fornecedor = state.suppliers.find(s=>s.id===p.supplierId);
  const costs = computeCosts(p);
  const stages = getStagesForProcess(p);
  const extra = p.extra || {};

  const etapasHtml = stages.map(s=>{
    let itemsHtml = '';
    if(s.type==='payments'){
      itemsHtml = s.items.map(it=>{
        const rec = (p.payments && p.payments[it.key]) || {checked:false, valor:''};
        const v = parseFloat(rec.valor)||0;
        return `<div class="view-check-item ${rec.checked?'done':''}"><span class="vc">${rec.checked?'✓':''}</span>${it.label}${v?` — ${fmtBRL(v)}`:''}</div>`;
      }).join('');
    } else {
      const checked = p.checklist[s.key]||[];
      itemsHtml = s.items.map((label,idx)=>`<div class="view-check-item ${checked[idx]?'done':''}"><span class="vc">${checked[idx]?'✓':''}</span>${label}</div>`).join('');
    }
    return `<div style="margin-bottom:14px;"><div style="font-weight:700;font-size:13px;margin-bottom:6px;">${s.label}</div><div class="view-check-list">${itemsHtml}</div></div>`;
  }).join('');

  const docsHtml = `<div class="view-check-list">${DOC_TYPES.map(d=>`<div class="view-check-item ${p.docs&&p.docs[d]?'done':''}"><span class="vc">${p.docs&&p.docs[d]?'✓':''}</span>${d}</div>`).join('')}</div>`;

  const containersHtml = (extra.containersList && extra.containersList.length) ? `
    <div class="view-grid" style="margin-top:8px;">
      ${extra.containersList.map((c,i)=>viewFieldHtml('Container #'+(i+1), (c.container||'—')+' / Lacre: '+(c.lacre||'—'))).join('')}
    </div>` : '';

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${p.produto||'Processo'} <span style="font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--muted);">· ${p.ref||''}</span></h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="status-badge-row">
          <div class="stamp ${stageInfoFor(p,p.status).cls}">${stageInfoFor(p,p.status).label}</div>
          <div class="status-badge-hint">${Math.round(processProgressRatio(p)*100)}% concluído · Visualização somente leitura</div>
        </div>

        <div class="view-section-title">Identificação</div>
        <div class="view-grid">
          ${viewFieldHtml('Fornecedor', fornecedor?fornecedorNameHtml(fornecedor):'—')}
          ${viewFieldHtml('Tipo', p.tipo==='temporaria'?'Admissão Temporária':'Importação Definitiva')}
          ${viewFieldHtml('Data do Pedido', fmtDate(p.dataPedido))}
          ${viewFieldHtml('Prontidão Prevista', fmtDate(p.prontidao))}
        </div>

        <div class="view-section-title">Dados da Importação</div>
        <div class="view-grid">
          ${viewFieldHtml('Origem', (countryFlag(p.origemPais)?countryFlag(p.origemPais)+' ':'')+(p.origemPais||'—'))}

/* ===================== LÓGICA DE ETAPAS ===================== */
function getStagesForProcess(p){
  if(p && p.tipo==='temporaria') return TEMP_STAGES;
  return STAGE_DEFS.map(s=>{
    if(s.key==='fase3'){
      const supplier = state.suppliers.find(x=>x.id===p.supplierId);
      let options = [];
      if(supplier && supplier.modalidades){
        if(supplier.modalidades.adiantado) options.push('Adiantado');
        if(supplier.modalidades.aPrazo && supplier.modalidades.aPrazo.checked) options.push(`A prazo (${supplier.modalidades.aPrazo.dias||'?'} dias)`);
        if(supplier.modalidades.factoring && supplier.modalidades.factoring.checked) options.push(`Factoring (${supplier.modalidades.factoring.dias||'?'} dias)`);
      }
      if(options.length===0) options = ['Adiantado','A prazo','Factoring'];
      const mp = p.extra && p.extra.modalidadePagamento;
      const label = mp ? `Pagamento (${mp})` : 'Pagamento';
      return {...s, items:[label], extraFields:[{key:'modalidadePagamento', label:'Modalidade de Pagamento', type:'select', options}]};
    }
    return s;
  });
}
function stageIndexFor(p, key){ return getStagesForProcess(p).findIndex(s=>s.key===key); }
function stageInfoFor(p, key){ const stages=getStagesForProcess(p); return stages.find(s=>s.key===key) || stages[0]; }

function initProcessData(p){
  p.extra = p.extra || {};
  p.payments = p.payments || {};
  p.checklist = p.checklist || {};
  getStagesForProcess(p).forEach(s=>{
    if(s.type==='payments'){
      s.items.forEach(it=>{
        if(!p.payments[it.key]) p.payments[it.key] = {checked:false, valor:''};
      });
    } else {
      const existing = p.checklist[s.key] || [];
      p.checklist[s.key] = s.items.map((_,i)=> existing[i]===true);
    }
  });
  return p;
}

function stageComplete(p, stageKey){
  const stage = getStagesForProcess(p).find(s=>s.key===stageKey);
  if(!stage) return false;
  if(stage.type==='payments'){
    return stage.items.every(it=> (p.payments[it.key]||{}).checked===true);
  }
  const checked = p.checklist[stageKey] || [];
  return stage.items.every((_,i)=>checked[i]===true);
}

function recomputeStatus(p){
  const stages = getStagesForProcess(p);
  for(const s of stages){
    if(!stageComplete(p, s.key)) return s.key;
  }
  return stages[stages.length-1].key;
}

function isProcessDone(p){
  return getStagesForProcess(p).every(s=>stageComplete(p, s.key));
}

function getDashboardConfig(){
  const dflt = {
    labels: {
      producao: {label:'Em Produção', icon:'📦'},
      aguardando_embarque: {label:'Aguardando Embarque', icon:'⏳'},
      transito: {label:'Em Trânsito', icon:'🚢'},
      desembaraco: {label:'Em Desembaraço', icon:'📋'},
      entregue: {label:'Entregue', icon:'✅'},
    },
    rules: [],
  };
  const cfg = state.dashboardConfig || {};
  const labels = {...dflt.labels};
  Object.keys(cfg.labels||{}).forEach(k=>{ labels[k] = {...labels[k], ...cfg.labels[k]}; });
  return { labels, rules: cfg.rules || [] };
}

function bucketLabel(id, cfg){
  cfg = cfg || getDashboardConfig();
  if(String(id).indexOf('custom:')===0){
    const rid = id.slice(7);
    const r = (cfg.rules||[]).find(x=>x.id===rid);
    return r ? `${r.icon?r.icon+' ':''}${r.label}` : id;
  }
  const l = cfg.labels[id];
  return l ? `${l.icon?l.icon+' ':''}${l.label}` : id;
}

function getBucket(p){
  if(isProcessDone(p)) return 'finalizados';
  const cfg = getDashboardConfig();
  const rule = (cfg.rules||[]).find(r=>r.stageKey===p.status);
  if(rule) return 'custom:'+rule.id;
  if(p.tipo==='temporaria') return 'producao';
  const stages = getStagesForProcess(p);
  const idx = stages.findIndex(s=>s.key===p.status);
  if(idx<=3){
    if(p.prontidao && daysBetween(todayStr(), p.prontidao) <= 0) return 'aguardando_embarque';
    return 'producao';
  }
  if(idx===4){
    const diasParaEmbarque = p.dataEmbarqueReal ? daysBetween(todayStr(), p.dataEmbarqueReal) : null;
    if(diasParaEmbarque===null || diasParaEmbarque>0) return 'aguardando_embarque';
    return 'transito';
  }
  if(idx===5){
    const stage = stages[5];
    const checked = p.checklist['fase6']||[];
    return checked[stage.arrivalItemIndex] ? 'desembaraco' : 'transito';
  }
  if(idx===6){
    const stage = stages[6];
    const checked = p.checklist['fase7']||[];
    return checked[stage.receiptItemIndex] ? 'entregue' : 'desembaraco';
  }
  if(idx>=7) return 'entregue';
  return 'producao';
}

function currentStepLabel(p){
  const stages = getStagesForProcess(p);
  const stage = stages.find(s=>s.key===p.status);
  if(!stage) return '';
  if(stage.type==='payments'){
    const pend = stage.items.find(it=> !(p.payments[it.key]||{}).checked);
    return pend ? `Pendente: ${pend.label}` : 'Concluído';
  }
  const checked = p.checklist[stage.key]||[];
  const idx = stage.items.findIndex((_,i)=>!checked[i]);
  return idx>=0 ? `Pendente: ${stage.items[idx]}` : 'Concluído';
}

function computeCosts(p){
  const fob = parseFloat(p.fob)||0;
  const frete = parseFloat(p.frete)||0;
  const seguro = parseFloat(p.seguro)||0;
  const cambio = parseFloat(p.cambio)||0;
  const cifUsd = fob + frete + seguro;
  const cifBrl = cifUsd * cambio;
  const ii = parseFloat(p.ii)||0;
  const ipi = parseFloat(p.ipi)||0;
  const pis = parseFloat(p.pis)||0;
  const cofins = parseFloat(p.cofins)||0;
  const icms = parseFloat(p.icms)||0;
  const despesas = parseFloat(p.despesas)||0;
  const paymentsTotal = p.payments ? Object.values(p.payments).reduce((s,r)=>s+(parseFloat(r.valor)||0),0) : 0;
  const total = cifBrl + ii + ipi + pis + cofins + icms + despesas + paymentsTotal;
  return {cifUsd, cifBrl, ii, ipi, pis, cofins, icms, despesas, paymentsTotal, total};
}

let dashboardFilters = { search:'', supplierId:'', modal:'', tipo:'' };

function processMatchesFilter(p){
  if(dashboardFilters.search){
    const q = dashboardFilters.search.toLowerCase();
    const hay = `${p.produto||''} ${p.ref||''}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(dashboardFilters.supplierId && p.supplierId!==dashboardFilters.supplierId) return false;
  if(dashboardFilters.modal && p.modal!==dashboardFilters.modal) return false;
  if(dashboardFilters.tipo && p.tipo!==dashboardFilters.tipo) return false;
  return true;
}

function applyDashboardFilters(){
  dashboardFilters.search = document.getElementById('dash-filter-search').value;
  dashboardFilters.supplierId = document.getElementById('dash-filter-supplier').value;
  dashboardFilters.modal = document.getElementById('dash-filter-modal').value;
  dashboardFilters.tipo = document.getElementById('dash-filter-tipo').value;
  const el = document.getElementById('dashboard-results');
  if(el) el.innerHTML = renderDashboardResults();
}

function clearDashboardFilters(){
  dashboardFilters = { search:'', supplierId:'', modal:'', tipo:'' };

}

function renderDashboard(){
  const supplierOptions = state.suppliers.map(s=>`<option value="${s.id}" ${dashboardFilters.supplierId===s.id?'selected':''}>${s.name}</option>`).join('');
  const filterBar = `
    <div class="filter-bar">
      <input type="text" id="dash-filter-search" placeholder="Buscar por produto ou referência..." value="${dashboardFilters.search}" oninput="applyDashboardFilters()">
      <select id="dash-filter-supplier" onchange="applyDashboardFilters()">
        <option value="">Todos os fornecedores</option>
        ${supplierOptions}
      </select>
      <select id="dash-filter-modal" onchange="applyDashboardFilters()">
        <option value="">Todos os modais</option>
        <option value="maritimo" ${dashboardFilters.modal==='maritimo'?'selected':''}>Marítimo</option>
        <option value="aereo" ${dashboardFilters.modal==='aereo'?'selected':''}>Aéreo</option>
      </select>
      <select id="dash-filter-tipo" onchange="applyDashboardFilters()">
        <option value="">Definitiva e Temporária</option>
        <option value="definitiva" ${dashboardFilters.tipo==='definitiva'?'selected':''}>Só Definitiva</option>

      </select>

    </div>
  `;
  return filterBar + `<div id="dashboard-results">${renderDashboardResults()}</div>`;
}

function renderDashboardResults(){
  const cfg = getDashboardConfig();
  const bucketOrder = ['producao','aguardando_embarque','transito','desembaraco','entregue', ...cfg.rules.map(r=>'custom:'+r.id)];
  const buckets = {};
  bucketOrder.forEach(id=>buckets[id]=[]);
  const filteredProcesses = state.processes.filter(processMatchesFilter);
  filteredProcesses.forEach(p=>{ const b=getBucket(p); if(buckets[b]) buckets[b].push(p); });
  const finalizadosCount = filteredProcesses.filter(p=>getBucket(p)==='finalizados').length;

  const kpiAccents = {producao:'var(--ink-blue)', aguardando_embarque:'var(--ink-amber)', transito:'var(--ink-purple)', desembaraco:'var(--ink-red)', entregue:'var(--ink-green)'};
  const kpis = `
  <div class="kpi-row">
    ${bucketOrder.map(id=>`
      <div class="kpi-card" style="--kpi-accent:${kpiAccents[id]||'var(--ink-teal)'}">
        <div class="kpi-label">${bucketLabel(id, cfg)}</div>
        <div class="kpi-value">${buckets[id].length}</div>
      </div>
    `).join('')}
  </div>
  `;

  let body = '';
  let anyContent = false;
  bucketOrder.forEach(id=>{
    const list = buckets[id];
    if(!list.length) return;
    anyContent = true;
    const title = bucketLabel(id, cfg);
    if(id==='producao'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(producaoCard).join('')}</div>`;
    } else if(id==='aguardando_embarque'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(aguardandoEmbarqueCard).join('')}</div>`;
    } else if(id==='transito'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(transitoCard).join('')}</div>`;
    } else if(id==='desembaraco'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(desembaracoCard).join('')}</div>`;
    } else {
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(p=>processCard(p)).join('')}</div>`;
    }
  });

  if(!anyContent){
    const hasFilters = dashboardFilters.search || dashboardFilters.supplierId || dashboardFilters.modal || dashboardFilters.tipo;
    body = hasFilters ? `
    <div class="empty-state">
      <h3>Nenhum processo encontrado</h3>
      <p>Nenhum processo bate com os filtros aplicados.</p>
      <button class="btn" onclick="clearDashboardFilters()">Limpar filtros</button>
    </div>
  ` : `
    <div class="empty-state">
      <h3>Nenhum processo em andamento</h3>
      <p>Cadastre seu primeiro processo de importação para começar a acompanhar aqui.</p>
      <button class="btn btn-primary" onclick="openProcessModal()">+ Novo Processo</button>
    </div>
  `;
  }

  const finalNote = finalizadosCount ? `<div class="cost-note" style="margin-top:14px;">${finalizadosCount} processo(s) finalizado(s) — veja na aba <strong>Finalizados</strong>.</div>` : '';

  return kpis + body + finalNote;
}

/* ---------- PROCESSOS ---------- */
function processProgressRatio(p){
  const stages = getStagesForProcess(p);
  let total=0, done=0;
  stages.forEach(s=>{
    if(s.type==='payments'){
      total += s.items.length;
      done += s.items.filter(it=>(p.payments[it.key]||{}).checked).length;
    } else {
      total += s.items.length;
      const checked = p.checklist[s.key]||[];
      done += checked.filter(Boolean).length;
    }
  });
  return total ? done/total : 0;
}

function renderProcessos(){
  const list = state.processes.filter(p=>getBucket(p)!=='finalizados');
  if(list.length===0){
    return `<div class="empty-state">
      <h3>Nenhum processo ativo</h3>
      <p>Crie seu primeiro processo para começar a controlar custos, prazos e documentos.</p>
      <button class="btn btn-primary" onclick="openProcessModal()">+ Novo Processo</button>
    </div>`;
  }
  const sorted = [...list].sort((a,b)=> processProgressRatio(b) - processProgressRatio(a) || (a.chegadaPrevista||'9999').localeCompare(b.chegadaPrevista||'9999'));
  return `<div class="process-list">${sorted.map(p=>processCard(p)).join('')}</div>`;
}

  const list = state.processes.filter(p=>getBucket(p)==='finalizados');

  return `<div class="process-list">${list.map(p=>processCard(p)).join('')}</div>`;
}

function processCard(p, note){
  const stages = getStagesForProcess(p);
  const info = stageInfoFor(p, p.status);
  const idx = stageIndexFor(p, p.status);
  const costs = computeCosts(p);
  const fornecedor = state.suppliers.find(s=>s.id===p.supplierId);
  const trackHtml = stages.map((s,i)=>{
    const dotCls = i<idx ? 'done' : (i===idx ? 'current' : '');
    const lineCls = i<idx ? 'done' : '';
    return `<div class="track-step">
      <div class="track-dot ${dotCls}"></div>
      ${i<stages.length-1?`<div class="track-line ${lineCls}"></div>`:''}
    </div>`;
  }).join('');

  return `
  <div class="process-card ${getProcessAlerts(p).length?'has-alert':''}" onclick="openProcessModal('${p.id}')">
    <button class="eye-btn" onclick="openProcessViewModal('${p.id}', event)" title="Visualizar processo">👁️</button>

      <h3>${p.produto || 'Sem descrição'}<span class="phase-mini">${info.label.replace(/^Fase \d+ · /,'')}</span></h3>

      <div class="process-meta">${fornecedorNameHtml(fornecedor)} · ${originModalMeta(p)}</div>
      <div class="process-track">${trackHtml}</div>
      <div class="progress-pct">${Math.round(processProgressRatio(p)*100)}% concluído</div>
      ${note?`<div class="step-note">${note}</div>`:''}
      ${renderAlertBanner(p)}
    </div>
    <div class="process-side">
      <div class="process-value">${fmtBRL(costs.total)}</div>
      <div class="process-eta">Chegada: ${fmtDate(p.chegadaPrevista)}</div>

async function savePartner(id){
  if(!requireEditPermission()) return;
  const empresa = document.getElementById('pt-empresa').value.trim();
  if(!empresa){ alert('Informe o nome da empresa.'); return; }
  const data = {
    id,
    tipo: document.getElementById('pt-tipo').value,
    empresa,
    contato: document.getElementById('pt-contato').value.trim(),
    phone: document.getElementById('pt-phone').value.trim(),
    email: document.getElementById('pt-email').value.trim(),
    notes: document.getElementById('pt-notes').value.trim(),
  };
  const idx = state.partners.findIndex(p=>p.id===id);
  if(idx>=0) state.partners[idx]=data; else state.partners.push(data);
  await persistState();
  closeModal();
  render();
}

async function deletePartner(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este parceiro?')) return;
  state.partners = state.partners.filter(p=>p.id!==id);
  await persistState();
  closeModal();
  render();
}

function renderExtraFieldInput(f, p){
  const val = (p.extra && p.extra[f.key]) || '';
  if(f.type==='readonly'){
    const v = (p[f.sourceKey]!==undefined && p[f.sourceKey]!=='') ? p[f.sourceKey] : '—';
    return `<div class="mini-field"><label>${f.label}</label><div style="padding:6px 8px;font-size:12px;background:#fff;border:1px solid var(--border-strong);border-radius:5px;">${v}</div></div>`;
  }
  if(f.type==='select'){
    const preview = f.key==='canalDesembaraco' && val ? `<div style="margin-top:5px;">${canalBadgeHtml(val)}</div>` : '';
    return `<div class="mini-field"><label>${f.label}</label><select onchange="updateExtraField('${f.key}', this.value)">
      <option value="">—</option>
      ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select>${preview}</div>`;
  }
  if(f.type==='partner'){
    const options = state.partners.filter(pt=>pt.tipo===f.partnerType).map(pt=>pt.empresa);
    return `<div class="mini-field"><label>${f.label}</label><select onchange="updateExtraField('${f.key}', this.value)">
      <option value="">—</option>
      ${options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select></div>`;
  }
  const type = f.type||'text';
  return `<div class="mini-field"><label>${f.label}</label><input type="${type}" value="${val}" oninput="updateExtraField('${f.key}', this.value)"></div>`;
}
function renderContainersTable(p){
  const qty = parseInt(p.containersQty)||0;
  if(qty<=0){
    return `<div class="form-hint" style="margin-top:6px;">Defina a quantidade de containers na Visão Geral para preencher os números aqui.</div>`;
  }
  const list = p.extra.containersList || [];
  let rows = '';
  for(let i=0;i<qty;i++){
    const c = list[i] || {container:'', lacre:''};
    rows += `<div class="container-row">
      <span class="container-idx">#${i+1}</span>
      <input type="text" placeholder="Número do container" value="${c.container||''}" oninput="updateContainerField(${i},'container',this.value)">

  return `<div class="containers-table"><label style="display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px;">Containers e Lacres</label>${rows}</div>`;

function updateContainerField(idx, field, value){

  const p = window.__editingProcess;

function updateExtraField(key, val){

function updatePaymentValue(key, val){

function togglePaymentCheck(key){

function changeProcessType(tipo){
  window.__editingProcess.tipo = tipo;
  initProcessData(window.__editingProcess);
  window.__editingProcess.status = recomputeStatus(window.__editingProcess);
  window.__openStage = window.__editingProcess.status;
  document.querySelectorAll('.type-toggle button').forEach(b=>{
    b.classList.toggle('active', (tipo==='definitiva' && b.textContent.includes('Definitiva')) || (tipo==='temporaria' && b.textContent.includes('Temporária')));

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

function renderEtapasTab(){
  const p = window.__editingProcess;
  const stages = getStagesForProcess(p);
  const currentKey = recomputeStatus(p);
  p.status = currentKey;

  const html = stages.map((s,i)=>{
    const isPayments = s.type==='payments';
    const doneCount = isPayments
      ? s.items.filter(it=>(p.payments[it.key]||{}).checked).length
      : (p.checklist[s.key]||[]).filter(Boolean).length;
    const total = s.items.length;
    const isDone = doneCount===total;
    const isCurrent = s.key===currentKey;
    const stateCls = isDone ? 'done' : (isCurrent ? 'current' : '');
    const isOpen = window.__openStage === s.key;

    let bodyHtml = '';
    if(isPayments){
      bodyHtml = s.items.map(it=>{
        const rec = p.payments[it.key] || {checked:false, valor:''};
        const label = (it.key==='dta' && p.extra && p.extra.transportadoraDTA) ? `${it.label} (${p.extra.transportadoraDTA})` : it.label;
        return `<div class="payment-row ${rec.checked?'checked':''}">
          <div class="doc-check" style="cursor:pointer;" onclick="togglePaymentCheck('${it.key}')">${rec.checked?'✓':''}</div>
          <div class="payment-label" onclick="togglePaymentCheck('${it.key}')">${label}</div>
          <input type="number" step="0.01" class="payment-value" placeholder="Valor pago (R$)" value="${rec.valor||''}" oninput="updatePaymentValue('${it.key}', this.value)">
        </div>`;
      }).join('');
    } else {
      const checked = p.checklist[s.key] || [];
      bodyHtml = s.items.map((label,idx)=>{
        let row = `<div class="doc-item ${checked[idx]?'checked':''}" onclick="toggleStageItem('${s.key}',${idx})">
          <div class="doc-check">${checked[idx]?'✓':''}</div><span>${label}</span>
        </div>`;
        if(s.itemFields && s.itemFields[idx]){
          row += `<div class="item-fields">${s.itemFields[idx].map(f=>renderExtraFieldInput(f,p)).join('')}${s.containersItemIndex===idx?renderContainersTable(p):''}</div>`;
        } else if(s.containersItemIndex===idx){
          row += `<div class="item-fields">${renderContainersTable(p)}</div>`;
        }
        return row;
      }).join('');
      if(s.extraFields){
        bodyHtml += `<div class="stage-extra">${s.extraFields.map(f=>renderExtraFieldInput(f,p)).join('')}</div>`;
      }
    }

    return `
    <div class="stage-block ${stateCls}">
      <div class="stage-header" onclick="toggleStageOpen('${s.key}')">
        <div class="stage-num">${isDone?'✓':(i+1)}</div>
        <div class="stage-title">${s.label}</div>
        <div class="stage-progress">${doneCount}/${total}</div>
      </div>
      <div class="stage-body" style="display:${isOpen?'flex':'none'}">
        ${bodyHtml}
      </div>
    </div>`;
  }).join('');

  document.getElementById('etapas-container').innerHTML = html;

  const stampEl = document.getElementById('geral-status-stamp');
  if(stampEl){
    const info = stageInfoFor(p, currentKey);
    stampEl.className = `stamp ${info.cls}`;
    stampEl.textContent = info.label;
  }
}

function toggleStageOpen(key){
  window.__openStage = (window.__openStage===key) ? null : key;
  renderEtapasTab();
}

function collectProcessFormData(){
  const docs = {};
  document.querySelectorAll('#tab-docs .doc-item').forEach(el=>{
    const name = el.querySelector('span').textContent;
    docs[name] = el.classList.contains('checked');
  });
  const status = recomputeStatus(window.__editingProcess);
  return {
    id: window.__editingProcess.id,
    tipo: window.__editingProcess.tipo || 'definitiva',
    status: status,
    checklist: window.__editingProcess.checklist,
    payments: window.__editingProcess.payments,
    extra: window.__editingProcess.extra,

    chegadaPrevista: document.getElementById('f-chegada').value,

    containersQty: document.getElementById('f-containers').value,
    temperaturaControlada: !!window.__editingProcess.temperaturaControlada,
    temperaturaValor: document.getElementById('f-temperatura').value,
    temperaturaOutro: document.getElementById('f-temperatura-outro').value,
    obs: document.getElementById('f-obs').value,
    docs: docs,
    ...collectCostFields()
  };
}

async function saveProcess(){
  if(!requireEditPermission()) return;
  const data = collectProcessFormData();
  if(!data.produto){
    alert('Informe ao menos o nome do produto.');
    switchTab('geral');
    return;
  }
  const idx = state.processes.findIndex(p=>p.id===data.id);
  const prev = idx>=0 ? state.processes[idx] : null;
  const newKey = currentPendingKey(data);
  if(prev && prev.pendingKey===newKey){
    data.pendingSince = prev.pendingSince || todayStr();
  } else {
    data.pendingSince = todayStr();
  }
  data.pendingKey = newKey;
  if(idx>=0) state.processes[idx] = data; else state.processes.push(data);
  await persistState();
  closeModal();
  render();
}

async function deleteProcess(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este processo permanentemente?')) return;
  state.processes = state.processes.filter(p=>p.id!==id);
  await persistState();
  closeModal();
  render();
}

function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.remove();
  window.__editingProcess = null;
}

/* ---------- GERAÇÃO DE CAPA (PDF via impressão) ---------- */
function capaItem(checked, label){
  return `<div class="capa-item"><span class="capa-check">${checked?'&#10003;':''}</span><span>${label}</span></div>`;
}

function generateCapaPDF(){
  const data = collectProcessFormData();
  const fornecedor = state.suppliers.find(s=>s.id===data.supplierId);
  const stages = getStagesForProcess(data);
  const costs = computeCosts(data);
  const extra = data.extra || {};
  const destino = data.modal==='aereo' ? 'Aeroporto de Confins' : 'Porto Seco de Betim';
  const refDisplay = data.ref || ('REF-'+data.id.slice(0,6).toUpperCase());
  const statusLabel = stageInfoFor(data, data.status).label;

  const etapasHtml = stages.map(s=>{
    if(s.type==='payments'){
      return s.items.map(it=>{
        const rec = (data.payments && data.payments[it.key]) || {checked:false, valor:''};
        const v = parseFloat(rec.valor)||0;
        return capaItem(rec.checked, it.label + (v?` — ${fmtBRL(v)}`:''));
      }).join('');
    }
    const checked = data.checklist[s.key]||[];
    return s.items.map((label,idx)=>capaItem(checked[idx], label)).join('');
  }).join('');

  const docsHtml = DOC_TYPES.map(d=>capaItem(data.docs && data.docs[d], d)).join('');

  const field = (label, value)=>`<div class="f"><div class="l">${label}</div><div class="v">${value || '—'}</div></div>`;

  const html = `<!DOCTYPE html>

.capa-check{display:inline-block;width:12px;height:12px;border:1.4px solid var(--bar);text-align:center;line-height:11px;font-size:8px;color:var(--bar);flex-shrink:0;}
.obs-box{background:var(--fill);border-radius:4px;padding:8px 10px;margin-top:8px;font-size:9.5pt;min-height:30px; break-inside:avoid; page-break-inside:avoid;}
.foot{text-align:center;font-size:7.5pt;color:#8a93a8;margin-top:18px;padding-top:8px;border-top:1px solid #d5dcec;}
@media print{

</style></head>
<body>
<div class="sheet">
  <div class="head">

  </div>

  <div class="row">
    ${field('Data de Abertura', fmtDate(data.dataPedido))}

  <div class="sec-bar">2. Dados da Importação</div>
  <div class="row">
    ${field('DI / DUIMP', extra.numeroDUIMP)}

    ${field('Incoterm', data.incoterm)}
    ${field('Regime Fiscal', data.regime)}
  </div>
  <div class="row">
    ${field('Controle de Temperatura', data.temperaturaControlada ? (data.temperaturaValor==='outro' ? data.temperaturaOutro : (data.temperaturaValor||'Sim')) : 'Não')}
  </div>
  <div class="row">
    ${field('Origem', data.origemPais)}
    ${field('Destino', destino)}
    ${field('Moeda', 'USD')}
    ${field('Câmbio', data.cambio)}
  </div>
  <div class="row">
    ${field('Agente de Cargas', extra.agenteCarga)}
    ${field('Despachante', extra.despachante)}
    ${field('Transportadora (DTA)', extra.transportadoraDTA)}

  <div class="row">
    ${field('Número do BL', extra.numeroBL)}

/* ---------- SUPPLIER MODAL ---------- */
function openSupplierModal(id){
  const existing = id ? state.suppliers.find(s=>s.id===id) : null;
  const s = existing || {id:uid()};
  window.__editingSupplierCountries = (s.countries||[]).slice();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h2>${existing?'Editar Fornecedor':'Novo Fornecedor'}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>Nome</label><input id="s-name" value="${s.name||''}" placeholder="Ex: Morita ou Carestream"></div>
        <div class="form-group">
          <label>Países de Origem</label>
          <div class="country-checks">
            ${COUNTRY_OPTIONS.map(c=>`<div class="country-chip ${window.__editingSupplierCountries.includes(c)?'checked':''}" id="chip-${c}" onclick="toggleSupplierCountry('${c}')">${c}</div>`).join('')}
          </div>
          <div class="form-hint">Ex: Morita normalmente só Japão; Carestream pode sair de EUA, Holanda, Bélgica ou China.</div>
        </div>
        <div class="form-group"><label>Contato (e-mail / telefone)</label><input id="s-contact" value="${s.contact||''}"></div>
        <div class="form-group">
          <label>Modalidades de Pagamento Aceitas</label>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-adiantado" ${s.modalidades && s.modalidades.adiantado ? 'checked':''}> Adiantado</label>
          </div>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-aprazo" onchange="toggleModalidadeDias('aprazo', this.checked)" ${s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.checked ? 'checked':''}> A prazo</label>
            <div class="modalidade-dias" id="wrap-aprazo" style="display:${s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.checked ? 'flex':'none'};">
              <input type="number" id="s-mod-aprazo-dias" value="${(s.modalidades && s.modalidades.aPrazo && s.modalidades.aPrazo.dias) || ''}" placeholder="dias">
              <span>dias após a fatura</span>
            </div>
          </div>
          <div class="modalidade-row">
            <label class="modalidade-check"><input type="checkbox" id="s-mod-factoring" onchange="toggleModalidadeDias('factoring', this.checked)" ${s.modalidades && s.modalidades.factoring && s.modalidades.factoring.checked ? 'checked':''}> Factoring</label>
            <div class="modalidade-dias" id="wrap-factoring" style="display:${s.modalidades && s.modalidades.factoring && s.modalidades.factoring.checked ? 'flex':'none'};">
              <input type="number" id="s-mod-factoring-dias" value="${(s.modalidades && s.modalidades.factoring && s.modalidades.factoring.dias) || ''}" placeholder="dias">
              <span>dias após a fatura (via banco)</span>
            </div>
          </div>
          <div class="form-hint">Marque quantas se aplicarem. O número de dias fica salvo para quando você precisar calcular a data de vencimento a partir da fatura.</div>
        </div>
        <div class="form-group"><label>Observações de Pagamento</label><input id="s-payment" value="${s.paymentTerms||''}" placeholder="Ex: condições específicas, banco, contato financeiro..."></div>
        <div class="form-group"><label>Observações Gerais</label><textarea id="s-notes">${s.notes||''}</textarea></div>
      </div>
      <div class="modal-footer">
        <div>${existing && currentRole!=='viewer' ?`<button class="btn btn-danger" onclick="deleteSupplier('${s.id}')">Excluir</button>`:'<span></span>'}</div>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="closeModal()">${currentRole==='viewer'?'Fechar':'Cancelar'}</button>
          ${currentRole!=='viewer' ? `<button class="btn btn-primary" onclick="saveSupplier('${s.id}')">Salvar Fornecedor</button>` : ''}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function toggleModalidadeDias(which, checked){
  document.getElementById('wrap-'+which).style.display = checked ? 'flex' : 'none';
}

function toggleSupplierCountry(c){
  const arr = window.__editingSupplierCountries;
  const i = arr.indexOf(c);
  if(i>=0) arr.splice(i,1); else arr.push(c);
  document.getElementById('chip-'+c).classList.toggle('checked');
}

async function saveSupplier(id){
  if(!requireEditPermission()) return;
  const name = document.getElementById('s-name').value.trim();
  if(!name){ alert('Informe o nome do fornecedor.'); return; }
  const data = {
    id,
    name,
    countries: (window.__editingSupplierCountries||[]).slice(),
    contact: document.getElementById('s-contact').value.trim(),
    modalidades: {
      adiantado: document.getElementById('s-mod-adiantado').checked,
      aPrazo: { checked: document.getElementById('s-mod-aprazo').checked, dias: document.getElementById('s-mod-aprazo-dias').value },
      factoring: { checked: document.getElementById('s-mod-factoring').checked, dias: document.getElementById('s-mod-factoring-dias').value },
    },
    paymentTerms: document.getElementById('s-payment').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
  };
  const idx = state.suppliers.findIndex(s=>s.id===id);
  if(idx>=0) state.suppliers[idx]=data; else state.suppliers.push(data);
  await persistState();
  closeModal();
  render();
}

async function deleteSupplier(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este fornecedor? Processos vinculados manterão a referência vazia.')) return;
  state.suppliers = state.suppliers.filter(s=>s.id!==id);
  state.processes.forEach(p=>{ if(p.supplierId===id) p.supplierId=''; });
  await persistState();
  closeModal();
  render();
}

applyStoredTheme();
