  return { labels, rules: cfg.rules || [] };
}

function bucketLabel(id, cfg){
  cfg = cfg || getDashboardConfig();
  if(String(id).indexOf('custom:')===0){
    const rid = id.slice(7);
    const r = (cfg.rules||[]).find(x=>x.id===rid);
    return r ? `${r.icon?r.icon+' ':''}${r.label}` : id;
  }
  const l = cfg.labels[id];
  return l ? `${l.icon?l.icon+' ':''}${l.label}` : id;
}

function getBucket(p){
  if(isProcessDone(p)) return 'finalizados';
  const cfg = getDashboardConfig();
  const rule = (cfg.rules||[]).find(r=>r.stageKey===p.status);
  if(rule) return 'custom:'+rule.id;
  if(p.tipo==='temporaria') return 'producao';

  const stages = getStagesForProcess(p);
  const fase6 = stages.find(s=>s.key==='fase6');
  const fase7 = stages.find(s=>s.key==='fase7');
  const chegou = fase6 ? !!(p.checklist['fase6']||[])[fase6.arrivalItemIndex] : false;
  const recebido = fase7 ? !!(p.checklist['fase7']||[])[fase7.receiptItemIndex] : false;

  /* Entregue e Em Desembaraço dependem do marco físico real (chegada / recebimento em
     estoque), não da posição abstrata da etapa. Isso evita que marcar um item qualquer
     lá na frente (ex: um pagamento da Fase 8) jogue o processo pra Entregue sem a
     remoção ter de fato acontecido. */
  if(recebido) return 'entregue';
  if(chegou) return 'desembaraco';

  const idx = stages.findIndex(s=>s.key===p.status);
  const fase4Idx = stages.findIndex(s=>s.key==='fase4');
  if(idx<=fase4Idx){
    if(p.prontidao && daysBetween(todayStr(), p.prontidao) <= 0) return 'aguardando_embarque';
    return 'producao';
  }
  const diasParaEmbarque = p.dataEmbarqueReal ? daysBetween(todayStr(), p.dataEmbarqueReal) : null;
  if(diasParaEmbarque===null || diasParaEmbarque>0) return 'aguardando_embarque';
  return 'transito';
}

function currentStepLabel(p){
  const stages = getStagesForProcess(p);
  /* Procura o item pendente mais antigo em toda a jornada, não só dentro da fase
     "atual" — já que a fase atual pode estar mais adiante por causa de um marco
     físico (ex: já chegou), enquanto um item de uma fase anterior (ex: DDR) ainda
     está pendente. */
  for(const stage of stages){
    if(stage.type==='payments'){
      const pend = stage.items.find(it=> !(p.payments[it.key]||{}).checked);
      if(pend) return `Pendente: ${pend.label}`;
    } else {
      const checked = p.checklist[stage.key]||[];
      const idx = stage.items.findIndex((_,i)=>!checked[i]);
      if(idx>=0) return `Pendente: ${stage.items[idx]}`;
    }
  }
  return 'Concluído';
}

function computeCosts(p){
  const fob = parseFloat(p.fob)||0;
  const frete = parseFloat(p.frete)||0;
  const seguro = parseFloat(p.seguro)||0;
  const cambio = parseFloat(p.cambio)||0;
  const cifUsd = fob + frete + seguro;
  const cifBrl = cifUsd * cambio;
  const fobBrl = fob * cambio;
  const seguroBrl = seguro * cambio;
  const ii = parseFloat(p.ii)||0;
  const ipi = parseFloat(p.ipi)||0;
  const pis = parseFloat(p.pis)||0;
  const cofins = parseFloat(p.cofins)||0;
  /* RET-MG (regime "revenda") substitui o recolhimento do ICMS na entrada — o campo não
     deve compor o custo enquanto esse regime estiver selecionado. */
  const icmsAplicavel = p.regime !== 'revenda';
  const icms = icmsAplicavel ? (parseFloat(p.icms)||0) : 0;
  const despesas = parseFloat(p.despesas)||0;
  const taxaSiscomex = parseFloat(p.taxaSiscomex)||0;
  const paymentsTotal = p.payments ? Object.values(p.payments).reduce((s,r)=>s+(parseFloat(r.valor)||0),0) : 0;
  /* Total NÃO soma o frete do campo acima (que é só referência para o CIF) — o frete
     de verdade é o valor pago marcado na Fase 8, já incluído em paymentsTotal. */
  const total = fobBrl + seguroBrl + ii + ipi + pis + cofins + icms + despesas + taxaSiscomex + paymentsTotal;
  return {cifUsd, cifBrl, fobBrl, seguroBrl, ii, ipi, pis, cofins, icms, icmsAplicavel, despesas, taxaSiscomex, paymentsTotal, total};
}

/* =====================================================================================
   PROVISIONAMENTO — Etapa 1
   Estima previamente os valores a gastar numa importação, por tipo de despesa, e permite
   registrar a data prevista de pagamento. Os valores calculados (impostos, armazenagem)
   NUNCA são digitados — são sempre recalculados a partir dos dados do processo (itens,
   NCM/alíquotas, câmbio, containers). Só honorários do despachante é valor manual.
   Campos novos ficam em p.extra (mesma estrutura schemaless já usada em todo o processo,
   sem criar um objeto/tabela paralela) — assim continuam sujeitos ao mesmo padrão de
   snapshot/edição do resto do app.
   ===================================================================================== */

/* Valor Aduaneiro total e por item (USD e BRL). Reaproveita p.cambio (mesmo câmbio da aba
   Custos — não existe uma segunda lógica de conversão aqui) e o valor de Seguro já
   informado na aba Custos (p.seguro, em USD, igual ao resto do cálculo de CIF do processo).
   Frete Internacional é o único valor novo, específico do Provisionamento. O rateio de
   frete/seguro entre os itens é proporcional ao valor FOB de cada item — é a forma padrão
   de ratear despesas de transporte entre itens com valores diferentes numa mesma carga. */
function computeValorAduaneiroBreakdown(p){
  const itens = p.itens || [];
  /* Câmbio e Seguro vivem na aba Custos e só são gravados em p.cambio/p.seguro no Salvar
     Processo — para o Provisionamento reagir em tempo real (mesmo com a aba Custos oculta,
     já que todas as abas do modal ficam no DOM ao mesmo tempo), lemos o valor ao vivo dos
     inputs quando eles existem, com fallback pro valor já salvo no processo. */
  const cambioEl = document.getElementById('c-cambio');
  const seguroEl = document.getElementById('c-seguro');
  const cambio = cambioEl ? (parseFloat(cambioEl.value)||0) : (parseFloat(p.cambio)||0);
  const seguroUsd = seguroEl ? parseBRMasked(seguroEl.value) : (parseFloat(p.seguro)||0);
  /* Frete Internacional pode ser informado em US$ ou R$ (alguns fornecedores cobram frete
     direto em reais) — internamente tudo é somado em USD, então um valor em R$ é convertido
     pra "USD equivalente" dividindo pelo câmbio; no final o Valor Aduaneiro inteiro volta a
     ser convertido pra BRL multiplicando pelo mesmo câmbio, então o resultado em BRL fica
     matematicamente correto nos dois casos (é só um passo intermediário de cálculo). */
  const freteValorInformado = parseFloat((p.extra||{}).provFreteInternacionalUsd)||0;
  const freteMoeda = (p.extra||{}).provFreteMoeda || 'USD';
  const freteUsd = freteMoeda==='BRL' ? (cambio>0 ? freteValorInformado/cambio : 0) : freteValorInformado;
  /* Acréscimos do despachante (ex: taxas/ajustes que ele soma antes de calcular impostos) —
     entram no Valor Aduaneiro exatamente como frete/seguro, ratados por item da mesma forma.
     Também aceita US$ ou R$ (mesma conversão "USD equivalente" usada no Frete acima). */
  const acrescimosValorInformado = parseFloat((p.extra||{}).provAcrescimosUsd)||0;
  const acrescimosMoeda = (p.extra||{}).provAcrescimosMoeda || 'USD';
  const acrescimosUsd = acrescimosMoeda==='BRL' ? (cambio>0 ? acrescimosValorInformado/cambio : 0) : acrescimosValorInformado;

  const itensComFob = itens.map(it=>{
    const fobItemUsd = (parseFloat(it.valorUnitarioUsado)||0) * (parseFloat(it.quantidade)||0);
    return {it, fobItemUsd};
  });
  const fobTotalUsd = itensComFob.reduce((s,x)=>s+x.fobItemUsd, 0);

  const itensComVA = itensComFob.map(({it, fobItemUsd})=>{
    const proporcao = fobTotalUsd>0 ? (fobItemUsd/fobTotalUsd) : (itens.length? 1/itens.length : 0);
    const freteItemUsd = freteUsd * proporcao;
    const seguroItemUsd = seguroUsd * proporcao;
    const acrescimosItemUsd = acrescimosUsd * proporcao;
    const vaItemUsd = fobItemUsd + freteItemUsd + seguroItemUsd + acrescimosItemUsd;
    const vaItemBrl = vaItemUsd * cambio;
    return {it, fobItemUsd, freteItemUsd, seguroItemUsd, acrescimosItemUsd, vaItemUsd, vaItemBrl, proporcao};
  });

  const vaTotalUsd = fobTotalUsd + freteUsd + seguroUsd + acrescimosUsd;
  const vaTotalBrl = vaTotalUsd * cambio;

  return { cambio, freteUsd, seguroUsd, acrescimosUsd, fobTotalUsd, vaTotalUsd, vaTotalBrl, itens: itensComVA };
}

/* Impostos federais da importação (II + IPI + PIS + COFINS), calculados item a item —
   NUNCA uma alíquota única sobre o valor total, já que cada item pode ter NCM diferente.
   Fórmula padrão de importação (reutilizada, não inventada):
     Valor Aduaneiro (VA) = FOB do item + frete rateado + seguro rateado, convertido em BRL
     II     = VA × alíquota II
     IPI    = (VA + II) × alíquota IPI   (IPI incide sobre o valor aduaneiro já acrescido do II)
     PIS    = VA × alíquota PIS
     COFINS = VA × alíquota COFINS
   ICMS fica FORA desse total: é imposto estadual, tratado à parte na aba Custos (inclusive
   com a regra de RET-MG já existente) e não costuma compor o "imposto do despachante".
   As alíquotas vêm da aba NCM (reaproveita getEffectiveAliquotas/findNCMEntry — os mesmos
   usados no Banco de Itens), então ficam sempre atualizadas: mudou lá, muda aqui também. */
function computeImpostosImportacao(p){
  const va = computeValorAduaneiroBreakdown(p);
  let totalII=0, totalIPI=0, totalPIS=0, totalCOFINS=0;
  const itensSemAliquota = [];
  const detalhe = va.itens.map(({it, vaItemBrl})=>{
    const al = getEffectiveAliquotas(it);
    const faltando = [];
    if(!al.ncmEncontrado) faltando.push('NCM não cadastrado na aba NCM');
    else{
      if(al.ii===null) faltando.push('II');
      if(al.ipi===null) faltando.push('IPI');
      if(al.pis===null) faltando.push('PIS');
      if(al.cofins===null) faltando.push('COFINS');
    }
    const iiItem = (al.ii||0)/100 * vaItemBrl;
    const ipiItem = (al.ipi||0)/100 * (vaItemBrl + iiItem);
    const pisItem = (al.pis||0)/100 * vaItemBrl;
    const cofinsItem = (al.cofins||0)/100 * vaItemBrl;
    totalII+=iiItem; totalIPI+=ipiItem; totalPIS+=pisItem; totalCOFINS+=cofinsItem;
    if(faltando.length) itensSemAliquota.push({pn: it.pn, faltando});
    return { pn: it.pn, descricao: it.descricao, ncm: it.ncm, vaItemBrl, iiItem, ipiItem, pisItem, cofinsItem, faltando };
  });
  const total = totalII+totalIPI+totalPIS+totalCOFINS;
  return { total, totalII, totalIPI, totalPIS, totalCOFINS, detalhe, itensSemAliquota, va, temItens: va.itens.length>0 };
}

/* Regras de armazenagem por recinto de Zona Primária. Cada recinto tem sua própria função
   de cálculo — adicionar um novo recinto no futuro é só acrescentar uma entrada aqui, sem
   mexer no resto do Provisionamento (é o "Exemplo conceitual" pedido: Recinto → Regra). */
const ARMAZENAGEM_ZONA_PRIMARIA_RULES = {
  movecta: {
    label: 'Movecta',
    /* Composição por container, reconstruída a partir de 3 demonstrativos reais de
       faturamento:
         FA-00001997-26 (28/04/2026, 2 containers)
         FA-00004599-26 (01/06/2026, 1 container)
         FA-00010750-26 (14/08/2026, 2 containers)
       O 3º demonstrativo confirmou por escrito a fórmula do mínimo ("Mínimo de R$1.732,64
       X Per. 15 dias") — o mínimo é só da linha Armazenagem (o Seguro é calculado à parte,
       sem piso) e escala com o número de períodos, não é um valor fixo único.
       Também revelou que TODOS os valores fixos (carregamento, movimentação, pedágio,
       remoção) e até a alíquota do Seguro mudaram entre os 3 documentos — não são
       constantes eternas, parecem sofrer reajuste periódico. Por isso cada um está marcado
       como 'referência' (não 'confirmado'): uso sempre o valor do demonstrativo mais
       recente, mas vale reconferir de tempos em tempos com novos demonstrativos.
       "Taxa Operador Portuário BTP" apareceu nos 2 demonstrativos de 2 containers e faltou
       no de 1 container — pode ter relação com múltiplos containers, mas 3 exemplos ainda
       não é suficiente pra eu confiar nisso, então fica de fora (ver aviso na interface).
       Monitoramento de energia p/ container reefer também fica de fora (cobrança à parte,
       condicional a carga refrigerada, confirmado pelo usuário que às vezes é cobrada por
       engano mesmo sem necessidade — não deve compor a regra padrão de armazenagem).
       Verificação: reconstrói o total do demonstrativo de 2 containers de agosto
       (R$17.188,74 − BTP − energia reefer = R$10.563,18 = 2 × R$5.281,59) exatamente. */
    componentes(vaTotalBrl, periodos){
      const armazenagemCalculado = 0.0020 * periodos * vaTotalBrl; // 0,20% por período de 15 dias
      const minimoArmazenagem = 1732.64 * periodos;                 // mínimo escala com o nº de períodos
      const armazenagemCobrado = Math.max(armazenagemCalculado, minimoArmazenagem);
      return [
        { chave:'armazenagem', label:'Armazenagem', valor: armazenagemCobrado, confianca:'formula',
          detalhe:'0,20% por período de 15 dias sobre o Valor Aduaneiro, com mínimo de R$1.732,64 por período — fórmula e mínimo confirmados por escrito no demonstrativo de 14/08/2026',
          calculado: armazenagemCalculado, minimoAplicado: armazenagemCobrado > armazenagemCalculado },
        { chave:'seguro', label:'Seguro de armazenagem', valor: 0.00067 * vaTotalBrl, confianca:'formula',
          detalhe:'0,067% sobre o Valor Aduaneiro (era 0,06% até junho/2026 — alíquota reajustada; usando a mais recente)' },
        { chave:'carregamento', label:'Carregamento de CNTR cheio', valor: 599.20, confianca:'referencia', detalhe:'Valor do demonstrativo mais recente (14/08/2026) — já foi R$535,00 em documentos anteriores (abr/jun de 2026)' },
        { chave:'movimentacao', label:'Movimentação interna', valor: 1475.88, confianca:'referencia', detalhe:'Valor do demonstrativo mais recente (14/08/2026) — variou entre R$1.255,00 e R$1.317,75 em documentos anteriores, sem variável visível que explique a diferença' },
        { chave:'pedagio', label:'Pedágio até 25t', valor: 96.00, confianca:'referencia', detalhe:'Valor do demonstrativo mais recente (14/08/2026) — era R$91,50 em abril/2026; ausente no demonstrativo de 1 container' },
        { chave:'remocaoCostado', label:'Remoção Costado [Santos]', valor: 1252.44, confianca:'referencia', detalhe:'Valor do demonstrativo mais recente (14/08/2026) — era R$1.065,00 em abril/2026; ausente no demonstrativo de 1 container' },
      ];
    },
    calcular(vaTotalBrl, containersQty, periodoDias){
      const periodos = Math.max(1, Math.ceil((parseFloat(periodoDias)||0) / 15));
      const componentes = this.componentes(vaTotalBrl, periodos);
      const porContainer = componentes.reduce((s,c)=>s+c.valor, 0);
      const minimoAplicado = componentes[0].minimoAplicado;
      const nContainers = Math.max(1, parseInt(containersQty)||1);
      return { total: porContainer*nContainers, porContainer, minimoAplicado, valorMinimo: 1732.64*periodos, componentes, periodos, nContainers };
    }
  }
};
function normalizeRecintoKey(nome){ return String(nome||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
function getArmazenagemRule(recintoNome){ return ARMAZENAGEM_ZONA_PRIMARIA_RULES[normalizeRecintoKey(recintoNome)] || null; }

function computeArmazenagemZonaPrimaria(p){
  if(p.modal==='aereo') return { status:'nao_aplicavel' };
  const recintoNome = ((p.extra||{}).recintoZonaPrimaria||'').trim();
  if(!recintoNome) return { status:'sem_recinto' };
  const regra = getArmazenagemRule(recintoNome);
  if(!regra) return { status:'sem_regra', recintoNome };
  const va = computeValorAduaneiroBreakdown(p);
  /* O Provisionamento é feito ANTES do embarque, quando ainda não se sabe quantos dias a
     carga vai ficar na Zona Primária de fato — por isso a estimativa sempre considera
     apenas o 1º período (15 dias), sem pedir esse dado manualmente. */
  const calc = regra.calcular(va.vaTotalBrl, p.containersQty, 15);
  return { status:'ok', recintoNome, regraLabel: regra.label, vaTotalBrl: va.vaTotalBrl, ...calc };
}

/* Armazenagem — Zona Secundária. Mesmo padrão em registry por recinto da Zona Primária —
   o recinto usado é sempre o que já está preenchido na etapa (Fase 6 · "Recinto de
   Desembaraço", campo recintoAlfandegado), nunca fixo/hardcoded. */
const ARMAZENAGEM_ZONA_SECUNDARIA_RULES = {
  tora: {
    label: 'Tora',
    /* Fonte: proposta comercial vigente da Tora (LOG.865-25, 09/08/2025), tabela "ESTRUTURA
       DE PREÇO — ARMAZÉM ALFANDEGADO", item 1.1 (Importação Comum — carga em container).
       Confiança ALTA: além de ser a tabela oficial publicada pelo próprio recinto, bate ao
       centavo com uma NFS-e real (00000011768) assim que aplicado o adicional de câmara
       fria de 40% (aquela carga era refrigerada) — as duas cobranças (armazenagem e
       seguro) fecharam exatas, sem diferença de 1 centavo sequer.
       Armazenagem: 0,22% sobre o Valor Aduaneiro (CIF), fixo para o 1º período de 10 dias.
       Seguro: 0,05% sobre o Valor Aduaneiro + II (não só CIF — reaproveita o II já calculado
       em "Impostos da Importação" do Provisionamento, sem duplicar o cálculo).
       Câmara fria (+40% sobre armazenagem+seguro): aplicado automaticamente quando o
       processo está marcado como carga com temperatura controlada.
       Movimentação: valor oficial por tamanho de container (item 4 da tabela) — só entra no
       cálculo se o processo (ou o Produto Mestre aplicado) já tiver o tamanho preenchido;
       sem isso, mostra um aviso em vez de chutar um tamanho.
       Despesas Acessórias: valor APROXIMADO (não fórmula exata) que junta as tarifas fixas
       da tabela que tendem a se repetir em qualquer operação — Pesagem (R$38,00/container),
       Lacre (R$9,88, assumindo 1 por container), Varredura (R$53,21/container) e
       Movimentação de Container (R$167,23/operação, cobre carregamento/remoção final) — mais
       Dimensionamento de carga (R$76,01, uma vez por processo). Não inclui pesagem/carga de
       volumes fora de container, embalagem, retenção, ou qualquer coisa "sob consulta" na
       tabela — é só uma referência pra não deixar essas despesas de fora do provisionamento,
       não substitui o fechamento real da nota.
       Faturamento mínimo: R$672,00 por processo (não por container, diferente da Movecta).
       Não incluído ainda: carregamento fora do container (carga solta/paletizada) e o
       acréscimo por carga perigosa (classificação ONU) — nenhum desses tem o dado de
       entrada necessário no Provisionamento ainda. */
    getMovimentacaoRatePorContainer(containerTamanho){
      if(!containerTamanho) return null;
      // "Contêiner 40' ou veículo grande" cobre 40'/40' HC/45' HC; "20' ou veículo médio" é só o 20'.
      return containerTamanho.startsWith('20') ? 332.95 : 487.32;
    },
    componentes(vaTotalBrl, iiTotalBrl, temperaturaControlada, containerTamanho, containersQty){
      const fatorCamaraFria = temperaturaControlada ? 1.40 : 1;
      const armazenagemBase = 0.0022 * vaTotalBrl;
      const seguroBase = 0.0005 * (vaTotalBrl + iiTotalBrl);
      const lista = [
        { chave:'armazenagem', label:'Armazenagem (1º período, 10 dias)', valor: armazenagemBase * fatorCamaraFria, confianca:'alta',
          detalhe:'0,22% sobre o Valor Aduaneiro — tabela oficial da Tora (proposta LOG.865-25)' + (temperaturaControlada ? ' + 40% de adicional por câmara fria' : '') },
        { chave:'seguro', label:'Seguro de armazenagem', valor: seguroBase * fatorCamaraFria, confianca:'alta',
          detalhe:'0,05% sobre o Valor Aduaneiro + II — tabela oficial da Tora (proposta LOG.865-25)' + (temperaturaControlada ? ' + 40% de adicional por câmara fria' : '') },
      ];
      const rateMovimentacao = this.getMovimentacaoRatePorContainer(containerTamanho);
      const nContainers = Math.max(1, parseInt(containersQty)||1);
      if(rateMovimentacao!==null){
        lista.push({ chave:'movimentacao', label:`Movimentação (${nContainers} container${nContainers>1?'s':''} de ${containerTamanho})`, valor: rateMovimentacao * nContainers, confianca:'alta',
          detalhe:`R$${rateMovimentacao.toFixed(2)} por operação/container — tabela oficial da Tora (proposta LOG.865-25)` });
      }
      // Despesas acessórias: soma aproximada de tarifas fixas da tabela (pesagem, lacre,
      // varredura, movimentação de container) que tendem a acontecer em toda operação,
      // mais o dimensionamento de carga (uma vez por processo). Ver nota acima — é uma
      // referência pra não deixar de fora do provisionamento, não um fechamento exato.
      const PESAGEM = 38.00, LACRE = 9.88, VARREDURA = 53.21, MOV_CONTAINER = 167.23, DIMENSIONAMENTO = 76.01;
      const acessoriasPorContainer = PESAGEM + LACRE + VARREDURA + MOV_CONTAINER;
      const acessoriasTotal = acessoriasPorContainer * nContainers + DIMENSIONAMENTO;
      lista.push({ chave:'acessorias', label:`Despesas Acessórias (aprox., ${nContainers} container${nContainers>1?'s':''})`, valor: acessoriasTotal, confianca:'aproximado',
        detalhe:`Pesagem (R$${PESAGEM.toFixed(2)}) + Lacre (R$${LACRE.toFixed(2)}) + Varredura (R$${VARREDURA.toFixed(2)}) + Movimentação de Container (R$${MOV_CONTAINER.toFixed(2)}) por container, + Dimensionamento de carga (R$${DIMENSIONAMENTO.toFixed(2)}) uma vez por processo — valor APROXIMADO, não fórmula exata (tabela oficial da Tora, proposta LOG.865-25)` });
      return lista;
    },
    calcular(vaTotalBrl, iiTotalBrl, temperaturaControlada, containerTamanho, containersQty){
      const componentes = this.componentes(vaTotalBrl, iiTotalBrl, temperaturaControlada, containerTamanho, containersQty);
      const subtotal = componentes.reduce((s,c)=>s+c.valor, 0);
      const FATURAMENTO_MINIMO_POR_PROCESSO = 672.00;
      const total = Math.max(subtotal, FATURAMENTO_MINIMO_POR_PROCESSO);
      const minimoAplicado = total > subtotal;
      const semContainerTamanho = !containerTamanho;
      return { total, subtotal, minimoAplicado, valorMinimo: FATURAMENTO_MINIMO_POR_PROCESSO, componentes, semContainerTamanho };
    }
  }
};
function getRecintoZonaSecundaria(p){ return ((p.extra||{}).recintoAlfandegado||'').trim(); }
function getArmazenagemZSRule(recintoNome){ return ARMAZENAGEM_ZONA_SECUNDARIA_RULES[normalizeRecintoKey(recintoNome)] || null; }

function computeArmazenagemZonaSecundaria(p){
  if(p.modal==='aereo') return { status:'nao_aplicavel' };
  const recintoNome = getRecintoZonaSecundaria(p);
  if(!recintoNome) return { status:'sem_recinto' };
  const regra = getArmazenagemZSRule(recintoNome);
  if(!regra) return { status:'sem_regra', recintoNome };
  const va = computeValorAduaneiroBreakdown(p);
  /* Mesmo raciocínio da Zona Primária: provisionamento é feito antes do embarque, então
     sempre considera só o 1º período (10 dias, negociados fixos, conforme informado).
     Reaproveita o II já calculado em Impostos da Importação — não recalcula à parte. */
  const iiTotalBrl = computeImpostosImportacao(p).totalII;
  const calc = regra.calcular(va.vaTotalBrl, iiTotalBrl, !!p.temperaturaControlada, p.containerTamanho, p.containersQty);
  return { status:'ok', recintoNome, regraLabel: regra.label, vaTotalBrl: va.vaTotalBrl, ...calc };
}

/* Carregamento agora é feito por attachDataListener() após o login (ver script de autenticação acima) */

async function persistState(){
  if(!hasAnyEditAccess()){ return false; }
  updateSaveIndicator('Salvando...');
  try{
    /* Blindagem: o Firestore rejeita o documento INTEIRO se qualquer campo, em qualquer nível
       (mesmo dentro de um processo específico), estiver como "undefined" — e como todos os
       processos moram no mesmo documento, um único campo assim quebra o salvamento de TUDO
       silenciosamente. JSON.stringify+parse remove "undefined" de forma nativa e testada,
       então sanitiza o payload inteiro logo antes de gravar, protegendo contra esse cenário
       independente de onde o campo problemático tenha entrado. */
    const payload = JSON.parse(JSON.stringify({
      processes: state.processes,
      suppliers: state.suppliers,
      partners: state.partners,
      dashboardConfig: state.dashboardConfig || null,
      ncms: state.ncms || [],
      empresaConfig: state.empresaConfig || { nome:'', estoques:[] },
    }));
    await db.collection('comextrack').doc('data').set(payload);
    updateSaveIndicator('Dados salvos na nuvem ✓');
    return true;
  }catch(e){
    console.error('Erro ao salvar no Firestore', e);
    updateSaveIndicator('⚠ Falha ao salvar — clique em Salvar agora');
    return false;
  }
}
function updateSaveIndicator(text){
  const el = document.getElementById('save-indicator');
  if(el) el.textContent = text;
}
function manualSave(){ persistState(); }

function getNavOrder(){
  try{
    const saved = JSON.parse(localStorage.getItem('comextrack_nav_order')||'null');
    if(Array.isArray(saved) && saved.length){
      const byKey = {}; NAV_ITEMS.forEach(i=>byKey[i.key]=i);
      const ordered = saved.map(k=>byKey[k]).filter(Boolean);
      NAV_ITEMS.forEach(i=>{ if(!saved.includes(i.key)) ordered.push(i); });
      return ordered;
    }
  }catch(e){}
  return NAV_ITEMS.slice();
}
function saveNavOrder(items){
  try{ localStorage.setItem('comextrack_nav_order', JSON.stringify(items.map(i=>i.key))); }catch(e){}
}
function toggleNavReorderMode(){
  navReorderMode = !navReorderMode;
  render();
}
function moveNavItem(key, dir){
  const items = getNavOrder();
  const idx = items.findIndex(i=>i.key===key);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=items.length) return;
  [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
  saveNavOrder(items);
  render();
}
function renderNavHtml(){
  const items = getNavOrder().filter(i=> canView(i.key));
  const ncmAlertCount = getAllPendingNCMAlerts().length;
  const labelFor = (i)=> (i.key==='ncm' && ncmAlertCount) ? `${i.label} <span class="nav-alert-badge">${ncmAlertCount}</span>` : i.label;
  const body = items.map((i,idx)=>{
    if(navReorderMode){
      return `<div class="nav-item-reorder-row">
        <button class="nav-item ${currentView===i.key?'active':''}" style="flex:1;" onclick="setView('${i.key}')"><span class="dot"></span>${labelFor(i)}</button>
        <button class="nav-reorder-btn" onclick="moveNavItem('${i.key}',-1)" ${idx===0?'disabled':''}>↑</button>
        <button class="nav-reorder-btn" onclick="moveNavItem('${i.key}',1)" ${idx===items.length-1?'disabled':''}>↓</button>
      </div>`;
    }
    return navItem(i.key, labelFor(i));
  }).join('');
  const toggleBtn = `<button class="nav-reorder-toggle" onclick="toggleNavReorderMode()">${navReorderMode?'✓ Concluir reordenação':'⇅ Reordenar abas'}</button>`;
  return body + toggleBtn;
}

function navItem(key,label){

/* Troca o cargo de um usuário — trata "admin" como caso especial (não é um doc em 'cargos').
   Sempre garante que reste pelo menos 1 administrador na plataforma antes de rebaixar alguém,
   pra nunca deixar a plataforma sem ninguém com acesso administrativo (pedido explicitamente). */
async function changeUserCargo(uid, value){
  if(value==='admin' && currentRole!=='admin'){
    alert('Só um administrador pode promover alguém a Administrador.');
    renderEquipe();
    return;
  }
  if(value!=='admin'){
    // checa se essa troca deixaria a plataforma sem nenhum admin
    const usersSnap = await db.collection('users').get();
    const admins = [];
    usersSnap.forEach(doc=>{ if(doc.data().role==='admin') admins.push(doc.id); });
    if(admins.length===1 && admins[0]===uid){
      alert('Não é possível remover o último administrador da plataforma. Promova outra pessoa a Administrador antes de rebaixar esta.');
      renderEquipe();
      return;
    }
  }
  const data = value==='admin' ? { role:'admin', cargoId: null } : { role:'editor', cargoId: value };
  await db.collection('users').doc(uid).set(data, {merge:true});
  renderEquipe();
}

   desliga Editar junto, pela mesma razão. */
function onCargoPermVerChange(tabKey){
  const ver = document.getElementById(`cargo-perm-${tabKey}-ver`);
  const editar = document.getElementById(`cargo-perm-${tabKey}-editar`);
  if(!ver.checked) editar.checked = false;
}
function onCargoPermEditarChange(tabKey){
  const ver = document.getElementById(`cargo-perm-${tabKey}-ver`);
  const editar = document.getElementById(`cargo-perm-${tabKey}-editar`);
  if(editar.checked) ver.checked = true;
}

async function saveCargo(isEdit){
  const nome = document.getElementById('cargo-nome').value.trim();
  if(!nome){ alert('Informe o nome do cargo.'); return; }
  const prev = window.__editingCargo || {};
  const id = window.__editingCargoId || uid();

  const permissoes = {};
  getPermissionTabs().forEach(t=>{
    const ver = document.getElementById(`cargo-perm-${t.key}-ver`);
    const editar = document.getElementById(`cargo-perm-${t.key}-editar`);
    permissoes[t.key] = { ver: ver ? ver.checked : false, editar: editar ? editar.checked : false };
  });
  const verAlertasEl = document.getElementById('cargo-ver-alertas');
  const verAlertas = verAlertasEl ? verAlertasEl.checked : true;

  const userEmail = currentUser ? currentUser.email : '';
  const history = (prev.history||[]).slice();
  if((prev.nome||'') !== nome){
    history.push({ ts: Date.now(), field:'Nome do Cargo', valorAnterior: prev.nome||'', valorNovo: nome, userEmail });
  }
  getPermissionTabs().forEach(t=>{
    const antes = prev.permissoes && prev.permissoes[t.key] ? prev.permissoes[t.key] : {ver:false, editar:false};
    const depois = permissoes[t.key];
    if(antes.ver!==depois.ver || antes.editar!==depois.editar){
      const fmt = p => p.editar ? 'Ver + Editar' : (p.ver ? 'Somente Ver' : 'Sem acesso');
      history.push({ ts: Date.now(), field:`Permissão — ${t.label}`, valorAnterior: fmt(antes), valorNovo: fmt(depois), userEmail });
    }
  });
  const verAlertasAntes = prev.verAlertas===false ? false : true;
  if(verAlertasAntes !== verAlertas){
    history.push({ ts: Date.now(), field:'Ver Alertas de Pendências', valorAnterior: verAlertasAntes?'Sim':'Não', valorNovo: verAlertas?'Sim':'Não', userEmail });
  }

  const data = {
    nome, permissoes, verAlertas,
    sistema: !!prev.sistema,
    history,
    createdAt: prev.createdAt || Date.now(),
    updatedAt: Date.now(),
  };
  try{
    await db.collection('cargos').doc(id).set(data);
    // se o cargo do próprio usuário logado foi editado, atualiza a matriz aplicada na hora
    if(currentUserCargoId===id){ currentUserPermissoes = permissoes; currentUserVerAlertas = verAlertas; }
    closeModal();
    renderEquipe();
  }catch(e){
    console.error(e);
    alert('Não foi possível salvar o cargo: ' + e.message);
  }
}

async function deleteCargo(id){
  const usersSnap = await db.collection('users').get();
  let emUso = 0;
  usersSnap.forEach(doc=>{ if(doc.data().role!=='admin' && doc.data().cargoId===id) emUso++; });
  if(emUso>0){
    alert(`Este cargo está em uso por ${emUso} usuário(s). Troque o cargo dessas pessoas antes de excluí-lo.`);
    return;
  }
  if(!confirm('Excluir este cargo? Esta ação não pode ser desfeita.')) return;
  try{
    await db.collection('cargos').doc(id).delete();
    renderEquipe();
  }catch(e){
    console.error(e);
    alert('Não foi possível excluir o cargo: ' + e.message);
  }
}

function processMatchesFilter(p, f){
  if(f.search){
    const q = f.search.toLowerCase();
    const hay = `${p.produto||''} ${p.ref||''}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(f.supplierId && p.supplierId!==f.supplierId) return false;
  if(f.modal && p.modal!==f.modal) return false;
  if(f.tipo && p.tipo!==f.tipo) return false;
  if(f.stage && getBucket(p)!==f.stage) return false;
  return true;
}

function monthLabel(ym){
  const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  const [y,m] = ym.split('-');
  return `${meses[parseInt(m)-1]}/${y}`;
}
function groupByMonth(list, dateField){
  const groups = {};
  list.forEach(p=>{
    const d = p[dateField];
    const key = d ? d.slice(0,7) : 'sem-data';
    groups[key] = groups[key] || [];
    groups[key].push(p);
  });
  const keys = Object.keys(groups).filter(k=>k!=='sem-data').sort();
  if(groups['sem-data']) keys.push('sem-data');
  return keys.map(k=>({key:k, label: k==='sem-data' ? 'Sem data de prontidão' : monthLabel(k), items:groups[k]}));
}

function renderFilterBar(pageKey, universe, stageOptions){
  const f = pageFilters[pageKey];
  const cfg = getDashboardConfig();
  const supplierOptions = state.suppliers.map(s=>`<option value="${s.id}" ${f.supplierId===s.id?'selected':''}>${s.name}</option>`).join('');

  const countBase = universe.filter(p=>
    (!f.supplierId || p.supplierId===f.supplierId) &&
    (!f.modal || p.modal===f.modal) &&
    (!f.tipo || p.tipo===f.tipo)
  );
  const stageCounts = {};
  countBase.forEach(p=>{ const b=getBucket(p); stageCounts[b]=(stageCounts[b]||0)+1; });

  const pills = [`<button class="stage-pill ${!f.stage?'active':''}" onclick="setPageStageFilter('${pageKey}','')">Todos (${countBase.length})</button>`]
    .concat(stageOptions.map(id=>{
      const label = bucketLabel(id, cfg).replace(/^\S+\s/,'');
      return `<button class="stage-pill ${f.stage===id?'active':''}" onclick="setPageStageFilter('${pageKey}','${id}')">${label} (${stageCounts[id]||0})</button>`;
    })).join('');

  return `
    <div class="filter-bar">
      <input type="text" id="${pageKey}-filter-search" placeholder="Buscar por produto ou referência..." value="${f.search}" oninput="applyPageSearchFilter('${pageKey}')">
      <select id="${pageKey}-filter-supplier" onchange="applyPageFiltersFull('${pageKey}')">
        <option value="">Todos os fornecedores</option>
        ${supplierOptions}
      </select>
      <select id="${pageKey}-filter-modal" onchange="applyPageFiltersFull('${pageKey}')">
        <option value="">Todos os modais</option>
        <option value="maritimo" ${f.modal==='maritimo'?'selected':''}>Marítimo</option>
        <option value="aereo" ${f.modal==='aereo'?'selected':''}>Aéreo</option>
      </select>
      <select id="${pageKey}-filter-tipo" onchange="applyPageFiltersFull('${pageKey}')">
        <option value="">Definitiva e Temporária</option>
        <option value="definitiva" ${f.tipo==='definitiva'?'selected':''}>Só Definitiva</option>
        <option value="temporaria" ${f.tipo==='temporaria'?'selected':''}>Só Temporária</option>
      </select>
      <button class="btn" onclick="clearPageFilters('${pageKey}')">Limpar filtros</button>
    </div>
    <div class="stage-pills">${pills}</div>
  `;
}

/* Ordem de exibição do Painel: processos mais adiantados no fluxo aparecem primeiro
   (no topo), os mais iniciais ficam por último (embaixo). Usada tanto nos cards de
   KPI quanto nas seções do corpo e no filtro de etapa, pra manter tudo consistente. */
function dashboardBucketOrder(cfg){
  cfg = cfg || getDashboardConfig();
  const ascending = ['producao','aguardando_embarque','transito','desembaraco','entregue', ...cfg.rules.map(r=>'custom:'+r.id)];
  return ascending.reverse();
}

function bucketIconOnly(id, cfg){
  if(String(id).indexOf('custom:')===0){
    const rid = id.slice(7);
    const r = (cfg.rules||[]).find(x=>x.id===rid);
    return (r && r.icon) ? r.icon : '📌';
  }
  const l = cfg.labels[id];
  return (l && l.icon) ? l.icon : '📌';
}

  const filteredProcesses = state.processes.filter(p=>processMatchesFilter(p,f));
  filteredProcesses.forEach(p=>{ const b=getBucket(p); if(buckets[b]) buckets[b].push(p); });

  const totalAtivos = state.processes.filter(p=>getBucket(p)!=='finalizados').length;

  /* TESTE VISUAL — Painel v2: a mesma cor por etapa (kpiAccents) agora também alimenta os
     retângulos-separador de seção abaixo — os cards de resumo (KPI) e os separadores das
     etapas "conversam" na mesma família de cor, como pedido. */

  const kpiAccentsBg = {producao:'var(--ink-blue-bg)', aguardando_embarque:'var(--ink-amber-bg)', transito:'var(--ink-purple-bg)', desembaraco:'var(--ink-red-bg)', entregue:'var(--ink-green-bg)'};
  const kpis = `

  <div class="kpi-row">
    ${bucketOrder.map(id=>`
      <div class="kpi-card" style="--kpi-accent:${kpiAccents[id]||'var(--ink-teal)'}; --kpi-accent-bg:${kpiAccentsBg[id]||'var(--ink-teal-bg)'}">

     categoria) — nenhuma informação nova é inventada aqui, só reorganizada visualmente. */
  let attentionHtml = '';
  if(canSeeProcessAlerts()){
    const items = getAttentionItems(filteredProcesses);
    const nAtrasados = items.filter(i=>i.category==='atrasado').length;
    const nPendencias = items.filter(i=>i.category==='pendencia').length;

    }

  let body = '';

  bucketOrder.forEach((id, idx)=>{
    const list = buckets[id];
    if(!list.length) return;
    anyContent = true;
    const title = bucketLabel(id, cfg).replace(/^\S+\s/,'');
    const bandColor = kpiAccents[id] || 'var(--ink-teal)';
    // Por padrão TODAS as seções vêm abertas — só fecha se a pessoa clicar pra recolher
    // (fica lembrado nesta sessão via window.__dashboardBandState).
    const stored = window.__dashboardBandState[id];

    if(!expanded){
      body += band + `<div class="section-band-placeholder" onclick="toggleDashboardBand('${id}')"><span>Ver processos ${title.toLowerCase()}</span><span class="band-chevron" style="color:var(--muted);">▼</span></div>`;

    if(id==='producao'){
      const groups = groupByMonth(list, 'prontidao');

      body += band + `<div class="process-list">${list.map(aguardandoEmbarqueCard).join('')}</div>`;

    } else if(id==='desembaraco'){
      body += band + `<div class="process-list">${list.map(desembaracoCard).join('')}</div>`;
    } else {
      body += band + `<div class="process-list">${list.map(p=>processCard(p)).join('')}</div>`;
    }
  });

  if(!anyContent){
    const hasFilters = f.search || f.supplierId || f.modal || f.tipo || f.stage;
    body = hasFilters ? `
    <div class="empty-state">
      <h3>Nenhum processo encontrado</h3>

      <button class="btn" onclick="clearPageFilters('dashboard')">Limpar filtros</button>

     que batem com os filtros aplicados (os mesmos que aparecem nas seções acima), e o horário
     real da última sincronização com o Firestore — nada estimado. */
  const totalFobUsd = Object.values(buckets).flat().reduce((s,p)=>s+(parseFloat(p.fob)||0),0);
  const footerHtml = `
    <div class="dashboard-footer-bar">

      <div class="dashboard-footer-fob"><span class="dashboard-footer-fob-label">Total FOB (USD)</span><span class="stat-box-value">${fmtUSD(totalFobUsd)}</span></div>
    </div>
  `;

  return kpis + attentionHtml + body + finalNote + footerHtml;
}

/* TESTE VISUAL — Painel v2: "há X minutos/horas/dias" a partir de um timestamp real
   (window.__lastSyncTs, atualizado a cada snapshot do Firestore). */
function formatRelativeTime(ts){
  if(!ts) return 'agora mesmo';
  const diffSec = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(diffSec < 60) return 'agora mesmo';
  const diffMin = Math.round(diffSec/60);
  if(diffMin < 60) return `há ${diffMin} minuto${diffMin===1?'':'s'}`;
  const diffH = Math.round(diffMin/60);
  if(diffH < 24) return `há ${diffH} hora${diffH===1?'':'s'}`;
  const diffD = Math.round(diffH/24);
  return `há ${diffD} dia${diffD===1?'':'s'}`;
}

function sanitizePN(v){ return String(v==null?'':v).trim(); }

/* Remove acentos e caixa pra comparação de busca (ex: "Veraview" == "veraview" == "VERAVIEW"). */
function normalizeSearchText(v){
  return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

/* Cache em memória do catálogo completo — usado só pra busca "contains" de Nome/Descrição
   (Firestore não faz "contains", só prefixo). Invalidado sempre que um produto é salvo,
   inativado/reativado ou importado, pra nunca mostrar resultado desatualizado na mesma sessão. */
let __produtosCacheAll = null;
async function getAllProdutosCached(forceRefresh){
  if(__produtosCacheAll && !forceRefresh) return __produtosCacheAll;
  try{
    const snap = await db.collection('produtos').get();
    const out = [];
    snap.forEach(doc=>out.push({id:doc.id, ...doc.data()}));
    __produtosCacheAll = out;
    return out;
  }catch(e){
    console.error('Erro ao carregar catálogo completo de produtos', e);
    return __produtosCacheAll || [];
  }
}
function invalidateProdutosCache(){ __produtosCacheAll = null; }

async function searchProducts(field, query, limitN){
  limitN = limitN || 30;
  const q = String(query||'').trim();
  if(!q) return [];
  try{
    if(field==='descricao'){
      /* Busca "contains", ignorando acentos/caixa e a ordem das palavras digitadas — ex:
         "X800" encontra "VERAVIEW X800", e "X800 VERAVIEW" também encontra. O Firestore só
         suporta busca por prefixo (startAt/endAt), então aqui filtramos em memória, contra
         Nome/Descrição + Produto (modelo), que juntos cobrem como o nome comercial costuma
         estar escrito no cadastro. */
      const all = await getAllProdutosCached();
      const tokens = normalizeSearchText(q).split(/\s+/).filter(Boolean);
      if(!tokens.length) return [];
      const matches = all.filter(p=>{
        const hay = normalizeSearchText((p.descricao||'') + ' ' + (p.produto||''));
        return tokens.every(t=>hay.includes(t));
      });
      return matches.slice(0, limitN);
    }
    let ref = db.collection('produtos').orderBy(field).startAt(q).endAt(q+'\uf8ff').limit(limitN);
    const snap = await ref.get();
    const out = [];
    snap.forEach(doc=>out.push({id:doc.id, ...doc.data()}));
    return out;
  }catch(e){
    console.error('Erro ao buscar produtos', e);
    return [];
  }
}

async function getProductByPN(pn){
  try{
    const doc = await db.collection('produtos').doc(sanitizePN(pn)).get();
    return doc.exists ? {id:doc.id, ...doc.data()} : null;
  }catch(e){
    console.error('Erro ao buscar produto', e);
    return null;
  }
}

  const vencido = p.exTarifarioVencimento && p.exTarifarioVencimento < todayStr();
  const style = vencido ? 'background:rgba(220,38,38,.12); color:var(--ink-red); border-color:rgba(220,38,38,.35);' : '';
  const label = (vencido?'⚠️ EX VENCIDO':'EX') + (p.exTarifarioNumero?' '+p.exTarifarioNumero:'');
  return `<span class="ex-badge" style="${style}" title="EX Tarifário — II considerado zerado${vencido?' — venceu em '+fmtDate(p.exTarifarioVencimento):''}">${label}</span>`;
}

async function runProductSearch(){
  const field = document.getElementById('product-search-field').value;
  const query = document.getElementById('product-search-input').value;
  productSearchState.field = field;
  productSearchState.query = query;
  const el = document.getElementById('product-results');
  if(!query.trim()){
    el.innerHTML = `<div class="form-hint">Digite algo pra buscar (ex: parte do PN, nome do produto, NCM ou fabricante).</div>`;
    return;
  }
  el.innerHTML = `<div class="form-hint">Buscando...</div>`;
  const results = await searchProducts(field, query);
  productSearchState.results = results;
  if(!results.length){
    el.innerHTML = `<div class="empty-state"><h3>Nenhum produto encontrado</h3><p>Confira o termo buscado ou cadastre um novo produto.</p></div>`;
    return;
  }
  el.innerHTML = results.map(p=>`
    <div class="product-row" onclick="openProductModal('${p.id.replace(/'/g,"\\'")}')">
      <span class="pn">${p.pn||p.id}</span>
      <span class="desc">${p.descricao||'—'} ${p.ativo===false?'<span class="product-inactive-badge">Inativo</span>':''}${renderExBadge(p)}</span>
      <span class="ncm">${p.ncm||'—'}</span>
      <span class="fab">${p.fabricante||'—'}</span>
      <span class="val">${p.valorUnitario?fmtUSD(parseFloat(p.valorUnitario)):'—'}</span>
      <span></span>
    </div>
  `).join('');
}

/* Histórico de uso em processos: em quais referências este item (PN) já foi trazido e em
   que quantidade. É calculado na hora (varre state.processes), nunca precisa ser salvo à
   parte — assim aparece automaticamente assim que o item é adicionado a qualquer processo,
   sem risco de ficar desatualizado. */
function getProductUsageHistory(pn){
  const alvo = sanitizePN(pn);
  const rows = [];
  (state.processes||[]).forEach(proc=>{
    (proc.itens||[]).forEach(it=>{
      if(sanitizePN(it.pn) === alvo){
        const fornecedor = state.suppliers.find(s=>s.id===proc.supplierId);
        rows.push({
          processId: proc.id,
          ref: proc.ref || ('REF-'+proc.id.slice(0,6).toUpperCase()),
          fornecedor: fornecedor ? fornecedor.name : '—',
          quantidade: parseFloat(it.quantidade)||0,
          dataPedido: proc.dataPedido || '',
          statusLabel: stageInfoFor(proc, proc.status).label,
          isDone: isProcessDone(proc),
        });
      }
    });
  });
  rows.sort((a,b)=> (b.dataPedido||'').localeCompare(a.dataPedido||''));
  return rows;
}

function renderProductUsageHistory(pn){
  const rows = getProductUsageHistory(pn);
  if(!rows.length){
    return `<div class="form-hint">Este item ainda não foi adicionado a nenhum processo. Assim que for usado em algum, aparece aqui automaticamente.</div>`;
  }
  const totalQtd = rows.reduce((s,r)=>s+r.quantidade, 0);
  const rowsHtml = rows.map(r=>`
    <div class="history-item" style="cursor:pointer;" onclick="closeModal(); openProcessModal('${r.processId}');" title="Abrir processo">
      <div class="history-date">${r.dataPedido?fmtDate(r.dataPedido):'Data não informada'} · ${r.fornecedor}${r.isDone?' · Finalizado':''}</div>
      <div class="history-title">${r.ref}</div>
      <div class="history-detail">Quantidade trazida: <strong>${r.quantidade}</strong> · Status: ${r.statusLabel}</div>
    </div>
  `).join('');
  return `
    <div class="form-hint" style="margin-bottom:10px;">${rows.length} processo(s) já trouxeram este item · Quantidade total: <strong>${totalQtd}</strong></div>
    ${rowsHtml}
  `;
}

/* Alíquotas efetivas de um produto (Banco de Itens): parte do que está cadastrado no NCM,
   mas zera o II quando o item tem EX Tarifário marcado (mesmo com o EX vencido — o alerta
   de vencimento é só visual, quem decide se o EX ainda vale é o usuário). Ponto único pra
   quem for usar isso em cálculos futuros (ex: Custos automático por item). */
function getEffectiveAliquotas(product){
  const entry = findNCMEntry(product && product.ncm);
  const base = {
    ii: entry && entry.ii!=='' ? parseFloat(entry.ii)||0 : null,
    ipi: entry && entry.ipi!=='' ? parseFloat(entry.ipi)||0 : null,
    pis: entry && entry.pis!=='' ? parseFloat(entry.pis)||0 : null,
    cofins: entry && entry.cofins!=='' ? parseFloat(entry.cofins)||0 : null,
    ncmEncontrado: !!entry,
  };
  if(product && product.exTarifario) base.ii = 0;
  return base;
}

function renderNcmAliquotasRef(ncmValue){
  if(!ncmValue) return `<div class="form-hint">Digite o NCM para ver a alíquota cadastrada na aba NCM.</div>`;
  const entry = findNCMEntry(ncmValue);
  if(!entry){
    return `<div class="form-hint">⚠️ Este NCM ainda não está cadastrado na aba NCM. <a href="#" onclick="event.preventDefault(); closeModal(); setView('ncm'); openNCMModal();">Cadastrar agora</a>.</div>`;
  }
  const has = v => v!==''&&v!=null;
  const parts = [
    `II ${has(entry.ii)?entry.ii+'%':'—'}`,
    `IPI ${has(entry.ipi)?entry.ipi+'%':'—'}`,
    `PIS ${has(entry.pis)?entry.pis+'%':'—'}`,
    `COFINS ${has(entry.cofins)?entry.cofins+'%':'—'}`,
  ];
  const alertaHtml = (entry.pendingAlerts||[]).length ? ` <span style="color:var(--ink-red); font-weight:700;">⚠️ alíquota alterada recentemente</span>` : '';
  return `<div class="form-hint">Alíquotas cadastradas para este NCM (atualizadas automaticamente conforme a aba NCM): <strong>${parts.join(' · ')}</strong>${entry.ativo===false?' <span class="product-inactive-badge">NCM Inativo</span>':''}${alertaHtml}</div>`;
}
function onProductNcmInput(val){
  const ref = document.getElementById('ncm-aliquotas-ref');

function formatNCM(v){
  const digits = String(v||'').replace(/\D/g,'');
  if(!digits) return '';
  const p = digits.padStart(8,'0').slice(-8);
  return `${p.slice(0,4)}.${p.slice(4,6)}.${p.slice(6,8)}`;
}
function formatCodigoImposto(v){
  const digits = String(v||'').replace(/\D/g,'');
  if(!digits) return '';
  const p = digits.padStart(7,'0').slice(-7);
  return `${p.slice(0,4)}-${p.slice(4,7)}`;
}
function formatCodCatalogo(v){
  const digits = String(v||'').replace(/\D/g,'');
  if(!digits) return '';
  return digits.padStart(10,'0').slice(-10);
}
/* "II" aqui é o código de cadastro interno no SAP (nada a ver com Imposto de Importação,
   que também é abreviado II em outras partes do app — nomes de campo e rótulo deixam isso
   claro pra não confundir). Formato fixo: "II" + 6 dígitos, ex: II000640. */
function formatCodigoII(v){
  const digits = String(v||'').replace(/\D/g,'');
  if(!digits) return '';
  return 'II' + digits.padStart(6,'0').slice(-6);
}

/* ---------- NCM E ALÍQUOTAS ---------- */
/* Cadastro de NCMs com II/IPI/PIS/COFINS. Integra com o Banco de Itens: o campo NCM de
   cada produto busca aqui a alíquota vigente (nunca copia/trava um valor fixo no produto),
   então qualquer atualização feita nesta aba já "respeitada" automaticamente por todos os
   itens que usam aquele NCM. Toda alteração de alíquota gera um alerta pendente até alguém
   marcar como ciente. */
function findNCMEntry(ncmValue){
  const digits = String(ncmValue||'').replace(/\D/g,'');
  if(!digits) return null;
  return (state.ncms||[]).find(n=>String(n.ncm||'').replace(/\D/g,'')===digits) || null;
}

function getAllPendingNCMAlerts(){
  const out = [];
  (state.ncms||[]).forEach(n=>{
    (n.pendingAlerts||[]).forEach(a=>out.push({...a, ncmId:n.id, ncm:n.ncm}));
  });
  out.sort((a,b)=>b.ts-a.ts);
  return out;
}

function renderNCMAlertsBanner(){
  const alerts = getAllPendingNCMAlerts();
  if(!alerts.length) return '';
  return `
    <div class="alert-banner" style="margin-bottom:18px; border:1px solid var(--ink-red); background:rgba(220,38,38,.08); border-radius:8px; padding:12px 14px;">
      <div style="font-weight:700; color:var(--ink-red); margin-bottom:8px;">⚠️ ${alerts.length} alteração(ões) de alíquota pendente(s) de ciência</div>
      ${alerts.map(a=>`
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-top:1px solid rgba(220,38,38,.2);">
          <div style="font-size:12.5px;">
            <strong>${a.ncm}</strong> — ${a.campo} mudou de <strong>${a.valorAnterior===''?'—':a.valorAnterior+'%'}</strong> para <strong>${a.valorNovo}%</strong>
            <span style="color:var(--muted);"> · ${formatHistoryDate(a.ts)}</span>
          </div>
          <button class="btn" style="white-space:nowrap;" onclick="acknowledgeNCMAlert('${a.ncmId}','${a.id}')">Marcar como Ciente</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function acknowledgeNCMAlert(ncmId, alertId){
  const n = (state.ncms||[]).find(x=>x.id===ncmId);
  if(!n) return;
  n.pendingAlerts = (n.pendingAlerts||[]).filter(a=>a.id!==alertId);
  await persistState();
  render();
}

/* Área simples de configuração — nome da empresa deste acesso e cadastro de Estoques

function getEmpresaConfig(){
  state.empresaConfig = state.empresaConfig || { nome:'', estoques:[] };
  state.empresaConfig.estoques = state.empresaConfig.estoques || [];
  if(state.empresaConfig.seguroLimiteValor===undefined) state.empresaConfig.seguroLimiteValor = 4000000;
  if(!state.empresaConfig.seguroLimiteMoeda) state.empresaConfig.seguroLimiteMoeda = 'BRL';
  return state.empresaConfig;
}

async function saveEmpresaNome(){
  if(!requireEditPermission()) return;
  const cfg = getEmpresaConfig();
  cfg.nome = document.getElementById('empresa-nome-input').value.trim();
  await persistState();
  updateSaveIndicator('Nome da empresa salvo ✓');
}

async function saveEmpresaSeguro(){
  if(!requireEditPermission()) return;
  const cfg = getEmpresaConfig();
  const valor = parseFloat(document.getElementById('empresa-seguro-valor').value);
  cfg.seguroLimiteValor = isNaN(valor) ? 0 : valor;
  cfg.seguroLimiteMoeda = document.getElementById('empresa-seguro-moeda').value === 'USD' ? 'USD' : 'BRL';
  await persistState();
  updateSaveIndicator('Alerta de seguro salvo ✓');
}

async function addEstoque(){
  if(!requireEditPermission()) return;
  const cfg = getEmpresaConfig();
  cfg.estoques.push({ id: uid(), nome: '' });
  await persistState();
  render();
}

async function updateEstoqueNome(id, nome){
  if(!requireEditPermission()) return;
  const cfg = getEmpresaConfig();
  const estoque = cfg.estoques.find(e=>e.id===id);
  if(!estoque) return;
  estoque.nome = nome.trim();
  await persistState();
}

async function removeEstoque(id){
  if(!requireEditPermission()) return;
  if(!confirm('Remover este estoque?')) return;
  const cfg = getEmpresaConfig();
  cfg.estoques = cfg.estoques.filter(e=>e.id!==id);
  await persistState();
  render();
}

function runNCMSearch(){

}

function toggleNCMSortDir(btn){
  ncmPageState.sortDir = ncmPageState.sortDir==='asc' ? 'desc' : 'asc';
  if(btn) btn.textContent = ncmPageState.sortDir==='asc' ? '⬆️ Crescente' : '⬇️ Decrescente';
  document.getElementById('ncm-results').innerHTML = renderNCMResults();
}

function renderNCMResults(){
  const q = (ncmPageState.query||'').trim().toLowerCase();
  const qDigits = q.replace(/\D/g,'');
  let list = (state.ncms||[]).filter(n=>{
    if(!q) return true;
    const ncmDigits = String(n.ncm||'').replace(/\D/g,'');
    return (n.ncm||'').toLowerCase().includes(q)
      || (qDigits && ncmDigits.includes(qDigits))
      || (n.descricao||'').toLowerCase().includes(q);
  });

  const field = ncmPageState.sortField || 'ncm';
  const dir = ncmPageState.sortDir==='desc' ? -1 : 1;
  list = list.slice().sort((a,b)=>{
    if(field==='ncm') return (a.ncm||'').localeCompare(b.ncm||'') * dir;
    const av = a[field]===''||a[field]==null ? -Infinity : parseFloat(a[field]);
    const bv = b[field]===''||b[field]==null ? -Infinity : parseFloat(b[field]);
    return (av - bv) * dir;
  });

  if(!list.length){
    return `<div class="empty-state">
      <h3>Nenhuma NCM encontrada</h3>
      <p>${q ? 'Confira o termo buscado ou cadastre uma NCM nova.' : 'Cadastre as NCMs e suas alíquotas para usar como referência no Banco de Itens.'}</p>
    </div>`;
  }

  const rows = list.map(n=>`
    <div class="product-row" onclick="openNCMModal('${n.id}')">
      <span class="pn">${n.ncm}</span>
      <span class="desc">${n.descricao||'—'} ${n.ativo===false?'<span class="product-inactive-badge">Inativo</span>':''}${(n.pendingAlerts||[]).length?' <span style="color:var(--ink-red); font-weight:700;">⚠️ alíquota alterada</span>':''}</span>
      <span class="ncm">II ${n.ii!==''&&n.ii!=null?n.ii+'%':'—'}</span>
      <span class="fab">IPI ${n.ipi!==''&&n.ipi!=null?n.ipi+'%':'—'}</span>
      <span class="val">PIS ${n.pis!==''&&n.pis!=null?n.pis+'%':'—'} · COFINS ${n.cofins!==''&&n.cofins!=null?n.cofins+'%':'—'}</span>
      <span></span>
    </div>
  `).join('');
  return `<div class="product-list">${rows}</div>`;
}

async function saveNCM(id){
  if(!requireEditPermission()) return;
  const ncmRaw = document.getElementById('ncm-codigo').value;
  const ncm = formatNCM(ncmRaw);
  if(!ncm){ alert('Informe o código da NCM.'); return; }

  const prev = window.__editingNCM || {};
  const duplicate = (state.ncms||[]).find(n=>n.ncm===ncm && n.id!==id);
  if(duplicate){ alert('Já existe uma NCM cadastrada com este código.'); return; }

  const aliquotaFields = [
    {key:'ii', label:'II'}, {key:'ipi', label:'IPI'}, {key:'pis', label:'PIS'}, {key:'cofins', label:'COFINS'},
  ];
  const data = {
    id,
    ncm,
    descricao: document.getElementById('ncm-descricao').value.trim(),
    ii: document.getElementById('ncm-ii').value.trim(),
    ipi: document.getElementById('ncm-ipi').value.trim(),
    pis: document.getElementById('ncm-pis').value.trim(),
    cofins: document.getElementById('ncm-cofins').value.trim(),
  };

  const history = (prev.history||[]).slice();
  const pendingAlerts = (prev.pendingAlerts||[]).slice();
  const userEmail = currentUser ? currentUser.email : '';
  const isNew = !(state.ncms||[]).some(n=>n.id===id);

  aliquotaFields.forEach(f=>{
    const antes = prev[f.key]!==undefined ? String(prev[f.key]) : '';
    const depois = data[f.key]!==undefined ? String(data[f.key]) : '';
    if(antes !== depois){
      history.push({ ts: Date.now(), field: f.label, valorAnterior: antes, valorNovo: depois, userEmail });
      /* Só dispara alerta de "alíquota mudou" quando já havia um valor antes — cadastro
         inicial de uma NCM nova (ou preenchendo pela primeira vez) não é uma "mudança". */
      if(!isNew && antes !== ''){
        pendingAlerts.push({ id: uid(), campo: f.label, valorAnterior: antes, valorNovo: depois, ts: Date.now() });
      }
    }
  });

  data.history = history;
  data.pendingAlerts = pendingAlerts;
  data.ativo = prev.ativo===false ? false : true;

  const idx = (state.ncms||[]).findIndex(n=>n.id===id);
  state.ncms = state.ncms || [];
  if(idx>=0) state.ncms[idx] = data; else state.ncms.push(data);

  await persistState();
  closeModal();
  render();
}

async function toggleNCMActive(id, makeActive){
  if(!requireEditPermission()) return;
  const n = (state.ncms||[]).find(x=>x.id===id);
  if(!n) return;
  n.ativo = makeActive;
  await persistState();
  closeModal();
  render();
}

async function deleteNCM(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir esta NCM? Itens do Banco de Itens que usam este código deixam de ter alíquota de referência.')) return;
  state.ncms = (state.ncms||[]).filter(n=>n.id!==id);
  await persistState();
  closeModal();
  render();
}

async function saveProduct(isEdit){
  if(!requireEditPermission()) return;
  const pnFieldVal = document.getElementById('pf-pn').value;
  const pn = sanitizePN(pnFieldVal);
  if(!pn){ alert('Informe o PN do produto.'); return; }

  const prev = window.__editingProduct || {};
  const oldPn = sanitizePN(prev.pn);
  const isRename = isEdit && oldPn && oldPn !== pn;

  if(!isEdit || isRename){
    const already = await getProductByPN(pn);
    if(already){
      alert('Este PN já está cadastrado. Abrindo o produto existente para edição.');
      closeModal();
      openProductModal(pn);
      return;
    }
  }

  const data = { pn };
  PRODUCT_FIELDS.forEach(f=>{
    if(f.key==='pn') return;
    const el = document.getElementById('pf-'+f.key);
    data[f.key] = el ? el.value : (prev[f.key]||'');
    if((f.key==='valorUnitario' || f.key==='peso') && data[f.key]){
      data[f.key] = String(parseBRMasked(data[f.key]));
    }
  });
  if(data.ncm) data.ncm = formatNCM(data.ncm);
  if(data.codigo) data.codigo = formatCodigoImposto(data.codigo);
  if(data.codCatalogo) data.codCatalogo = formatCodCatalogo(data.codCatalogo);
  if(data.codigoII) data.codigoII = formatCodigoII(data.codigoII);

  data.exTarifario = !!(window.__editingProduct && window.__editingProduct.exTarifario);
  data.exTarifarioNumero = data.exTarifario ? (document.getElementById('pf-exTarifarioNumero').value||'').trim() : '';
  data.exTarifarioVencimento = data.exTarifario ? (document.getElementById('pf-exTarifarioVencimento').value||'') : '';

  data.tipoExtracaoLotes = document.getElementById('pf-tipo-extracao') ? document.getElementById('pf-tipo-extracao').value : '';

  data.validadeUnidade = document.getElementById('pf-validade-unidade') ? document.getElementById('pf-validade-unidade').value : 'meses';
  data.validadeQtd = data.validadeUnidade==='indeterminado' ? null : (parseInt((document.getElementById('pf-validade-qtd')||{}).value,10) || null);

  const history = (prev.history||[]).slice();
  const userEmail = currentUser ? currentUser.email : '';
  if(isRename){
    history.push({ ts: Date.now(), field:'PN', valorAnterior: oldPn, valorNovo: pn, userEmail });
  }
  PRODUCT_FIELDS.forEach(f=>{
    if(f.key==='pn') return;
    const antes = prev[f.key]!==undefined ? prev[f.key] : '';
    const depois = data[f.key]!==undefined ? data[f.key] : '';
    if(String(antes) !== String(depois)){
      history.push({ ts: Date.now(), field: f.label, valorAnterior: antes, valorNovo: depois, userEmail });
    }
  });
  const exFieldsToTrack = [
    {key:'exTarifario', label:'EX Tarifário', fmt:v=>v?'Sim':'Não'},
    {key:'exTarifarioNumero', label:'Número do EX', fmt:v=>v||''},
    {key:'exTarifarioVencimento', label:'Vencimento do EX', fmt:v=>v||''},
    {key:'tipoExtracaoLotes', label:'Extração de Lotes da Fatura', fmt:v=>v ? (LOTE_EXTRACTION_RULES[v] ? LOTE_EXTRACTION_RULES[v].label : v) : 'Nenhuma'},
    {key:'validadeUnidade', label:'Validade (Unidade)', fmt:v=>v||''},
    {key:'validadeQtd', label:'Validade (Quantidade)', fmt:v=>v||''},
  ];
  exFieldsToTrack.forEach(f=>{
    const antes = f.fmt(prev[f.key]);
    const depois = f.fmt(data[f.key]);
    if(antes !== depois){
      history.push({ ts: Date.now(), field: f.label, valorAnterior: antes, valorNovo: depois, userEmail });
    }
  });
  data.history = history;
  data.ativo = prev.ativo===false ? false : true;
  data.createdAt = prev.createdAt || Date.now();
  data.updatedAt = Date.now();

  /* Mesma blindagem aplicada ao salvamento principal dos processos: remove qualquer campo
     "undefined" antes de gravar, pra nunca correr o risco de o Firestore rejeitar a escrita
     (ou gravar um documento incompleto) por causa de um único campo problemático. */
  const sanitizedData = JSON.parse(JSON.stringify(data));
  try{
    await db.collection('produtos').doc(pn).set(sanitizedData);
    if(isRename){
      await db.collection('produtos').doc(oldPn).delete();
    }
  }catch(e){
    console.error(e);
    alert('Não foi possível salvar o produto: ' + e.message);
    return;
  }
  /* A partir daqui o Firestore JÁ confirmou a escrita — qualquer coisa que falhar abaixo (fechar
     modal, invalidar cache, re-renderizar lista) NUNCA deve fazer parecer que o salvamento
     falhou, já que o dado em si já está gravado com segurança. */
  if(isRename) delete window.__lotesProductsCache[oldPn];
  invalidateProdutosCache();
  delete window.__lotesProductsCache[pn]; // força reconsultar na próxima vez que a aba Lotes renderizar
  try{ closeModal(); }catch(e){ console.error('Erro ao fechar modal (não afeta o salvamento, já concluído)', e); }
  alert(`Produto ${pn} salvo com sucesso.`);
  if(currentView==='bancoitens') runProductSearch();
}

async function toggleProductActive(pn, makeActive){
  if(!requireEditPermission()) return;
  try{
    await db.collection('produtos').doc(pn).set({ ativo: makeActive, updatedAt: Date.now() }, {merge:true});
    invalidateProdutosCache();
    closeModal();
    if(currentView==='bancoitens') runProductSearch();
  }catch(e){
    console.error(e);
    alert('Não foi possível atualizar o status do produto.');
  }
}

function addRotaPonto(){
  const sel = document.getElementById('rota-add-recinto');
  const recintoId = sel.value;
  if(!recintoId) return;
  const recinto = state.partners.find(p=>p.id===recintoId);
  if(!recinto) return;
  window.__editingRota.pontos = window.__editingRota.pontos || [];
  window.__editingRota.pontos.push({ recintoId, recintoNome: recinto.empresa, zona: recinto.zonaRecinto||'' });
  sel.value = '';
  renderRotaPontos();
}
function removeRotaPonto(idx){
  window.__editingRota.pontos.splice(idx,1);
  renderRotaPontos();
}
function moveRotaPonto(idx, dir){
  const pontos = window.__editingRota.pontos;
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=pontos.length) return;
  [pontos[idx], pontos[newIdx]] = [pontos[newIdx], pontos[idx]];
  renderRotaPontos();
}

async function saveRota(){
  if(!requireEditPermission()) return;
  const nome = document.getElementById('rota-nome').value.trim();
  if(!nome){ alert('Informe o nome da rota.'); return; }
  const r = window.__editingRota;
  const data = {
    id: r.id,
    nome,
    ativo: r.ativo===false ? false : true,
    pontos: r.pontos || [],
    createdAt: r.createdAt || Date.now(),
    updatedAt: Date.now(),
  };
  try{
    await db.collection('rotas').doc(r.id).set(data);
    const idx = (window.__rotas||[]).findIndex(x=>x.id===r.id);
    if(idx>=0) window.__rotas[idx]=data; else (window.__rotas=window.__rotas||[]).push(data);
    closeModal();
    if(currentView==='rotas') renderRotasList();
  }catch(e){
    console.error(e);
    alert('Não foi possível salvar a rota: ' + e.message);
  }
}

async function toggleRotaActive(id, makeActive){

function renderProdutosMestreList(){
  const el = document.getElementById('view-content');
  const canEditHere = canEdit('produtosmestre');
  const produtos = (window.__produtosMestre||[]).slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const header = canEditHere ? `<div style="margin-bottom:18px;"><button class="btn btn-primary" onclick="openProdutoMestreModal()">+ Novo Produto</button></div>` : '';
  if(!produtos.length){
    el.innerHTML = header + `<div class="empty-state"><h3>Nenhum produto cadastrado</h3><p>Cadastre as características recorrentes de um tipo de carga (fornecedor, país, portos, temperatura, genset) pra reaproveitar rapidamente na criação de processos.</p></div>`;
    return;
  }

  const groups = {};
  produtos.forEach(pr=>{
    const key = pr.supplierId || '__sem__';
    groups[key] = groups[key] || [];
    groups[key].push(pr);
  });
  const supplierIds = Object.keys(groups).filter(k=>k!=='__sem__');
  supplierIds.sort((a,b)=>{
    const sa = state.suppliers.find(s=>s.id===a);
    const sb = state.suppliers.find(s=>s.id===b);
    return (sa?sa.name:'').localeCompare(sb?sb.name:'');
  });
  if(groups['__sem__']) supplierIds.push('__sem__');

  const sectionsHtml = supplierIds.map(key=>{
    const list = groups[key];
    const fornecedor = key==='__sem__' ? null : state.suppliers.find(s=>s.id===key);
    const titleColor = fornecedor ? getSupplierColor(fornecedor) : 'var(--muted)';
    const titleText = fornecedor ? fornecedor.name : 'Sem fornecedor definido';
    return `
      <div class="contact-group">
        <div class="contact-group-title" style="color:${titleColor};">${titleText}</div>
        <div class="supplier-grid">
          ${list.map(pr=>renderProdutoMestreCard(pr)).join('')}
        </div>
      </div>
    `;
  }).join('');

  el.innerHTML = header + sectionsHtml;
}

function renderPMDesempenhoHtml(pr){
  const historico = pr.historicoProcessos || [];
  if(!historico.length){
    return `<div class="form-hint">Nenhum processo finalizado vinculado a este produto ainda. Conforme processos que usarem este modelo forem concluídos, as médias de prazo e custo aparecem aqui automaticamente.</div>`;
  }
  const leadTimes = historico.filter(h=>h.leadTimeDias!=null).map(h=>h.leadTimeDias);
  const custos = historico.filter(h=>h.custoTotal!=null).map(h=>h.custoTotal);
  const mediaLead = leadTimes.length ? (leadTimes.reduce((a,b)=>a+b,0)/leadTimes.length) : null;
  const mediaCusto = custos.length ? (custos.reduce((a,b)=>a+b,0)/custos.length) : null;
  return `
    <div class="item-totals-row" style="margin-top:0;">
      <div class="item-total-box"><div class="num">${historico.length}</div><div class="lbl">Processos Concluídos</div></div>

      <div class="item-total-box"><div class="num">${mediaCusto!==null?fmtBRL(mediaCusto):'—'}</div><div class="lbl">Custo Médio</div></div>
    </div>

      <thead><tr><th>Referência</th><th>Lead Time</th><th>Custo Total</th><th>Concluído em</th></tr></thead>
      <tbody>
        ${historico.slice().sort((a,b)=>new Date(b.dataFinalizacao)-new Date(a.dataFinalizacao)).slice(0,15).map(h=>`
          <tr><td>${h.ref||'—'}</td><td>${h.leadTimeDias!=null?h.leadTimeDias+' dias':'—'}</td><td>${h.custoTotal!=null?fmtBRL(h.custoTotal):'—'}</td><td>${fmtDate(h.dataFinalizacao)}</td></tr>

async function saveProdutoMestre(isEdit){
  if(!requireEditPermission()) return;
  const nome = document.getElementById('pm-nome').value.trim();
  if(!nome){ alert('Informe o nome do produto.'); return; }
  const prev = window.__editingProdutoMestre || {};
  const modal = document.getElementById('pm-modal').value;
  const data = {
    id: prev.id,
    nome,
    descricaoDetalhadaDTA: document.getElementById('pm-descricao-dta').value.trim(),
    supplierId: document.getElementById('pm-supplier').value,
    origemPais: document.getElementById('pm-origem').value,
    modal,
    portoEmbarque: document.getElementById('pm-porto-embarque').value.trim(),
    portoDestino: document.getElementById('pm-porto-destino').value.trim(),
    aeroportoEmbarque: document.getElementById('pm-aero-embarque').value.trim(),
    aeroportoDesembarque: document.getElementById('pm-aero-desembarque').value.trim(),
    aeroportoDestinoFinal: prev.aeroportoDestinoFinal===undefined ? null : prev.aeroportoDestinoFinal,
    aeroportoDestino: document.getElementById('pm-aero-destino').value.trim(),
    containerTamanho: document.getElementById('pm-container-tamanho').value,
    containerTipo: document.getElementById('pm-container-tipo').value,
    temperaturaControlada: !!prev.temperaturaControlada,
    temperaturaMin: document.getElementById('pm-temp-min').value,
    temperaturaMax: document.getElementById('pm-temp-max').value,
    genset: !!prev.genset,
  };

  const history = (prev.history||[]).slice();
  const userEmail = currentUser ? currentUser.email : '';
  const compareFields = ['nome','descricaoDetalhadaDTA','supplierId','origemPais','modal','portoEmbarque','portoDestino','aeroportoEmbarque','aeroportoDesembarque','containerTamanho','containerTipo','temperaturaControlada','temperaturaMin','temperaturaMax','genset'];
  compareFields.forEach(k=>{
    const antes = prev[k]!==undefined ? prev[k] : '';
    const depois = data[k]!==undefined ? data[k] : '';
    if(String(antes) !== String(depois)){
      history.push({ts:Date.now(), field:k, valorAnterior:antes, valorNovo:depois, userEmail});
    }
  });
  data.history = history;
  data.ativo = prev.ativo===false ? false : true;
  data.createdAt = prev.createdAt || Date.now();
  data.updatedAt = Date.now();

  const sanitizedData = JSON.parse(JSON.stringify(data));
  try{
    await db.collection('produtosMestre').doc(data.id).set(sanitizedData);
  }catch(e){
    console.error(e);
    alert('Não foi possível salvar o produto: ' + e.message);
    return;
  }
  /* A partir daqui o Firestore JÁ confirmou a escrita — qualquer coisa que falhar abaixo
     (fechar modal, re-renderizar lista) NUNCA deve fazer parecer que o salvamento falhou.
     Antes esse código ficava dentro do mesmo try/catch da escrita, e um erro aqui disparava
     a mensagem "Não foi possível salvar" mesmo com o dado já gravado corretamente. */
  const idx = (window.__produtosMestre||[]).findIndex(x=>x.id===data.id);
  if(idx>=0) window.__produtosMestre[idx]=sanitizedData; else (window.__produtosMestre=window.__produtosMestre||[]).push(sanitizedData);
  try{ closeModal(); }catch(e){ console.error('Erro ao fechar modal (não afeta o salvamento, já concluído)', e); }
  alert(`Produto "${nome}" salvo com sucesso.`);
  if(currentView==='produtosmestre') renderProdutosMestreList();
}

function handleImportFile(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      window.__importState.workbook = wb;
      renderImportSheetChoice();
    }catch(err){
      console.error(err);
      alert('Não foi possível ler esse arquivo. Confira se é um .xlsx, .xls ou .csv válido.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function loadSheetRawRows(sheetName){
  const wb = window.__importState.workbook;
  const sheet = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', blankrows:false});
  window.__importState.rawRows = rows;
  const headerSelect = document.getElementById('import-header-row-select');
  headerSelect.innerHTML = rows.slice(0,15).map((r,i)=>`<option value="${i}">Linha ${i+1}: ${r.slice(0,4).filter(String).join(' | ').slice(0,60) || '(vazia)'}</option>`).join('');
  // tenta adivinhar a linha de cabeçalho: a primeira com mais de 2 células de texto preenchidas
  let guess = 0;
  for(let i=0;i<Math.min(15,rows.length);i++){
    const filled = rows[i].filter(c=>String(c).trim()!=='').length;
    if(filled>=3){ guess = i; break; }
  }
  headerSelect.value = guess;
  window.__importState.headerRow = guess;
  renderRawPreview();
}

function guessColumnMatch(fieldKey, headerName){
  const h = String(headerName||'').toLowerCase();
  const guesses = {
    pn: ['pn','part number','partnumber'],
    descricao: ['descrição','descricao','nome'],
    valorUnitario: ['valor unit','valor unitário','valor','preço'],
    ncm: ['ncm'],
    fabricante: ['fabricante'],
    codigo: ['código','codigo'],
    peso: ['peso'],
    tipo: ['tipo'],
    produto: ['produto'],
    codCatalogo: ['cod catalogo','código catálogo','catalogo'],
    registroAnvisa: ['anvisa','registro'],
    descDetalhada: ['desc pt','descrição detalhada'],
    obs: ['obs','observ'],
  };
  return (guesses[fieldKey]||[]).some(g=>h.includes(g));
}

async function buildImportPreview(){
  const mapping = {};
  PRODUCT_FIELDS.forEach(f=>{
    const el = document.getElementById('map-'+f.key);
    if(el && el.value!=='') mapping[f.key] = parseInt(el.value);
  });
  if(mapping.pn===undefined){ alert('É obrigatório mapear o campo PN.'); return; }
  window.__importState.mapping = mapping;

  const rows = window.__importState.rawRows.slice(window.__importState.headerRow+1);
  const parsed = rows.map(r=>{
    const obj = {};
    PRODUCT_FIELDS.forEach(f=>{
      if(mapping[f.key]!==undefined) obj[f.key] = r[mapping[f.key]]!==undefined ? String(r[mapping[f.key]]).trim() : '';
    });
    obj.pn = sanitizePN(obj.pn);
    if(obj.ncm) obj.ncm = formatNCM(obj.ncm);
    if(obj.codigo) obj.codigo = formatCodigoImposto(obj.codigo);
    if(obj.codCatalogo) obj.codCatalogo = formatCodCatalogo(obj.codCatalogo);
    return obj;
  }).filter(o=>o.pn);

  const body = document.getElementById('import-modal-body');
  body.innerHTML = `<div class="form-hint">Analisando ${parsed.length} linha(s) contra o banco atual...</div>`;

  let existingMap = {};
  try{
    const snap = await db.collection('produtos').get();
    snap.forEach(doc=>{ existingMap[doc.id] = doc.data(); });
  }catch(e){
    console.error(e);
  }

  const seenPNs = new Set();
  const classified = [];
  parsed.forEach(row=>{
    if(seenPNs.has(row.pn)) return; // duplicado dentro da própria planilha, ignora repetição
    seenPNs.add(row.pn);
    const existing = existingMap[row.pn];
    if(!existing){
      classified.push({...row, __status:'novo'});
    } else {
      const changedFields = PRODUCT_FIELDS.filter(f=>mapping[f.key]!==undefined && f.key!=='pn')
        .filter(f=> String(existing[f.key]||'') !== String(row[f.key]||''));
      classified.push({...row, __status: changedFields.length ? 'alterado' : 'inalterado', __changedFields: changedFields.map(f=>f.label)});
    }
  });
  window.__importState.classified = classified;

  const novos = classified.filter(c=>c.__status==='novo').length;
  const alterados = classified.filter(c=>c.__status==='alterado').length;
  const inalterados = classified.filter(c=>c.__status==='inalterado').length;

  body.innerHTML = `
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi-card" style="--kpi-accent:var(--ink-green)"><div class="kpi-label">Novos</div><div class="kpi-value">${novos}</div></div>
      <div class="kpi-card" style="--kpi-accent:var(--ink-amber)"><div class="kpi-label">Alterados</div><div class="kpi-value">${alterados}</div></div>
      <div class="kpi-card" style="--kpi-accent:var(--muted)"><div class="kpi-label">Sem Alteração</div><div class="kpi-value">${inalterados}</div></div>
    </div>
    <div style="overflow-x:auto; max-height:300px; border:1px solid var(--border); border-radius:6px;">
      <table class="import-preview-table">
        <thead><tr><th>Status</th><th>PN</th><th>Descrição</th><th>Alterações</th></tr></thead>
        <tbody>
          ${classified.slice(0,50).map(c=>`
            <tr>
              <td><span class="import-status-badge ${c.__status}">${c.__status}</span></td>
              <td>${c.pn}</td>
              <td>${c.descricao||'—'}</td>
              <td>${(c.__changedFields||[]).join(', ')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${classified.length>50?`<div class="form-hint" style="padding:8px;">Mostrando as primeiras 50 de ${classified.length} linhas.</div>`:''}
    </div>
    <div style="margin-top:16px; text-align:right; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn" onclick="renderImportMapping()">Voltar</button>
      <button class="btn btn-primary" onclick="confirmImport()">Confirmar Importação (${novos+alterados} gravações)</button>
    </div>
  `;
}

async function confirmImport(){
  const classified = window.__importState.classified.filter(c=>c.__status!=='inalterado');
  const body = document.getElementById('import-modal-body');
  body.innerHTML = `<div class="form-hint">Gravando ${classified.length} produto(s)...</div>`;
  const userEmail = currentUser ? currentUser.email : '';
  const CHUNK = 400;
  let done = 0;
  try{
    for(let i=0;i<classified.length;i+=CHUNK){
      const batch = db.batch();
      const chunk = classified.slice(i, i+CHUNK);
      chunk.forEach(row=>{
        const ref = db.collection('produtos').doc(row.pn);
        const data = {...row};
        delete data.__status;
        delete data.__changedFields;
        data.ativo = true;
        data.updatedAt = Date.now();
        if(row.__status==='novo'){
          data.createdAt = Date.now();
          data.history = [{ts:Date.now(), field:'Produto', valorAnterior:'', valorNovo:'Importado via planilha', userEmail}];
          batch.set(ref, data);
        } else {
          data.history = firebase.firestore.FieldValue.arrayUnion({ts:Date.now(), field:(row.__changedFields||[]).join(', '), valorAnterior:'(ver planilha anterior)', valorNovo:'Atualizado via planilha', userEmail});
          batch.set(ref, data, {merge:true});
        }
      });
      await batch.commit();
      done += chunk.length;
    }
    body.innerHTML = `<div class="empty-state"><h3>Importação concluída</h3><p>${done} produto(s) gravado(s) com sucesso.</p><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>`;
    invalidateProdutosCache();
    if(currentView==='bancoitens') runProductSearch();
  }catch(e){
    console.error(e);
    body.innerHTML = `<div class="empty-state"><h3>Erro na importação</h3><p>${e.message}</p><button class="btn" onclick="closeModal()">Fechar</button></div>`;
  }
}

/* ---------- PROCESSOS ---------- */
function processProgressRatio(p){
  const stages = getStagesForProcess(p);
  let total=0, done=0;
  stages.forEach(s=>{
    if(s.type==='payments'){
      total += s.items.length;
      done += s.items.filter(it=>(p.payments[it.key]||{}).checked).length;
    } else {
      total += s.items.length;
      const checked = p.checklist[s.key]||[];
      done += checked.filter(Boolean).length;
    }
  });
  return total ? done/total : 0;
}

function renderProcessos(){
  const universe = state.processes.filter(p=>getBucket(p)!=='finalizados');
  const stageOptions = dashboardBucketOrder();
  const filterBar = renderFilterBar('processos', universe, stageOptions);
