/* ---------- HISTÓRICO / FOLLOW-UP ---------- */
function pushHistoryEvent(p, icon, title, detail){
  p.history = p.history || [];
  p.history.push({
    id: uid(),
    ts: Date.now(),
    manual: false,
    icon: icon,
    title: title,
    detail: detail || '',
  });
}

function detectHistoryChanges(prev, next){
  if(!prev){
    pushHistoryEvent(next, '🆕', 'Processo criado', next.produto||'');
    return;
  }
  next.history = prev.history ? prev.history.slice() : [];

  const fieldChange = (label, icon, prevVal, nextVal, formatter) => {
    if((prevVal||'') !== (nextVal||'') && nextVal){
      const fmt = formatter || (v=>v);
      const detail = prevVal ? `Anterior: ${fmt(prevVal)}\nNova: ${fmt(nextVal)}` : `Definido: ${fmt(nextVal)}`;
      pushHistoryEvent(next, icon, label, detail);
    }
  };

  fieldChange('Data prevista de chegada alterada', '📅', prev.chegadaPrevista, next.chegadaPrevista, fmtDate);
  fieldChange('Chegada na Zona Primária confirmada', '⚓', (prev.extra||{}).dataChegadaZonaPrimaria, (next.extra||{}).dataChegadaZonaPrimaria, fmtDate);
  fieldChange('Data de embarque alterada', '🚢', prev.dataEmbarqueReal, next.dataEmbarqueReal, fmtDate);
  fieldChange('Data de chegada ao porto alterada', '⚓', (prev.extra||{}).dataChegadaBetim, (next.extra||{}).dataChegadaBetim, fmtDate);
  fieldChange('Número da DUIMP registrado', '📄', (prev.extra||{}).numeroDUIMP, (next.extra||{}).numeroDUIMP);
  fieldChange('DUIMP desembaraçada — data', '✅', (prev.extra||{}).dataDesembaraco, (next.extra||{}).dataDesembaraco, fmtDate);
  fieldChange('Canal de conferência definido', '🚦', (prev.extra||{}).canalDesembaraco, (next.extra||{}).canalDesembaraco);
  fieldChange('Despachante definido', '🧾', (prev.extra||{}).despachante, (next.extra||{}).despachante);
  fieldChange('Transportadora (DTA) definida', '🚛', (prev.extra||{}).transportadoraDTA, (next.extra||{}).transportadoraDTA);

  /* Pagamentos: cada pagamento marcado como feito (Frete Internacional, DTA, Prestação
     Despachante, ou um pagamento personalizado) gera sua própria linha no histórico — em vez
     de aparecer só genericamente quando o processo muda de estágio pra "Pagamentos". */
  {
    const prevPayments = prev.payments || {};
    const nextPayments = next.payments || {};
    const nomesFixosPagamento = {freteInternacional:'Frete Internacional', dta:'DTA', prestacaoDespachante:'Prestação Despachante'};
    const paymentLabel = (key)=>{
      if(nomesFixosPagamento[key]) return nomesFixosPagamento[key];
      if(key.startsWith('custom:')){
        const id = key.replace('custom:','');
        const cp = (next.customPayments||[]).find(c=>c.id===id);
        return cp ? cp.name : key;
      }
      return key;
    };
    Object.keys(nextPayments).forEach(key=>{
      const wasChecked = !!(prevPayments[key] && prevPayments[key].checked);
      const isChecked = !!(nextPayments[key] && nextPayments[key].checked);
      if(!wasChecked && isChecked){
        pushHistoryEvent(next, '💳', `Pagamento - ${paymentLabel(key)}`, '');
      }
    });
  }

  /* Devolução do container: no instante em que o checklist "Devolução do vazio" passa de
     não-marcado pra marcado, registra automaticamente no histórico se foi dentro ou fora do
     Free Time, com a quantidade de dias — usando a data limite recalculada na hora (que nunca
     muda depois, já que depende só de Chegada na Zona Primária + Free Time, nunca da própria
     data de devolução). */
  if(!isContainerReturnDone(prev) && isContainerReturnDone(next)){
    const perf = containerReturnPerformance(next);
    if(perf){
      if(perf.onTime){
        const msg = perf.dias===0 ? 'Devolução do container realizada no prazo — na data limite.' : `Devolução do container realizada no prazo — ${perf.dias} dia(s) antes do limite.`;
        pushHistoryEvent(next, '🟢', 'Devolução do container — Dentro do prazo', msg);
      } else {
        pushHistoryEvent(next, '🔴', 'Devolução do container — Fora do prazo', `Devolução do container realizada fora do prazo — ${perf.dias} dia(s) de atraso.`);
      }
    }
  }

  if(prev.status !== next.status){
    pushHistoryEvent(next, '🔄', 'Processo alterado para outro estágio', `${stageInfoFor(prev,prev.status).label} → ${stageInfoFor(next,next.status).label}`);
  }

  const prevDocs = prev.docs||{}, nextDocs = next.docs||{};
  DOC_TYPES.forEach(d=>{
    if(!prevDocs[d] && nextDocs[d]) pushHistoryEvent(next, '📎', 'Documento adicionado', d);
    if(prevDocs[d] && !nextDocs[d]) pushHistoryEvent(next, '🗑️', 'Documento removido', d);
  });

  if((prev.obs||'') !== (next.obs||'') && next.obs){
    pushHistoryEvent(next, '📝', 'Observação alterada', next.obs);
  }
}

function addManualHistoryEvent(text){
  if(!text || !text.trim()) return;
  const p = window.__editingProcess;
  p.history = p.history || [];
  p.history.push({ id: uid(), ts: Date.now(), manual: true, icon:'✏️', title:'Registro manual', detail: text.trim() });
  renderHistoryTab();
}
function editManualHistoryEvent(id){
  const p = window.__editingProcess;
  const ev = (p.history||[]).find(h=>h.id===id);
  if(!ev || !ev.manual) return;
  const novo = prompt('Editar registro:', ev.detail);
  if(novo===null) return;
  ev.detail = novo.trim();
  renderHistoryTab();
}
function deleteManualHistoryEvent(id){
  const p = window.__editingProcess;
  if(!confirm('Excluir este registro do histórico?')) return;
  p.history = (p.history||[]).filter(h=>h.id!==id);
  renderHistoryTab();
}

function formatHistoryDate(ts){
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} — ${hh}:${mi}`;
}

/* ---------- ITENS DO PROCESSO ---------- */
let editingItemIds = new Set();
function startEditingItem(id){ editingItemIds.add(id); renderItensTab(); }
function finishEditingItem(id){ editingItemIds.delete(id); renderItensTab(); }

   Como todo modal do app reaproveita o mesmo id="modal-overlay" (um modal por vez), não dá
   pra empilhar o modal do produto em cima do modal do processo sem quebrar o fechamento —
   por isso salva o processo primeiro (mesma função usada ao adicionar/remover item) e só
   depois troca de modal, pra não perder nada que estava sendo editado. */

  await autoPersistCurrentProcess();

  openProductModal(pn);
}

    const valorAlterado = it.valorUnitarioMestre!==undefined && it.valorUnitarioMestre!=='' && String(it.valorUnitarioMestre)!==String(it.valorUnitarioUsado);
    const alteradoHtml = valorAlterado ? `<br><span class="form-hint" style="color:var(--ink-amber);">✏️ Valor alterado manualmente — cadastrado: ${fmtUSD(parseFloat(it.valorUnitarioMestre)||0)}</span>` : '';

    if(canEditHere && editingItemIds.has(it.id)){
      return `
      <div class="item-row">

        <span class="item-desc">${it.descricao||'—'}${alteradoHtml}</span>
        <input type="text" inputmode="decimal" value="${it.valorUnitarioUsado?fmtNumberBR(it.valorUnitarioUsado):''}" oninput="maskCurrencyInput(this); updateItemField(${idx},'valorUnitarioUsado', parseBRMasked(this.value));" title="Valor unitário usado neste processo" style="font-family:'IBM Plex Mono',monospace; font-weight:700;">
        <input type="number" step="1" value="${it.quantidade}" oninput="updateItemField(${idx},'quantidade', this.value)" style="font-family:'IBM Plex Mono',monospace; font-weight:700;">
        <span style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; text-align:right;">${fmtUSD((parseFloat(it.valorUnitarioUsado)||0)*(parseFloat(it.quantidade)||0))}</span>
        <button class="btn btn-primary" style="padding:4px 10px; font-size:11px;" onclick="finishEditingItem('${it.id}')">OK</button>
      </div>
    `;
    }

    return `
      <div class="item-row">
        <span class="item-pn item-pn-link" onclick="openItemMasterProduct('${it.pn.replace(/'/g,"\\'")}')" title="Ver cadastro no Banco de Itens">${it.pn}</span>
        <span class="item-desc">${it.descricao||'—'}${alteradoHtml}</span>
        <span style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px;">${fmtUSD(parseFloat(it.valorUnitarioUsado)||0)}</span>
        <span style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px;">${it.quantidade}</span>
        <span style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; text-align:right;">${fmtUSD((parseFloat(it.valorUnitarioUsado)||0)*(parseFloat(it.quantidade)||0))}</span>

          <div style="display:flex; gap:4px;">
            <button class="btn" style="padding:4px 7px; font-size:11px;" onclick="startEditingItem('${it.id}')" title="Editar">✎</button>

/* Cada linha do Andamento mostra "Título: data" — mas o título precisa ser específico, não
   genérico. "Documento adicionado" vira o nome do documento (ex: "Comercial Invoice (Fatura)
   adicionado"); "Processo alterado para outro estágio" vira só o nome da etapa de destino,
   sem o prefixo "Fase N ·". Os demais eventos já nascem específicos (detectHistoryChanges) e
   não precisam de tratamento — usam o próprio título. */
function narrativeLine(ev){
  const dataEvento = fmtDate(new Date(ev.ts).toISOString().slice(0,10));
  let titulo;
  if(ev.manual){
    titulo = ev.detail || ev.title;
  } else if(ev.title==='Documento adicionado' || ev.title==='Documento removido'){
    const acao = ev.title==='Documento adicionado' ? 'adicionado' : 'removido';
    titulo = ev.detail ? `${ev.detail} ${acao}` : ev.title;
  } else if(ev.title==='Processo alterado para outro estágio'){
    const partes = String(ev.detail||'').split('→');
    const destino = (partes[partes.length-1]||'').trim().replace(/^Fase\s*\d+\s*·\s*/,'');
    titulo = destino || ev.title;
  } else {
    titulo = ev.title;
  }
  return `${titulo}: ${dataEvento}`;
}

function buildCompactNarrative(p){
  const events = (p.history||[]).slice().sort((a,b)=>a.ts-b.ts);
  if(!events.length) return 'Sem eventos registrados ainda.';
  return events.map(narrativeLine).join('\n');
}

function escHtmlSimple(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Formata um texto de ANDAMENTO (uma "linha" por marco, ex: "Carga embarcada: 12/06/2026")
   deixando as palavras em negrito e as datas (DD/MM/AAAA) sem negrito, pra ficar fácil de
   escanear visualmente qual é o marco e qual é a data — tanto no card do Follow-up dentro do
   app quanto na tabela HTML gerada pra colar em e-mail. Genérico o bastante pra funcionar em
   qualquer linha (não depende de um separador fixo tipo ":"), só localiza datas no formato
   DD/MM/AAAA e deixa todo o resto em negrito. */
function formatAndamentoHtml(text){
  const DATE_RE = /\d{2}\/\d{2}\/\d{4}/g;
  const lines = String(text||'').split('\n');
  return lines.map(line=>{
    let result = '';
    let lastIndex = 0;
    let m;
    DATE_RE.lastIndex = 0;
    while((m = DATE_RE.exec(line)) !== null){
      const before = line.slice(lastIndex, m.index);
      if(before) result += `<b>${escHtmlSimple(before)}</b>`;
      result += escHtmlSimple(m[0]); // a data em si, sem negrito
      lastIndex = DATE_RE.lastIndex;
    }
    const rest = line.slice(lastIndex);
    if(rest) result += `<b>${escHtmlSimple(rest)}</b>`;
    return result;
  }).join('<br>');
}

/* ---------- GERAÇÃO DE FOLLOW-UP EM TABELA (formato fixo pedido) ---------- */
/* Sempre gera uma tabela markdown com estas 14 colunas, nesta ordem — nunca texto corrido.
   Cada valor vem de dado real do processo; nada é inventado (campo sem dado fica em branco). */
const FOLLOWUP_TABLE_HEADERS = ['PROCESSO','FORNECEDOR','Data Pedido','Descrição do Produto','PRONTIDÃO','Embarque','CHEGADA BR','TRANSIT\n(dias)','FREETIME\n(dias)','DEVOLUÇÃO','MODAL','Origem','Status','ANDAMENTO'];
/* Ordem canônica dos 9 status, do mais inicial ao mais avançado — usada tanto pra escolher
   o status de cada processo quanto pro quadro de contagem no topo da tabela. */
const FOLLOWUP_STATUS_ORDER = ['Em produção','Aguardando Embarque','Em trânsito','Transporte DTA','Em processo de desembaraço','Aguardando carimbo do estado','Em remoção','Entregue','Finalizado'];
const FOLLOWUP_FORNECEDOR_POR_LETRA = {C:'CARESTREAM', M:'MORITA', G:'GENORAY'};

function fmtDateOrBlank(d){ return d ? fmtDate(d) : ''; }

/* Status: sempre o mais avançado já atingido, dentre os 9 valores fixos pedidos. Usa a
   granularidade real do checklist (não só o bucket do painel) pra distinguir "Transporte
   DTA" de "Em processo de desembaraço" de "Aguardando carimbo do estado". */
function getFollowUpStatus(p){
  if(isProcessDone(p)) return 'Finalizado';

  const stages = getStagesForProcess(p);
  const checklist = p.checklist || {};

  const fase7Stage = stages.find(s=>s.key==='fase7');
  const fase7 = checklist['fase7']||[];
  if(fase7Stage){
    if(fase7Stage.receiptItemIndex!=null && fase7[fase7Stage.receiptItemIndex]) return 'Entregue';
    if(fase7.some(Boolean)) return 'Em remoção';
  }

  const fase6Stage = stages.find(s=>s.key==='fase6');
  const fase6 = checklist['fase6']||[];
  if(fase6Stage){
    const desembaracoIdx = fase6Stage.items.indexOf('Desembaraço da DUIMP');
    const liberacaoIdx = fase6Stage.items.indexOf('Liberação SEFAZ');
    if(desembaracoIdx>=0 && fase6[desembaracoIdx]){
      if(!(liberacaoIdx>=0 && fase6[liberacaoIdx])) return 'Aguardando carimbo do estado';
    }
    if(fase6Stage.arrivalItemIndex!=null && fase6[fase6Stage.arrivalItemIndex]) return 'Em processo de desembaraço';
    if(fase6.some(Boolean)) return 'Transporte DTA';
  }

  const bucket = getBucket(p);
  if(bucket==='transito') return 'Em trânsito';
  if(bucket==='aguardando_embarque') return 'Aguardando Embarque';
  return 'Em produção';
}

/* ANDAMENTO: log cronológico reconstruído a partir dos dados reais do processo (datas e
   itens de checklist já preenchidos), no vocabulário e formato pedidos — "<Marco>: DD/MM/AAAA"
   por linha, mais antigo primeiro. O último marco (se ainda em aberto) não leva data —
   reaproveita currentStepLabel(), que já resolve qual é o item pendente mais antigo. */
function buildAndamentoLines(p){
  const extra = p.extra || {};
  const today = todayStr();
  const lines = [];
  const add = (label, dateStr) => { if(dateStr) lines.push(`${label}: ${fmtDate(dateStr)}`); };

  add('Data do pedido', p.dataPedido);

  if(p.prontidao){
    add(p.prontidao > today ? 'Prontidão prevista' : 'Prontidão confirmada', p.prontidao);
  }

  add('Carga embarcada', p.dataEmbarqueReal);

  const chegadaReal = extra.dataChegadaBetim;
  const nomeChegada = p.modal==='aereo' ? 'Chegada em Confins' : 'Chegada no Brasil';
  if(chegadaReal){
    add(`${nomeChegada} confirmada`, chegadaReal);
  } else if(p.chegadaPrevista){
    add(`${nomeChegada} prevista`, p.chegadaPrevista);
  }

  add('DTA iniciada', extra.dataAgendamentoDTA);

  if(extra.dataRegistroDUIMP){
    const canal = extra.canalDesembaraco ? ` (Canal ${extra.canalDesembaraco})` : '';
    lines.push(`DUIMP registrada${canal}: ${fmtDate(extra.dataRegistroDUIMP)}`);
  }

  add('DUIMP desembaraçada', extra.dataDesembaraco);
  add('Liberação do Estado', extra.dataLiberacaoSefaz);

  const stages = getStagesForProcess(p);
  const fase7Stage = stages.find(s=>s.key==='fase7');
  const fase7 = (p.checklist||{})['fase7']||[];
  if(fase7Stage && fase7Stage.receiptItemIndex!=null && fase7[fase7Stage.receiptItemIndex]){
    lines.push('Carga removida e recebida em estoque');
  }

  if(extra.numeroNF) lines.push(`NF de entrada: ${extra.numeroNF}`);

  if(!isProcessDone(p)){
    const pendente = currentStepLabel(p);
    if(pendente && pendente!=='Concluído') lines.push(pendente.replace(/^Pendente: /,'Aguardando '));
  }

  return lines.join('\n');
}

function buildFollowUpTableRow(p){
  const extra = p.extra || {};
  const fornecedorCadastrado = state.suppliers.find(s=>s.id===p.supplierId);
  let fornecedor = fornecedorCadastrado ? fornecedorCadastrado.name.toUpperCase() : '';
  if(!['CARESTREAM','MORITA','GENORAY'].includes(fornecedor)){
    // Sem cadastro reconhecido — cai pra dedução pela letra inicial do PROCESSO, como pedido.
    const letra = (p.ref||'').trim().charAt(0).toUpperCase();
    fornecedor = FOLLOWUP_FORNECEDOR_POR_LETRA[letra] || fornecedor;
  }

  const descricao = p.produto || '';

  const isMaritimo = p.modal!=='aereo';
  let transit = '';
  if(p.dataEmbarqueReal && extra.dataChegadaBetim){
    transit = String(daysBetween(p.dataEmbarqueReal, extra.dataChegadaBetim));
  }

  const freetime = isMaritimo ? (extra.freetime || '-') : '-';

  let devolucao = '';
  if(isMaritimo){
    const baseChegadaZP = extra.dataChegadaZonaPrimaria || extra.dataChegadaBetim;
    if(baseChegadaZP && extra.freetime){
      const dt = new Date(baseChegadaZP+'T00:00:00');
      dt.setDate(dt.getDate() + (parseInt(extra.freetime)||0) - 1);
      devolucao = fmtDate(dt.toISOString().slice(0,10));
    }
  } else {
    devolucao = '-';
  }

  const chegadaConfirmada = !!extra.dataChegadaBetim;
  const chegadaValorBase = extra.dataChegadaBetim || p.chegadaPrevista;
  const chegadaBR = chegadaValorBase ? (fmtDate(chegadaValorBase) + (chegadaConfirmada ? '' : ' (prevista)')) : '';

  return {
    processo: p.ref || '',
    fornecedor,
    dataPedido: fmtDateOrBlank(p.dataPedido),
    descricao,
    prontidao: fmtDateOrBlank(p.prontidao),
    embarque: fmtDateOrBlank(p.dataEmbarqueReal),
    chegadaBR,
    chegadaConfirmada,
    transit,
    freetime,
    devolucao,
    modal: isMaritimo ? 'MARÍTIMO' : 'AÉREO',
    origem: p.origemPais || '',
    status: getFollowUpStatus(p),
    andamento: buildAndamentoLines(p),
  };
}

/* Gera a tabela markdown com as 14 colunas na ordem exata — célula com múltiplas linhas
   (Descrição do Produto, ANDAMENTO) usa "\n" literal dentro da célula (2 caracteres, não
   quebra de linha real — isso quebraria a sintaxe da tabela, que precisa de 1 linha física
   por linha da tabela). Os dados em si (buildFollowUpTableRow) guardam quebra de linha real;
   a conversão pro literal acontece só aqui, na hora de montar o texto markdown. */
function generateFollowUpMarkdownTable(processes){
  const toLiteral = s => String(s==null?'':s).replace(/\n/g,'\\n');
  const header = `| ${FOLLOWUP_TABLE_HEADERS.map(toLiteral).join(' | ')} |`;
  const sep = `|${FOLLOWUP_TABLE_HEADERS.map(()=>'---').join('|')}|`;
  const rows = processes.map(p=>{
    const r = buildFollowUpTableRow(p);
    const cells = [r.processo, r.fornecedor, r.dataPedido, r.descricao, r.prontidao, r.embarque, r.chegadaBR, r.transit, r.freetime, r.devolucao, r.modal, r.origem, r.status, r.andamento];
    return `| ${cells.map(toLiteral).join(' | ')} |`;
  });
  return [header, sep, ...rows].join('\n');
}

function processFollowUpMeta(p){
  const fornecedor = state.suppliers.find(s=>s.id===p.supplierId);
  const extra = p.extra || {};
  const chegadaReal = extra.dataChegadaBetim;
  let transit = '';
  if(p.dataEmbarqueReal && (chegadaReal||p.chegadaPrevista)){
    transit = daysBetween(p.dataEmbarqueReal, chegadaReal||p.chegadaPrevista) + 'd' + (chegadaReal?'':' (est.)');
  }
  const devolucao = containerReturnDate(p);
  return {
    ref: p.ref || ('REF-'+p.id.slice(0,6).toUpperCase()),
    fornecedor: fornecedor ? fornecedor.name : '—',
    produto: p.produto || 'Sem descrição',
    dataPedido: fmtDate(p.dataPedido),
    prontidao: fmtDate(p.prontidao),
    embarque: fmtDate(p.dataEmbarqueReal),
    chegada: fmtDate(chegadaReal || p.chegadaPrevista) + (chegadaReal ? '' : ' (prevista)'),
    chegadaConfirmada: !!chegadaReal,
    transit: transit || '—',
    freetime: extra.freetime ? extra.freetime+'d' : '—',
    devolucao: devolucao ? fmtDate(devolucao.date) : '—',
    modal: modalLabel(p.modal),
    origem: p.origemPais || '—',
    status: stageInfoFor(p, p.status).label,
  };
}

        ${viewFieldHtml('Embarque', m.embarque)}
        ${viewFieldHtml('Chegada BR', m.chegadaConfirmada ? m.chegada : `<span class="chegada-prevista-tag">${m.chegada}</span>`)}
        ${viewFieldHtml('Transit', m.transit)}

        ${viewFieldHtml('Devolução', m.devolucao)}

function generateFollowUpTextForProcess(p){
  const m = processFollowUpMeta(p);
  let text = `${m.ref} — ${m.fornecedor} — ${m.produto}\n`;
  text += `Pedido: ${m.dataPedido} | Prontidão: ${m.prontidao} | Embarque: ${m.embarque} | Chegada BR: ${m.chegada}\n`;
  text += `Transit: ${m.transit} | Freetime: ${m.freetime} | Devolução: ${m.devolucao} | Modal: ${m.modal} | Origem: ${m.origem}\n`;
  text += `Status: ${m.status}\n`;
  text += buildCompactNarrative(p) + '\n';
  return text;
}

function generateFollowUpTextAll(){
  const active = state.processes.filter(p=>getBucket(p)!=='finalizados');

/* Larguras pensadas pra cada coluna não ficar espremida — datas/códigos curtos ganham
   pouco espaço, Descrição/Status/ANDAMENTO ganham mais (senão o texto fica ilegível
   amontoado, especialmente Status com rótulos longos tipo "Aguardando carimbo do estado"). */
const FOLLOWUP_COLUMN_WIDTHS = ['60px','90px','75px','140px','75px','75px','75px','55px','55px','75px','75px','85px','160px','340px'];

/* Tabela em HTML de verdade (não markdown) — pensada pra ser colada em e-mail (Outlook/
   Gmail). Célula com múltiplas linhas usa <br> (que sobrevive à colagem rica), diferente da
   versão markdown (generateFollowUpMarkdownTable) que usa "\n" literal e serve pra colar em
   lugares que entendem markdown de verdade. Mesmo padrão de tabela em HTML já usado no
   e-mail de Nota Fiscal. Vem com um quadro de contagem por Status no topo, igual à planilha
   de referência (aba Controle). */
function generateFollowUpStatusSummaryHtml(processes){
  const counts = {};
  FOLLOWUP_STATUS_ORDER.forEach(s=>counts[s]=0);
  processes.forEach(p=>{ const s = getFollowUpStatus(p); counts[s] = (counts[s]||0)+1; });

  const cellStyle = 'border:1px solid #333; padding:5px 10px; font-size:11.5px;';
  const rows = FOLLOWUP_STATUS_ORDER.map(s=>`<tr><td style="${cellStyle}">${s}</td><td style="${cellStyle} text-align:center; font-weight:700;">${counts[s]}</td></tr>`).join('');
  return `<table style="border-collapse:collapse; margin-bottom:14px;"><tr><th colspan="2" style="${cellStyle} background:#e9edf5; font-weight:700; text-align:left;">FOLLOW UP — ${processes.length} processo(s)</th></tr>${rows}</table>`;
}

function generateFollowUpHtmlTable(processes){
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const thStyle = i => `border:1px solid #333; padding:6px 9px; background:#e9edf5; font-weight:700; text-align:left; font-size:11.5px; width:${FOLLOWUP_COLUMN_WIDTHS[i]};`;
  const tdStyle = 'border:1px solid #333; padding:6px 9px; font-size:11.5px; vertical-align:top;';
  const tdStyleChegadaPrevista = tdStyle + ' background:#fef3c7; color:#92400e; font-weight:600;';

  const headerHtml = FOLLOWUP_TABLE_HEADERS.map((h,i)=>`<th style="${thStyle(i)}">${esc(h)}</th>`).join('');
  const rowsHtml = processes.map(p=>{
    const r = buildFollowUpTableRow(p);
    // CHEGADA BR (índice 6) ganha fundo amarelo quando a chegada ainda não foi confirmada
    // (mostrando a data prevista) — e ANDAMENTO (índice 13) vai com marcos em negrito e
    // datas sem negrito, pra facilitar a leitura rápida na tabela colada no e-mail.
    const cells = [
      {v:r.processo}, {v:r.fornecedor}, {v:r.dataPedido}, {v:r.descricao}, {v:r.prontidao}, {v:r.embarque},
      {v:r.chegadaBR, style: (!r.chegadaConfirmada && r.chegadaBR) ? tdStyleChegadaPrevista : tdStyle},
      {v:r.transit}, {v:r.freetime}, {v:r.devolucao}, {v:r.modal}, {v:r.origem}, {v:r.status},
      {v:formatAndamentoHtml(r.andamento), raw:true},
    ];
    return `<tr>${cells.map(c=>`<td style="${c.style||tdStyle}">${c.raw ? c.v : esc(c.v)}</td>`).join('')}</tr>`;
  }).join('');

  const summaryHtml = generateFollowUpStatusSummaryHtml(processes);
  return `${summaryHtml}<table style="border-collapse:collapse; table-layout:fixed; width:100%;"><thead><tr>${headerHtml}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
}

/* Fallback só-texto (sem HTML) pra quando o navegador não suportar a cópia rica — usa TAB
   entre colunas (cola bem em Excel/Sheets se precisar) e "\n" literal dentro da célula
   (quebra de linha real quebraria as linhas/colunas do TSV). */
function generateFollowUpPlainText(processes){
  const toLiteral = s => String(s==null?'':s).replace(/\n/g,'\\n');
  const header = FOLLOWUP_TABLE_HEADERS.map(toLiteral).join('\t');
  const rows = processes.map(p=>{
    const r = buildFollowUpTableRow(p);
    const cells = [r.processo, r.fornecedor, r.dataPedido, r.descricao, r.prontidao, r.embarque, r.chegadaBR, r.transit, r.freetime, r.devolucao, r.modal, r.origem, r.status, r.andamento];
    return cells.map(toLiteral).join('\t');
  });
  return [header, ...rows].join('\n');
}

/* Modal único de preview — reaproveitado tanto pro follow-up de 1 processo quanto de todos.
   Corpo renderizado num contenteditable com <table> de verdade (não textarea), pra manter
   a tabela ao colar num cliente de e-mail. Mesmo mecanismo de cópia rica (com fallback pra
   texto simples) já usado no e-mail de Nota Fiscal. */
function openFollowUpTablePreview(processes, title){
  const htmlTable = generateFollowUpHtmlTable(processes);
  const plainFallback = generateFollowUpPlainText(processes);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'followup-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:1100px;">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="modal-close" onclick="document.getElementById('followup-overlay').remove()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-hint" style="margin-bottom:10px;">A tabela abaixo é editável — clique e ajuste o que precisar antes de copiar. Ao colar num e-mail (Outlook/Gmail), a tabela vem com bordas e colunas de verdade, não como texto com barras.</div>
        <div id="followup-table-body" contenteditable="true" style="width:100%; max-height:480px; overflow:auto; font-family:Arial,Helvetica,sans-serif; padding:10px; border:1px solid var(--border-strong); border-radius:6px; background:#fff;">${htmlTable}</div>
      </div>
      <div class="modal-footer">
        <div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="document.getElementById('followup-overlay').remove()">Fechar</button>
          <button class="btn btn-primary" onclick="copyFollowUpTableToClipboard()">Copiar Tabela</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.dataset.plainFallback = plainFallback;
}

function copyFollowUpTableToClipboard(){
  const el = document.getElementById('followup-table-body');
  try{
    const range = document.createRange();
    range.selectNodeContents(el);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    const ok = document.execCommand('copy');
    selection.removeAllRanges();
    if(ok){
      alert('Tabela copiada! Agora é só colar no e-mail — as colunas e bordas vêm junto.');
      return;
    }
    throw new Error('execCommand retornou false');
  }catch(e){
    const overlay = document.getElementById('followup-overlay');
    const fallback = overlay ? overlay.dataset.plainFallback : el.innerText;
    const ta = document.createElement('textarea');
    ta.value = fallback || el.innerText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      alert('Tabela copiada como texto simples (colunas separadas por Tab) — seu navegador não suportou a cópia rica.');
    }catch(e2){
      alert('Não foi possível copiar automaticamente. Selecione o conteúdo manualmente.');
    }
    document.body.removeChild(ta);
  }
}

/* =====================================================================================
   EXTRAÇÃO DE LOTES E DATAS DE FABRICAÇÃO — a partir das faturas anexadas ao processo
   Cada Produto Mestre pode ter sua própria regra de leitura (registry, igual ao padrão já
   usado nas regras de armazenagem por recinto) — hoje só "Químicos" está implementada, mas
   a arquitetura já está pronta pra receber novas regras sem mexer no resto da funcionalidade.
   NUNCA inventa dado: o que não é identificado com segurança no PDF fica marcado como tal,
   nunca é presumido nem copiado de outro lote/fatura.
   ===================================================================================== */
const LOTE_EXTRACTION_RULES = {
  quimicos: {
    label: 'Químicos',
    /* Fatura modelo: Carestream/Fujifilm — bloco por Material Number, com uma ou mais
       linhas "Qty Batch Bottle Lot Mfg Date" + "Exp Date" logo abaixo, e uma lista de
       PACKAGE# que é só detalhe de embalagem (não são lotes novos, nunca conta pra soma). */
    parseInvoiceText(text){
      const norm = String(text||'').replace(/\s+/g, ' ').trim();
      // PN: "Material Number" + peso + quantidade + "EA" (formato fixo da fatura Carestream)
      const pnMatches = [];
      const pnRegex = /(\d{6,8})\s+[\d.,]+\s+[\d,]+\s+EA\s+/g;
      let pm;
      while((pm = pnRegex.exec(norm)) !== null){
        pnMatches.push({ index: pm.index, pn: pm[1] });
      }
      // Lote: Qty Batch BottleLot MfgDate ... Exp Date ExpDate — não depende do cabeçalho
      // "Qty Batch Bottle Lot Mfg Date" estar logo antes (mais robusto a variação de layout
      // do texto extraído do PDF), só da sequência de dados + a palavra "Exp Date".
      const lotRegex = /(\d[\d,]*)\s+(\S+)\s+(\S+)\s+(\d{1,2}\/\d{1,2}\/\d{2,4})\s+Exp Date\s+(\d{1,2}\/\d{1,2}\/\d{2,4})/g;
      const lots = [];
      let lm;
      while((lm = lotRegex.exec(norm)) !== null){
        const [, qty, batch, bottleLot, mfgDate, expDate] = lm;
        // acha o PN mais próximo ANTES da posição deste lote
        let pn = null;
        for(const p of pnMatches){ if(p.index <= lm.index) pn = p.pn; else break; }
        lots.push({
          pn: pn || '⚠️ PN não identificado',
          bottleLot, quantidade: parseInt(String(qty).replace(/,/g,''),10)||0,
          manufactureDate: mfgDate, expireDate: expDate,
        });
      }
      return lots;
    }
  },
  filme: {
    label: 'Filme / E-Speed (Package-Batch-Exp Date)',
    /* Fatura modelo: Carestream (E-Speed, Insight, Filme DVE, GBX Revelador/Fixador) — bloco
       por Material Number, com uma tabela "Package Qty Batch Exp Date" logo abaixo, e depois
       um resumo "PACKAGE# QUANTITY..." que NUNCA deve ser lido como lote: às vezes esse resumo
       repete Batch+Exp Date do único lote do material, o que geraria contagem em dobro se não
       fosse cortado fora explicitamente (bug real encontrado e corrigido durante os testes).
       Esta fatura não traz Data de Fabricação — ela é calculada a partir da Validade do Produto
       (cadastrada no Produto Mestre) subtraída da Expire Date, por isso computesManufactureFromValidade. */
    computesManufactureFromValidade: true,
    parseInvoiceText(text){
      const norm = String(text||'').replace(/\s+/g, ' ').trim();
      const pnMatches = [];
      const pnRegex = /(\d{6,8})\s+[\d.,]+\s+[\d,]+\s+EA\s+/g;
      let pm;
      while((pm = pnRegex.exec(norm)) !== null){
        pnMatches.push({ index: pm.index, pn: pm[1] });
      }
      const lots = [];
      const lotRegex = /(\S+)\s+(\d{1,6})\s+(\S+)\s+(20\d{6})\b/g;
      pnMatches.forEach((p, idx)=>{
        const blockEnd = idx+1 < pnMatches.length ? pnMatches[idx+1].index : norm.length;
        let block = norm.slice(p.index, blockEnd);
        // corta fora a seção de resumo por embalagem — nunca é fonte de lote
        const totalsIdx = block.indexOf('PACKAGE#');
        if(totalsIdx >= 0) block = block.slice(0, totalsIdx);
        lotRegex.lastIndex = 0;
        let lm;
        while((lm = lotRegex.exec(block)) !== null){
          const [, , qty, batch, expRaw] = lm;
          const y = expRaw.slice(0,4), mo = expRaw.slice(4,6), d = expRaw.slice(6,8);
          lots.push({
            pn: p.pn, bottleLot: batch, quantidade: parseInt(qty,10)||0,
            expireDate: `${d}/${mo}/${y}`,
          });
        }
      });
      return lots;
    }
  },
  equipamentos: {
    label: 'Equipamentos (Serial único — Morita)',
    /* Fatura modelo: J. Morita — cada item é "NO. CODE DESCRIÇÃO QTY unidade US$preço US$total",
       seguido por um ou mais blocos "Serial number ... / Manufacture date ...". O LOTE aqui é
       sempre o PRIMEIRO serial number do item (o do próprio equipamento — o que vem marcado no
       anexo), ignorando os seriais dos acessórios que vêm listados logo depois (capture box,
       software) — esses pertencem à regra "I-Dixel", não a esta. */
    parseInvoiceText(text){ return moritaFindItems(text, false); }
  },
  idixel: {
    label: 'I-Dixel / Chaves (Faixa de Serial — Morita)',
    /* Mesma fatura Morita, mas pra itens cujo próprio serial já vem como uma FAIXA
       ("Serial numbers Ser.Nos. X～Y"), como o USB Key — não confundir com a faixa do
       i-Dixel Client Software que aparece DENTRO de um item de equipamento (essa é ignorada
       aqui; só entra a faixa que é a identificação principal do próprio item da fatura). */
    parseInvoiceText(text){ return moritaFindItems(text, true); }
  }
};

const MORITA_MONTH_MAP = {January:'01',February:'02',March:'03',April:'04',May:'05',June:'06',July:'07',August:'08',September:'09',October:'10',November:'11',December:'12'};

/* Expande uma faixa de serial "PREFIXOxxxx～PREFIXOyyyy" em uma lista com CADA número
   individual (ex: Z901K017438～Z901K017457 vira 20 seriais, um por linha) — acha o prefixo
   comum entre início e fim, e incrementa só a parte numérica que muda, preservando os zeros
   à esquerda. Se não conseguir identificar um padrão numérico, devolve só os dois extremos
   (fallback seguro — nunca inventa um serial no meio que não seja garantidamente sequencial). */
function expandSerialRange(start, end){
  let i = 0;
  while(i < start.length && i < end.length && start[i] === end[i]) i++;
  const prefix = start.slice(0, i);
  const startNum = start.slice(i);
  const endNum = end.slice(i);
  if(!/^\d+$/.test(startNum) || !/^\d+$/.test(endNum)) return [start, end];
  const width = startNum.length;
  const startN = parseInt(startNum, 10);
  const endN = parseInt(endNum, 10);
  const result = [];
  for(let n = startN; n <= endN; n++){
    result.push(prefix + String(n).padStart(width, '0'));
  }
  return result;
}

/* Motor compartilhado pelas regras "equipamentos" e "idixel" (mesma fatura Morita, mesma
   lógica de leitura) — a única diferença é se o PRIMEIRO serial number encontrado dentro do
   item é único (equipamentos) ou uma faixa X～Y (idixel); wantRange escolhe qual tipo aceitar.
   Pra faixas, cada serial individual da faixa vira sua própria linha (quantidade 1 cada),
   não uma linha só com a faixa inteira — batendo item a item com o que está na fatura. */
function moritaFindItems(text, wantRange){
  const norm = String(text||'').replace(/\s+/g, ' ').trim();
  // Cabeçalho de item: "NO. CODE DESCRIÇÃO QTY set|pcs US$preço US$total"
  const headerRegex = /(\d{3})\s+(\d{5,8})\s+(.+?)\s+(\d+(?:\.\d+)?)\s+(?:set|pcs\.?)\s+US\$[\d,]+\.\d{2}\s+US\$[\d,]+\.\d{2}/g;
  const headers = [];
  let hm;
  while((hm = headerRegex.exec(norm)) !== null){
    headers.push({ index: hm.index, end: headerRegex.lastIndex, pn: hm[2], qty: parseFloat(hm[4])||0 });
  }
  // Só o PRIMEIRO "Serial number(s) ... Manufacture date ..." dentro do trecho de cada item —
  // os seriais de acessórios que vêm depois (capture box, i-Dixel software) não entram.
  const serialRegex = /Serial numbers?\s+(?:Ser\.Nos\.\s+)?([A-Za-z0-9]+)(?:\s*[～~]\s*([A-Za-z0-9]+))?\s*-?\s*Manufacture date\s+([A-Za-z]+)\s*\/\s*(\d{4})/;
  const lots = [];
  headers.forEach((h, idx)=>{
    const blockEnd = idx+1 < headers.length ? headers[idx+1].index : norm.length;
    const block = norm.slice(h.end, blockEnd);
    const sm = serialRegex.exec(block);
    if(!sm) return;
    const isRange = !!sm[2];
    if(isRange !== wantRange) return;
    const mesNum = MORITA_MONTH_MAP[sm[3]] || '';
    // Fatura só traz Mês/Ano, sem dia — não inventa um dia, mostra "MM/AAAA".
    const manufactureDate = mesNum ? `${mesNum}/${sm[4]}` : sm[4];
    if(isRange){
      const seriais = expandSerialRange(sm[1], sm[2]);
      if(seriais.length !== h.qty){
        console.warn(`Fatura Morita: a faixa ${sm[1]}～${sm[2]} do item ${h.pn} tem ${seriais.length} número(s), mas a fatura declara quantidade ${h.qty}. Conferir manualmente.`);
      }
      seriais.forEach(serial=>{
        lots.push({ pn: h.pn, bottleLot: serial, quantidade: 1, expireDate: '', manufactureDate });
      });
    } else {
      lots.push({ pn: h.pn, bottleLot: sm[1], quantidade: h.qty, expireDate: '', manufactureDate });
    }
  });
  return lots;
}

/* Subtrai meses/anos de uma data DD/MM/AAAA, mantendo o mesmo dia do mês (regra pedida:
   ex. Exp 24/08/2028 - 36 meses = Fab 24/08/2025). Usada pra calcular a Manufacture Date
   quando a fatura não a traz diretamente (ex: regra "filme"). */
function subtractFromDate(ddmmaaaa, qtd, unidade){
  const parts = String(ddmmaaaa||'').split('/');
  if(parts.length!==3) return null;
  const d = parseInt(parts[0],10), m = parseInt(parts[1],10);
  let year = parseInt(parts[2],10), month = m;
  if(unidade==='anos'){ year -= qtd; }
  else { month -= qtd; while(month <= 0){ month += 12; year -= 1; } }
  return String(d).padStart(2,'0') + '/' + String(month).padStart(2,'0') + '/' + year;
}

/* Soma quantidades quando PN+Bottle Lot são exatamente iguais (ex: mesmo lote dividido em
   vários Packages) — nunca junta lotes diferentes, mesmo com mesmo PN/datas. */
function consolidateLots(lots){
  const groups = {};
  const order = [];
  lots.forEach(l=>{
    const key = l.pn + '|' + l.bottleLot;
    if(!groups[key]){ groups[key] = {...l}; order.push(key); }
    else{ groups[key].quantidade += l.quantidade; }
  });
  return order.map(k=>groups[k]);
}

/* PNs únicos dos itens já cadastrados no processo (aba Itens) — é daqui, e não mais do
   Produto Mestre, que a extração de lotes descobre qual regra usar pra cada produto. Isso
   também permite um mesmo processo/fatura ter PNs com regras DIFERENTES (ex: equipamento
   com serial único + acessório com faixa de serial), coisa que um único Produto Mestre não
   conseguia representar. */
function getProcessItemPNs(p){
  return Array.from(new Set((p.itens||[]).map(it=>it.pn).filter(Boolean)));
}

/* Cache em memória (pn -> produto do Banco de Itens, ou null se não cadastrado) — evita
   buscar o mesmo PN toda hora que a aba Lotes re-renderiza. */
window.__lotesProductsCache = window.__lotesProductsCache || {};

/* Faturas anexadas ao processo — tanto no tipo fixo "Comercial Invoice (Fatura)" quanto em
   documentos personalizados cujo nome contenha "fatura"/"invoice" (ex: "Segunda Fatura"),
   pra suportar múltiplas faturas no mesmo processo sem mudar o sistema de Documentos. */
function getInvoiceDocEntries(p){
  const docFiles = p.docFiles || {};
  const entries = [];
  Object.keys(docFiles).forEach(key=>{
    const file = docFiles[key];
    if(!file || !file.url) return;
    let label = key;
    if(key.startsWith('custom:')){
      const id = key.replace('custom:','');
      const cd = (p.customDocs||[]).find(c=>c.id===id);
      label = cd ? cd.name : key;
    }
    if(/fatura|invoice/i.test(label)){
      entries.push({ key, label, url: file.url, name: file.name });
    }
  });
  return entries;
}

async function extractPdfText(url){
  if(typeof pdfjsLib==='undefined') throw new Error('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.');
  const pdf = await pdfjsLib.getDocument(url).promise;
  let fullText = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return fullText;
}

/* Monta {pn: ruleKey} só pra PNs que estão no processo E têm regra configurada no Banco de
   Itens — usa o cache já carregado (window.__lotesProductsCache), não busca nada aqui. */
function buildPnRuleMap(p){
  const map = {};
  getProcessItemPNs(p).forEach(pn=>{
    const prod = window.__lotesProductsCache[pn];
    if(prod && prod.tipoExtracaoLotes) map[pn] = prod.tipoExtracaoLotes;
  });
  return map;
}

async function extractAllLotes(){
  const p = window.__editingProcess;
  const pnRuleMap = buildPnRuleMap(p);
  const rulesInUse = Array.from(new Set(Object.values(pnRuleMap)));
  if(!rulesInUse.length) return;
  const invoices = getInvoiceDocEntries(p);
  if(!invoices.length) return;

  const btn = document.getElementById('lotes-extrair-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Lendo faturas...'; }

  const perInvoice = [];
  for(const inv of invoices){
    try{
      const text = await extractPdfText(inv.url);
      // Roda CADA regra em uso neste processo contra a mesma fatura, mas só aproveita de cada
      // regra os lotes cujo PN está de fato atribuído a ela — assim um PN de "Equipamentos"
      // não pega lote encontrado pela regra "I-Dixel" e vice-versa, mesmo lendo o mesmo PDF.
      let lotsRaw = [];
      rulesInUse.forEach(ruleKey=>{
        const rule = LOTE_EXTRACTION_RULES[ruleKey];
        if(!rule) return;
        rule.parseInvoiceText(text).forEach(l=>{
          if(pnRuleMap[l.pn]===ruleKey){ l.__ruleKey = ruleKey; lotsRaw.push(l); }
        });
      });
      const lots = consolidateLots(lotsRaw);
      perInvoice.push({ docLabel: inv.label, lots, error: lots.length ? null : 'Nenhum lote identificado nesta fatura com as regras configuradas — confira se o PDF é pesquisável (não uma imagem escaneada) e se segue o modelo esperado.' });
    }catch(e){
      console.error('Erro extraindo lotes de', inv.label, e);
      perInvoice.push({ docLabel: inv.label, lots: [], error: 'Não foi possível ler este PDF (' + (e.message||'erro desconhecido') + ').' });
    }
  }

  // A Manufacture Date (quando a regra de origem do lote não a traz direto da fatura) é
  // calculada a partir da Validade cadastrada no PN, no Banco de Itens.
  perInvoice.forEach(r=>{
    r.lots.forEach(l=>{
      const rule = LOTE_EXTRACTION_RULES[l.__ruleKey];
      if(!rule || !rule.computesManufactureFromValidade) return;
      const prod = window.__lotesProductsCache[l.pn];
      if(!prod){
        l.manufactureDate = '⚠️ PN não cadastrado no Banco de Itens';
      } else if(prod.validadeUnidade === 'indeterminado'){
        l.manufactureDate = 'Indeterminado (sem validade)';
      } else if(prod.validadeUnidade && prod.validadeQtd){
        l.manufactureDate = subtractFromDate(l.expireDate, prod.validadeQtd, prod.validadeUnidade) || '⚠️ Data inválida';
      } else {
        l.manufactureDate = '⚠️ Configure a Validade deste PN no Banco de Itens';
      }
    });
  });

  const resultados = perInvoice;
  window.__lotesResultados = resultados;
  p.lotesExtraidos = resultados; // fica salvo no processo — não precisa extrair de novo ao reabrir
  renderLotesTab();
  await autoPersistCurrentProcess();
}

function renderLotesTab(){
  const container = document.getElementById('lotes-content');
  if(!container) return;
  const p = window.__editingProcess;
  const pns = getProcessItemPNs(p);

  if(!pns.length){
    container.innerHTML = `<div class="form-hint">Nenhum item cadastrado neste processo ainda. Adicione os produtos na aba "Itens" — é o PN de cada item ali que define, lá no Banco de Itens, qual regra de extração de lotes será usada.</div>`;
    return;
  }

  // Se algum PN do processo ainda não foi consultado no Banco de Itens, busca agora e
  // re-renderiza sozinho quando terminar — não precisa fechar/reabrir o processo.
  const pending = pns.filter(pn => window.__lotesProductsCache[pn] === undefined);
  if(pending.length){
    container.innerHTML = `<div class="form-hint">Carregando dados dos produtos...</div>`;
    Promise.all(pending.map(async pn=>{
      try{ window.__lotesProductsCache[pn] = await getProductByPN(pn); }
      catch(e){ console.error('Erro ao buscar produto pra extração de lotes', pn, e); window.__lotesProductsCache[pn] = null; }
    })).then(renderLotesTab);
    return;
  }

  const pnRuleMap = buildPnRuleMap(p);
  const semCadastro = pns.filter(pn => !window.__lotesProductsCache[pn]);
  const semRegra = pns.filter(pn => window.__lotesProductsCache[pn] && !window.__lotesProductsCache[pn].tipoExtracaoLotes);
  const rulesInUse = Array.from(new Set(Object.values(pnRuleMap)));

  if(!rulesInUse.length){
    let msg = 'Nenhum item deste processo tem uma regra de extração de lotes configurada.';
    if(semCadastro.length) msg += ` PN(s) não cadastrados no Banco de Itens: ${semCadastro.join(', ')}.`;
    if(semRegra.length) msg += ` PN(s) sem regra definida: ${semRegra.join(', ')}.`;
    msg += ' Vá em Banco de Itens → edite o PN → "Extração de Lotes da Fatura".';
    container.innerHTML = `<div class="form-hint">${msg}</div>`;
    return;
  }

  const invoices = getInvoiceDocEntries(p);
  if(!invoices.length){
    container.innerHTML = `<div class="form-hint">Nenhuma fatura anexada ainda. Envie o arquivo em Documentos → "Comercial Invoice (Fatura)" (ou um documento personalizado com "Fatura"/"Invoice" no nome, se houver mais de uma) para habilitar a extração.</div>`;
    return;
  }

  const invoicesListHtml = invoices.map(i=>`<li>${i.label}${i.name?' — '+i.name:''}</li>`).join('');
  const rulesLabelHtml = rulesInUse.map(k=>LOTE_EXTRACTION_RULES[k] ? LOTE_EXTRACTION_RULES[k].label : k).join(', ');
  const avisosPendentes = [];
  if(semCadastro.length) avisosPendentes.push(`PN(s) não cadastrados no Banco de Itens: ${semCadastro.join(', ')}`);
  if(semRegra.length) avisosPendentes.push(`PN(s) sem regra de extração definida: ${semRegra.join(', ')}`);
  const semRegraHint = avisosPendentes.length ? `<div class="form-hint" style="margin-top:6px;">⚠️ Não entram na extração — ${avisosPendentes.join('; ')}.</div>` : '';
  const resultados = window.__lotesResultados || p.lotesExtraidos || null;

  container.innerHTML = `
    <div class="form-hint" style="margin-bottom:10px;">Regra(s) de extração em uso (definidas por PN, no Banco de Itens): <strong>${rulesLabelHtml}</strong>. Fatura(s) encontrada(s):</div>
    <ul style="margin:0 0 14px 20px; font-size:13px;">${invoicesListHtml}</ul>
    ${semRegraHint}
    <button id="lotes-extrair-btn" class="btn btn-pdf" onclick="extractAllLotes()">${resultados ? 'Extrair Novamente' : 'Extrair Lotes ' + (invoices.length>1?'de Todas as Faturas':'desta Fatura')}</button>
    ${resultados ? `<button class="btn" style="margin-left:8px;" onclick="downloadLotesExcel()">⬇️ Baixar Excel</button>` : ''}
    <div id="lotes-resultados" style="margin-top:16px;">${resultados ? renderLotesResultadosHtml(resultados) : ''}</div>
  `;
}

function renderLotesResultadosHtml(resultados){
  return resultados.map(r=>{
    if(r.error && !r.lots.length){
      return `<div class="prov-section" style="margin-bottom:14px;"><div class="prov-section-title">${r.docLabel.toUpperCase()}</div><div class="prov-warning">⚠️ ${r.error}</div></div>`;
    }
    const rows = r.lots.map(l=>`
      <tr>
        <td>${l.pn}</td>
        <td>${l.bottleLot}</td>
        <td style="text-align:right;">${l.quantidade}</td>
        <td>${l.bottleLot}</td>
        <td>${l.bottleLot}</td>
        <td>${l.expireDate}</td>
        <td>${l.manufactureDate}</td>
      </tr>
    `).join('');
    return `
      <div class="prov-section" style="margin-bottom:14px;">
        <div class="prov-section-title">${r.docLabel.toUpperCase()}</div>
        ${r.error ? `<div class="prov-warning" style="margin-bottom:8px;">⚠️ ${r.error}</div>` : ''}
        <table class="prov-mini-table">
          <tr><th>PN</th><th>LOTE</th><th>QUANTIDADE</th><th>LOTE</th><th>LOTE</th><th>EXPIRE DATE</th><th>MANUFACTURE DATE</th></tr>
          ${rows}
        </table>
      </div>
    `;
  }).join('');
}

function downloadLotesExcel(){
  const p = window.__editingProcess;
  const resultados = window.__lotesResultados || p.lotesExtraidos;
  if(!resultados || !resultados.length) return;

  const rows = [];
  resultados.forEach(r=>{
    rows.push(['FATURA', r.docLabel]);
    rows.push(['PN','LOTE','QUANTIDADE','LOTE','LOTE','EXPIRE DATE','MANUFACTURE DATE']);
    r.lots.forEach(l=>{
      rows.push([l.pn, l.bottleLot, l.quantidade, l.bottleLot, l.bottleLot, l.expireDate, l.manufactureDate]);
    });
    rows.push([]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Lotes');
  XLSX.writeFile(wb, `Lotes_${(p.ref||p.id).replace(/[^a-zA-Z0-9-]/g,'_')}.xlsx`);
}

/* Busca o parceiro Despachante selecionado na Fase 5 do processo (extra.despachante guarda
   o nome/"empresa" do parceiro, não o id — mesmo padrão usado nos outros campos type:'partner'). */
function getDespachantePartner(p){
  const nome = p.extra && p.extra.despachante;
  if(!nome) return null;
  return state.partners.find(pt=>pt.tipo==='Despachante' && pt.empresa===nome) || null;
}
function getDespachanteContatos(p){
  const partner = getDespachantePartner(p);
  if(!partner) return [];
  return (partner.contatosEmail||[]).filter(c=>c.nome || c.email);
}

/* Transportadora responsável pela DTA (extra.transportadoraDTA, Fase 6 · "Solicitar DTA") —
   mesmo padrão de getDespachantePartner/Contatos, usado no e-mail de DTA. */
function getTransportadoraDTAPartner(p){
  const nome = p.extra && p.extra.transportadoraDTA;
  if(!nome) return null;
  return state.partners.find(pt=>pt.tipo==='Transportadora' && pt.empresa===nome) || null;
}
function getTransportadoraDTAContatos(p){

/* Honorários do despachante: puxa automaticamente do cadastro do parceiro (Parceiros →
   Despachante → Honorários Padrão) enquanto o processo não tiver um valor próprio definido.
   Assim que o usuário editar e salvar pelo botão "Editar" do Provisionamento, o processo
   passa a ter seu próprio valor fixo (não recalcula mais sozinho, nem se o cadastro do
   despachante mudar depois) — mesmo padrão de "puxa automático até alguém sobrescrever"
   já usado nas alíquotas de NCM do Banco de Itens. */
function getHonorariosDespachante(p){
  const extra = p.extra || {};
  const manual = extra.provDespachanteHonorarios;
  if(manual!==undefined && manual!==null && manual!==''){
    return { valor: parseFloat(manual)||0, origem:'manual' };
  }
  const partner = getDespachantePartner(p);
  if(partner && partner.honorariosPadrao){
    return { valor: parseFloat(partner.honorariosPadrao)||0, origem:'partner', partnerNome: partner.empresa };
  }
  return { valor: 0, origem:'nenhum' };
}

/* Taxa Siscomex: mesmo padrão de "puxa automático até alguém sobrescrever" dos Honorários
   acima, só que na aba Custos (não Provisionamento) — puxa do cadastro do despachante
   (Parceiros → Despachante → Taxa Siscomex Padrão) enquanto o processo não tiver seu
   próprio valor definido (armazenado direto em p.taxaSiscomex, igual aos outros campos
   da aba Custos como ii/ipi/icms/despesas). */
function getTaxaSiscomexDespachante(p){
  const manual = p.taxaSiscomex;
  if(manual!==undefined && manual!==null && manual!==''){
    return { valor: parseFloat(manual)||0, origem:'manual' };
  }
  const partner = getDespachantePartner(p);
  if(partner && partner.taxaSiscomexPadrao){
    return { valor: parseFloat(partner.taxaSiscomexPadrao)||0, origem:'partner', partnerNome: partner.empresa };
  }
  return { valor: 0, origem:'nenhum' };
}

function generateEmailDTAText(p){

  const ccList = contatos.map(c=>c.email).filter(Boolean);

  return { subject, bodyHtml, bodyText, ccList };
}

function copyEmailBodyToClipboard(){
  const el = document.getElementById('email-body-text');
  try{
    const range = document.createRange();
    range.selectNodeContents(el);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    const ok = document.execCommand('copy');
    selection.removeAllRanges();
    if(ok){
      alert('Corpo do e-mail copiado (com a tabela)! Agora é só colar no seu cliente de e-mail.');
      return;
    }
    throw new Error('execCommand retornou false');
  }catch(e){
    const overlay = document.getElementById('email-overlay');
    const fallback = overlay ? overlay.dataset.bodyTextFallback : el.innerText;
    const ta = document.createElement('textarea');
    ta.value = fallback || el.innerText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      alert('Corpo copiado como texto simples (sem tabela) — seu navegador não suportou a cópia rica.');
    }catch(e2){
      alert('Não foi possível copiar automaticamente. Selecione o texto manualmente.');
    }
    document.body.removeChild(ta);
  }
}

function getStagesForProcess(p){
  if(p && p.tipo==='temporaria') return TEMP_STAGES;
  const isAereo = p && p.modal==='aereo';
  return STAGE_DEFS.map(s=>{
    if(s.key==='fase3'){
      const supplier = state.suppliers.find(x=>x.id===p.supplierId);
      let options = [];
      if(supplier && supplier.modalidades){
        if(supplier.modalidades.adiantado) options.push('Adiantado');
        if(supplier.modalidades.aPrazo && supplier.modalidades.aPrazo.checked) options.push(`A prazo (${supplier.modalidades.aPrazo.dias||'?'} dias)`);
        if(supplier.modalidades.factoring && supplier.modalidades.factoring.checked) options.push(`Factoring (${supplier.modalidades.factoring.dias||'?'} dias)`);
      }
      if(options.length===0) options = ['Adiantado','A prazo','Factoring'];
      const mp = p.extra && p.extra.modalidadePagamento;
      const label = mp ? `Pagamento (${mp})` : 'Pagamento';
      /* "Provisionamento Financeiro" fica no índice 1 (depois de "Pagamento", que permanece
         no índice 0) — assim nenhum processo já em andamento tem sua marcação de Pagamento
         deslocada de posição no checklist. */
      return {...s, items:[label, 'Provisionamento Financeiro'], extraFields:[{key:'modalidadePagamento', label:'Modalidade de Pagamento', type:'select', options}]};
    }

    if(s.key==='fase4' && isAereo){
      return {...s, containersItemIndex: undefined, itemFields:{
        1: s.itemFields[1],
        2: [
          {key:'numeroBooking', label:'Número do Booking', type:'text'},
          {key:'numeroAWB', label:'AWB', type:'text'},
          {key:'ciaAerea', label:'Companhia Aérea', type:'text'},
        ],
      }};
    }

    if(s.key==='fase5' && isAereo){
      const items = s.items.slice();
      items[0] = 'Aprovar Draft de AWB';
      return {...s, items, itemFields:{
        0: [{key:'numeroBL', label:'Número do AWB', type:'text'}],
        4: s.itemFields[4],
      }};
    }

    if(s.key==='fase6' && isAereo){
      const items = ['Chegada e presença'];
      const itemFields = {};
      const incluirDTA = p.aeroportoDestinoFinal !== true;
      if(incluirDTA){
        items.push('Início DTA');
        itemFields[items.length-1] = [{key:'dataAgendamentoDTA', label:'Data de Início', type:'date'}];
      }
      items.push('Chegada no Aeroporto de Confins');
      const arrivalItemIndex = items.length-1;
      itemFields[arrivalItemIndex] = [{key:'dataChegadaBetim', label:'Data de Chegada', type:'date'}];
      items.push('Pagar numerário despachante');
      items.push('Registro da DUIMP');
      itemFields[items.length-1] = [{key:'numeroDUIMP', label:'Número da DUIMP', type:'text'},{key:'chaveAcessoDUIMP', label:'Chave de Acesso da DUIMP', type:'text'},{key:'dataRegistroDUIMP', label:'Data de Registro', type:'date'}];
      items.push('Testar NF');
      items.push('Desembaraço da DUIMP');
      itemFields[items.length-1] = [{key:'canalDesembaraco', label:'Canal', type:'select', options:['Verde','Amarelo','Vermelho','Cinza']},{key:'dataDesembaraco', label:'Data do Desembaraço', type:'date'}];
      items.push('Liberação SEFAZ');
      itemFields[items.length-1] = [{key:'dataLiberacaoSefaz', label:'Data de Liberação SEFAZ', type:'date'}];
      return {...s, items, itemFields, arrivalItemIndex, extraFields: s.extraFields};
    }

    if(s.key==='fase7' && isAereo){
      const items = s.items.slice(0,4); // remove "Devolução do vazio" (não existe no aéreo)
      return {...s, items};
    }

    return s;
  });
}
function stageIndexFor(p, key){ return getStagesForProcess(p).findIndex(s=>s.key===key); }
function stageInfoFor(p, key){ const stages=getStagesForProcess(p); return stages.find(s=>s.key===key) || stages[0]; }

function initProcessData(p){
  p.extra = p.extra || {};
  p.payments = p.payments || {};
  p.checklist = p.checklist || {};
  p.docs = p.docs || {};
  p.docFiles = p.docFiles || {};
  p.customDocs = p.customDocs || [];
  p.itens = p.itens || [];
  p.customPayments = p.customPayments || [];
  /* Migração leve: "Invoice Comercial (Fatura)" foi renomeado pra "Comercial Invoice (Fatura)"
     (nome correto em inglês). Processos já existentes que tinham o documento marcado/anexado
     com a chave antiga continuam reconhecidos normalmente, sem precisar re-anexar o arquivo. */
  const LEGACY_DOC_KEY = 'Invoice Comercial (Fatura)', NEW_DOC_KEY = 'Comercial Invoice (Fatura)';
  if(p.docs[LEGACY_DOC_KEY] !== undefined && p.docs[NEW_DOC_KEY] === undefined){
    p.docs[NEW_DOC_KEY] = p.docs[LEGACY_DOC_KEY];
    delete p.docs[LEGACY_DOC_KEY];
  }
  if(p.docFiles[LEGACY_DOC_KEY] !== undefined && p.docFiles[NEW_DOC_KEY] === undefined){
    p.docFiles[NEW_DOC_KEY] = p.docFiles[LEGACY_DOC_KEY];
    delete p.docFiles[LEGACY_DOC_KEY];
  }
  /* Migração leve: "Referência do Fornecedor" era um campo de texto único — vira a primeira
     referência da nova lista (agora suporta mais de uma fatura por processo), sem perder o
     que já estava preenchido. */
  if(!p.referenciasFornecedor || !p.referenciasFornecedor.length){
    p.referenciasFornecedor = p.referenciaFornecedor ? [{id: uid(), ref: p.referenciaFornecedor}] : [];
  }
  syncInvoiceDocSlots(p);
  getStagesForProcess(p).forEach(s=>{
    if(s.type==='payments'){
      s.items.forEach(it=>{
        if(!p.payments[it.key]) p.payments[it.key] = {checked:false, valor:''};
      });
    } else {
      const existing = p.checklist[s.key] || [];
      p.checklist[s.key] = s.items.map((_,i)=> existing[i]===true);
    }
  });
  return p;
}

function stageComplete(p, stageKey){
  const stage = getStagesForProcess(p).find(s=>s.key===stageKey);
  if(!stage) return false;
  if(stage.type==='payments'){
    const fixedOk = stage.items.every(it=> (p.payments[it.key]||{}).checked===true);
    const customOk = (p.customPayments||[]).every(cp=> (p.payments['custom:'+cp.id]||{}).checked===true);
    return fixedOk && customOk;
  }
  const checked = p.checklist[stageKey] || [];
  return stage.items.every((_,i)=>checked[i]===true);
}

function stageHasProgress(p, s){
  if(s.type==='payments'){
    const fixedProgress = s.items.some(it=>(p.payments[it.key]||{}).checked);
    const customProgress = (p.customPayments||[]).some(cp=>(p.payments['custom:'+cp.id]||{}).checked);
    return fixedProgress || customProgress;
  }
  return (p.checklist[s.key]||[]).some(Boolean);
}

function recomputeStatus(p){
  const stages = getStagesForProcess(p);
  /* Etapa atual = a mais avançada que já tem algum marco batido, seguindo dali
     em diante pra primeira que ainda não está 100% completa. Isso evita que um
     item pendente de uma fase anterior (ex: rascunho da DUIMP) trave o processo
     numa etapa antiga quando ele já chegou fisicamente numa etapa posterior
     (ex: chegada em Confins/Santos). O que falta pra trás vira alerta, não trava.
     IMPORTANTE: a Fase de Pagamentos (tipo 'payments') NUNCA empurra essa
     hierarquia pra frente — pagar algo adiantado (ex: frete) não significa que
     desembaraço/remoção já avançaram. DUIMP → desembaraço → SEFAZ → remoção →
     recebimento são estritamente sequenciais e não podem ser furados. */
  let lastActiveIdx = 0;
  stages.forEach((s,i)=>{
    if(s.type==='payments') return;
    if(stageHasProgress(p, s)) lastActiveIdx = i;
  });
  for(let i=lastActiveIdx; i<stages.length; i++){
    if(!stageComplete(p, stages[i].key)) return stages[i].key;
  }
  return stages[stages.length-1].key;
}

function isProcessDone(p){
  return getStagesForProcess(p).every(s=>stageComplete(p, s.key));
}

function getDashboardConfig(){
  const dflt = {
    labels: {
      producao: {label:'Em Produção', icon:'📦'},
      aguardando_embarque: {label:'Aguardando Embarque', icon:'⏳'},
      transito: {label:'Em Trânsito', icon:'🚢'},
      desembaraco: {label:'Em Desembaraço', icon:'📋'},
      entregue: {label:'Entregue', icon:'✅'},
    },
    rules: [],
  };
  const cfg = state.dashboardConfig || {};
  const labels = {...dflt.labels};
