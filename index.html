<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --navy:#0F1B2D;
  --navy-light:#16263D;
  --navy-lighter:#223a58;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --ink-red:#B8441F;
  --ink-red-bg:#FBE9E2;
  --ink-green:#1F7A5C;
  --ink-green-bg:#E4F3EC;
  --ink-amber:#A5730F;
  --ink-amber-bg:#FBF0DC;
  --ink-blue:#2A5C8A;
  --ink-blue-bg:#E4EEF6;
  --ink-purple:#5B3FA0;
  --ink-purple-bg:#EDE7F8;
  --ink-teal:#0E7C86;
  --ink-teal-bg:#DCEEF0;
  --ink-gold:#946200;
  --ink-gold-bg:#FCEFD1;
  --text:#1A2433;
  --muted:#6B7785;
  --border:#E2E6EA;
  --border-strong:#C7CFD6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.display{font-family:'Zilla Slab', serif;}

#app{display:flex; min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--navy);
  color:#DCE4EC;
  display:flex; flex-direction:column;
  padding:24px 0;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:0 20px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  margin-bottom:20px;
  display:flex; justify-content:center;
}
.brand-mark{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:20px;
  color:#fff; letter-spacing:0.02em;
  display:flex; align-items:center; gap:8px;
}
.brand-mark svg{flex-shrink:0;}
.brand-sub{
  font-family:'IBM Plex Mono', monospace; font-size:10px; color:#7C8FA8;
  letter-spacing:0.12em; text-transform:uppercase; margin-top:4px;
}
.nav{display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:6px;
  color:#AEBBCC; font-size:14px; font-weight:500;
  cursor:pointer; border:none; background:none; text-align:left; width:100%;
  transition:background 0.15s, color 0.15s;
}
.nav-item:hover{background:var(--navy-light); color:#fff;}
.nav-item.active{background:var(--navy-lighter); color:#fff;}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0; flex-shrink:0;}
.nav-item.active .dot{opacity:1; background:#E8A25C;}

.sidebar-footer{margin-top:auto; padding:0 20px;}
.new-process-btn{
  width:100%; background:var(--ink-red); color:#fff; border:none;
  padding:11px 14px; border-radius:6px; font-weight:600; font-size:13px;
  cursor:pointer; font-family:'Inter',sans-serif;
  transition:background 0.15s;
}
.new-process-btn:hover{background:#9c3818;}

/* MAIN */
main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:28px 36px 20px 36px;
  border-bottom:1px solid var(--border);
  background:var(--card);
}
.topbar h1{font-family:'Zilla Slab', serif; font-size:26px; font-weight:700;}
.topbar p{color:var(--muted); font-size:13.5px; margin-top:4px;}
.view-content{padding:28px 36px 60px 36px; flex:1;}

/* KPI */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
.kpi-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:16px 18px; position:relative; overflow:hidden;
}
.kpi-card::before{
  content:''; position:absolute; top:0; left:0; width:3px; height:100%;
  background:var(--kpi-accent, var(--ink-blue));
}
.kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-weight:600;}
.kpi-value{font-family:'Zilla Slab', serif; font-size:26px; font-weight:700; margin-top:6px;}
.kpi-sub{font-size:12px; color:var(--muted); margin-top:3px;}

.section-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:16px;
  margin:36px 0 16px 0; display:flex; align-items:center; gap:12px;
  text-transform:uppercase; letter-spacing:0.03em;
}
.section-title:first-child{margin-top:0;}
.section-title .rule{flex:1; height:3px; background:linear-gradient(90deg, var(--navy) 0%, var(--border-strong) 70%, transparent 100%); border-radius:2px;}

/* PROCESS LIST */
.process-list{display:flex; flex-direction:column; gap:10px;}
.process-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:16px 18px; cursor:pointer; transition:border-color 0.15s, box-shadow 0.15s;
  display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center;
}
.process-card:hover{border-color:var(--border-strong); box-shadow:0 2px 10px rgba(15,27,45,0.06);}

.stamp{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600;
  letter-spacing:0.06em; text-transform:uppercase;
  border:2px solid currentColor; border-radius:4px;
  padding:5px 8px; transform:rotate(-3deg); white-space:nowrap;
  text-align:center; line-height:1.3; max-width:150px;
}
.stamp-pedido{color:var(--ink-blue); background:var(--ink-blue-bg);}
.stamp-producao{color:var(--ink-amber); background:var(--ink-amber-bg);}
.stamp-embarcado{color:var(--ink-purple); background:var(--ink-purple-bg);}
.stamp-transito{color:var(--ink-purple); background:var(--ink-purple-bg);}
.stamp-porto{color:var(--ink-amber); background:var(--ink-amber-bg);}
.stamp-desembaraco{color:var(--ink-red); background:var(--ink-red-bg);}
.stamp-remocao{color:var(--ink-teal); background:var(--ink-teal-bg);}
.stamp-pagamentos{color:var(--ink-gold); background:var(--ink-gold-bg);}
.stamp-entregue{color:var(--ink-green); background:var(--ink-green-bg);}

.process-main h3{font-size:15px; font-weight:600;}
.process-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
.process-meta .ref{font-family:'IBM Plex Mono', monospace; color:var(--muted);}
.process-track{margin-top:10px; display:flex; align-items:center;}
.track-step{display:flex; align-items:center; flex:1;}
.track-dot{width:8px; height:8px; border-radius:50%; background:var(--border-strong); flex-shrink:0; position:relative;}
.track-dot.done{background:var(--ink-green);}
.track-dot.current{background:var(--ink-red); box-shadow:0 0 0 3px var(--ink-red-bg);}
.track-line{flex:1; height:2px; background:var(--border-strong);}
.track-line.done{background:var(--ink-green);}
.step-note{font-size:12px; color:var(--ink-red); margin-top:5px; font-style:italic;}
.progress-pct{font-size:10.5px; color:var(--muted); margin-top:4px; font-family:'IBM Plex Mono',monospace;}
.alert-banner{
  background:var(--ink-red-bg); color:var(--ink-red); border:1px solid #F0BBA5; border-radius:6px;
  padding:6px 10px; font-size:11.5px; font-weight:600; margin-top:7px; line-height:1.5;
}
.process-card.has-alert, .transit-card.has-alert{border-color:var(--ink-red); box-shadow:0 0 0 1px var(--ink-red-bg);}

.eye-btn{
  position:absolute; top:10px; right:10px; background:var(--paper); border:1px solid var(--border-strong);
  border-radius:6px; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:14px; z-index:2;
}
.eye-btn:hover{background:var(--card); border-color:var(--ink-blue);}
.process-card, .transit-card{position:relative;}

.view-section-title{font-family:'Zilla Slab',serif; font-weight:700; font-size:14.5px; margin:18px 0 10px 0; color:var(--navy); text-transform:uppercase; letter-spacing:0.03em;}
.view-section-title:first-child{margin-top:0;}
.view-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
.view-field{background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:8px 10px;}
.view-field .view-label{display:block; font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:0.03em; margin-bottom:3px;}
.view-field .view-value{font-size:13px; font-weight:500;}
.view-check-list{display:flex; flex-direction:column; gap:5px;}
.view-check-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px; border-radius:5px;}
.view-check-item.done{color:var(--ink-green);}
.view-check-item .vc{width:14px; height:14px; border-radius:4px; border:2px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff;}
.view-check-item.done .vc{background:var(--ink-green); border-color:var(--ink-green);}
.pending-since{font-size:11px; color:var(--ink-red); margin-top:4px; font-weight:600;}

.process-ref-badge{min-width:64px; text-align:center; padding:6px 4px;}
.process-ref-badge .ref-label{display:block; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:3px;}
.process-ref-badge .ref-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; color:var(--navy); line-height:1.2; word-break:break-word; text-transform:uppercase; letter-spacing:0.02em;}
.phase-mini{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; color:var(--muted); background:var(--paper); padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; margin-left:6px; vertical-align:middle;}

.filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:20px;}
.filter-bar input, .filter-bar select{padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;}
.filter-bar input[type="text"]{flex:1; min-width:180px;}
.filter-bar .btn{padding:8px 12px; font-size:12.5px;}

.stage-pills{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px;}
.stage-pill{
  padding:6px 13px; border-radius:20px; border:1px solid var(--border-strong); background:var(--card);
  font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;
}
.stage-pill.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.stage-pill:hover:not(.active){border-color:var(--ink-blue);}

.active-count-label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:12px; letter-spacing:0.02em;}

.month-group{margin-bottom:6px;}
.month-summary{
  cursor:pointer; font-family:'Zilla Slab',serif; font-weight:700; font-size:14px; color:var(--navy);
  padding:9px 4px; list-style:none; display:flex; align-items:center; gap:10px; letter-spacing:0.03em;
}
.month-summary::-webkit-details-marker{display:none;}
.month-summary::before{content:'▸'; font-size:12px; color:var(--muted);}
.month-group[open] .month-summary::before{content:'▾';}
.month-count{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--muted); background:var(--paper); padding:2px 8px; border-radius:10px;}

.history-item{border-left:3px solid var(--ink-blue); background:var(--paper); border-radius:0 6px 6px 0; padding:10px 14px; margin-bottom:10px;}
.history-date{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;}
.history-title{font-size:13.5px; font-weight:600; margin-top:3px;}
.history-detail{font-size:12.5px; color:var(--muted); margin-top:4px; white-space:pre-line; line-height:1.5;}
.history-actions{display:flex; gap:6px; margin-top:8px;}

.perf-group{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:4px 14px;}
.perf-row{padding:11px 0; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;}
.perf-row:last-child{border-bottom:none;}
.perf-label{font-size:13px; color:var(--text);}
.perf-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
.perf-compare{width:100%; font-size:11.5px; color:var(--muted); margin-top:2px;}

.followup-card{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:14px;}
.followup-card-header{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.followup-ref{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:var(--navy); margin-right:10px; text-transform:uppercase;}
.followup-produto{font-weight:600; font-size:14px; margin-right:8px;}
.followup-fornecedor{font-size:12.5px; color:var(--muted);}
.followup-meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-bottom:12px;}
.followup-meta-grid .view-field{padding:6px 8px;}
.followup-meta-grid .view-label{font-size:9px;}
.followup-meta-grid .view-value{font-size:12px;}
.followup-narrative{background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-size:12.5px; line-height:1.8; color:var(--text);}
.supplier-name-carestream{color:#C8641A; font-weight:700;}
.supplier-name-morita{color:#1D5FA8; font-weight:700;}

body.dark-mode{
  --paper:#10161F; --card:#1A222E; --text:#E4E9F0; --muted:#8C9BB5;
  --border:#2A3646; --border-strong:#3A4A5F;
}
body.dark-mode .modal-overlay{background:rgba(0,0,0,0.7);}
body.dark-mode .form-group input, body.dark-mode .form-group select, body.dark-mode .form-group textarea,
body.dark-mode .filter-bar input, body.dark-mode .filter-bar select,
body.dark-mode .item-fields input, body.dark-mode .item-fields select,
body.dark-mode .stage-extra input, body.dark-mode .payment-row input,
body.dark-mode .config-icon, body.dark-mode .config-label, body.dark-mode .config-row select{
  background:#232E3D; color:var(--text); border-color:var(--border-strong);
}
body.dark-mode .doc-item, body.dark-mode .stage-header, body.dark-mode .stage-body{background:#1A222E;}
body.dark-mode .theme-toggle-btn{background:#232E3D; color:#fff; border-color:#3A4A5F;}
body.dark-mode .process-ref-badge .ref-value{color:#E8A25C;}
body.dark-mode .kpi-card, body.dark-mode .process-card, body.dark-mode .transit-card, body.dark-mode .supplier-card, body.dark-mode .contact-card{background:var(--card);}
body.dark-mode .stage-block.done .stage-header, body.dark-mode .stage-block.current .stage-header{color:#152A3D;}
body.dark-mode .stage-block.done .stage-title, body.dark-mode .stage-block.current .stage-title{color:#152A3D;}
body.dark-mode .contact-role, body.dark-mode .supplier-flag{color:#9AA9C2;}
body.dark-mode .contact-phone{color:#7FB3E8;}
body.dark-mode .stage-progress{color:#8C9BB5;}

.process-side{text-align:right; white-space:nowrap;}
.process-value{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px;}
.process-eta{font-size:11.5px; color:var(--muted); margin-top:3px;}
.process-badge-temp{
  display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--ink-purple); background:var(--ink-purple-bg);
  padding:2px 6px; border-radius:4px; margin-top:4px;
}

/* TRANSIT CARD */
.transit-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; cursor:pointer;
}
.transit-card:hover{border-color:var(--border-strong); box-shadow:0 2px 10px rgba(15,27,45,0.06);}
.transit-icon{font-size:26px; width:44px; text-align:center;}
.transit-dates{font-size:12px; color:var(--muted); margin-top:5px; display:flex; gap:14px; flex-wrap:wrap;}
.transit-logi{font-size:11.5px; color:var(--text); margin-top:4px; display:flex; gap:12px; flex-wrap:wrap;}
.transit-logi b{color:var(--muted); font-weight:600;}
.transit-days{text-align:right; white-space:nowrap;}
.transit-days .big{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; letter-spacing:0.01em;}
.transit-days .small{font-size:11px; color:var(--muted);}
.transit-days.late .big{color:var(--ink-red);}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--muted);
  border:1px dashed var(--border-strong); border-radius:10px;
}
.empty-state h3{font-family:'Zilla Slab', serif; color:var(--text); font-size:17px; margin-bottom:6px;}
.empty-state button{margin-top:16px;}

/* SUPPLIERS / PARTNERS */
.supplier-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
.supplier-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 18px;
  cursor:pointer;
}
.supplier-card:hover{border-color:var(--border-strong);}
.supplier-card h3{font-size:15px; font-weight:600;}
.supplier-flag{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
.supplier-meta{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.6;}
.supplier-count{
  display:inline-block; margin-top:10px; font-size:11px; font-weight:600;
  background:var(--ink-blue-bg); color:var(--ink-blue); padding:3px 8px; border-radius:20px;
}
.supplier-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;}
.supplier-tag{font-size:10.5px; background:var(--ink-blue-bg); color:var(--ink-blue); padding:2px 7px; border-radius:10px; font-weight:600;}

/* COUNTRY CHIPS */
.country-checks{display:flex; flex-wrap:wrap; gap:8px;}
.country-chip{
  padding:6px 11px; border:1px solid var(--border-strong); border-radius:20px; font-size:12px; cursor:pointer; user-select:none;
}
.country-chip.checked{background:var(--ink-blue); color:#fff; border-color:var(--ink-blue);}

.modalidade-row{display:flex; align-items:center; gap:14px; margin-top:6px; flex-wrap:wrap;}
.modalidade-check{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; min-width:110px;}
.modalidade-check input{width:auto;}
.modalidade-dias{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
.modalidade-dias input{width:70px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}

.container-row{display:grid; grid-template-columns:28px 1fr 1fr; gap:8px; align-items:center; margin-top:6px;}
.container-row .container-idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;}
.container-row input{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px;}
.containers-table{margin-top:4px;}

/* PARTNERS GROUPS */
.contact-group{margin-bottom:26px;}
.contact-group-title{
  font-family:'Zilla Slab', serif; font-weight:700; font-size:15px; margin-bottom:10px;
  display:flex; align-items:center; gap:8px; color:var(--navy);
}
.contact-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px;}
.contact-card{
  background:var(--card); border:1px solid var(--border); border-radius:8px; padding:13px 15px; cursor:pointer;
}
.contact-card:hover{border-color:var(--border-strong);}
.contact-name{font-size:13.5px; font-weight:600;}
.contact-role{font-size:12px; color:var(--muted); margin-top:1px;}
.contact-phone{font-size:12.5px; color:var(--ink-blue); margin-top:6px; font-family:'IBM Plex Mono',monospace;}

/* INDICATORS */
.indicators-table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.indicators-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);
  background:var(--paper); padding:10px 14px; font-weight:600; border-bottom:1px solid var(--border);
}
.indicators-table td{padding:11px 14px; font-size:13px; border-bottom:1px solid var(--border);}
.indicators-table tr:last-child td{border-bottom:none;}
.indicators-table td.meta-col{font-family:'IBM Plex Mono',monospace; color:var(--ink-green); font-weight:600;}

/* MODAL */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,27,45,0.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:40px 20px;
  overflow-y:auto;
}
.modal{
  background:var(--card); border-radius:10px; width:100%; max-width:700px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.modal-header{
  padding:20px 26px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-header h2{font-family:'Zilla Slab', serif; font-size:19px;}
.modal-close{
  background:none; border:none; cursor:pointer; color:var(--muted); font-size:20px;
  width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center;
}
.modal-close:hover{background:var(--paper); color:var(--text);}
.modal-body{padding:22px 26px; max-height:70vh; overflow-y:auto;}
.modal-footer{padding:16px 26px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}

.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em;}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border-strong); border-radius:6px;
  font-family:'Inter',sans-serif; font-size:13.5px; background:#fff; color:var(--text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:2px solid var(--ink-blue); outline-offset:1px; border-color:var(--ink-blue);}
.form-group textarea{resize:vertical; min-height:60px;}
.form-hint{font-size:11px; color:var(--muted); margin-top:4px; font-style:italic;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.tab-btn{
  background:none; border:none; padding:9px 4px; margin-right:18px; font-size:13px; font-weight:600;
  color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:'Inter',sans-serif;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--ink-red);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

.cost-table{width:100%; border-collapse:collapse; font-size:13px;}
.cost-table td{padding:7px 0; border-bottom:1px solid var(--border);}
.cost-table td:last-child{text-align:right; font-family:'IBM Plex Mono',monospace;}
.cost-table tr.total td{font-weight:700; border-top:2px solid var(--text); border-bottom:none; padding-top:10px;}
.cost-note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5; font-style:italic;}

.doc-checklist{display:flex; flex-direction:column; gap:8px;}
.doc-item-block{border:1px solid var(--border); border-radius:6px; overflow:hidden;}
.doc-item-block .doc-item{border:none; border-radius:0; margin:0;}
.doc-file-row{display:flex; align-items:center; gap:8px; padding:8px 11px; background:var(--paper); flex-wrap:wrap;}
.doc-file-name{font-size:12px; color:var(--text); font-weight:500;}
.doc-upload-status{font-size:11.5px; color:var(--muted); font-style:italic;}
.doc-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  border:1px solid var(--border); border-radius:6px; cursor:pointer;
}
.doc-item.checked{background:var(--ink-green-bg); border-color:#B7DBC9;}
.doc-check{
  width:18px; height:18px; border-radius:4px; border:2px solid var(--border-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
}
.doc-item.checked .doc-check{background:var(--ink-green); border-color:var(--ink-green);}
.doc-item span{font-size:13px; line-height:1.4;}
.doc-item.checked span{color:var(--ink-green); text-decoration:line-through; text-decoration-color:#B7DBC9;}

.item-fields{margin:-2px 0 6px 30px; padding:9px 11px; background:var(--paper); border-left:2px solid var(--border-strong); display:flex; flex-wrap:wrap; gap:8px; border-radius:0 6px 6px 0;}
.item-fields .mini-field{display:flex; flex-direction:column; gap:3px; min-width:130px; flex:1;}
.item-fields label{font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600;}
.item-fields input, .item-fields select{padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; font-family:'Inter',sans-serif;}

.stage-extra{margin-top:6px; padding:11px 12px; background:var(--paper); border:1px solid var(--border); border-radius:6px; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:9px;}

.payment-row{display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border); border-radius:6px;}
.payment-row.checked{background:var(--ink-green-bg); border-color:#B7DBC9;}
.payment-row .payment-label{flex:1; font-size:13px; cursor:pointer;}
.payment-row input.payment-value{width:140px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:5px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; text-align:right;}

.btn{
  padding:9px 16px; border-radius:6px; font-size:13.5px; font-weight:600; cursor:pointer;
  border:1px solid var(--border-strong); background:#fff; color:var(--text); font-family:'Inter',sans-serif;
}
.btn:hover{background:var(--paper);}
.btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.btn-primary:hover{background:var(--navy-light);}
.btn-danger{color:var(--ink-red); border-color:var(--ink-red-bg);}
.btn-danger:hover{background:var(--ink-red-bg);}
.btn-pdf{color:var(--ink-teal); border-color:var(--ink-teal-bg); background:var(--ink-teal-bg);}
.btn-pdf:hover{background:#c9e6e9;}

.status-badge-row{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  background:var(--paper); border:1px solid var(--border); border-radius:8px; margin-bottom:16px;
}
.status-badge-row .stamp{transform:rotate(0deg);}
.status-badge-hint{font-size:12px; color:var(--muted);}

.type-toggle{display:flex; gap:8px; margin-bottom:16px;}
.type-toggle button{
  flex:1; padding:10px 12px; border-radius:6px; border:1px solid var(--border-strong);
  background:#fff; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted);
}
.type-toggle button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

.stage-block{
  border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden;
}
.stage-block.current{border-color:var(--ink-red); box-shadow:0 0 0 1px var(--ink-red-bg);}
.stage-block.done{border-color:#B7DBC9;}
.stage-header{
  display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer;
  background:#fff; user-select:none;
}
.stage-block.done .stage-header{background:var(--ink-green-bg);}
.stage-block.current .stage-header{background:var(--ink-red-bg);}
.stage-num{
  width:22px; height:22px; border-radius:50%; background:var(--border-strong); color:#fff;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'IBM Plex Mono', monospace;
}
.stage-block.done .stage-num{background:var(--ink-green);}
.stage-block.current .stage-num{background:var(--ink-red);}
.stage-title{flex:1; font-size:13.5px; font-weight:600;}
.stage-progress{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted);}
.stage-body{padding:12px 14px 14px 14px; display:flex; flex-direction:column; gap:8px; background:#fff;}
.stage-hint{font-size:11.5px; color:var(--muted); margin-top:2px; font-style:italic;}

#loading{padding:60px; text-align:center; color:var(--muted);}

/* LOGIN */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--navy);
}
.login-box{
  background:var(--card); border-radius:12px; padding:36px 34px; width:100%; max-width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
let currentUser = null;
let currentRole = 'viewer';
let unsubscribeData = null;

function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
  auth.signInWithEmailAndPassword(email, password).catch(e=>{
    errEl.textContent = 'Não foi possível entrar. Confira e-mail e senha.';
    console.error(e);
  });
}
function doLogout(){
  if(unsubscribeData) unsubscribeData();
  auth.signOut();
}

async function ensureUserRole(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if(snap.exists){
    currentRole = snap.data().role || 'editor';
    return;
  }
  const allUsers = await db.collection('users').get();
  const role = allUsers.empty ? 'admin' : 'editor';
  await ref.set({ email:user.email, role, createdAt: Date.now() });
  currentRole = role;
}

function attachDataListener(){
  if(unsubscribeData) unsubscribeData();
  unsubscribeData = db.collection('comextrack').doc('data').onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      state.processes = d.processes || [];
      state.suppliers = d.suppliers || [];
      state.partners = (d.partners && d.partners.length) ? d.partners : DEFAULT_PARTNERS.map(p=>({...p}));
      state.dashboardConfig = d.dashboardConfig || null;
    } else {
      state = { processes:[], suppliers:[], partners: DEFAULT_PARTNERS.map(p=>({...p})) };
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render();
  }, err=>{
    console.error('Erro ao sincronizar', err);
    updateSaveIndicator('⚠ Erro de conexão com a nuvem');
  });
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    await ensureUserRole(user);
    attachDataListener();
  } else {
    currentUser = null;
    if(unsubscribeData) unsubscribeData();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }
});
</script>

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  try{ localStorage.setItem('comextrack-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); }catch(e){}
  render();
}
function applyStoredTheme(){
  try{
    if(localStorage.getItem('comextrack-theme')==='dark'){ document.body.classList.add('dark-mode'); }
  }catch(e){}
}

  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtUSD(v){
  return (v||0).toLocaleString('en-US', {style:'currency', currency:'USD'});
}
function fmtDate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(d1,d2){
  const a = new Date(d1+'T00:00:00');
  const b = new Date(d2+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function countryFlag(country){
  const map = {'Japão':'japao','EUA':'eua','Holanda':'holanda','Bélgica':'belgica','China':'china'};
  const key = map[country];
  if(!key) return '';
  return `<img src="${FLAG_ICONS[key]}" alt="${country}" style="width:16px;height:11px;object-fit:cover;border-radius:2px;vertical-align:-1px;display:inline-block;">`;
}
function modalIcon(modal){ return modal==='aereo' ? '✈️' : '🚢'; }
function modalLabel(modal){ return modal==='aereo' ? 'Aéreo' : 'Marítimo'; }
function computePerformanceMetrics(p){
  const extra = p.extra || {};
  const m = {};
  if(p.dataPedido && p.dataEmbarqueReal) m.tempoProducao = daysBetween(p.dataPedido, p.dataEmbarqueReal);
  if(p.prontidao && p.dataEmbarqueReal) m.tempoProntoEmbarque = daysBetween(p.prontidao, p.dataEmbarqueReal);
  if(p.dataEmbarqueReal && extra.dataChegadaBetim) m.transitTime = daysBetween(p.dataEmbarqueReal, extra.dataChegadaBetim);
  if(extra.dataChegadaBetim && extra.dataDesembaraco) m.tempoDesembaraco = daysBetween(extra.dataChegadaBetim, extra.dataDesembaraco);
  const fimReferencia = (isProcessDone(p) && p.pendingSince) ? p.pendingSince : todayStr();
  if(p.dataPedido) m.tempoTotal = daysBetween(p.dataPedido, fimReferencia);
  const costs = computeCosts(p);
  m.custoRealizado = costs.total;
  m.custoOrcado = parseFloat(p.custoOrcado) || null;
  if(m.custoOrcado){
    m.custoVariacaoPct = ((m.custoRealizado - m.custoOrcado) / m.custoOrcado) * 100;
  }
  m.alteracoesETA = (p.history||[]).filter(h=>h.title==='Data prevista de chegada alterada').length;
  m.ocorrencias = (p.history||[]).length;
  return m;
}

function historicalAverage(field, excludeId){
  const finalizados = state.processes.filter(x=>x.id!==excludeId && isProcessDone(x));
  const vals = finalizados.map(x=>computePerformanceMetrics(x)[field]).filter(v=>v!==undefined && v!==null && !isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function perfComparisonHtml(label, valor, media, unidade, lowerIsBetter){
  if(valor===undefined || valor===null || isNaN(valor)){
    return `<div class="perf-row"><span class="perf-label">${label}</span><span class="perf-value">—</span></div>`;
  }
  let compHtml = '';
  if(media!==null && media!==undefined && !isNaN(media) && media!==0){
    const diffPct = ((valor - media) / Math.abs(media)) * 100;
    const isBetter = lowerIsBetter ? diffPct < 0 : diffPct > 0;
    const icon = Math.abs(diffPct) < 1 ? '⚪' : (isBetter ? '🟢' : '🔴');
    compHtml = `<div class="perf-compare">${icon} ${Math.abs(diffPct).toFixed(1)}% ${isBetter?'melhor':'pior'} que a média histórica (${media.toFixed(1)}${unidade})</div>`;
  }
  return `<div class="perf-row"><span class="perf-label">${label}</span><span class="perf-value">${valor.toFixed ? valor.toFixed(1) : valor}${unidade}</span>${compHtml}</div>`;
}

function renderDesempenhoTab(){
  const p = window.__editingProcess;
  const m = computePerformanceMetrics(p);
  const avgTotal = historicalAverage('tempoTotal', p.id);
  const avgProducao = historicalAverage('tempoProducao', p.id);
  const avgTransit = historicalAverage('transitTime', p.id);
  const avgDesembaraco = historicalAverage('tempoDesembaraco', p.id);
  const avgCusto = historicalAverage('custoRealizado', p.id);

  const finalizadosCount = state.processes.filter(x=>x.id!==p.id && isProcessDone(x)).length;

  let html = '';
  if(finalizadosCount < 3){
    html += `<div class="form-hint" style="margin-bottom:14px;">Ainda há poucos processos finalizados (${finalizadosCount}) para uma comparação histórica confiável. As médias abaixo vão ficar mais precisas conforme mais processos forem concluídos.</div>`;
  }

  html += `<div class="perf-group">`;
  html += perfComparisonHtml('Tempo de produção (pedido → embarque)', m.tempoProducao, avgProducao, 'd', true);
  html += perfComparisonHtml('Tempo entre pronto e embarque', m.tempoProntoEmbarque, null, 'd', true);
  html += perfComparisonHtml('Transit time (embarque → chegada)', m.transitTime, avgTransit, 'd', true);
  html += perfComparisonHtml('Tempo de desembaraço (chegada → desembaraçado)', m.tempoDesembaraco, avgDesembaraco, 'd', true);
  html += perfComparisonHtml('Tempo total do processo', m.tempoTotal, avgTotal, 'd', true);
  html += `</div>`;

  html += `<div class="perf-group" style="margin-top:16px;">`;
  let custoCompHtml = '';
  if(avgCusto!==null && avgCusto!==undefined && avgCusto!==0){
    const diffPct = ((m.custoRealizado - avgCusto) / Math.abs(avgCusto)) * 100;
    const icon = Math.abs(diffPct) < 1 ? '⚪' : (diffPct<0 ? '🟢' : '🔴');
    custoCompHtml = `<div class="perf-compare">${icon} ${Math.abs(diffPct).toFixed(1)}% ${diffPct<0?'abaixo':'acima'} da média histórica (${fmtBRL(avgCusto)})</div>`;
  }
  html += `<div class="perf-row"><span class="perf-label">Custo realizado</span><span class="perf-value">${fmtBRL(m.custoRealizado)}</span>${custoCompHtml}</div>`;
  if(m.custoOrcado){
    const varHtml = m.custoVariacaoPct!==undefined ? `<div class="perf-compare">${m.custoVariacaoPct<=0?'🟢':'🔴'} ${Math.abs(m.custoVariacaoPct).toFixed(1)}% ${m.custoVariacaoPct<=0?'abaixo':'acima'} do orçado</div>` : '';
    html += `<div class="perf-row"><span class="perf-label">Custo orçado</span><span class="perf-value">${fmtBRL(m.custoOrcado)}</span>${varHtml}</div>`;
  }
  html += `</div>`;

  html += `<div class="perf-group" style="margin-top:16px;">`;
  html += `<div class="perf-row"><span class="perf-label">Alterações de ETA</span><span class="perf-value">${m.alteracoesETA}</span></div>`;
  html += `<div class="perf-row"><span class="perf-label">Total de ocorrências no histórico</span><span class="perf-value">${m.ocorrencias}</span></div>`;
  html += `</div>`;

  return html;
}

function containerReturnDate(p){
  const extra = p.extra || {};
  const baseDate = extra.dataChegadaBetim || p.chegadaPrevista;
  if(!baseDate || !extra.freetime) return null;
  const dias = parseInt(extra.freetime)||0;
  const dt = new Date(baseDate+'T00:00:00');
  dt.setDate(dt.getDate()+dias);
  return { date: dt.toISOString().slice(0,10), estimated: !extra.dataChegadaBetim };
}

function getProcessAlerts(p){
  const alerts = [];
  if(p.tipo==='temporaria' || isProcessDone(p)) return alerts;
  const extra = p.extra || {};
  const today = todayStr();

  if(p.dataEmbarqueReal){
    const diasDesdeEmbarque = daysBetween(p.dataEmbarqueReal, today);
    const diasParaEmbarque = daysBetween(today, p.dataEmbarqueReal);
    if(diasDesdeEmbarque>=3 && !extra.despachante){
      alerts.push(`Já se passaram ${diasDesdeEmbarque} dias do embarque sem despachante definido`);
    }
    if(diasParaEmbarque<=3 && diasParaEmbarque>0 && !extra.despachante){
      alerts.push(`Faltam ${diasParaEmbarque} dia${diasParaEmbarque===1?'':'s'} para o embarque sem despachante definido`);
    }
    if(diasParaEmbarque===0 && !extra.despachante){
      alerts.push('Embarca hoje e o despachante ainda não foi definido');
    }
    if(diasDesdeEmbarque>=0){
      const fase3checked = p.checklist['fase3']||[];
      if(!fase3checked[0]){
        alerts.push(diasDesdeEmbarque===0 ? 'Carga embarcou hoje e o provisionamento (Fase 3) ainda não foi enviado' : `Carga embarcou há ${diasDesdeEmbarque} dias e o provisionamento (Fase 3) ainda não foi enviado`);
      }
    }
  }

  if(p.chegadaPrevista){
    const diasParaChegada = daysBetween(today, p.chegadaPrevista);
    if(diasParaChegada<=5 && diasParaChegada>0 && !extra.transportadoraDTA){
      alerts.push(`Faltam ${diasParaChegada} dia${diasParaChegada===1?'':'s'} para a chegada sem DTA definida`);
    }
    if(diasParaChegada<=0 && !extra.transportadoraDTA){
      alerts.push(diasParaChegada===0 ? 'Chegada é hoje e a DTA ainda não foi definida' : `Chegada atrasada há ${Math.abs(diasParaChegada)} dias sem DTA definida`);
    }
    const fase5checked = p.checklist['fase5']||[];
    if(diasParaChegada<=5 && diasParaChegada>0 && !fase5checked[4]){
      alerts.push(`Faltam ${diasParaChegada} dia${diasParaChegada===1?'':'s'} para a chegada sem rascunho da DUIMP`);
    }
    if(diasParaChegada<=0 && !fase5checked[4]){
      alerts.push(diasParaChegada===0 ? 'Chegada é hoje sem rascunho da DUIMP' : `Chegada atrasada há ${Math.abs(diasParaChegada)} dias sem rascunho da DUIMP`);
    }
  }

  if(p.prontidao && daysBetween(p.prontidao, today) >= 0){
    const diasDesdeProntidao = daysBetween(p.prontidao, today);
    const hasFatura = p.docs && p.docs['Invoice Comercial (Fatura)'];
    const hasPacking = p.docs && p.docs['Packing List'];
    if(!hasFatura || !hasPacking){
      alerts.push(diasDesdeProntidao===0 ? 'Prontidão é hoje sem Fatura e/ou Packing List marcados' : `Prontidão chegou há ${diasDesdeProntidao} dias sem Fatura e/ou Packing List marcados`);
    }
  }

  if(extra.dataChegadaBetim){
    const diasDesdeChegada = daysBetween(extra.dataChegadaBetim, today);
    if(diasDesdeChegada>=1){
      if(!extra.numeroDUIMP){
        alerts.push(`Já se passaram ${diasDesdeChegada} dias da chegada sem número da DUIMP`);
      }
      const hasDDR = p.docs && p.docs['DDR (Declaração do Detentor do Registro)'];
      if(!hasDDR){
        alerts.push(`Já se passaram ${diasDesdeChegada} dias da chegada sem DDR`);
      }
    }
  }

  const devolucao = containerReturnDate(p);
  if(devolucao){
    const diasParaDevolucao = daysBetween(today, devolucao.date);
    const fase7checked = p.checklist['fase7']||[];
    if(diasParaDevolucao<=5 && diasParaDevolucao>0 && !fase7checked[4]){
      alerts.push(`Faltam ${diasParaDevolucao} dia${diasParaDevolucao===1?'':'s'} para a devolução do container e a etapa ainda não foi marcada`);
    }
    if(diasParaDevolucao<=0 && !fase7checked[4]){
      alerts.push(diasParaDevolucao===0 ? 'Devolução do container é hoje e a etapa ainda não foi marcada' : `Devolução do container atrasada há ${Math.abs(diasParaDevolucao)} dias`);
    }
  }

  const costs = computeCosts(p);
  if(costs.cifBrl > 4000000){
    alerts.push(`Carga acima de R$ 4 milhões (${fmtBRL(costs.cifBrl)}) — informe a seguradora`);
  }

  return alerts;
}

/* ---------- HISTÓRICO / FOLLOW-UP ---------- */
function pushHistoryEvent(p, icon, title, detail){
  p.history = p.history || [];
  p.history.push({
    id: uid(),
    ts: Date.now(),
    manual: false,
    icon: icon,
    title: title,
    detail: detail || '',
  });
}

function detectHistoryChanges(prev, next){
  if(!prev){
    pushHistoryEvent(next, '🆕', 'Processo criado', next.produto||'');
    return;
  }
  next.history = prev.history ? prev.history.slice() : [];

  const fieldChange = (label, icon, prevVal, nextVal, formatter) => {
    if((prevVal||'') !== (nextVal||'') && nextVal){
      const fmt = formatter || (v=>v);
      const detail = prevVal ? `Anterior: ${fmt(prevVal)}\nNova: ${fmt(nextVal)}` : `Definido: ${fmt(nextVal)}`;
      pushHistoryEvent(next, icon, label, detail);
    }
  };

  fieldChange('Data prevista de chegada alterada', '📅', prev.chegadaPrevista, next.chegadaPrevista, fmtDate);
  fieldChange('Data de embarque alterada', '🚢', prev.dataEmbarqueReal, next.dataEmbarqueReal, fmtDate);
  fieldChange('Data de chegada ao porto alterada', '⚓', (prev.extra||{}).dataChegadaBetim, (next.extra||{}).dataChegadaBetim, fmtDate);
  fieldChange('Número da DUIMP registrado', '📄', (prev.extra||{}).numeroDUIMP, (next.extra||{}).numeroDUIMP);
  fieldChange('DUIMP desembaraçada — data', '✅', (prev.extra||{}).dataDesembaraco, (next.extra||{}).dataDesembaraco, fmtDate);
  fieldChange('Canal de conferência definido', '🚦', (prev.extra||{}).canalDesembaraco, (next.extra||{}).canalDesembaraco);
  fieldChange('Despachante definido', '🧾', (prev.extra||{}).despachante, (next.extra||{}).despachante);
  fieldChange('Transportadora (DTA) definida', '🚛', (prev.extra||{}).transportadoraDTA, (next.extra||{}).transportadoraDTA);

  if(prev.status !== next.status){
    pushHistoryEvent(next, '🔄', 'Processo alterado para outro estágio', `${stageInfoFor(prev,prev.status).label} → ${stageInfoFor(next,next.status).label}`);
  }

  const prevDocs = prev.docs||{}, nextDocs = next.docs||{};
  DOC_TYPES.forEach(d=>{
    if(!prevDocs[d] && nextDocs[d]) pushHistoryEvent(next, '📎', 'Documento adicionado', d);
    if(prevDocs[d] && !nextDocs[d]) pushHistoryEvent(next, '🗑️', 'Documento removido', d);
  });

  if((prev.obs||'') !== (next.obs||'') && next.obs){
    pushHistoryEvent(next, '📝', 'Observação alterada', next.obs);
  }
}

function addManualHistoryEvent(text){
  if(!text || !text.trim()) return;
  const p = window.__editingProcess;
  p.history = p.history || [];
  p.history.push({ id: uid(), ts: Date.now(), manual: true, icon:'✏️', title:'Registro manual', detail: text.trim() });
  renderHistoryTab();
}
function editManualHistoryEvent(id){
  const p = window.__editingProcess;
  const ev = (p.history||[]).find(h=>h.id===id);
  if(!ev || !ev.manual) return;
  const novo = prompt('Editar registro:', ev.detail);
  if(novo===null) return;
  ev.detail = novo.trim();
  renderHistoryTab();
}
function deleteManualHistoryEvent(id){
  const p = window.__editingProcess;
  if(!confirm('Excluir este registro do histórico?')) return;
  p.history = (p.history||[]).filter(h=>h.id!==id);
  renderHistoryTab();
}

function formatHistoryDate(ts){
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} — ${hh}:${mi}`;
}

function narrativeLine(ev){
  if(ev.manual) return ev.detail;
  if(!ev.detail) return ev.title;
  const lines = ev.detail.split('\n');
  const last = lines[lines.length-1];
  return `${ev.title} — ${last}`;
}

function buildCompactNarrative(p){
  const events = (p.history||[]).slice().sort((a,b)=>a.ts-b.ts);
  if(!events.length) return 'Sem eventos registrados ainda.';
  return events.map(narrativeLine).join('\n');
}

/* ===================== LÓGICA DE ETAPAS ===================== */
function getStagesForProcess(p){
  if(p && p.tipo==='temporaria') return TEMP_STAGES;
  const isAereo = p && p.modal==='aereo';
  return STAGE_DEFS.map(s=>{
    if(s.key==='fase3'){
      const supplier = state.suppliers.find(x=>x.id===p.supplierId);
      let options = [];
      if(supplier && supplier.modalidades){
        if(supplier.modalidades.adiantado) options.push('Adiantado');
        if(supplier.modalidades.aPrazo && supplier.modalidades.aPrazo.checked) options.push(`A prazo (${supplier.modalidades.aPrazo.dias||'?'} dias)`);
        if(supplier.modalidades.factoring && supplier.modalidades.factoring.checked) options.push(`Factoring (${supplier.modalidades.factoring.dias||'?'} dias)`);
      }
      if(options.length===0) options = ['Adiantado','A prazo','Factoring'];
      const mp = p.extra && p.extra.modalidadePagamento;
      const label = mp ? `Pagamento (${mp})` : 'Pagamento';
      return {...s, items:[label], extraFields:[{key:'modalidadePagamento', label:'Modalidade de Pagamento', type:'select', options}]};
    }

    if(s.key==='fase4' && isAereo){
      return {...s, containersItemIndex: undefined, itemFields:{
        1: s.itemFields[1],
        2: [
          {key:'numeroAWB', label:'AWB', type:'text'},
          {key:'ciaAerea', label:'Companhia Aérea', type:'text'},
        ],
      }};
    }

    if(s.key==='fase6' && isAereo){
      const items = ['Chegada e presença'];
      const itemFields = {};
      const incluirDTA = p.aeroportoDestinoFinal !== true;
      if(incluirDTA){
        items.push('Início DTA');
        itemFields[items.length-1] = [{key:'dataAgendamentoDTA', label:'Data de Início', type:'date'}];
      }
      items.push('Chegada no Aeroporto de Confins');
      const arrivalItemIndex = items.length-1;
      itemFields[arrivalItemIndex] = [{key:'dataChegadaBetim', label:'Data de Chegada', type:'date'}];
      items.push('Descarga em Betim');
      items.push('Registro da DUIMP');
      itemFields[items.length-1] = [{key:'numeroDUIMP', label:'Número da DUIMP', type:'text'},{key:'chaveAcessoDUIMP', label:'Chave de Acesso da DUIMP', type:'text'},{key:'dataRegistroDUIMP', label:'Data de Registro', type:'date'}];
      items.push('Pagar numerário despachante');
      items.push('Testar NF');
      items.push('Desembaraço da DUIMP');
      itemFields[items.length-1] = [{key:'canalDesembaraco', label:'Canal', type:'select', options:['Verde','Amarelo','Vermelho','Cinza']},{key:'dataDesembaraco', label:'Data do Desembaraço', type:'date'}];
      items.push('Liberação SEFAZ');
      itemFields[items.length-1] = [{key:'dataLiberacaoSefaz', label:'Data de Liberação SEFAZ', type:'date'}];
      return {...s, items, itemFields, arrivalItemIndex, extraFields: s.extraFields};
    }

    if(s.key==='fase7' && isAereo){
      const items = s.items.slice(0,4); // remove "Devolução do vazio" (não existe no aéreo)
      return {...s, items};
    }

    if(s.key==='fase8' && isAereo){
      return {...s, items:[
        {key:'freteInternacional', label:'Frete Internacional'},
        {key:'armazenagemBHAirport', label:'Armazenagem BH Airport'},
        {key:'prestacaoDespachante', label:'Prestação Despachante'},
      ]};
    }

    return s;
  });
}
function stageIndexFor(p, key){ return getStagesForProcess(p).findIndex(s=>s.key===key); }
function stageInfoFor(p, key){ const stages=getStagesForProcess(p); return stages.find(s=>s.key===key) || stages[0]; }

function initProcessData(p){
  p.extra = p.extra || {};
  p.payments = p.payments || {};
  p.checklist = p.checklist || {};
  p.docs = p.docs || {};
  p.docFiles = p.docFiles || {};
  getStagesForProcess(p).forEach(s=>{
    if(s.type==='payments'){
      s.items.forEach(it=>{
        if(!p.payments[it.key]) p.payments[it.key] = {checked:false, valor:''};
      });
    } else {
      const existing = p.checklist[s.key] || [];
      p.checklist[s.key] = s.items.map((_,i)=> existing[i]===true);
    }
  });
  return p;
}

function stageComplete(p, stageKey){
  const stage = getStagesForProcess(p).find(s=>s.key===stageKey);
  if(!stage) return false;
  if(stage.type==='payments'){
    return stage.items.every(it=> (p.payments[it.key]||{}).checked===true);
  }
  const checked = p.checklist[stageKey] || [];
  return stage.items.every((_,i)=>checked[i]===true);
}

function recomputeStatus(p){
  const stages = getStagesForProcess(p);
  for(const s of stages){
    if(!stageComplete(p, s.key)) return s.key;
  }
  return stages[stages.length-1].key;
}

function isProcessDone(p){
  return getStagesForProcess(p).every(s=>stageComplete(p, s.key));
}

function getDashboardConfig(){
  const dflt = {
    labels: {
      producao: {label:'Em Produção', icon:'📦'},
      aguardando_embarque: {label:'Aguardando Embarque', icon:'⏳'},
      transito: {label:'Em Trânsito', icon:'🚢'},
      desembaraco: {label:'Em Desembaraço', icon:'📋'},
      entregue: {label:'Entregue', icon:'✅'},
    },
    rules: [],
  };
  const cfg = state.dashboardConfig || {};
  const labels = {...dflt.labels};
  Object.keys(cfg.labels||{}).forEach(k=>{ labels[k] = {...labels[k], ...cfg.labels[k]}; });
  return { labels, rules: cfg.rules || [] };
}

function bucketLabel(id, cfg){
  cfg = cfg || getDashboardConfig();
  if(String(id).indexOf('custom:')===0){
    const rid = id.slice(7);
    const r = (cfg.rules||[]).find(x=>x.id===rid);
    return r ? `${r.icon?r.icon+' ':''}${r.label}` : id;
  }
  const l = cfg.labels[id];
  return l ? `${l.icon?l.icon+' ':''}${l.label}` : id;
}

function getBucket(p){
  if(isProcessDone(p)) return 'finalizados';
  const cfg = getDashboardConfig();
  const rule = (cfg.rules||[]).find(r=>r.stageKey===p.status);
  if(rule) return 'custom:'+rule.id;
  if(p.tipo==='temporaria') return 'producao';
  const stages = getStagesForProcess(p);
  const idx = stages.findIndex(s=>s.key===p.status);
  if(idx<=3){
    if(p.prontidao && daysBetween(todayStr(), p.prontidao) <= 0) return 'aguardando_embarque';
    return 'producao';
  }
  if(idx===4){
    const diasParaEmbarque = p.dataEmbarqueReal ? daysBetween(todayStr(), p.dataEmbarqueReal) : null;
    if(diasParaEmbarque===null || diasParaEmbarque>0) return 'aguardando_embarque';
    return 'transito';
  }
  if(idx===5){
    const stage = stages[5];
    const checked = p.checklist['fase6']||[];
    return checked[stage.arrivalItemIndex] ? 'desembaraco' : 'transito';
  }
  if(idx===6){
    const stage = stages[6];
    const checked = p.checklist['fase7']||[];
    return checked[stage.receiptItemIndex] ? 'entregue' : 'desembaraco';
  }
  if(idx>=7) return 'entregue';
  return 'producao';
}

function currentStepLabel(p){
  const stages = getStagesForProcess(p);
  const stage = stages.find(s=>s.key===p.status);
  if(!stage) return '';
  if(stage.type==='payments'){
    const pend = stage.items.find(it=> !(p.payments[it.key]||{}).checked);
    return pend ? `Pendente: ${pend.label}` : 'Concluído';
  }
  const checked = p.checklist[stage.key]||[];
  const idx = stage.items.findIndex((_,i)=>!checked[i]);
  return idx>=0 ? `Pendente: ${stage.items[idx]}` : 'Concluído';
}

function computeCosts(p){
  const fob = parseFloat(p.fob)||0;
  const frete = parseFloat(p.frete)||0;
  const seguro = parseFloat(p.seguro)||0;
  const cambio = parseFloat(p.cambio)||0;
  const cifUsd = fob + frete + seguro;
  const cifBrl = cifUsd * cambio;
  const fobBrl = fob * cambio;
  const seguroBrl = seguro * cambio;
  const ii = parseFloat(p.ii)||0;
  const ipi = parseFloat(p.ipi)||0;
  const pis = parseFloat(p.pis)||0;
  const cofins = parseFloat(p.cofins)||0;
  const icms = parseFloat(p.icms)||0;
  const despesas = parseFloat(p.despesas)||0;
  const paymentsTotal = p.payments ? Object.values(p.payments).reduce((s,r)=>s+(parseFloat(r.valor)||0),0) : 0;
  /* Total NÃO soma o frete do campo acima (que é só referência para o CIF) — o frete
     de verdade é o valor pago marcado na Fase 8, já incluído em paymentsTotal. */
  const total = fobBrl + seguroBrl + ii + ipi + pis + cofins + icms + despesas + paymentsTotal;
  return {cifUsd, cifBrl, fobBrl, seguroBrl, ii, ipi, pis, cofins, icms, despesas, paymentsTotal, total};
}

async function saveDashboardConfig(){

/* ---------- DASHBOARD ---------- */
let pageFilters = {
  dashboard: {search:'', supplierId:'', modal:'', tipo:'', stage:''},
  processos: {search:'', supplierId:'', modal:'', tipo:'', stage:''},
  finalizados: {search:'', supplierId:'', modal:'', tipo:'', stage:''},
};

function processMatchesFilter(p, f){
  if(f.search){
    const q = f.search.toLowerCase();
    const hay = `${p.produto||''} ${p.ref||''}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(f.supplierId && p.supplierId!==f.supplierId) return false;
  if(f.modal && p.modal!==f.modal) return false;
  if(f.tipo && p.tipo!==f.tipo) return false;
  if(f.stage && getBucket(p)!==f.stage) return false;
  return true;
}

function monthLabel(ym){
  const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  const [y,m] = ym.split('-');
  return `${meses[parseInt(m)-1]}/${y}`;
}
function groupByMonth(list, dateField){
  const groups = {};
  list.forEach(p=>{
    const d = p[dateField];
    const key = d ? d.slice(0,7) : 'sem-data';
    groups[key] = groups[key] || [];
    groups[key].push(p);
  });
  const keys = Object.keys(groups).filter(k=>k!=='sem-data').sort();
  if(groups['sem-data']) keys.push('sem-data');
  return keys.map(k=>({key:k, label: k==='sem-data' ? 'Sem data de prontidão' : monthLabel(k), items:groups[k]}));
}

function renderFilterBar(pageKey, universe, stageOptions){
  const f = pageFilters[pageKey];
  const cfg = getDashboardConfig();
  const supplierOptions = state.suppliers.map(s=>`<option value="${s.id}" ${f.supplierId===s.id?'selected':''}>${s.name}</option>`).join('');

  const countBase = universe.filter(p=>
    (!f.supplierId || p.supplierId===f.supplierId) &&
    (!f.modal || p.modal===f.modal) &&
    (!f.tipo || p.tipo===f.tipo)
  );
  const stageCounts = {};
  countBase.forEach(p=>{ const b=getBucket(p); stageCounts[b]=(stageCounts[b]||0)+1; });

  const pills = [`<button class="stage-pill ${!f.stage?'active':''}" onclick="setPageStageFilter('${pageKey}','')">Todos (${countBase.length})</button>`]
    .concat(stageOptions.map(id=>{
      const label = bucketLabel(id, cfg).replace(/^\S+\s/,'');
      return `<button class="stage-pill ${f.stage===id?'active':''}" onclick="setPageStageFilter('${pageKey}','${id}')">${label} (${stageCounts[id]||0})</button>`;
    })).join('');

  return `
    <div class="filter-bar">
      <input type="text" id="${pageKey}-filter-search" placeholder="Buscar por produto ou referência..." value="${f.search}" oninput="applyPageSearchFilter('${pageKey}')">
      <select id="${pageKey}-filter-supplier" onchange="applyPageFiltersFull('${pageKey}')">
        <option value="">Todos os fornecedores</option>
        ${supplierOptions}
      </select>
      <select id="${pageKey}-filter-modal" onchange="applyPageFiltersFull('${pageKey}')">
        <option value="">Todos os modais</option>
        <option value="maritimo" ${f.modal==='maritimo'?'selected':''}>Marítimo</option>
        <option value="aereo" ${f.modal==='aereo'?'selected':''}>Aéreo</option>
      </select>
      <select id="${pageKey}-filter-tipo" onchange="applyPageFiltersFull('${pageKey}')">
        <option value="">Definitiva e Temporária</option>
        <option value="definitiva" ${f.tipo==='definitiva'?'selected':''}>Só Definitiva</option>
        <option value="temporaria" ${f.tipo==='temporaria'?'selected':''}>Só Temporária</option>
      </select>
      <button class="btn" onclick="clearPageFilters('${pageKey}')">Limpar filtros</button>
    </div>
    <div class="stage-pills">${pills}</div>
  `;
}

function applyPageSearchFilter(pageKey){
  pageFilters[pageKey].search = document.getElementById(pageKey+'-filter-search').value;
  const el = document.getElementById(pageKey+'-results');
  if(el){
    if(pageKey==='dashboard') el.innerHTML = renderDashboardResults();
    else if(pageKey==='processos') el.innerHTML = renderProcessosResults();
    else if(pageKey==='finalizados') el.innerHTML = renderFinalizadosResults();
  }
}
function applyPageFiltersFull(pageKey){
  const f = pageFilters[pageKey];
  f.supplierId = document.getElementById(pageKey+'-filter-supplier').value;
  f.modal = document.getElementById(pageKey+'-filter-modal').value;
  f.tipo = document.getElementById(pageKey+'-filter-tipo').value;
  renderView();
}
function setPageStageFilter(pageKey, stage){
  pageFilters[pageKey].stage = stage;
  renderView();
}
function clearPageFilters(pageKey){
  pageFilters[pageKey] = {search:'', supplierId:'', modal:'', tipo:'', stage:''};
  renderView();
}

function renderDashboard(){
  const cfg = getDashboardConfig();
  const stageOptions = ['producao','aguardando_embarque','transito','desembaraco','entregue', ...cfg.rules.map(r=>'custom:'+r.id)];
  const universe = state.processes.filter(p=>getBucket(p)!=='finalizados');
  const filterBar = renderFilterBar('dashboard', universe, stageOptions);
  return filterBar + `<div id="dashboard-results">${renderDashboardResults()}</div>`;
}

function renderDashboardResults(){
  const cfg = getDashboardConfig();
  const f = pageFilters.dashboard;
  const bucketOrder = ['producao','aguardando_embarque','transito','desembaraco','entregue', ...cfg.rules.map(r=>'custom:'+r.id)];
  const buckets = {};
  bucketOrder.forEach(id=>buckets[id]=[]);
  const filteredProcesses = state.processes.filter(p=>processMatchesFilter(p,f));
  filteredProcesses.forEach(p=>{ const b=getBucket(p); if(buckets[b]) buckets[b].push(p); });
  const finalizadosCount = state.processes.filter(p=>getBucket(p)==='finalizados').length;
  const totalAtivos = state.processes.filter(p=>getBucket(p)!=='finalizados').length;

  const kpiAccents = {producao:'var(--ink-blue)', aguardando_embarque:'var(--ink-amber)', transito:'var(--ink-purple)', desembaraco:'var(--ink-red)', entregue:'var(--ink-green)'};
  const kpis = `
  <div class="active-count-label">Processos ativos: ${totalAtivos}</div>
  <div class="kpi-row">
    ${bucketOrder.map(id=>`
      <div class="kpi-card" style="--kpi-accent:${kpiAccents[id]||'var(--ink-teal)'}">
        <div class="kpi-label">${bucketLabel(id, cfg)}</div>
        <div class="kpi-value">${buckets[id].length}</div>
      </div>
    `).join('')}
  </div>
  `;

  let body = '';
  let anyContent = false;
  bucketOrder.forEach(id=>{
    const list = buckets[id];
    if(!list.length) return;
    anyContent = true;
    const title = bucketLabel(id, cfg);
    if(id==='producao'){
      const groups = groupByMonth(list, 'prontidao');
      const groupsHtml = groups.map(g=>`
        <details class="month-group" open>
          <summary class="month-summary">${g.label.toUpperCase()} <span class="month-count">${g.items.length}</span></summary>
          <div class="process-list" style="margin-top:10px;">${g.items.map(producaoCard).join('')}</div>
        </details>
      `).join('');
      body += `<div class="section-title">${title}<div class="rule"></div></div>${groupsHtml}`;
    } else if(id==='aguardando_embarque'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(aguardandoEmbarqueCard).join('')}</div>`;
    } else if(id==='transito'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(transitoCard).join('')}</div>`;
    } else if(id==='desembaraco'){
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(desembaracoCard).join('')}</div>`;
    } else {
      body += `<div class="section-title">${title}<div class="rule"></div></div><div class="process-list">${list.map(p=>processCard(p)).join('')}</div>`;
    }
  });

  if(!anyContent){
    const hasFilters = f.search || f.supplierId || f.modal || f.tipo || f.stage;
    body = hasFilters ? `
    <div class="empty-state">
      <h3>Nenhum processo encontrado</h3>
      <p>Nenhum processo bate com os filtros aplicados.</p>
      <button class="btn" onclick="clearPageFilters('dashboard')">Limpar filtros</button>
    </div>
  ` : `
    <div class="empty-state">
      <h3>Nenhum processo em andamento</h3>
      <p>Cadastre seu primeiro processo de importação para começar a acompanhar aqui.</p>
      <button class="btn btn-primary" onclick="openProcessModal()">+ Novo Processo</button>
    </div>
  `;
  }

  const finalNote = finalizadosCount ? `<div class="cost-note" style="margin-top:14px;">${finalizadosCount} processo(s) finalizado(s) — veja na aba <strong>Finalizados</strong>.</div>` : '';

  return kpis + body + finalNote;
}

/* ---------- PROCESSOS ---------- */
function processProgressRatio(p){
  const stages = getStagesForProcess(p);
  let total=0, done=0;
  stages.forEach(s=>{
    if(s.type==='payments'){
      total += s.items.length;
      done += s.items.filter(it=>(p.payments[it.key]||{}).checked).length;
    } else {
      total += s.items.length;
      const checked = p.checklist[s.key]||[];
      done += checked.filter(Boolean).length;
    }
  });
  return total ? done/total : 0;
}

function renderProcessos(){
  const universe = state.processes.filter(p=>getBucket(p)!=='finalizados');
  const stageOptions = ['producao','aguardando_embarque','transito','desembaraco','entregue'];
  const filterBar = renderFilterBar('processos', universe, stageOptions);
  return filterBar + `<div id="processos-results">${renderProcessosResults()}</div>`;
}

function renderProcessosResults(){
  const f = pageFilters.processos;
  const list = state.processes.filter(p=>getBucket(p)!=='finalizados' && processMatchesFilter(p,f));
  if(list.length===0){
    const hasFilters = f.search || f.supplierId || f.modal || f.tipo || f.stage;
    return hasFilters ? `<div class="empty-state"><h3>Nenhum processo encontrado</h3><p>Nenhum processo bate com os filtros aplicados.</p><button class="btn" onclick="clearPageFilters('processos')">Limpar filtros</button></div>` : `<div class="empty-state">
      <h3>Nenhum processo ativo</h3>
      <p>Crie seu primeiro processo para começar a controlar custos, prazos e documentos.</p>
      <button class="btn btn-primary" onclick="openProcessModal()">+ Novo Processo</button>
    </div>`;
  }
  const sorted = [...list].sort((a,b)=> processProgressRatio(b) - processProgressRatio(a) || (a.chegadaPrevista||'9999').localeCompare(b.chegadaPrevista||'9999'));
  return `<div class="active-count-label">${sorted.length} processo(s)</div><div class="process-list">${sorted.map(p=>processCard(p)).join('')}</div>`;
}

/* ---------- FINALIZADOS ---------- */
function renderFinalizados(){
  const universe = state.processes.filter(p=>getBucket(p)==='finalizados');
  const filterBar = renderFilterBar('finalizados', universe, []);
  return filterBar + `<div id="finalizados-results">${renderFinalizadosResults()}</div>`;
}

function renderFinalizadosResults(){
  const f = pageFilters.finalizados;
  const list = state.processes.filter(p=>getBucket(p)==='finalizados' && processMatchesFilter(p,f));
  if(list.length===0){
    const hasFilters = f.search || f.supplierId || f.modal || f.tipo;
    return hasFilters ? `<div class="empty-state"><h3>Nenhum processo encontrado</h3><p>Nenhum processo bate com os filtros aplicados.</p><button class="btn" onclick="clearPageFilters('finalizados')">Limpar filtros</button></div>` : `<div class="empty-state">
      <h3>Nenhum processo finalizado ainda</h3>
      <p>Quando um processo tiver a Fase 9 (Encerramento) totalmente concluída, ele aparece aqui.</p>
    </div>`;
  }
  return `<div class="active-count-label">${list.length} processo(s)</div><div class="process-list">${list.map(p=>processCard(p)).join('')}</div>`;
}

function processCard(p, note){
  const stages = getStagesForProcess(p);
  const info = stageInfoFor(p, p.status);
  const idx = stageIndexFor(p, p.status);
  const costs = computeCosts(p);
  const fornecedor = state.suppliers.find(s=>s.id===p.supplierId);
  const trackHtml = stages.map((s,i)=>{
    const dotCls = i<idx ? 'done' : (i===idx ? 'current' : '');
    const lineCls = i<idx ? 'done' : '';
    return `<div class="track-step">
      <div class="track-dot ${dotCls}"></div>
      ${i<stages.length-1?`<div class="track-line ${lineCls}"></div>`:''}
    </div>`;
  }).join('');

  return `
  <div class="process-card ${getProcessAlerts(p).length?'has-alert':''}" onclick="openProcessModal('${p.id}')">
    <button class="eye-btn" onclick="openProcessViewModal('${p.id}', event)" title="Visualizar processo">👁️</button>
    ${refBadgeHtml(p)}
    <div class="process-main">
      <h3>${p.produto || 'Sem descrição'}<span class="phase-mini">${info.label.replace(/^Fase \d+ · /,'')}</span></h3>
      ${p.tipo==='temporaria'?'<div class="process-badge-temp">Admissão Temp.</div>':''}
      <div class="process-meta">${fornecedorNameHtml(fornecedor)} · ${originModalMeta(p)}</div>
      <div class="process-track">${trackHtml}</div>
      <div class="progress-pct">${Math.round(processProgressRatio(p)*100)}% concluído</div>
      ${note?`<div class="step-note">${note}</div>`:''}
      ${renderAlertBanner(p)}
    </div>
    <div class="process-side">
      <div class="process-value">${fmtBRL(costs.total)}</div>
      <div class="process-eta">Chegada: ${fmtDate(p.chegadaPrevista)}</div>
    </div>
  </div>`;
}

function producaoCard(p){
  const stages = getStagesForProcess(p);
  const idx = stageIndexFor(p, p.status);
  const dias = p.prontidao ? daysBetween(todayStr(), p.prontidao) : null;
  const lateCls = (dias!==null && dias<0) ? 'late' : '';
  const remText = dias===null ? 'Prontidão não definida' : (dias<0 ? `${Math.abs(dias)}d de atraso` : (dias===0 ? 'Pronto hoje' : `em ${dias}d`));
  const fornecedor = state.suppliers.find(s=>s.id===p.supplierId);
  const trackHtml = stages.map((s,i)=>{
    const dotCls = i<idx ? 'done' : (i===idx ? 'current' : '');
    const lineCls = i<idx ? 'done' : '';
    return `<div class="track-step">
      <div class="track-dot ${dotCls}"></div>
      ${i<stages.length-1?`<div class="track-line ${lineCls}"></div>`:''}
    </div>`;
  }).join('');

async function savePartner(id){
  if(!requireEditPermission()) return;
  const empresa = document.getElementById('pt-empresa').value.trim();
  if(!empresa){ alert('Informe o nome da empresa.'); return; }
  const data = {
    id,
    tipo: document.getElementById('pt-tipo').value,
    empresa,
    contato: document.getElementById('pt-contato').value.trim(),
    phone: document.getElementById('pt-phone').value.trim(),
    email: document.getElementById('pt-email').value.trim(),
    notes: document.getElementById('pt-notes').value.trim(),
  };
  const idx = state.partners.findIndex(p=>p.id===id);
  if(idx>=0) state.partners[idx]=data; else state.partners.push(data);
  await persistState();
  closeModal();
  render();
}

async function deletePartner(id){
  if(!requireEditPermission()) return;
  if(!confirm('Excluir este parceiro?')) return;
  state.partners = state.partners.filter(p=>p.id!==id);
  await persistState();
  closeModal();
  render();
}

/* ---------- CAMPOS EXTRAS (itemFields / extraFields) ---------- */
function renderExtraFieldInput(f, p){
  const val = (p.extra && p.extra[f.key]) || '';
  if(f.type==='readonly'){
    const v = (p[f.sourceKey]!==undefined && p[f.sourceKey]!=='') ? p[f.sourceKey] : '—';
    return `<div class="mini-field"><label>${f.label}</label><div style="padding:6px 8px;font-size:12px;background:#fff;border:1px solid var(--border-strong);border-radius:5px;">${v}</div></div>`;
  }
  if(f.type==='select'){
    const preview = f.key==='canalDesembaraco' && val ? `<div style="margin-top:5px;">${canalBadgeHtml(val)}</div>` : '';
    return `<div class="mini-field"><label>${f.label}</label><select onchange="updateExtraField('${f.key}', this.value)">
      <option value="">—</option>
      ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select>${preview}</div>`;
  }
  if(f.type==='partner'){
    const options = state.partners.filter(pt=>pt.tipo===f.partnerType).map(pt=>pt.empresa);
    return `<div class="mini-field"><label>${f.label}</label><select onchange="updateExtraField('${f.key}', this.value)">
      <option value="">—</option>
      ${options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select></div>`;
  }
  const type = f.type||'text';
  return `<div class="mini-field"><label>${f.label}</label><input type="${type}" value="${val}" oninput="updateExtraField('${f.key}', this.value)"></div>`;
}
function renderContainersTable(p){
  const qty = parseInt(p.containersQty)||0;
  if(qty<=0){
    return `<div class="form-hint" style="margin-top:6px;">Defina a quantidade de containers na Visão Geral para preencher os números aqui.</div>`;
  }
  const list = p.extra.containersList || [];
  let rows = '';
  for(let i=0;i<qty;i++){
    const c = list[i] || {container:'', lacre:''};
    rows += `<div class="container-row">
      <span class="container-idx">#${i+1}</span>
      <input type="text" placeholder="Número do container" value="${c.container||''}" oninput="updateContainerField(${i},'container',this.value)">
      <input type="text" placeholder="Número do lacre" value="${c.lacre||''}" oninput="updateContainerField(${i},'lacre',this.value)">
    </div>`;
  }
  return `<div class="containers-table"><label style="display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px;">Containers e Lacres</label>${rows}</div>`;
}
function updateContainerField(idx, field, value){
  const p = window.__editingProcess;
  p.extra.containersList = p.extra.containersList || [];
  if(!p.extra.containersList[idx]) p.extra.containersList[idx] = {container:'', lacre:''};
  p.extra.containersList[idx][field] = value;
}
function onCambioManualEdit(){
  window.__editingProcess.cambioManual = true;
  const statusEl = document.getElementById('cambio-status');
  if(statusEl) statusEl.textContent = '✏️ Valor definido manualmente';
}

async function fetchDollarQuoteIfNeeded(){
  const p = window.__editingProcess;
  if(p.cambioManual) return; // travado, não sobrescreve
  const cambioInput = document.getElementById('c-cambio');
  if(cambioInput && cambioInput.value) return; // já tem valor (processo existente), não mexe
  try{
    const resp = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
    const data = await resp.json();
    const bid = data && data.USDBRL && data.USDBRL.bid;
    if(bid && cambioInput){
      cambioInput.value = parseFloat(bid).toFixed(4);
      updateCostPreview();
      const statusEl = document.getElementById('cambio-status');
      if(statusEl) statusEl.textContent = '🔄 Cotação automática do último fechamento';
    }
  }catch(e){
    console.log('Não foi possível buscar a cotação automática do dólar.', e);
  }
}
